<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行业模板库 · Direction A · 信息建筑派</title>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@1,500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --q-primary: #4F46E5;
      --canvas-base: #FEFBF4;
      --glass-surface: rgba(255, 253, 245, 0.65);
      --glass-surface-hover: rgba(255, 253, 245, 0.82);
      --glass-blur-default: 18px;
      --glass-border: rgba(235, 220, 200, 0.7);
      --color-accent: #DCA03E;
      --color-accent-hover: #C48C28;
      --color-text-primary: #2C2218;
      --color-text-secondary: #6B5B4D;
      --color-text-tertiary: #5A6A7E;
      --color-icon-muted: #A89580;
      --interaction-surface-hover: #FDF6E8;
      --glass-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      --color-success: #4CAF7C;
      --color-warning: #F09B54;
      --color-danger: #E55C5C;
      --color-border-soft: rgba(141, 110, 99, 0.12);
      --color-surface-solid: #FFFFFF;
      --color-success-soft: #ECFDF3;
      --color-warning-soft: rgba(240, 155, 84, 0.08);
      --color-info-soft: #EEF6FF;
      --color-accent-blue: #2563EB;
      --color-accent-blue-soft: rgba(37, 99, 235, 0.08);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #FEFBF4 0%, #FEFBF4 40%, rgba(254, 251, 244, 0.88) 100%);
      color: var(--color-text-primary);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-feature-settings: 'tnum' 1; }
    .serif { font-family: 'Newsreader', 'Source Serif Pro', Georgia, serif; font-style: italic; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
    input { font-family: inherit; }

    /* Page background pattern (subtle paper) */
    .page-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(220, 160, 62, 0.06), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(79, 70, 229, 0.04), transparent 50%);
    }

    /* App shell */
    .app-shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; flex-shrink: 0;
      padding: 18px 12px;
      background: rgba(255, 249, 236, 0.72);
      backdrop-filter: blur(20px) saturate(1.08);
      -webkit-backdrop-filter: blur(20px) saturate(1.08);
      border-right: 1px solid rgba(208, 192, 168, 0.55);
      box-shadow: var(--glass-inner-highlight), 0 12px 40px rgba(93, 64, 55, 0.1);
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 10px 22px;
      font-weight: 700; font-size: 16px; letter-spacing: -0.02em;
    }
    .sidebar-brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #DCA03E 0%, #B57F1E 100%);
      display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(220, 160, 62, 0.3);
    }
    .sidebar-section { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); padding: 14px 10px 6px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 10px; border-radius: 10px;
      font-size: 13.5px; color: var(--color-text-primary);
      transition: background 0.12s;
    }
    .sidebar-item:hover { background: rgba(255, 255, 255, 0.55); }
    .sidebar-item--active {
      background: rgba(233, 162, 59, 0.18);
      box-shadow: inset 3px 0 0 var(--color-accent), var(--glass-inner-highlight);
      font-weight: 600;
    }
    .sidebar-item__icon { font-size: 16px; width: 18px; text-align: center; color: var(--color-icon-muted); }
    .sidebar-item--active .sidebar-item__icon { color: var(--color-accent); }

    .main { flex: 1; min-width: 0; padding: 24px 32px 64px; max-width: 1440px; }

    /* Page hero */
    .page-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
    .page-kicker { display: inline-flex; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
    .page-title { margin: 4px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    .page-subtitle { margin: 8px 0 0; max-width: 36rem; color: var(--color-text-secondary); font-size: 13.5px; }
    .page-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      transition: background 0.12s, border-color 0.12s, transform 0.06s;
    }
    .btn:active { transform: translateY(0.5px); }
    .btn-primary { background: var(--color-accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 1px 2px rgba(220,160,62,0.2); }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-ghost { background: var(--color-surface-solid); border: 1px solid var(--color-border-soft); color: var(--color-text-primary); }
    .btn-ghost:hover { background: var(--interaction-surface-hover); border-color: var(--glass-border); }

    /* Metrics strip */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
    .metric-card {
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur-default));
      -webkit-backdrop-filter: blur(var(--glass-blur-default));
      box-shadow: var(--glass-inner-highlight);
      padding: 14px 18px 16px;
      transition: border-color 0.18s;
    }
    .metric-card:hover { border-color: rgba(220, 160, 62, 0.4); }
    .metric-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .metric-value { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
    .metric-foot { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
    .metric-foot .delta-up { color: var(--color-success); font-weight: 600; }
    .metric-foot .delta-down { color: var(--color-danger); font-weight: 600; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur-default));
      -webkit-backdrop-filter: blur(var(--glass-blur-default));
      box-shadow: var(--glass-inner-highlight);
      margin-bottom: 16px;
    }
    .search {
      display: flex; align-items: center; gap: 8px;
      background: var(--color-surface-solid);
      border: 1px solid var(--color-border-soft);
      border-radius: 10px;
      padding: 7px 10px;
      min-width: 280px;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .search:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(220,160,62,0.15); }
    .search input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; color: var(--color-text-primary); }
    .search input::placeholder { color: var(--color-icon-muted); }
    .search-icon { color: var(--color-icon-muted); font-size: 14px; }
    .search-kbd { font-size: 11px; color: var(--color-text-tertiary); border: 1px solid var(--color-border-soft); border-radius: 4px; padding: 1px 5px; background: var(--canvas-base); }

    .filter-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      font-size: 12.5px; font-weight: 500;
      background: transparent; color: var(--color-text-secondary);
      border: 1px solid transparent;
      transition: all 0.12s;
    }
    .chip:hover { background: var(--interaction-surface-hover); }
    .chip--active { background: var(--color-surface-solid); border-color: var(--color-accent); color: var(--color-text-primary); box-shadow: 0 0 0 1px var(--color-accent); }
    .chip__count { font-size: 11px; padding: 0 5px; border-radius: 6px; background: rgba(141, 110, 99, 0.1); color: var(--color-text-secondary); }
    .chip--active .chip__count { background: rgba(220, 160, 62, 0.18); color: #8a6014; }

    .toolbar-spacer { flex: 1; }
    .view-toggle { display: flex; background: var(--color-surface-solid); border: 1px solid var(--color-border-soft); border-radius: 10px; padding: 2px; }
    .view-toggle button { padding: 5px 10px; border-radius: 8px; font-size: 12.5px; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 4px; }
    .view-toggle button.is-active { background: var(--interaction-surface-hover); color: var(--color-text-primary); }

    /* Industry grid (default) */
    .ind-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .ind-card {
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur-default));
      -webkit-backdrop-filter: blur(var(--glass-blur-default));
      box-shadow: var(--glass-inner-highlight);
      padding: 18px 20px 16px;
      transition: transform 0.16s ease, border-color 0.16s, box-shadow 0.16s;
      cursor: pointer;
      position: relative;
    }
    .ind-card:hover { transform: translateY(-2px); border-color: rgba(220, 160, 62, 0.45); box-shadow: 0 8px 24px rgba(93, 64, 55, 0.08), var(--glass-inner-highlight); }
    .ind-card.is-open { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(220, 160, 62, 0.18), 0 8px 24px rgba(93, 64, 55, 0.08); }

    .ind-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .ind-mono {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 14px; letter-spacing: 0.02em;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.06);
    }
    .ind-mono::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1.2px);
      background-size: 6px 6px;
      border-radius: inherit;
      opacity: 0.5;
      pointer-events: none;
    }
    .ind-title-wrap { flex: 1; min-width: 0; }
    .ind-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .ind-key { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
    .ind-key span { color: var(--color-text-secondary); }
    .ind-status { flex-shrink: 0; display: flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 3px 8px; border-radius: 999px; }
    .ind-status--on { background: var(--color-success-soft); color: #2D6A4F; }
    .ind-status--off { background: rgba(229, 92, 92, 0.1); color: #B13939; }
    .ind-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .ind-desc { font-size: 12.5px; color: var(--color-text-secondary); margin: 0 0 14px; min-height: 36px; line-height: 1.5; }

    .ind-divider { height: 1px; background: var(--color-border-soft); margin: 12px 0; }

    .ind-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .ind-metric { display: flex; flex-direction: column; gap: 2px; }
    .ind-metric__val { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
    .ind-metric__lbl { font-size: 10.5px; color: var(--color-text-tertiary); letter-spacing: 0.02em; }

    .ind-foot { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
    .ind-action {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 500;
      color: var(--color-text-secondary);
      transition: background 0.12s, color 0.12s;
    }
    .ind-action:hover { background: var(--interaction-surface-hover); color: var(--color-text-primary); }
    .ind-action--primary { color: #8a6014; }
    .ind-action--primary:hover { background: rgba(220, 160, 62, 0.12); }
    .ind-foot-spacer { flex: 1; }
    .ind-source { font-size: 10.5px; color: var(--color-text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; }

    /* Request new industry CTA card */
    .ind-card--cta {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      min-height: 232px;
      border-style: dashed;
      background: transparent;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .ind-card--cta:hover { color: var(--color-accent); }
    .ind-card--cta .plus {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1.5px solid currentColor;
      font-size: 18px; line-height: 1;
    }
    .ind-card--cta small { font-size: 11.5px; color: var(--color-text-tertiary); }

    /* Empty state */
    .empty {
      border: 1px dashed var(--color-border-soft);
      border-radius: 18px;
      padding: 48px 24px;
      text-align: center;
      background: var(--glass-surface);
    }
    .empty h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .empty p { margin: 0; color: var(--color-text-tertiary); font-size: 13px; }

    /* Table view */
    .ind-table {
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur-default));
      -webkit-backdrop-filter: blur(var(--glass-blur-default));
      overflow: hidden;
      box-shadow: var(--glass-inner-highlight);
    }
    .ind-table table { width: 100%; border-collapse: collapse; }
    .ind-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--color-text-tertiary);
      padding: 12px 16px;
      background: rgba(255, 253, 245, 0.5);
      border-bottom: 1px solid var(--color-border-soft);
    }
    .ind-table td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--color-border-soft);
      vertical-align: middle;
    }
    .ind-table tbody tr { transition: background 0.1s; cursor: pointer; }
    .ind-table tbody tr:hover { background: var(--interaction-surface-hover); }
    .ind-table tbody tr:last-child td { border-bottom: none; }
    .ind-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .ind-table .ind-cell { display: flex; align-items: center; gap: 10px; }
    .ind-table .ind-mono { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; }
    .ind-table .ind-mono::after { display: none; }

    /* Side drawer */
    .drawer-mask { position: fixed; inset: 0; background: rgba(44, 34, 24, 0.18); backdrop-filter: blur(2px); z-index: 50; animation: fadeIn 0.18s ease; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 480px; max-width: 100%;
      background: var(--canvas-base);
      border-left: 1px solid var(--glass-border);
      box-shadow: -20px 0 60px rgba(93, 64, 55, 0.15);
      z-index: 51;
      display: flex; flex-direction: column;
      animation: slideIn 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 24px 28px 18px; border-bottom: 1px solid var(--color-border-soft); }
    .drawer-head .ind-mono { width: 44px; height: 44px; }
    .drawer-head .ind-mono::after { display: none; }
    .drawer-close { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--color-text-tertiary); }
    .drawer-close:hover { background: var(--interaction-surface-hover); color: var(--color-text-primary); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px 28px 28px; }
    .drawer-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .drawer-section-title::after { content: ''; flex: 1; height: 1px; background: var(--color-border-soft); }
    .dept-list { display: flex; flex-direction: column; gap: 8px; }
    .dept {
      border: 1px solid var(--color-border-soft);
      border-radius: 12px;
      background: var(--color-surface-solid);
      padding: 12px 14px;
    }
    .dept-head { display: flex; align-items: center; gap: 8px; }
    .dept-head .dept-name { font-weight: 600; font-size: 13.5px; }
    .dept-head .dept-count { font-size: 11px; color: var(--color-text-tertiary); }
    .dept-pos { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .dept-pos-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; color: var(--color-text-secondary); }
    .dept-pos-row:hover { background: var(--interaction-surface-hover); }
    .dept-pos-row .pos-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--color-icon-muted); }
    .dept-pos-row .pos-name { flex: 1; }
    .dept-pos-row .pos-seniority { font-size: 10.5px; color: var(--color-text-tertiary); padding: 1px 6px; border-radius: 4px; background: var(--canvas-base); border: 1px solid var(--color-border-soft); }
    .drawer-foot { padding: 16px 28px; border-top: 1px solid var(--color-border-soft); display: flex; gap: 8px; }
    .drawer-foot .btn { flex: 1; justify-content: center; }

    /* Tweak (for live switching) */
    .tweaks { position: fixed; bottom: 16px; left: 16px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
    .tweaks-panel {
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 12px;
      padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      font-size: 11.5px; color: var(--color-text-secondary);
    }
    .tweaks-panel b { color: var(--color-text-primary); font-weight: 600; }
    .tweaks-panel kbd { font-size: 10px; padding: 1px 5px; border: 1px solid var(--color-border-soft); border-radius: 3px; background: var(--canvas-base); font-family: 'JetBrains Mono', monospace; }

    /* Signature quote (one detail at 120%) */
    .signature {
      margin-top: 36px; padding: 20px 0;
      border-top: 1px solid var(--color-border-soft);
      display: flex; align-items: center; gap: 14px;
      color: var(--color-text-tertiary); font-size: 12.5px;
    }
    .signature .rule { width: 32px; height: 1px; background: var(--color-accent); }
    .signature .quote { font-family: 'Newsreader', serif; font-style: italic; color: var(--color-text-secondary); font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ── Real data (from industry-template-library.design.md v1.0) ──
    const INDUSTRIES = [
      {
        key: 'softwaredev',
        name: '软件开发',
        desc: '系统开发 / UE 游戏 / 全栈 / DevOps',
        mono: 'SD',
        monoBg: 'linear-gradient(135deg, #4F46E5 0%, #312E81 100%)',
        deptCount: 10,
        posCount: 45,
        agentCount: 96,
        installed: 12,
        status: 'enabled',
        source: 'system',
        departments: [
          { name: '后端研发部', positions: [
            { name: 'Golang 高级工程师', level: 'P6' },
            { name: 'Java 高级工程师', level: 'P6' },
            { name: 'Python 数据工程师', level: 'P5' },
          ]},
          { name: '前端研发部', positions: [
            { name: 'Vue3 高级前端', level: 'P6' },
            { name: 'React 资深前端', level: 'P6' },
            { name: '设计系统工程师', level: 'P5' },
          ]},
          { name: '游戏开发部', positions: [
            { name: 'UE 客户端', level: 'P5' },
            { name: 'UE 服务端', level: 'P5' },
            { name: '技术美术', level: 'P5' },
          ]},
          { name: '运维 / SRE', positions: [
            { name: 'SRE 工程师', level: 'P6' },
            { name: 'DevOps 工程师', level: 'P5' },
          ]},
        ],
      },
      {
        key: 'selfmedia',
        name: '自媒体 / 内容创作',
        desc: '网文小说 / 短视频 / 图文 / 直播',
        mono: 'SM',
        monoBg: 'linear-gradient(135deg, #E55C5C 0%, #9B2226 100%)',
        deptCount: 5,
        posCount: 28,
        agentCount: 54,
        installed: 7,
        status: 'enabled',
        source: 'system',
        departments: [
          { name: '小说创作部', positions: [
            { name: '网文作者', level: 'P4' },
            { name: '剧本编辑', level: 'P5' },
          ]},
          { name: '视频制作部', positions: [
            { name: '短视频编导', level: 'P5' },
            { name: '剪辑师', level: 'P4' },
            { name: '内容运营', level: 'P4' },
          ]},
        ],
      },
      {
        key: 'finance',
        name: '金融 / 投资',
        desc: '证券研究 / 量化交易 / 固收 / 财富管理',
        mono: 'FI',
        monoBg: 'linear-gradient(135deg, #0EA5E9 0%, #075985 100%)',
        deptCount: 6,
        posCount: 32,
        agentCount: 58,
        installed: 3,
        status: 'enabled',
        source: 'system',
        departments: [
          { name: '证券研究部', positions: [
            { name: '行业分析师', level: 'P5' },
            { name: '宏观研究员', level: 'P5' },
            { name: '量化研究员', level: 'P6' },
          ]},
          { name: '量化交易部', positions: [
            { name: '策略研究员', level: 'P6' },
            { name: '交易员', level: 'P5' },
          ]},
        ],
      },
    ];

    // ── Sidebar nav (simplified, just for context) ──
    const NAV = [
      { section: '概览', items: [
        { key: 'overview', label: '总览', icon: '◇' },
        { key: 'monitor', label: '监控', icon: '◌' },
      ]},
      { section: '配置', items: [
        { key: 'agents', label: 'Agent', icon: '◎' },
        { key: 'teams', label: 'Team', icon: '◫' },
        { key: 'industries', label: '行业模板', icon: '⬡', active: true },
        { key: 'taxonomy', label: '分类体系', icon: '▤' },
      ]},
      { section: '能力', items: [
        { key: 'tools', label: '工具', icon: '◐' },
        { key: 'skills', label: '技能', icon: '✦' },
        { key: 'knowledge', label: '知识库', icon: '◧' },
      ]},
    ];

    // ── Sidebar ──
    function Sidebar() {
      return (
        <aside className="sidebar">
          <div className="sidebar-brand">
            <div className="sidebar-brand-mark">A</div>
            <span>Aranea</span>
          </div>
          {NAV.map((sec) => (
            <div key={sec.section}>
              <div className="sidebar-section">{sec.section}</div>
              {sec.items.map((it) => (
                <div
                  key={it.key}
                  className={'sidebar-item' + (it.active ? ' sidebar-item--active' : '')}
                >
                  <span className="sidebar-item__icon">{it.icon}</span>
                  <span>{it.label}</span>
                </div>
              ))}
            </div>
          ))}
        </aside>
      );
    }

    // ── KPI Metric card ──
    function MetricCard({ label, value, foot }) {
      return (
        <div className="metric-card">
          <div className="metric-label">{label}</div>
          <span className="metric-value mono">{value}</span>
          <div className="metric-foot">{foot}</div>
        </div>
      );
    }

    // ── Industry Card (grid view) ──
    function IndustryCard({ ind, isOpen, onOpen }) {
      return (
        <div
          className={'ind-card' + (isOpen ? ' is-open' : '')}
          onClick={() => onOpen(ind.key)}
        >
          <div className="ind-head">
            <div className="ind-mono" style={{ background: ind.monoBg, position: 'relative' }}>{ind.mono}</div>
            <div className="ind-title-wrap">
              <div className="ind-name">{ind.name}</div>
              <div className="ind-key mono">key: <span>{ind.key}</span></div>
            </div>
            <div className={'ind-status ind-status--on'}>
              <span className="ind-status-dot" />启用
            </div>
          </div>
          <p className="ind-desc">{ind.desc}</p>
          <div className="ind-divider" />
          <div className="ind-metrics">
            <div className="ind-metric">
              <span className="ind-metric__val mono">{ind.deptCount}</span>
              <span className="ind-metric__lbl">部门</span>
            </div>
            <div className="ind-metric">
              <span className="ind-metric__val mono">{ind.posCount}</span>
              <span className="ind-metric__lbl">岗位</span>
            </div>
            <div className="ind-metric">
              <span className="ind-metric__val mono">{ind.agentCount}</span>
              <span className="ind-metric__lbl">Agent</span>
            </div>
            <div className="ind-metric">
              <span className="ind-metric__val mono">{ind.installed}</span>
              <span className="ind-metric__lbl">已部署</span>
            </div>
          </div>
          <div className="ind-foot">
            <span className="ind-action ind-action--primary" onClick={(e) => { e.stopPropagation(); onOpen(ind.key); }}>
              查看部门 →
            </span>
            <span className="ind-foot-spacer" />
            <span className="ind-source">{ind.source}</span>
          </div>
        </div>
      );
    }

    // ── Industry Row (table view) ──
    function IndustryRow({ ind, onOpen }) {
      return (
        <tr onClick={() => onOpen(ind.key)}>
          <td>
            <div className="ind-cell">
              <div className="ind-mono" style={{ background: ind.monoBg }}>{ind.mono}</div>
              <div>
                <div style={{ fontWeight: 600 }}>{ind.name}</div>
                <div className="mono" style={{ fontSize: 11, color: 'var(--color-text-tertiary)' }}>{ind.key}</div>
              </div>
            </div>
          </td>
          <td style={{ color: 'var(--color-text-secondary)' }}>{ind.desc}</td>
          <td className="num mono">{ind.deptCount}</td>
          <td className="num mono">{ind.posCount}</td>
          <td className="num mono">{ind.agentCount}</td>
          <td className="num mono">{ind.installed}</td>
          <td>
            <div className={'ind-status ind-status--on'}>
              <span className="ind-status-dot" />启用
            </div>
          </td>
          <td style={{ color: 'var(--color-text-tertiary)', fontSize: 11.5, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{ind.source}</td>
        </tr>
      );
    }

    // ── Side Drawer (industry detail) ──
    function IndustryDrawer({ indKey, onClose }) {
      const ind = INDUSTRIES.find((i) => i.key === indKey);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);
      if (!ind) return null;
      return (
        <>
          <div className="drawer-mask" onClick={onClose} />
          <aside className="drawer" role="dialog" aria-label={'行业详情 ' + ind.name}>
            <div className="drawer-head">
              <div className="ind-mono" style={{ background: ind.monoBg }}>{ind.mono}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: '-0.02em' }}>{ind.name}</div>
                <div className="mono" style={{ fontSize: 11.5, color: 'var(--color-text-tertiary)', marginTop: 2 }}>
                  key: {ind.key} · {ind.source}
                </div>
              </div>
              <button className="drawer-close" onClick={onClose} aria-label="关闭">✕</button>
            </div>
            <div className="drawer-body">
              <p style={{ margin: '0 0 12px', color: 'var(--color-text-secondary)', fontSize: 13 }}>{ind.desc}</p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 8 }}>
                {[
                  { l: '部门', v: ind.deptCount },
                  { l: '岗位', v: ind.posCount },
                  { l: 'Agent', v: ind.agentCount },
                ].map((m) => (
                  <div key={m.l} style={{ border: '1px solid var(--color-border-soft)', borderRadius: 10, padding: '10px 12px', background: 'var(--color-surface-solid)' }}>
                    <div style={{ fontSize: 10.5, color: 'var(--color-text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>{m.l}</div>
                    <div className="mono" style={{ fontSize: 20, fontWeight: 600, marginTop: 2 }}>{m.v}</div>
                  </div>
                ))}
              </div>

              <div className="drawer-section-title">部门与岗位</div>
              <div className="dept-list">
                {ind.departments.map((dep) => (
                  <div key={dep.name} className="dept">
                    <div className="dept-head">
                      <span className="dept-name">{dep.name}</span>
                      <span className="dept-count mono">{dep.positions.length} 岗位</span>
                    </div>
                    <div className="dept-pos">
                      {dep.positions.map((p) => (
                        <div key={p.name} className="dept-pos-row">
                          <span className="pos-dot" />
                          <span className="pos-name">{p.name}</span>
                          <span className="pos-seniority mono">{p.level}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="drawer-foot">
              <button className="btn btn-ghost">查看 Prompt 模板</button>
              <button className="btn btn-primary">安装行业 →</button>
            </div>
          </aside>
        </>
      );
    }

    // ── Main: Industry Market Page ──
    function IndustryMarketPage() {
      const [query, setQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [sourceFilter, setSourceFilter] = useState('all');
      const [view, setView] = useState('grid'); // 'grid' | 'table'
      const [openKey, setOpenKey] = useState(null);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return INDUSTRIES.filter((i) => {
          if (q && !(i.name.toLowerCase().includes(q) || i.key.includes(q) || i.desc.toLowerCase().includes(q))) return false;
          if (statusFilter !== 'all' && i.status !== statusFilter) return false;
          if (sourceFilter !== 'all' && i.source !== sourceFilter) return false;
          return true;
        });
      }, [query, statusFilter, sourceFilter]);

      const totalDepts = INDUSTRIES.reduce((s, i) => s + i.deptCount, 0);
      const totalPos = INDUSTRIES.reduce((s, i) => s + i.posCount, 0);
      const totalAgents = INDUSTRIES.reduce((s, i) => s + i.agentCount, 0);

      return (
        <main className="main">
          {/* HERO */}
          <div className="page-hero">
            <div>
              <div className="page-kicker">Industry Template Library</div>
              <h1 className="page-title">行业模板库</h1>
              <p className="page-subtitle">
                一个行业即一个完整场景包 — 内置岗位级 Agent、部门职责、领域 Tool/Skill/Knowledge。
                选择行业，一键安装，立刻拥有可协作的智能团队。
              </p>
            </div>
            <div className="page-actions">
              <button className="btn btn-ghost">↻ 刷新</button>
              <button className="btn btn-ghost">↥ 导出清单</button>
              <button className="btn btn-primary">+ 申请新行业</button>
            </div>
          </div>

          {/* METRICS */}
          <div className="metrics-grid">
            <MetricCard label="已启用行业" value={INDUSTRIES.length} foot={
              <span><span className="delta-up">+1</span> 本月新增</span>
            } />
            <MetricCard label="部门总数" value={totalDepts} foot="跨所有已启用行业" />
            <MetricCard label="岗位总数" value={totalPos} foot={
              <span>人均 <span className="mono">{Math.round(totalAgents / totalPos * 10) / 10}</span> Agent / 岗</span>
            } />
            <MetricCard label="Agent 总数" value={totalAgents} foot={
              <span>已部署实例 <span className="mono">22</span></span>
            } />
          </div>

          {/* TOOLBAR */}
          <div className="toolbar">
            <div className="search">
              <span className="search-icon">⌕</span>
              <input
                placeholder="搜索行业名称 / key / 描述…"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
              <span className="search-kbd">⌘ K</span>
            </div>
            <div className="filter-chips">
              <span style={{ fontSize: 11, color: 'var(--color-text-tertiary)', marginRight: 4 }}>状态</span>
              {[
                { k: 'all', l: '全部', n: INDUSTRIES.length },
                { k: 'enabled', l: '启用', n: INDUSTRIES.filter((i) => i.status === 'enabled').length },
                { k: 'disabled', l: '停用', n: INDUSTRIES.filter((i) => i.status === 'disabled').length },
              ].map((c) => (
                <button
                  key={c.k}
                  className={'chip' + (statusFilter === c.k ? ' chip--active' : '')}
                  onClick={() => setStatusFilter(c.k)}
                >
                  {c.l}<span className="chip__count mono">{c.n}</span>
                </button>
              ))}
            </div>
            <div className="filter-chips">
              <span style={{ fontSize: 11, color: 'var(--color-text-tertiary)', marginRight: 4 }}>来源</span>
              {[
                { k: 'all', l: '全部' },
                { k: 'system', l: '系统' },
                { k: 'custom', l: '自建' },
              ].map((c) => (
                <button
                  key={c.k}
                  className={'chip' + (sourceFilter === c.k ? ' chip--active' : '')}
                  onClick={() => setSourceFilter(c.k)}
                >
                  {c.l}
                </button>
              ))}
            </div>
            <div className="toolbar-spacer" />
            <div className="view-toggle" role="tablist" aria-label="视图切换">
              <button className={view === 'grid' ? 'is-active' : ''} onClick={() => setView('grid')}>▦ 网格</button>
              <button className={view === 'table' ? 'is-active' : ''} onClick={() => setView('table')}>≡ 列表</button>
            </div>
          </div>

          {/* CONTENT */}
          {filtered.length === 0 ? (
            <div className="empty">
              <h4>没有匹配的行业模板</h4>
              <p>尝试调整搜索词或清除筛选条件</p>
            </div>
          ) : view === 'grid' ? (
            <div className="ind-grid">
              {filtered.map((ind) => (
                <IndustryCard
                  key={ind.key}
                  ind={ind}
                  isOpen={openKey === ind.key}
                  onOpen={(k) => setOpenKey(openKey === k ? null : k)}
                />
              ))}
              <div className="ind-card ind-card--cta">
                <div className="plus">+</div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>申请新行业</div>
                <small>描述你的业务场景<br />平台团队会评估并发布</small>
              </div>
            </div>
          ) : (
            <div className="ind-table">
              <table>
                <thead>
                  <tr>
                    <th>行业</th>
                    <th>描述</th>
                    <th className="num">部门</th>
                    <th className="num">岗位</th>
                    <th className="num">Agent</th>
                    <th className="num">已部署</th>
                    <th>状态</th>
                    <th>来源</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((ind) => (
                    <IndustryRow key={ind.key} ind={ind} onOpen={(k) => setOpenKey(k)} />
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* SIGNATURE (one detail at 120%) */}
          <div className="signature">
            <span className="rule" />
            <span className="quote">"Spec the world, then ship it."</span>
            <span>· 信息建筑派的签名细节 — 每个数字可被追溯、每个选项可被对比</span>
          </div>

          {openKey && <IndustryDrawer indKey={openKey} onClose={() => setOpenKey(null)} />}
        </main>
      );
    }

    // ── App ──
    function App() {
      return (
        <div className="app-shell">
          <Sidebar />
          <IndustryMarketPage />
        </div>
      );
    }

    // ── Tweak panel (bottom-left, live) ──
    function Tweaks() {
      return (
        <div className="tweaks">
          <div className="tweaks-panel">
            <b>Direction A</b> · 信息建筑派 (Pentagram / Linear)
            <br />点击行业卡片 → 侧滑详情；切换网格/列表；按 <kbd>⌘ K</kbd> 聚焦搜索
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <>
        <App />
        <Tweaks />
      </>
    );
  </script>
</body>
</html>
