<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aranea-Agents 请求生命周期</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky:#0EA5E9;--blue:#3B82F6;--indigo:#6366F1;--violet:#8B5CF6;
  --emerald:#10B981;--amber:#F59E0B;--rose:#F43F5E;--slate:#64748B;
  --bg:#0A0A0B;--surface:#111113;--surface2:#18181B;
  --border:#27272A;--text:#E4E4E7;--text2:#A1A1AA;--text3:#71717A;
  --mono:'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
  --sans:'Inter','SF Pro Text',-apple-system,'Segoe UI',sans-serif;
}
html{font-size:13px;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{padding:32px 40px;max-width:1700px;margin:0 auto;overflow-x:auto}

.header{margin-bottom:32px;opacity:0;animation:fadeIn .6s ease forwards}
.header h1{font-size:1.75rem;font-weight:600;letter-spacing:-.02em}
.header .sub{font-size:.78rem;color:var(--text3);margin-top:6px;font-family:var(--mono);letter-spacing:.04em}

/* Sequence Diagram Layout */
.seq-container{position:relative;min-width:1400px}

/* Swim Lanes */
.lanes{display:grid;grid-template-columns:repeat(9,1fr);gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:0}
.lane{border-right:1px solid var(--border);min-height:100%;position:relative}
.lane:last-child{border-right:none}
.lane-head{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:2}
.lane-head .label{font-size:.65rem;font-weight:600;letter-spacing:.02em}
.lane-head .sublabel{font-size:.55rem;color:var(--text3);font-family:var(--mono);margin-top:2px}
.lane-body{padding:0;position:relative}

/* Timeline */
.timeline{display:flex;flex-direction:column;width:100%}

/* Step Row */
.step-row{display:contents}
.step-cell{padding:6px 6px;border-bottom:1px solid rgba(39,39,42,.5);min-height:36px;display:flex;align-items:center;position:relative;font-size:.6rem}
.step-cell.active{background:rgba(255,255,255,.02)}
.step-cell .node{width:100%;padding:4px 6px;border-radius:3px;font-family:var(--mono);line-height:1.4}
.step-cell .node.highlight{border:1px solid;padding:4px 6px}

/* Arrow overlay */
.arrow-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* Phase markers */
.phase{display:flex;align-items:center;gap:0;margin-bottom:0}
.phase-label{writing-mode:vertical-rl;text-orientation:mixed;font-size:.58rem;font-weight:600;letter-spacing:.06em;padding:8px 4px;text-align:center;min-width:24px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface)}
.phase-content{flex:1}

/* Flow rows - using a simpler approach */
.flow{margin-bottom:0}
.flow-row{display:grid;grid-template-columns:24px repeat(9,1fr);border-bottom:1px solid rgba(39,39,42,.4);min-height:32px;align-items:center}
.flow-phase{font-size:.55rem;font-weight:600;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.04em;padding:4px 2px;text-align:center;color:var(--text3)}
.flow-cell{padding:3px 5px;font-size:.6rem;font-family:var(--mono);line-height:1.35;color:var(--text2);min-height:32px;display:flex;align-items:center}
.flow-cell.active{color:var(--text)}
.flow-cell .badge{display:inline-block;padding:1px 5px;border-radius:2px;font-size:.55rem;font-weight:600;margin-right:4px;flex-shrink:0}
.flow-cell .detail{font-size:.55rem;color:var(--text3)}

/* Arrow indicators */
.flow-cell .arrow-r{color:var(--text3);margin:0 2px;font-size:.7rem}
.flow-cell .arrow-d{color:var(--text3);font-size:.5rem;display:block;text-align:center}

/* Section dividers */
.section-divider{grid-column:1/-1;padding:8px 12px;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);border-top:1px solid var(--border);background:var(--surface)}

/* Legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:5px;opacity:0;animation:fadeIn .5s ease .8s forwards}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.62rem;font-family:var(--mono);color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Stagger animation for rows */
.flow-row{opacity:0;animation:fadeIn .35s ease forwards}
</style>
</head>
<body>

<div class="header">
  <h1>请求生命周期</h1>
  <div class="sub">aranea-agents / chat-request / sequence-diagram / end-to-end</div>
</div>

<!-- Main Sequence Diagram -->
<div class="flow" id="diagram"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--sky)"></div>前端</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>传输层</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--indigo)"></div>服务层</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--violet)"></div>Agent运行时</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--emerald)"></div>事件/推送</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>记忆</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--rose)"></div>前端接收</div>
</div>

<script>
const COLS = 9;
const lanes = [
  {label:'前端',sub:'ChatPage',color:'var(--sky)'},
  {label:'前端处理',sub:'ChatStore',color:'var(--sky)'},
  {label:'传输层',sub:'Kratos HTTP',color:'var(--blue)'},
  {label:'服务层',sub:'Orchestrator',color:'var(--indigo)'},
  {label:'Agent运行时',sub:'Runner',color:'var(--violet)'},
  {label:'LLM/工具',sub:'Provider+Tools',color:'var(--violet)'},
  {label:'事件发布',sub:'TraceEmitter',color:'var(--emerald)'},
  {label:'WebSocket',sub:'WSServer',color:'var(--emerald)'},
  {label:'记忆写入',sub:'AutoMemory',color:'var(--amber)'},
];

const steps = [
  {section:'1. 用户发送消息'},
  {cells:[1,0,0,0,0,0,0,0,0],text:['用户输入消息','','','','','','','',''],badge:['','','','','','','','','']},
  {cells:[1,0,0,0,0,0,0,0,0],text:['ChatPage.vue','','','','','','','',''],badge:['','','','','','','','',''],detail:['onSubmit','','','','','','','','']},

  {section:'2. 前端处理'},
  {cells:[0,1,0,0,0,0,0,0,0],text:['','ChatStore.sendMessage()','','','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,1,0,0,0,0,0,0,0],text:['','API Service → HTTP POST','','','','','','',''],badge:['','','','','','','','',''],detail:['','/v1/chat/sessions/{id}/turns','','','','','','','']},

  {section:'3. 传输层'},
  {cells:[0,0,1,0,0,0,0,0,0],text:['','Kratos HTTP Server 接收','','','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,1,0,0,0,0,0,0],text:['','中间件链执行','','','','','','',''],badge:['','','','','','','','',''],detail:['','recovery→tracing→logging→auth→cors','','','','','','','']},
  {cells:[0,0,1,0,0,0,0,0,0],text:['','路由 → ChatService','','','','','','',''],badge:['','','','','','','','','']},

  {section:'4. 服务层'},
  {cells:[0,0,0,1,0,0,0,0,0],text:['','','','ChatOrchestrator.RunTurn()','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,1,0,0,0,0,0],text:['','','','SessionStatusGuard 准入检查','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,1,0,0,0,0,0],text:['','','','BuildTRPCAgent()','','','','',''],badge:['','','','','','','','',''],detail:['','','','L1角色+L2工具+L3记忆+L4知识','','','','','']},
  {cells:[0,0,0,1,0,0,0,0,0],text:['','','','NewTRPCRunner()','','','','',''],badge:['','','','','','','','',''],detail:['','','','Session+Memory+Artifact+Plugin','','','','','']},
  {cells:[0,0,0,1,0,0,0,0,0],text:['','','','RunTurn → trpc-agent-go Runner','','','','',''],badge:['','','','','','','','','']},

  {section:'5. Agent 运行时'},
  {cells:[0,0,0,0,1,0,0,0,0],text:['','','','','BeforeModelHook','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,1,0,0,0,0],text:['','','','','L0 快照 → L1 工作记忆注入','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,1,0,0,0,0],text:['','','','','L2+L3 融合召回 → L4 知识图谱','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,1,0,0,0,0],text:['','','','','Skill 指引注入','','','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,1,0,0,0],text:['','','','','','LLM 调用','','',''],badge:['','','','','','','','',''],detail:['','','','','','Provider (7种, HA)','','','']},
  {cells:[0,0,0,0,0,1,0,0,0],text:['','','','','','工具调用','','',''],badge:['','','','','','','','',''],detail:['','','','','','28注册+MCP+Custom','','','']},
  {cells:[0,0,0,0,1,0,0,0,0],text:['','','','','AfterModelHook','','','',''],badge:['','','','','','','','',''],detail:['','','','','L0 回填实际 token','','','','']},

  {section:'6. 事件发布'},
  {cells:[0,0,0,0,0,0,1,0,0],text:['','','','','','','TraceEmitter → Infra.Publish','',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,0,1,0,0],text:['','','','','','','SessionBus + MonitorBus','',''],badge:['','','','','','','','','']},

  {section:'7. WebSocket 推送'},
  {cells:[0,0,0,0,0,0,0,1,0],text:['','','','','','','','WSServer.eventPump',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,0,0,1,0],text:['','','','','','','','3 优先级队列 → writePump',''],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,0,0,1,0],text:['','','','','','','','→ 浏览器',''],badge:['','','','','','','','','']},

  {section:'8. 记忆写入'},
  {cells:[0,0,0,0,0,0,0,0,1],text:['','','','','','','','','AutoMemoryQueue'],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,0,0,0,1],text:['','','','','','','','','Consolidator.Extract'],badge:['','','','','','','','','']},
  {cells:[0,0,0,0,0,0,0,0,1],text:['','','','','','','','','L3 facts + L2 episode'],badge:['','','','','','','','','']},

  {section:'9. 前端接收'},
  {cells:[0,1,0,0,0,0,0,0,0],text:['','WsTransport 接收','','','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,1,0,0,0,0,0,0,0],text:['','EnvelopeDispatcher 分发','','','','','','',''],badge:['','','','','','','','','']},
  {cells:[0,1,0,0,0,0,0,0,0],text:['','ChatStore → UI 更新','','','','','','',''],badge:['','','','','','','','','']},
];

const colors = ['var(--sky)','var(--sky)','var(--blue)','var(--indigo)','var(--violet)','var(--violet)','var(--emerald)','var(--emerald)','var(--amber)'];

let html = '';

// Lane headers
html += '<div class="flow-row" style="animation-delay:0s;background:var(--surface)">';
html += '<div class="flow-cell" style="justify-content:center;color:var(--text3)">#</div>';
for(let i=0;i<COLS;i++){
  html += `<div class="flow-cell" style="flex-direction:column;align-items:center;justify-content:center;padding:8px 4px">
    <span style="font-size:.68rem;font-weight:600;color:${colors[i]}">${lanes[i].label}</span>
    <span style="font-size:.55rem;color:var(--text3);font-family:var(--mono)">${lanes[i].sub}</span>
  </div>`;
}
html += '</div>';

let stepIdx = 0;
let animDelay = 0.05;

for(const step of steps){
  if(step.section){
    html += `<div class="section-divider" style="animation-delay:${animDelay}s">${step.section}</div>`;
    animDelay += 0.02;
    continue;
  }

  html += `<div class="flow-row" style="animation-delay:${animDelay}s">`;
  html += `<div class="flow-cell" style="justify-content:center;color:var(--text3);font-size:.5rem">${++stepIdx}</div>`;

  for(let i=0;i<COLS;i++){
    const isActive = step.cells[i];
    const txt = step.text[i] || '';
    const bdg = step.badge?.[i] || '';
    const det = step.detail?.[i] || '';

    if(isActive){
      html += `<div class="flow-cell active" style="flex-direction:column;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
          <span style="display:inline-block;width:4px;height:4px;border-radius:1px;background:${colors[i]};flex-shrink:0"></span>
          <span style="color:var(--text);font-weight:500">${txt}</span>
        </div>
        ${det ? `<span style="font-size:.52rem;color:var(--text3);margin-left:8px;margin-top:1px">${det}</span>` : ''}
      </div>`;
    } else {
      // Draw vertical line for inactive lanes
      html += `<div class="flow-cell" style="justify-content:center">
        <div style="width:1px;height:100%;background:var(--border);min-height:20px"></div>
      </div>`;
    }
  }
  html += '</div>';
  animDelay += 0.04;
}

document.getElementById('diagram').innerHTML = html;
</script>

</body>
</html>
