<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SRV 1U/2U/4U — 全息拆解台</title>
<style>
  :root { --cy:#35e0ff; --cyd:rgba(53,224,255,.35); --panel:rgba(8,18,28,.78); }
  body { margin:0; font:12px/1.45 ui-monospace,'Cascadia Mono',Consolas,monospace; background:#04070d; color:#bfe6f2; overflow:hidden; }
  /* ---- holo panel (angled corners) ---- */
  .holo { background:var(--panel); border:1px solid var(--cyd); box-shadow:0 0 18px rgba(53,224,255,.12) inset,0 0 12px rgba(0,0,0,.6);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); backdrop-filter:blur(6px); }
  #ui { position:fixed; top:10px; left:10px; z-index:9; padding:10px 12px; max-width:340px; }
  #ui b { color:var(--cy); letter-spacing:2px; }
  #ui button { margin:2px; font:11px ui-monospace,monospace; cursor:pointer; background:rgba(53,224,255,.06);
    color:#bfe6f2; border:1px solid rgba(53,224,255,.30); padding:2px 8px; }
  #ui button:hover { background:rgba(53,224,255,.22); box-shadow:0 0 8px rgba(53,224,255,.4); }
  #ui button.on { background:rgba(53,224,255,.30); color:#04121a; font-weight:bold; }
  #status { position:fixed; bottom:10px; left:10px; z-index:9; padding:6px 10px; color:#8fd8ea; }
  #counts { color:#5e8fa0; margin-top:4px; }
  input[type=range] { width:180px; vertical-align:middle; accent-color:var(--cy); }
  #explodeVal { display:inline-block; width:42px; color:var(--cy); }
  /* ---- scanlines + vignette (ambience layers) ---- */
  #scan { position:fixed; inset:0; z-index:7; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(160,230,255,.028) 0 1px, transparent 1px 3px); }
  #vig { position:fixed; inset:0; z-index:7; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(2,6,12,.55) 100%); }
  /* ---- leader lines + labels ---- */
  #leaders { position:fixed; inset:0; z-index:6; pointer-events:none; }
  #labels { position:fixed; inset:0; z-index:6; pointer-events:none; }
  .hw-label { position:absolute; top:0; left:0; pointer-events:auto; min-width:150px; padding:4px 8px 4px 10px;
    background:rgba(8,24,34,.66); border:1px solid var(--cyd); border-left:2px solid var(--cy);
    box-shadow:0 0 10px rgba(53,224,255,.15); backdrop-filter:blur(3px); cursor:default;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px); transition:background .15s, box-shadow .15s; }
  .hw-label .t { color:#eafcff; font-weight:bold; letter-spacing:1px; }
  .hw-label .m { color:#7fc9dd; font-size:11px; }
  .hw-label:hover, .hw-label.hot { background:rgba(53,224,255,.20); box-shadow:0 0 16px rgba(53,224,255,.45); }
  /* ---- detail card (diegetic) ---- */
  #card { position:fixed; z-index:9; display:none; min-width:230px; max-width:300px; padding:10px 12px; pointer-events:auto; }
  #card .ct { color:var(--cy); letter-spacing:2px; font-weight:bold; }
  #card .cm { color:#eafcff; font-size:14px; margin-top:2px; }
  #card .cs { color:#9fd8e8; margin-top:2px; }
  #card .cx { color:#5e8fa0; margin-top:6px; border-top:1px dashed rgba(53,224,255,.25); padding-top:4px; }
  #card .x { position:absolute; top:4px; right:8px; color:#5e8fa0; cursor:pointer; }
  #card .x:hover { color:var(--cy); }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<div id="ui" class="holo">
  <div><b>SRV 全息拆解台</b></div>
  <div>爆炸拆分: <input id="explode" type="range" min="0" max="1" step="0.001" value="0"><span id="explodeVal">0%</span></div>
  <div>机型:
    <button data-focus="SRV_1U_ROOT">1U</button><button data-focus="SRV_2U_ROOT">2U</button><button data-focus="SRV_4U_ROOT" class="on">4U</button>
  </div>
  <div>标签:
    <button id="lblAll" class="on">全部</button><button id="lblHover">Hover</button>
    <button id="tourBtn">▶ 导览</button>
  </div>
  <div>Health:
    <button data-led="M_LED_Health" data-c="0x00ff22">ok</button>
    <button data-led="M_LED_Health" data-c="0xffaa00">warn</button>
    <button data-led="M_LED_Health" data-c="0xff2222">crit</button>
  </div>
  <div>Power/UID:
    <button data-led="M_LED_Power" data-c="0x00ff22">on</button>
    <button data-led="M_LED_Power" data-c="0x000000">off</button>
    <button data-led="M_LED_UID" data-c="0x2266ff">uid</button>
    <button data-led="M_LED_UID" data-c="0x000000">uid off</button>
  </div>
  <div>视角:
    <button data-view="front">前</button><button data-view="rear">后</button><button data-view="top">顶</button><button data-view="iso">3/4</button>
  </div>
  <div id="counts">loading…</div>
</div>
<svg id="leaders"></svg>
<div id="labels"></div>
<div id="card" class="holo"><span class="x">✕</span><div class="ct"></div><div class="cm"></div><div class="cs"></div><div class="cx"></div></div>
<div id="scan"></div><div id="vig"></div>
<div id="status" class="holo">…</div>
<script type="module">
window.__ERRORS = [];
window.addEventListener('error', e => window.__ERRORS.push(String(e.message || e)));
window.addEventListener('unhandledrejection', e => window.__ERRORS.push('rej: ' + String(e.reason)));
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';
import { FBXLoader } from './lib/FBXLoader.js';

const report = { loaded: [], errors: [], meshes: 0, leds: 0, hwProps: 0, explodeVecs: 0,
                 animClips: 0, bbox: {}, sampleProps: null, ledMats: [], labels: 0 };
window.__REPORT = report;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
else if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
window.__SCENE = scene; window.__CAMERA_REF = () => camera; window.__THREE = THREE; window.__CONTROLS_REF = () => controls;
scene.background = new THREE.Color(0x04070d);
scene.fog = new THREE.Fog(0x04070d, 6, 18);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ---------------------------------------------------------------- environment (procedural studio equirect -> PMREM)
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#7d8694');
  grad.addColorStop(0.45, '#4a525c');
  grad.addColorStop(0.62, '#2b3138');
  grad.addColorStop(1.0, '#14171c');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  g.filter = 'blur(16px)';
  g.fillStyle = '#ffffff';
  g.fillRect(240, 18, 544, 78);
  g.filter = 'blur(24px)';
  g.fillStyle = '#e9effa';
  g.fillRect(30, 110, 110, 210);
  g.fillRect(884, 110, 110, 210);
  g.fillStyle = '#b9c9e2';
  g.fillRect(400, 140, 224, 56);
  g.filter = 'none';
  const fg = g.createLinearGradient(0, 330, 0, 512);
  fg.addColorStop(0, 'rgba(120,135,155,0.25)');
  fg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fg;
  g.fillRect(0, 330, 1024, 182);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = makeEnvTexture();
scene.environment = pmrem.fromEquirectangular(envTex).texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 1.5;
envTex.dispose();
pmrem.dispose();

// ---------------------------------------------------------------- lights (3-point + hemisphere)
scene.add(new THREE.HemisphereLight(0xbcc8d8, 0x1a1d22, 0.65));
const key = new THREE.DirectionalLight(0xfff4e8, 3.0);
key.position.set(2.2, -3.0, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9db8e8, 0.7);
fill.position.set(-3.2, -1.2, 1.8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.3);
rim.position.set(0.5, 3.2, 2.4);
scene.add(rim);

// ---------------------------------------------------------------- ground (shadow catcher + holo blueprint base)
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.35 }));
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a0f16, roughness: 0.9, metalness: 0.1 }));
disc.rotation.x = -Math.PI / 2;
disc.position.z = -0.002;
disc.receiveShadow = true;
scene.add(disc);
// blueprint polar grid + twin rotating holo rings (created once size is known)
let polarGrid = null, holoRing1 = null, holoRing2 = null;
function buildHoloBase(radius, floorY) {
  polarGrid = new THREE.PolarGridHelper(radius, 16, 8, 64, 0x1c6f80, 0x0d3540);
  polarGrid.position.y = floorY + radius * 0.001;
  polarGrid.material.transparent = true;
  polarGrid.material.opacity = 0.35;
  scene.add(polarGrid);
  const mkRing = (r, op) => {
    const m = new THREE.Mesh(
      new THREE.RingGeometry(r, r * 1.008 + 0.4, 96),
      new THREE.MeshBasicMaterial({ color: 0x35e0ff, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = floorY + radius * 0.002;
    scene.add(m);
    return m;
  };
  holoRing1 = mkRing(radius * 0.62, 0.5);
  holoRing2 = mkRing(radius * 0.88, 0.28);
}

// ---------------------------------------------------------------- loading
const loader = new FBXLoader();
const homes = new Map();
const explodeObjs = [];
const ledMeshes = [];
const loadedRoots = [];
const propsByName = {};
let scaleK = 1;

const MAT_TABLE = {
  MAT_Chassis_Steel: [0.35, 0.50], MAT_Front_Bezel: [0.25, 0.50], MAT_Tray_Silver: [0.50, 0.42],
  MAT_PCB_Green: [0.10, 0.50], MAT_Plastic_Black: [0.00, 0.55], MAT_Heatsink_Al: [1.00, 0.30],
  MAT_Heatsink_Cu: [1.00, 0.28], MAT_Chip_Black: [0.10, 0.40], MAT_Contact_Gold: [1.00, 0.22],
  MAT_HDD_Top: [0.60, 0.40], MAT_GPU_Shroud: [0.40, 0.40], MAT_PSU_Shell: [0.45, 0.45],
  MAT_DIMM_PCB: [0.10, 0.45], MAT_Label_White: [0.00, 0.60], MAT_USB_Blue: [0.05, 0.45],
  MAT_VGA_Blue: [0.10, 0.50],
};
const stdCache = new Map();
function toStandard(m) {
  if (!m || m.isMeshStandardMaterial) return m;
  const hit = stdCache.get(m.name);
  if (hit) return hit;
  const [met, rough] = MAT_TABLE[m.name] || [0.2, 0.5];
  const s = new THREE.MeshStandardMaterial({ name: m.name });
  if (m.color) s.color.copy(m.color);
  s.metalness = met;
  s.roughness = rough;
  if (m.name.startsWith('M_LED_')) {
    s.emissive.copy(s.color);
    s.emissiveIntensity = 2.0;
  }
  stdCache.set(m.name, s);
  return s;
}

function collect(root, file) {
  root.traverse(o => {
    if (o.isMesh) {
      report.meshes++;
      o.material = Array.isArray(o.material) ? o.material.map(toStandard) : toStandard(o.material);
      o.castShadow = true;
      o.receiveShadow = true;
      const mn = o.material && o.material.name || '';
      if (mn.startsWith('M_LED_')) {
        o.material = o.material.clone();
        o.castShadow = false;
        ledMeshes.push(o);
        report.leds++;
        if (!report.ledMats.includes(mn)) report.ledMats.push(mn);
      }
      const ud = Object.assign({}, propsByName[o.name] || {}, o.userData || {});
      o.userData = ud;
      if (ud.hw_name || ud.hw_model) {
        report.hwProps++;
        if (!report.sampleProps) report.sampleProps = { name: o.name, ...ud };
      }
      if (ud.explode_dx !== undefined) {
        homes.set(o, o.position.clone());
        explodeObjs.push({ obj: o, vec: new THREE.Vector3(+ud.explode_dx, +ud.explode_dy, +ud.explode_dz) });
        report.explodeVecs++;
      }
    }
  });
  if (root.animations) report.animClips += root.animations.length;
  scene.add(root);
  loadedRoots.push(root);
  report.loaded.push(file);
}

async function loadJsonProps() {
  try {
    const meta = await (await fetch('../ue5_integration.json')).json();
    for (const [tag, items] of Object.entries(meta.servers || {})) {
      for (const it of items) propsByName[it.name] = it.props || {};
    }
    report.jsonProps = Object.keys(propsByName).length;
  } catch (e) {
    report.errors.push('json: ' + String(e));
  }
}

async function load(file) {
  return new Promise((res, rej) => loader.load(file, g => res(g), undefined, rej));
}

let sceneCenter = new THREE.Vector3();
let sceneSize = 1;

function setView(name) {
  const c = sceneCenter, s = sceneSize;
  const d = s * 0.85;
  if (name === 'front') camera.position.set(c.x + s * 0.04, c.y + s * 0.16, c.z + d);
  else if (name === 'rear') camera.position.set(c.x - s * 0.06, c.y + s * 0.18, c.z - d);
  else if (name === 'top') camera.position.set(c.x, c.y + d * 1.25, c.z + s * 0.12);
  else camera.position.set(c.x + s * 0.50, c.y + s * 0.30, c.z + s * 0.58);
  controls.target.copy(c);
  controls.update();
}

function frameServer(rootName) {
  const root = scene.getObjectByName(rootName);
  if (!root) return;
  const bb = new THREE.Box3().setFromObject(root);
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  const m = Math.max(s.x, s.y, s.z);
  camera.position.set(c.x + 0.48 * m, c.y + 0.34 * m, c.z + 0.85 * m);
  controls.target.copy(c);
  controls.update();
}
window.__frame = (rootName, dx, dy, dz, dist) => {
  const root = scene.getObjectByName(rootName); if (!root) return 'no root';
  const bb = new THREE.Box3().setFromObject(root);
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  const m = Math.max(s.x, s.y, s.z);
  camera.position.set(c.x + dx * m * dist, c.y + dy * m * dist, c.z + dz * m * dist);
  controls.target.copy(c); controls.update();
  return 'ok';
};

// ---------------------------------------------------------------- label groups (holo teardown core)
const CN = { CPU: '处理器', HEATSINK: '散热器', MEMORY: '内存', GPU: '显卡', STORAGE: '硬盘',
             PSU: '电源', FAN: '风扇', MOTHERBOARD: '主板', CHIPSET: '芯片组' };
const TOUR_ORDER = ['MOTHERBOARD', 'CPU', 'HEATSINK', 'MEMORY', 'GPU', 'STORAGE', 'PSU', 'FAN'];
const groups = [];                 // {server, cat, model, spec, objs[], rep, el, line, mats[], size}
const groupByObj = new Map();      // hw-carrying object -> group
let focusServer = 'SRV_4U_ROOT';
let labelMode = 'all';             // 'all' | 'hover'
let explodeT = 0;
const LABEL_GATE = 0.25;           // "全部"模式在爆炸 ≥25% 时展开

const labelsDiv = document.getElementById('labels');
const leadersSvg = document.getElementById('leaders');
const card = document.getElementById('card');

function serverOf(name) { const m = name.match(/^SRV_(1U|2U|4U)_/); return m ? 'SRV_' + m[1] + '_ROOT' : null; }

function buildGroups() {
  const byKey = new Map();
  scene.traverse(o => {
    const ud = o.userData || {};
    if (!ud.hw_category || !CN[ud.hw_category]) return;
    const srv = serverOf(o.name);
    if (!srv) return;
    const key = `${srv}|${ud.hw_category}|${ud.hw_model || ''}`;
    let g = byKey.get(key);
    if (!g) {
      g = { server: srv, cat: ud.hw_category, model: ud.hw_model || '', spec: ud.hw_spec || '',
            objs: [], rep: null, el: null, line: null, mats: [], size: 1 };
      byKey.set(key, g);
      groups.push(g);
    }
    g.objs.push(o);
    groupByObj.set(o, g);
  });
  for (const g of groups) {
    g.rep = g.objs[Math.floor(g.objs.length / 2)];
    // per-group unique materials so highlight doesn't bleed into same-material siblings
    for (const o of g.objs) {
      o.traverse(m => {
        if (m.isMesh && m.material && !m.material.name.startsWith('M_LED_') && !m.userData.__uniq) {
          m.material = m.material.clone();
          m.userData.__uniq = 1;
          g.mats.push(m.material);
        }
      });
    }
    // label DOM + leader line
    const el = document.createElement('div');
    el.className = 'hw-label';
    el.style.display = 'none';
    el.innerHTML = `<div class="t">${CN[g.cat]}${g.objs.length > 1 ? ' ×' + g.objs.length : ''}</div>` +
                   (g.model ? `<div class="m">${g.model}</div>` : '');
    el.addEventListener('mouseenter', () => { setHover(g, true); });
    el.addEventListener('mouseleave', () => { setHover(null, true); });
    labelsDiv.appendChild(el);
    g.el = el;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'rgba(53,224,255,.55)');
    line.setAttribute('stroke-width', '1');
    line.style.display = 'none';
    leadersSvg.appendChild(line);
    g.line = line;
    // server bbox size (for tour distance)
    const root = scene.getObjectByName(g.server);
    if (root) g.size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3()).length();
  }
  report.labels = groups.length;
  window.__GROUPS = groups;
}

// ---------------------------------------------------------------- highlight / hover / pin
let hoverGroup = null;
let pinnedGroup = null;
function paintGroup(g, on) {
  for (const m of g.mats) {
    if (on) { m.emissive.setHex(0x1899b8); m.emissiveIntensity = 0.65; }
    else { m.emissive.setHex(0x000000); m.emissiveIntensity = 1; }
  }
  g.el.classList.toggle('hot', on);
}
function setHover(g, fromLabel) {
  if (hoverGroup === g) return;
  if (hoverGroup && hoverGroup !== pinnedGroup) paintGroup(hoverGroup, false);
  hoverGroup = g;
  if (g && g !== pinnedGroup) paintGroup(g, true);
}
function showCard(g) {
  if (!g) { card.style.display = 'none'; return; }
  card.querySelector('.ct').textContent = `${CN[g.cat]} · ${g.rep.userData.hw_name || g.cat}`;
  card.querySelector('.cm').textContent = g.model || '—';
  card.querySelector('.cs').textContent = g.spec || '';
  card.querySelector('.cx').textContent = `数量 ×${g.objs.length} · 类别 ${g.cat} · ${g.server.replace('SRV_', '').replace('_ROOT', '')}`;
  card.style.display = 'block';
}
function pinGroup(g) {
  if (pinnedGroup && pinnedGroup !== hoverGroup) paintGroup(pinnedGroup, false);
  pinnedGroup = g;
  if (g) { paintGroup(g, true); showCard(g); } else showCard(null);
}
card.querySelector('.x').addEventListener('click', () => pinGroup(null));

// ---------------------------------------------------------------- per-frame label layout (docked callout column)
const _v = new THREE.Vector3();
const _v2 = new THREE.Vector3();
function worldCenter(o) {
  return new THREE.Box3().setFromObject(o).getCenter(_v);
}
function updateLabels() {
  const showAll = labelMode === 'all' && explodeT >= LABEL_GATE;
  const items = [];
  for (const g of groups) {
    const vis = (g.server === focusServer) && (showAll || g === hoverGroup || g === pinnedGroup);
    if (!vis) { g.el.style.display = 'none'; g.line.style.display = 'none'; continue; }
    worldCenter(g.rep);
    // cull anchors behind the camera (view-space z > 0 = behind); must run on the
    // world-space center BEFORE project() — cm-scale scene makes a raw z>1 test bogus
    if (_v2.copy(_v).applyMatrix4(camera.matrixWorldInverse).z > 0) { g.el.style.display = 'none'; g.line.style.display = 'none'; continue; }
    _v.project(camera);
    items.push({ g, ax: (_v.x + 1) / 2 * innerWidth, ay: (-_v.y + 1) / 2 * innerHeight });
  }
  if (!items.length) return;
  items.sort((a, b) => a.ay - b.ay);
  let colX = 0;
  for (const it of items) colX = Math.max(colX, it.ax);
  colX = Math.min(colX + 70, innerWidth - 185);
  let prevY = 58;                       // top margin below UI panel
  for (const it of items) {
    const ly = Math.max(it.ay - 14, prevY);
    prevY = ly + 40;                    // min vertical gap
    it.g.el.style.display = 'block';
    it.g.el.style.transform = `translate(${colX}px, ${ly}px)`;
    it.g.line.style.display = 'block';
    it.g.line.setAttribute('points', `${it.ax},${it.ay} ${colX - 28},${it.ay} ${colX - 5},${ly + 14}`);
  }
}
function updateCard() {
  if (!pinnedGroup) return;
  worldCenter(pinnedGroup.rep).project(camera);
  const sx = (_v.x + 1) / 2 * innerWidth, sy = (-_v.y + 1) / 2 * innerHeight;
  card.style.left = Math.min(sx + 34, innerWidth - 320) + 'px';
  card.style.top = Math.max(sy - 90, 10) + 'px';
}

// ---------------------------------------------------------------- scan ring (holo sweep on explode)
const rings = [];
function spawnScanRing(serverRootName) {
  const root = scene.getObjectByName(serverRootName);
  if (!root) return;
  const bb = new THREE.Box3().setFromObject(root);
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  const r = Math.hypot(s.x, s.z) * 0.62;
  const m = new THREE.Mesh(
    new THREE.RingGeometry(r, r * 1.05, 72),
    new THREE.MeshBasicMaterial({ color: 0x35e0ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(c.x, bb.min.y, c.z);
  scene.add(m);
  rings.push({ m, t: 0, y0: bb.min.y, y1: bb.max.y + s.y * 0.3 });
}
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt / 1.3;
    if (r.t >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i, 1); continue; }
    r.m.position.y = r.y0 + (r.y1 - r.y0) * r.t;
    r.m.material.opacity = 0.7 * (1 - r.t);
    const k = 1 + 0.12 * r.t;
    r.m.scale.setScalar(k);
  }
}

// ---------------------------------------------------------------- guided tour
const tour = { active: false, idx: 0, stops: [], tGoal: new THREE.Vector3(), pGoal: new THREE.Vector3(), until: 0 };
const tourBtn = document.getElementById('tourBtn');
function startTour() {
  const stops = [];
  for (const cat of TOUR_ORDER) {
    const g = groups.find(x => x.server === focusServer && x.cat === cat);
    if (g) stops.push(g);
  }
  if (!stops.length) return;
  // ensure interior is visible during tour
  if (explodeT < 0.65) { slider.value = 1; slider.dispatchEvent(new Event('input')); }
  tour.active = true; tour.idx = 0; tour.stops = stops;
  tourBtn.textContent = '■ 停止';
  setTourStop(0);
}
function setTourStop(i) {
  const g = tour.stops[i];
  worldCenter(g.rep);
  tour.tGoal.copy(_v);
  const dir = new THREE.Vector3(0.5, 0.34, 1).normalize();
  tour.pGoal.copy(_v).addScaledVector(dir, g.size * 0.42);
  pinGroup(g);
  tour.until = performance.now() + 2800;
}
function stopTour() {
  tour.active = false;
  tourBtn.textContent = '▶ 导览';
  pinGroup(null);
}
tourBtn.addEventListener('click', () => tour.active ? stopTour() : startTour());
function updateTour() {
  if (!tour.active) return;
  camera.position.lerp(tour.pGoal, 0.06);
  controls.target.lerp(tour.tGoal, 0.09);
  if (performance.now() > tour.until) {
    tour.idx++;
    if (tour.idx >= tour.stops.length) { stopTour(); frameServer(focusServer); }
    else setTourStop(tour.idx);
  }
}

// ---------------------------------------------------------------- boot
const slider = document.getElementById('explode');
const sliderVal = document.getElementById('explodeVal');
(async () => {
  try {
    await loadJsonProps();
    for (const f of ['../SRV_1U.fbx', '../SRV_2U.fbx', '../SRV_4U.fbx']) {
      try {
        const g = await load(f);
        collect(g, f);
      } catch (fe) {
        report.errors.push(f + ': ' + String(fe));
      }
    }
    const cover = scene.getObjectByName('SRV_1U_TopCover');
    if (cover) {
      const bb = new THREE.Box3().setFromObject(cover);
      const w = bb.max.x - bb.min.x;
      scaleK = w / 0.428;
      report.bbox.topCoverWidth = +w.toFixed(3);
      report.bbox.unitScale = scaleK;
    }
    const layoutX = { SRV_1U_ROOT: -0.62, SRV_2U_ROOT: 0.0, SRV_4U_ROOT: 0.70 };
    for (const [nm, mx] of Object.entries(layoutX)) {
      const o = scene.getObjectByName(nm);
      if (!o) continue;
      const ws = o.parent.getWorldScale(new THREE.Vector3()).x || 1;
      const bb = new THREE.Box3().setFromObject(o);
      const cur = (bb.min.x + bb.max.x) / 2;
      o.position.x += (mx * scaleK - cur) / ws;
    }
    const all = new THREE.Box3();
    for (const r of loadedRoots) all.expandByObject(r);
    all.getCenter(sceneCenter);
    sceneSize = all.getSize(new THREE.Vector3()).length();
    const floorY = all.min.y;
    shadowCatcher.position.y = floorY - 0.01 * scaleK;
    disc.position.y = floorY - 0.005 * scaleK;
    disc.scale.setScalar(sceneSize * 0.22);
    buildHoloBase(sceneSize * 0.62, floorY - 0.004 * scaleK);
    key.position.set(sceneCenter.x + sceneSize * 0.45, sceneCenter.y + sceneSize * 0.85, sceneCenter.z + sceneSize * 0.55);
    key.target.position.copy(sceneCenter);
    scene.add(key.target);
    fill.position.set(sceneCenter.x - sceneSize * 0.5, sceneCenter.y + sceneSize * 0.3, sceneCenter.z + sceneSize * 0.4);
    fill.target.position.copy(sceneCenter);
    scene.add(fill.target);
    rim.position.set(sceneCenter.x - sceneSize * 0.2, sceneCenter.y + sceneSize * 0.55, sceneCenter.z - sceneSize * 0.65);
    rim.target.position.copy(sceneCenter);
    scene.add(rim.target);
    key.shadow.normalBias = sceneSize * 0.002;
    const sc = key.shadow.camera;
    sc.left = -sceneSize * 0.7; sc.right = sceneSize * 0.7;
    sc.top = sceneSize * 0.7; sc.bottom = -sceneSize * 0.7;
    sc.near = 0.01; sc.far = sceneSize * 3;
    sc.updateProjectionMatrix();
    scene.fog.near = sceneSize * 2.2;
    scene.fog.far = sceneSize * 7;
    camera.near = Math.max(sceneSize / 1000, 0.005);
    camera.far = sceneSize * 12;
    camera.updateProjectionMatrix();
    buildGroups();
    setView('iso');
    document.getElementById('counts').textContent =
      `meshes=${report.meshes} leds=${report.leds} hwProps=${report.hwProps} explode=${report.explodeVecs} labels=${report.labels} scale=${scaleK.toFixed(1)}`;
    document.getElementById('status').textContent = '全部加载完成';
  } catch (e) {
    report.errors.push(String(e));
    document.getElementById('status').textContent = 'ERROR: ' + e;
  }
})();

// explode slider — smoothstep easing
slider.addEventListener('input', ev => {
  const t = +ev.target.value;
  const e = t * t * (3 - 2 * t);
  for (const { obj, vec } of explodeObjs) {
    obj.position.copy(homes.get(obj)).addScaledVector(vec, e);
  }
  if (explodeT < LABEL_GATE && t >= LABEL_GATE) spawnScanRing(focusServer);   // upward crossing -> holo sweep
  explodeT = t;
  sliderVal.textContent = Math.round(t * 100) + '%';
});

// view / focus / label-mode buttons
document.querySelectorAll('button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});
document.querySelectorAll('button[data-focus]').forEach(btn => {
  btn.addEventListener('click', () => {
    focusServer = btn.dataset.focus;
    document.querySelectorAll('button[data-focus]').forEach(b => b.classList.toggle('on', b === btn));
    pinGroup(null); setHover(null);
    frameServer(focusServer);
  });
});
document.getElementById('lblAll').addEventListener('click', () => {
  labelMode = 'all';
  document.getElementById('lblAll').classList.add('on');
  document.getElementById('lblHover').classList.remove('on');
});
document.getElementById('lblHover').addEventListener('click', () => {
  labelMode = 'hover';
  document.getElementById('lblHover').classList.add('on');
  document.getElementById('lblAll').classList.remove('on');
});

// LED buttons
document.querySelectorAll('button[data-led]').forEach(btn => {
  btn.addEventListener('click', () => {
    const mat = btn.dataset.led, col = new THREE.Color(parseInt(btn.dataset.c));
    let n = 0;
    for (const m of ledMeshes) {
      if (m.material.name === mat) {
        m.material.emissive = col.clone();
        m.material.color = col.clone().multiplyScalar(0.25);
        n++;
      }
    }
    document.getElementById('status').textContent = `${mat} -> #${col.getHexString()} (${n} LEDs)`;
  });
});

// ---------------------------------------------------------------- picking (hover + click)
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoverDirty = false;
function groupAt(clientX, clientY) {
  mouse.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (groupByObj.has(o)) return groupByObj.get(o);
      o = o.parent;
    }
  }
  return null;
}
renderer.domElement.addEventListener('pointermove', ev => {
  mouse.set(ev.clientX, ev.clientY);
  hoverDirty = true;
});
renderer.domElement.addEventListener('pointerdown', ev => {
  if (tour.active) { stopTour(); return; }
  const g = groupAt(ev.clientX, ev.clientY);
  pinGroup(g);                       // null hides card (clicked empty space)
});

// ---------------------------------------------------------------- main loop
let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (hoverDirty && !tour.active) {
    hoverDirty = false;
    setHover(groupAt(mouse.x, mouse.y));
  }
  if (holoRing1) { holoRing1.rotation.z += dt * 0.12; holoRing2.rotation.z -= dt * 0.07; }
  updateRings(dt);
  updateTour();
  controls.update();
  updateLabels();
  updateCard();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  leadersSvg.setAttribute('width', innerWidth);
  leadersSvg.setAttribute('height', innerHeight);
});
leadersSvg.setAttribute('width', innerWidth);
leadersSvg.setAttribute('height', innerHeight);
</script>
