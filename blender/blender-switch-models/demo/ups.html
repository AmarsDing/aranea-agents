<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国产 UPS 3D 监控 · UE5 资产预览 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04060b;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:#cfe6f5; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- 顶栏 ---------- */
  #hud-top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:linear-gradient(180deg,rgba(4,8,16,.92),rgba(4,8,16,0));
    pointer-events:none; z-index:10; }
  #hud-top h1 { font-size:15px; font-weight:600; letter-spacing:2px; color:#7fd8ff;
    text-shadow:0 0 12px rgba(60,180,255,.6); white-space:nowrap; }
  #hud-top .sub { font-size:11px; color:#4a6a80; letter-spacing:1px; }
  .tabs { display:flex; gap:6px; margin-left:18px; pointer-events:auto; }
  .tabs button, .ops button {
    background:rgba(16,32,52,.65); border:1px solid rgba(64,160,220,.35); color:#9fd0ea;
    font-size:12px; padding:5px 14px; border-radius:3px; cursor:pointer; letter-spacing:1px;
    transition:all .18s; backdrop-filter:blur(6px); }
  .tabs button:hover, .ops button:hover { border-color:#46c8ff; color:#dff4ff;
    box-shadow:0 0 10px rgba(70,200,255,.35); }
  .tabs button.on { background:rgba(30,90,140,.7); border-color:#46c8ff; color:#fff; }
  .ops { margin-left:auto; display:flex; gap:8px; align-items:center; pointer-events:auto; }
  #stats { font-size:11px; color:#5f89a5; letter-spacing:1px; margin-right:6px; }
  #stats b { color:#8fe3ff; font-weight:600; }
  #stats .al { color:#ff5f6b; }

  /* ---------- 图例 ---------- */
  #legend { position:fixed; left:20px; bottom:18px; z-index:10; font-size:11px;
    background:rgba(8,16,28,.72); border:1px solid rgba(64,160,220,.22); border-radius:4px;
    padding:10px 14px; backdrop-filter:blur(8px); line-height:1.9; letter-spacing:1px; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; }
  #legend .g { background:#00e659; box-shadow:0 0 6px #00e659; }
  #legend .a { background:#ff8c0d; box-shadow:0 0 6px #ff8c0d; }
  #legend .r { background:#ff1419; box-shadow:0 0 6px #ff1419; }
  #legend .o { background:#1a2026; border:1px solid #333c44; }

  /* ---------- 遥测面板 ---------- */
  #panel { position:fixed; right:20px; top:64px; width:330px; z-index:15;
    background:linear-gradient(165deg,rgba(10,22,38,.90),rgba(6,12,24,.86));
    border:1px solid rgba(70,200,255,.40); border-radius:8px; padding:14px 16px;
    box-shadow:0 0 28px rgba(40,160,255,.20), inset 0 0 22px rgba(40,140,255,.05);
    backdrop-filter:blur(12px); }
  #panel .dev { font-size:13px; font-weight:600; color:#bfeaff; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; padding:1px 8px; border-radius:2px; letter-spacing:1px; }
  .badge.normal  { background:rgba(0,200,110,.18); color:#2dffa0; border:1px solid rgba(0,230,120,.5); }
  .badge.battery { background:rgba(255,140,13,.15); color:#ffb35c; border:1px solid rgba(255,150,30,.55); }
  .badge.bypass  { background:rgba(255,140,13,.15); color:#ffb35c; border:1px solid rgba(255,150,30,.55); }
  .badge.fault   { background:rgba(255,40,60,.18); color:#ff6b75; border:1px solid rgba(255,60,80,.6);
    animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.45; } }
  #panel .rated { font-size:10px; color:#557183; margin-top:2px; letter-spacing:.5px; }

  /* 能量流 */
  #flow { margin:12px 0 4px; }
  #flow svg { width:100%; height:86px; display:block; }
  .fl-line { stroke:#233a4d; stroke-width:2; fill:none; }
  .fl-line.on { stroke:#35d5ff; filter:drop-shadow(0 0 4px rgba(53,213,255,.8));
    stroke-dasharray:7 5; animation:dash 1.1s linear infinite; }
  .fl-line.bat { stroke:#233a4d; }
  .fl-line.bat.on { stroke:#ffa63d; filter:drop-shadow(0 0 4px rgba(255,166,61,.8));
    stroke-dasharray:7 5; animation:dash 1.1s linear infinite; }
  .fl-line.off { stroke:#2a3a48; stroke-dasharray:3 5; }
  @keyframes dash { to { stroke-dashoffset:-24; } }
  .fl-node { fill:rgba(14,30,48,.9); stroke:#3a7ba6; stroke-width:1.2; rx:4; }
  .fl-node.warn { stroke:#ffa63d; } .fl-node.err { stroke:#ff5f6b; }
  .fl-txt { fill:#9fd0ea; font-size:9.5px; letter-spacing:1px; text-anchor:middle; }
  .fl-val { fill:#e8f6ff; font-size:10px; font-weight:600; text-anchor:middle; }

  /* 参数网格 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; margin-top:10px; }
  .cell { background:rgba(14,28,46,.55); border:1px solid rgba(64,160,220,.18);
    border-radius:5px; padding:6px 9px; }
  .cell .k { font-size:10px; color:#5f89a5; letter-spacing:1px; }
  .cell .v { font-size:17px; font-weight:600; color:#e8f6ff; font-variant-numeric:tabular-nums;
    line-height:1.35; }
  .cell .u { font-size:10px; color:#4f7189; font-weight:400; margin-left:2px; }
  .cell.warn .v { color:#ffb35c; } .cell.err .v { color:#ff6b75; }

  /* 段显条 */
  .segs { display:flex; gap:4px; margin-top:5px; }
  .segs i { flex:1; height:8px; border-radius:2px; background:#141c26; border:1px solid #26333f; }
  .segs i.g { background:#00e659; box-shadow:0 0 6px rgba(0,230,89,.7); border-color:#00e659; }
  .segs i.a { background:#ff8c0d; box-shadow:0 0 6px rgba(255,140,13,.7); border-color:#ff8c0d; }
  .segs i.r { background:#ff1419; box-shadow:0 0 6px rgba(255,20,25,.7); border-color:#ff1419; }
  .segrow { margin-top:9px; font-size:10px; color:#5f89a5; letter-spacing:1px; }
  .segrow b { color:#d8f2ff; font-weight:500; float:right; }

  /* 演练按钮 */
  .drill { display:flex; flex-wrap:wrap; gap:6px; margin-top:13px;
    border-top:1px dashed rgba(70,160,220,.25); padding-top:11px; }
  .drill button { flex:1 1 30%; background:rgba(20,38,60,.6); border:1px solid rgba(64,160,220,.3);
    color:#9fd0ea; font-size:11px; padding:5px 0; border-radius:3px; cursor:pointer; letter-spacing:1px;
    transition:all .15s; }
  .drill button:hover { border-color:#46c8ff; color:#fff; box-shadow:0 0 8px rgba(70,200,255,.3); }
  .drill button.cur { background:rgba(30,90,140,.75); border-color:#46c8ff; color:#fff; }

  /* LED tooltip */
  #ledtip { position:fixed; z-index:30; pointer-events:none; display:none; font-size:11px;
    background:rgba(8,18,30,.92); border:1px solid rgba(70,200,255,.5); border-radius:4px;
    padding:5px 10px; color:#cfeaff; letter-spacing:.5px; transform:translate(14px,-28px);
    white-space:nowrap; box-shadow:0 0 14px rgba(40,160,255,.3); }

  /* 告警横幅 */
  #alarmbar { position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:14;
    display:none; font-size:12px; letter-spacing:2px; color:#ffb9be; padding:8px 22px;
    background:linear-gradient(90deg,rgba(80,10,20,.0),rgba(120,20,32,.75),rgba(80,10,20,.0));
    border-top:1px solid rgba(255,70,90,.5); border-bottom:1px solid rgba(255,70,90,.5);
    animation:blink 1.2s infinite; }

  #tip { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:11px; color:#3f5a70; letter-spacing:2px; }
  #loading { position:fixed; inset:0; z-index:50; background:#04060b; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition:opacity .6s; }
  #loading .t { font-size:13px; letter-spacing:4px; color:#58b6e8; }
  #loading .bar { width:260px; height:2px; background:rgba(80,180,255,.15); }
  #loading .bar i { display:block; height:100%; width:0; background:#46c8ff;
    box-shadow:0 0 8px #46c8ff; transition:width .3s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="hud-top">
  <h1>POWERGRID · 国产 UPS 3D 监控</h1>
  <span class="sub">UE5 资产预览 · 遥测模拟 · Three.js</span>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">全景</button>
    <button data-f="0">山特 C6KS</button>
    <button data-f="1">华为 UPS2000-A</button>
    <button data-f="2">科士达 YDC9110H</button>
  </div>
  <div class="ops"><span id="stats"></span></div>
</div>

<div id="legend">
  <i class="g"></i>正常/在线&nbsp;&nbsp;<i class="a"></i>电池/旁路/中级告警<br>
  <i class="r"></i>故障/过载/市电异常&nbsp;&nbsp;<i class="o"></i>未激活
</div>

<div id="panel">
  <div class="dev"><span id="p-name">—</span><span class="badge normal" id="p-mode">NORMAL</span></div>
  <div class="rated" id="p-rated"></div>
  <div id="flow">
    <svg viewBox="0 0 300 86">
      <path id="fl-in"  class="fl-line on" d="M52 30 H 118"/>
      <path id="fl-out" class="fl-line on" d="M182 30 H 248"/>
      <path id="fl-bat" class="fl-line bat" d="M150 44 V 62"/>
      <rect class="fl-node" id="nd-in"  x="8"   y="18" width="44" height="24" rx="4"/>
      <rect class="fl-node" id="nd-ups" x="118" y="14" width="64" height="32" rx="4"/>
      <rect class="fl-node" id="nd-out" x="248" y="18" width="44" height="24" rx="4"/>
      <rect class="fl-node" id="nd-bat" x="118" y="62" width="64" height="22" rx="4"/>
      <text class="fl-txt" x="30"  y="33">市电</text>
      <text class="fl-txt" x="150" y="33">UPS</text>
      <text class="fl-txt" x="270" y="33">负载</text>
      <text class="fl-txt" x="150" y="76">电池</text>
    </svg>
  </div>
  <div class="grid">
    <div class="cell" id="c-iv"><div class="k">输入电压</div><div class="v">—<span class="u">V</span></div></div>
    <div class="cell" id="c-ia"><div class="k">输入电流</div><div class="v">—<span class="u">A</span></div></div>
    <div class="cell" id="c-ov"><div class="k">输出电压</div><div class="v">—<span class="u">V</span></div></div>
    <div class="cell" id="c-oa"><div class="k">输出电流</div><div class="v">—<span class="u">A</span></div></div>
    <div class="cell" id="c-bv"><div class="k">电池电压</div><div class="v">—<span class="u">V</span></div></div>
    <div class="cell" id="c-tp"><div class="k">机内温度</div><div class="v">—<span class="u">°C</span></div></div>
  </div>
  <div class="segrow">输出负载 LOAD <b id="v-load">—</b><div class="segs" id="sg-load"></div></div>
  <div class="segrow">电池电量 BATT <b id="v-batt">—</b><div class="segs" id="sg-batt"></div></div>
  <div class="segrow" style="margin-top:6px">预计续航 <b id="v-rt">—</b></div>
  <div class="drill">
    <button data-m="normal">市电正常</button>
    <button data-m="battery">停电·电池</button>
    <button data-m="bypass">旁路</button>
    <button data-m="fault">过载故障</button>
    <button data-m="charge">充电恢复</button>
  </div>
</div>

<div id="ledtip"></div>
<div id="alarmbar">⚠ UPS 告警 — 请检查负载与市电输入</div>
<div id="tip">拖拽旋转 · 滚轮缩放 · 悬停 LED 查看语义 · 点击设备切换遥测 · 演练按钮模拟工况</div>

<div id="loading"><div class="t">LOADING ASSETS</div><div class="bar"><i id="lbar"></i></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 设备清单 ================= */
const DEVICES = [
  { prefix:'C6KS',   name:'山特 SANTAK C6KS',      glb:'../models/UPS1_SANTAK_C6KS.glb',
    manifest:'../models/C6KS_manifest.json',   pos:[-0.50, 0, -0.06] },
  { prefix:'HU10K',  name:'华为 UPS2000-A-10KTTL', glb:'../models/UPS2_HUAWEI_UPS2000-A-10KTTL.glb',
    manifest:'../models/HU10K_manifest.json',  pos:[0.0, 0, 0.42] },
  { prefix:'YDC10H', name:'科士达 KSTAR YDC9110H', glb:'../models/UPS3_KSTAR_YDC9110H.glb',
    manifest:'../models/YDC10H_manifest.json', pos:[0.52, 0, -0.10] },
];
// 初始工况(与渲染图一致)
const INIT_MODE = { C6KS:'normal', HU10K:'battery', YDC10H:'fault' };
const LED_TIP = { MAINS:'市电输入状态', BYPASS:'旁路供电', INVERT:'逆变工作',
  BATTERY:'电池充/放电', FAULT:'故障/告警', LOAD:'输出负载(输出电流水平)', BATT:'电池电量' };
const C = { g:[0x00e659,3.0], a:[0xff8c0d,3.0], r:[0xff1419,3.2], o:[0x14161a,0.15] };

/* ================= 场景基础 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070c);
scene.fog = new THREE.Fog(0x04070c, 4.5, 12);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.005, 60);
camera.position.set(0.02, 0.95, 2.35);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0.02, 0.26, 0.22);
controls.maxDistance = 6; controls.minDistance = 0.05;

scene.add(new THREE.AmbientLight(0x8899bb, 0.35));
const key = new THREE.DirectionalLight(0xdde8ff, 0.7); key.position.set(-1.2, 2.0, 1.4); scene.add(key);
const rim = new THREE.DirectionalLight(0x3f8cff, 0.9); rim.position.set(0.4, 1.2, -1.6); scene.add(rim);
const accent = new THREE.PointLight(0x1a73ff, 3.0, 3.5); accent.position.set(0.02, 0.4, 0.9); scene.add(accent);

const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color:0x070a10, metalness:0.35, roughness:0.55 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.001; scene.add(ground);
const grid = new THREE.GridHelper(8, 80, 0x0d2a40, 0x081826);
grid.position.y = 0.0005; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.72));
composer.addPass(new OutputPass());

/* ================= 遥测状态(模拟器) ================= */
function mkState(prefix, rated, mode){
  return { prefix, rated, mode,
    input:{ v:220.4, a:12.6, hz:50.0, state:'ok' },
    output:{ v:220.1, a:11.8, hz:50.0, load:58 },
    batt:{ v: rated.batt_vdc, soc:86, charging:true, runtime:42 },
    temp:33.5 };
}
const sims = new Map();       // prefix → state
function applyMode(st, mode){
  st.mode = mode;
  const r = st.rated;
  if (mode==='normal'){ st.input.state='ok'; st.output.load = 52+Math.random()*12|0; st.batt.charging = st.batt.soc<100; }
  if (mode==='battery'){ st.input.state='off'; st.output.load = 45+Math.random()*10|0; st.batt.charging=false; }
  if (mode==='bypass'){ st.input.state='ok'; st.output.load = 60+Math.random()*8|0; st.batt.charging=false; }
  if (mode==='fault'){ st.input.state='ok'; st.output.load = 104+Math.random()*4|0; st.batt.charging=false; }
  if (mode==='charge'){ st.input.state='ok'; st.output.load = 40+Math.random()*8|0; st.batt.charging=true; }
}
function drift(st){
  const on = st.input.state==='ok';
  st.input.v = on ? 218+Math.random()*5 : 0;
  st.input.a = on ? st.output.a*1.06+Math.random() : 0;
  st.input.hz = on ? 49.8+Math.random()*0.4 : 0;
  st.output.v = 219+Math.random()*2.5;
  st.output.a = +(st.rated.output_a_max*st.output.load/100).toFixed(1);
  st.batt.v = st.rated.batt_vdc*(0.94+st.batt.soc/100*0.10);
  if (st.batt.charging) st.batt.soc = Math.min(100, st.batt.soc+0.15);
  else if (st.mode==='battery') st.batt.soc = Math.max(3, st.batt.soc-0.25);
  st.batt.runtime = Math.max(1, st.batt.soc*0.55*(45/Math.max(st.output.load,5))|0);
  st.temp = 30+st.output.load*0.09+Math.random()*1.5;
}

/* ================= LED 驱动(与 UE5 契约同规则) ================= */
const ledMap = new Map();   // 'PREFIX:NAME' → material
const flickerLeds = [];     // {mat, hz}
function setLed(prefix, name, colorKey, flicker=0){
  const mat = ledMap.get(`${prefix}:${name}`);
  if (!mat) return;
  const [hex, inten] = C[colorKey];
  mat.emissive.setHex(hex); mat.emissiveIntensity = inten;
  const i = flickerLeds.findIndex(f => f.mat===mat);
  if (flicker>0){ if (i<0) flickerLeds.push({ mat, hz:flicker }); }
  else if (i>=0) flickerLeds.splice(i,1);
}
function segCount(pct){ return Math.max(0, Math.min(5, Math.ceil(pct/20))); }
function applyTelemetryLeds(st){
  const P = st.prefix;
  setLed(P,'MAINS', st.input.state==='ok'?'g':(st.input.state==='abnormal'?'r':'o'));
  setLed(P,'INVERT', (st.mode==='normal'||st.mode==='battery'||st.mode==='charge')?'g':'o');
  setLed(P,'BYPASS', st.mode==='bypass'?'a':'o');
  setLed(P,'BATTERY', st.mode==='battery'?'a':(st.batt.charging?'g':'o'), st.batt.charging?0.6:0);
  setLed(P,'FAULT', st.mode==='fault'?'r':'o', st.mode==='fault'?2:0);
  const lc = st.output.load>80?'r':(st.output.load>60?'a':'g');
  const nL = segCount(st.output.load);
  for (let i=1;i<=5;i++) setLed(P,`LOAD_${i}`, i<=nL?lc:'o');
  const bc = st.batt.soc<20?'r':(st.batt.soc<50?'a':'g');
  const nB = segCount(st.batt.soc);
  for (let i=1;i<=5;i++) setLed(P,`BATT_${i}`, i<=nB?bc:'o', (st.batt.soc<20&&i<=nB)?4:0);
}

/* ================= 资产加载 ================= */
const loader = new GLTFLoader();
const pickables = [];   // LED/SCREEN 网格(悬停)
const groups = [];
let loaded = 0;
const lbar = document.getElementById('lbar');

async function loadDevice(cfg, di){
  const [gltf, mani] = await Promise.all([
    loader.loadAsync(cfg.glb),
    fetch(cfg.manifest).then(r => r.json()),
  ]);
  const g = new THREE.Group();
  g.name = cfg.prefix;
  g.add(gltf.scene);
  g.position.set(...cfg.pos);
  scene.add(g);
  groups[di] = { cfg, group:g, manifest:mani };
  g.traverse(o => {
    if (!o.isMesh) return;
    if (/_LED_(MAINS|BYPASS|INVERT|BATTERY|FAULT|LOAD_\d|BATT_\d)/.test(o.name)) {
      o.material = o.material.clone();
      ledMap.set(`${cfg.prefix}:${o.name.replace(cfg.prefix+'_LED_','')}`, o.material);
      o.userData = { dev:cfg.prefix, led:o.name.replace(cfg.prefix+'_LED_','') };
      pickables.push(o);
    } else if (o.name.endsWith('_SCREEN')) {
      o.userData = { dev:cfg.prefix, led:'SCREEN' };
      pickables.push(o);
    }
  });
  const st = mkState(cfg.prefix, mani.rated, INIT_MODE[cfg.prefix]);
  applyMode(st, st.mode);
  sims.set(cfg.prefix, st);
  applyTelemetryLeds(st);
  loaded++; lbar.style.width = (loaded/DEVICES.length*100)+'%';
  if (loaded===DEVICES.length)
    setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0;
      setTimeout(()=>l.remove(),650); refreshStats(); selectDevice(0,false); }, 150);
}

/* ================= HUD 遥测面板 ================= */
let curDev = 'C6KS';
const segLoad = document.getElementById('sg-load');
const segBatt = document.getElementById('sg-batt');
for (let i=0;i<5;i++){ segLoad.appendChild(document.createElement('i')); segBatt.appendChild(document.createElement('i')); }

function refreshPanel(){
  const st = sims.get(curDev); if (!st) return;
  const g = groups.find(x => x.cfg.prefix===curDev);
  document.getElementById('p-name').textContent = g.cfg.name;
  document.getElementById('p-rated').textContent =
    `${g.manifest.rated.kva}KVA/${g.manifest.rated.kw}KW · 输入 ${g.manifest.rated.input_v} · 电池 ${g.manifest.rated.batt_vdc}VDC`;
  const modeTxt = { normal:'NORMAL 在线', battery:'BATTERY 放电', bypass:'BYPASS 旁路',
                    fault:'FAULT 故障', charge:'CHARGING 充电' }[st.mode];
  const badge = document.getElementById('p-mode');
  badge.textContent = modeTxt;
  badge.className = 'badge ' + (st.mode==='normal'||st.mode==='charge'?'normal':
                                st.mode==='fault'?'fault':'battery');
  const setCell = (id, v, u, cls='') => {
    const el = document.getElementById(id);
    el.className = 'cell '+cls;
    el.querySelector('.v').innerHTML = `${v}<span class="u">${u}</span>`;
  };
  setCell('c-iv', st.input.v.toFixed(1), 'V', st.input.state==='off'?'err':'');
  setCell('c-ia', st.input.a.toFixed(1), 'A', st.input.state==='off'?'err':'');
  setCell('c-ov', st.output.v.toFixed(1), 'V');
  setCell('c-oa', st.output.a.toFixed(1), 'A', st.output.load>80?'err':(st.output.load>60?'warn':''));
  setCell('c-bv', st.batt.v.toFixed(1), 'V');
  setCell('c-tp', st.temp.toFixed(1), '°C', st.temp>40?'warn':'');
  document.getElementById('v-load').textContent = st.output.load.toFixed(0)+' %';
  document.getElementById('v-batt').textContent = st.batt.soc.toFixed(0)+' %';
  document.getElementById('v-rt').textContent = st.mode==='battery' ? st.batt.runtime+' min' :
    (st.batt.charging ? '充电中 '+st.batt.soc.toFixed(0)+'%' : st.batt.runtime+' min (预估)');
  const lc = st.output.load>80?'r':(st.output.load>60?'a':'g');
  const bc = st.batt.soc<20?'r':(st.batt.soc<50?'a':'g');
  [...segLoad.children].forEach((el,i)=> el.className = i<segCount(st.output.load)?lc:'');
  [...segBatt.children].forEach((el,i)=> el.className = i<segCount(st.batt.soc)?bc:'');
  // 能量流
  const on = st.input.state==='ok';
  document.getElementById('fl-in').className.baseVal  = 'fl-line'+(on?' on':' off');
  document.getElementById('fl-out').className.baseVal = 'fl-line'+(st.mode!=='fault'?' on':' off');
  document.getElementById('fl-bat').className.baseVal =
    'fl-line bat'+((st.mode==='battery'||st.batt.charging)?' on':'');
  document.getElementById('nd-in').classList.toggle('err', !on);
  document.getElementById('nd-ups').classList.toggle('err', st.mode==='fault');
  document.getElementById('nd-bat').classList.toggle('warn', st.mode==='battery');
  // 演练按钮高亮
  document.querySelectorAll('.drill button').forEach(b =>
    b.classList.toggle('cur', b.dataset.m===st.mode));
  // 告警横幅
  const anyFault = [...sims.values()].some(s => s.mode==='fault');
  document.getElementById('alarmbar').style.display = anyFault?'block':'none';
}

document.querySelector('.drill').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const st = sims.get(curDev); if (!st) return;
  applyMode(st, b.dataset.m);
  applyTelemetryLeds(st); refreshPanel(); refreshStats();
});

function refreshStats(){
  let norm=0, warn=0, fault=0;
  for (const s of sims.values())
    s.mode==='fault' ? fault++ : (s.mode==='normal'||s.mode==='charge' ? norm++ : warn++);
  document.getElementById('stats').innerHTML =
    `在线 <b>${norm}</b> · 电池/旁路 <b>${warn}</b> · <span class="al">故障 ${fault}</span>`;
}

/* ================= 悬停 tooltip ================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-9,-9);
const ledtip = document.getElementById('ledtip');
let hovered = null;
addEventListener('pointermove', e => {
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  ledtip.style.left = e.clientX+'px'; ledtip.style.top = e.clientY+'px';
});
function hoverCheck(){
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0]?.object || null;
  if (hit===hovered) return;
  hovered = hit;
  document.body.style.cursor = hit?'pointer':'default';
  if (!hit){ ledtip.style.display='none'; return; }
  const { led } = hit.userData;
  const key = led.replace(/_\d$/,'');
  ledtip.textContent = led==='SCREEN' ? 'LCD 大屏 · 点击聚焦该设备'
    : `${led} · ${LED_TIP[key]||''} (点击切换到该设备)`;
  ledtip.style.display = 'block';
}
addEventListener('click', e => {
  if (e.target.closest('#hud-top,#panel') || !hovered) return;
  const di = groups.findIndex(x => x.cfg.prefix===hovered.userData.dev);
  if (di>=0){ selectDevice(di); }
});

/* ================= 聚焦 ================= */
const VIEWS = {
  all:{ cam:[0.02,0.95,2.35], tgt:[0.02,0.26,0.22] },
  0:  { cam:[-0.50,0.50,0.85], tgt:[-0.50,0.26,0.19] },
  1:  { cam:[0.0,0.30,1.55],  tgt:[0.0,0.05,0.71] },
  2:  { cam:[0.52,0.58,0.95], tgt:[0.52,0.34,0.195] },
};
let camAnim = null;
function selectDevice(di, moveCam=true){
  curDev = DEVICES[di].prefix;
  document.querySelectorAll('#tabs button').forEach(x =>
    x.classList.toggle('on', x.dataset.f==String(di)));
  if (moveCam){
    const v = VIEWS[di];
    camAnim = { cam:new THREE.Vector3(...v.cam), tgt:new THREE.Vector3(...v.tgt), t:0,
                fromCam:camera.position.clone(), fromTgt:controls.target.clone() };
  }
  refreshPanel();
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const f = b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x===b));
  const v = VIEWS[f];
  camAnim = { cam:new THREE.Vector3(...v.cam), tgt:new THREE.Vector3(...v.tgt), t:0,
              fromCam:camera.position.clone(), fromTgt:controls.target.clone() };
  if (f!=='all') curDev = DEVICES[+f].prefix;
  refreshPanel();
});

/* ================= 模拟器主循环(500ms 遥测刷新) ================= */
setInterval(() => {
  for (const st of sims.values()){ drift(st); applyTelemetryLeds(st); }
  refreshPanel();
}, 500);

/* ================= 渲染主循环 ================= */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  // LED 闪烁(FAULT 2Hz / 低电 4Hz / 充电 0.6Hz 呼吸)
  for (const f of flickerLeds){
    const s = Math.sin(t*Math.PI*2*f.hz);
    f.mat.emissiveIntensity = s>0 ? 3.4 : (f.hz<1 ? 1.2+s*0.8 : 0.25);
  }
  if (camAnim){
    camAnim.t = Math.min(1, camAnim.t+dt/0.9);
    const k = 1-Math.pow(1-camAnim.t,3);
    camera.position.lerpVectors(camAnim.fromCam, camAnim.cam, k);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.tgt, k);
    if (camAnim.t>=1) camAnim = null;
  }
  controls.update();
  hoverCheck();
  composer.render();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

DEVICES.forEach((cfg,i) => loadDevice(cfg,i).catch(err => {
  console.error('加载失败:', cfg.glb, err);
  document.querySelector('#loading .t').textContent = '加载失败: '+cfg.glb+' (需 HTTP 访问, 运行 启动预览Demo.bat)';
}));
tick();
</script>
