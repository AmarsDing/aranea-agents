<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机房交换机 3D 可视化 · UE5 资产预览 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04060b;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:#cfe6f5; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- 顶栏 ---------- */
  #hud-top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:linear-gradient(180deg,rgba(4,8,16,.92),rgba(4,8,16,0));
    pointer-events:none; z-index:10; }
  #hud-top h1 { font-size:15px; font-weight:600; letter-spacing:2px; color:#7fd8ff;
    text-shadow:0 0 12px rgba(60,180,255,.6); white-space:nowrap; }
  #hud-top .sub { font-size:11px; color:#4a6a80; letter-spacing:1px; }
  .tabs { display:flex; gap:6px; margin-left:18px; pointer-events:auto; }
  .tabs button, .ops button {
    background:rgba(16,32,52,.65); border:1px solid rgba(64,160,220,.35); color:#9fd0ea;
    font-size:12px; padding:5px 14px; border-radius:3px; cursor:pointer; letter-spacing:1px;
    transition:all .18s; backdrop-filter:blur(6px); }
  .tabs button:hover, .ops button:hover { border-color:#46c8ff; color:#dff4ff;
    box-shadow:0 0 10px rgba(70,200,255,.35); }
  .tabs button.on { background:rgba(30,90,140,.7); border-color:#46c8ff; color:#fff; }
  .ops { margin-left:auto; display:flex; gap:8px; align-items:center; pointer-events:auto; }
  #stats { font-size:11px; color:#5f89a5; letter-spacing:1px; margin-right:6px; }
  #stats b { color:#8fe3ff; font-weight:600; }
  #stats .al { color:#ff5f6b; }

  /* ---------- 图例 ---------- */
  #legend { position:fixed; left:20px; bottom:18px; z-index:10; font-size:11px;
    background:rgba(8,16,28,.72); border:1px solid rgba(64,160,220,.22); border-radius:4px;
    padding:10px 14px; backdrop-filter:blur(8px); line-height:1.9; letter-spacing:1px; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; }
  #legend .g { background:#00e659; box-shadow:0 0 6px #00e659; }
  #legend .a { background:#ff8c0d; box-shadow:0 0 6px #ff8c0d; }
  #legend .r { background:#ff1419; box-shadow:0 0 6px #ff1419; }
  #legend .o { background:#1a2026; border:1px solid #333c44; }

  /* ---------- 端口详情卡 ---------- */
  #portcard { position:fixed; z-index:20; min-width:230px; pointer-events:none; display:none;
    background:linear-gradient(160deg,rgba(10,22,38,.92),rgba(6,12,24,.88));
    border:1px solid rgba(70,200,255,.45); border-radius:6px; padding:12px 14px;
    box-shadow:0 0 24px rgba(40,160,255,.25), inset 0 0 18px rgba(40,140,255,.06);
    backdrop-filter:blur(10px); transform:translate(-50%,-115%); }
  #portcard::after { content:""; position:absolute; left:50%; bottom:-6px; width:10px; height:10px;
    background:inherit; border-right:1px solid rgba(70,200,255,.45); border-bottom:1px solid rgba(70,200,255,.45);
    transform:translateX(-50%) rotate(45deg); }
  #portcard .ifname { font-size:13px; font-weight:600; color:#bfeaff; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; padding:1px 8px; border-radius:2px; letter-spacing:1px; }
  .badge.up    { background:rgba(0,200,110,.18); color:#2dffa0; border:1px solid rgba(0,230,120,.5); }
  .badge.alarm { background:rgba(255,40,60,.18); color:#ff6b75; border:1px solid rgba(255,60,80,.6);
    animation:blink 1s infinite; }
  .badge.down  { background:rgba(120,130,140,.12); color:#8a98a5; border:1px solid rgba(140,150,160,.35); }
  @keyframes blink { 50% { opacity:.45; } }
  #portcard .rows { margin-top:8px; font-size:11px; line-height:2; color:#9dc3da; }
  #portcard .rows span { color:#557183; display:inline-block; width:64px; }
  #portcard .rows b { color:#d8f2ff; font-weight:500; }
  #portcard .poe { color:#ffd479; }
  #portcard .err { margin-top:6px; font-size:10px; color:#ff7b84; border-top:1px dashed rgba(255,90,100,.3);
    padding-top:6px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:16px; margin-top:2px; }
  .bars i { width:5px; background:linear-gradient(180deg,#46d8ff,#1a6a9a); border-radius:1px; }

  /* ---------- 告警自动标注 (引线卡) ---------- */
  .callout { position:fixed; z-index:15; pointer-events:none; transform:translate(-50%,-100%);
    background:linear-gradient(160deg,rgba(52,8,16,.88),rgba(24,4,8,.85));
    border:1px solid rgba(255,70,85,.65); border-radius:4px; padding:5px 10px;
    font-size:11px; letter-spacing:.5px; color:#ffb9bf; white-space:nowrap;
    box-shadow:0 0 16px rgba(255,40,60,.35); backdrop-filter:blur(6px);
    animation:coPulse 1.6s ease-in-out infinite; }
  .callout b { color:#fff; font-weight:600; }
  .callout::after { content:""; position:absolute; left:50%; top:100%; width:1px; height:26px;
    background:linear-gradient(180deg,rgba(255,70,85,.9),rgba(255,70,85,0)); }
  .callout::before { content:""; position:absolute; left:50%; top:calc(100% + 26px); width:7px; height:7px;
    border:1px solid rgba(255,70,85,.9); border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(255,40,60,.8); }
  @keyframes coPulse { 50% { box-shadow:0 0 28px rgba(255,40,60,.6); border-color:#ff8a95; } }

  /* ---------- 右侧 INSIGHT 侧栏 ---------- */
  #side { position:fixed; top:64px; right:16px; width:236px; z-index:10; pointer-events:auto;
    background:linear-gradient(170deg,rgba(8,18,32,.82),rgba(5,10,20,.78));
    border:1px solid rgba(64,160,220,.30); border-radius:6px; backdrop-filter:blur(10px);
    box-shadow:0 0 22px rgba(40,140,255,.12), inset 0 0 24px rgba(40,140,255,.04);
    overflow:hidden; }
  #side::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,200,255,.025) 3px 4px); }
  #side .hd { padding:10px 14px 8px; font-size:11px; letter-spacing:3px; color:#6fc4ee;
    border-bottom:1px solid rgba(64,160,220,.22); display:flex; justify-content:space-between; }
  #side .hd em { font-style:normal; color:#3f5a70; letter-spacing:1px; }
  .devblk { padding:10px 14px 12px; border-bottom:1px dashed rgba(64,160,220,.16); }
  .devblk:last-child { border-bottom:none; }
  .devblk .nm { font-size:12px; color:#bfeaff; font-weight:600; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px; }
  .devblk .nm i { width:7px; height:7px; border-radius:50%; }
  .devblk .ring-row { display:flex; align-items:center; gap:12px; margin-top:8px; }
  .ring { width:58px; height:58px; border-radius:50%; position:relative; flex:none;
    box-shadow:0 0 12px rgba(40,160,255,.15); }
  .ring::after { content:""; position:absolute; inset:7px; border-radius:50%; background:#08101c;
    display:flex; }
  .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#dff4ff; z-index:1; font-weight:600; }
  .kv { flex:1; font-size:10.5px; line-height:1.95; color:#7d9db5; letter-spacing:1px; }
  .kv b { font-weight:600; }
  .kv .u { color:#2dffa0; } .kv .a { color:#ff6b75; } .kv .d { color:#8a98a5; }
  .alarmlist { margin-top:8px; max-height:150px; overflow-y:auto; }
  .alarmlist::-webkit-scrollbar { width:3px; }
  .alarmlist::-webkit-scrollbar-thumb { background:rgba(64,160,220,.4); }
  .alarmlist .li { display:flex; align-items:center; gap:7px; font-size:10.5px; padding:4px 8px;
    margin-top:4px; background:rgba(255,40,60,.08); border:1px solid rgba(255,60,80,.30);
    border-radius:3px; color:#ffb9bf; cursor:pointer; transition:all .15s; letter-spacing:.5px; }
  .alarmlist .li:hover { background:rgba(255,40,60,.18); border-color:#ff5f6b;
    box-shadow:0 0 10px rgba(255,40,60,.3); }
  .alarmlist .li::before { content:"▸"; color:#ff5f6b; }
  .alarmlist .li .st { margin-left:auto; font-size:9px; color:#ff8a95; }

  /* ---------- 提示/加载 ---------- */
  #tip { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:11px; color:#3f5a70; letter-spacing:2px; }
  #loading { position:fixed; inset:0; z-index:50; background:#04060b; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition:opacity .6s; }
  #loading .t { font-size:13px; letter-spacing:4px; color:#58b6e8; }
  #loading .bar { width:260px; height:2px; background:rgba(80,180,255,.15); }
  #loading .bar i { display:block; height:100%; width:0; background:#46c8ff;
    box-shadow:0 0 8px #46c8ff; transition:width .3s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<body>
<div id="app"></div>

<div id="hud-top">
  <h1>NETVIZ · 机房交换机 3D 可视化</h1>
  <span class="sub">UE5 资产预览 · Three.js</span>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">全景</button>
    <button data-f="0">S5735 接入</button>
    <button data-f="1">H3C 高密度</button>
    <button data-f="2">CE6857 TOR</button>
  </div>
  <div class="ops">
    <span id="stats"></span>
    <button id="btn-alarm">⚠ 告警演练</button>
    <button id="btn-reset">复位状态</button>
  </div>
</div>

<div id="legend">
  <i class="g"></i>LNK 链路正常&nbsp;&nbsp;<i class="a"></i>ACT 数据收发<br>
  <i class="r"></i>端口告警&nbsp;&nbsp;<i class="o"></i>链路断开
</div>

<div id="side">
  <div class="hd">DEVICE INSIGHT<em>实时</em></div>
  <div id="side-body"></div>
</div>

<div id="portcard"></div>
<div id="callouts"></div>
<div id="tip">全息矩阵总览全局 · 划过矩阵格/端口看详情 · 单击定位 · 双击切换链路状态</div>

<div id="loading"><div class="t">LOADING ASSETS</div><div class="bar"><i id="lbar"></i></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 设备清单 ================= */
const DEVICES = [
  { prefix:'S5735',  glb:'../models/SW1_Huawei_S5735-L24P4S-A1.glb', manifest:'../models/S5735_manifest.json',  x:-0.53 },
  { prefix:'H3C52',  glb:'../models/SW2_H3C_S5130S-52S-EI.glb',      manifest:'../models/H3C52_manifest.json',  x: 0.00 },
  { prefix:'CE6857', glb:'../models/SW3_Huawei_CE6857-48S8CQ.glb',   manifest:'../models/CE6857_manifest.json', x: 0.56 },
];
const INIT = {
  S5735:  { alarm:[7],  down:[11,12] },
  H3C52:  { alarm:[5],  down:[19,20] },
  CE6857: { alarm:[8],  down:[13,14,54] },
};
const PORT_DIMS = {
  RJ45:[15.0,13.2], SFP:[14.2,9.6], 'SFP+':[14.2,9.6], SFP28:[14.2,9.6], QSFP28:[18.6,9.8], CONSOLE:[15.0,13.2],
};
const LED_STYLE = {
  up:    { lnk:[0x00e659, 2.6], act:[0xff8c0d, 2.2] },
  alarm: { lnk:[0xff1419, 3.0], act:[0x14161a, 0.12] },
  down:  { lnk:[0x14161a, 0.12], act:[0x14161a, 0.12] },
};
const IS_UPLINK = t => ['SFP','SFP+','SFP28','QSFP28'].includes(t);

/* ================= 场景基础 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070c);
scene.fog = new THREE.Fog(0x04070c, 3.2, 9);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.005, 60);
camera.position.set(0.05, 0.85, 1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0.02, 0.0, 0.05);
controls.maxDistance = 4; controls.minDistance = 0.05;

scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const key = new THREE.DirectionalLight(0xdde8ff, 0.85); key.position.set(-0.8, 1.4, 1.0); scene.add(key);
const rim = new THREE.DirectionalLight(0x3f8cff, 0.9); rim.position.set(0.3, 0.9, -1.2); scene.add(rim);
const accent = new THREE.PointLight(0x1a73ff, 0.5, 2.4); accent.position.set(0.02, 0.12, 0.42); scene.add(accent);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color:0x070a10, metalness:0.35, roughness:0.55 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.001; scene.add(ground);
const grid = new THREE.GridHelper(6, 60, 0x0d2a40, 0x081826);
grid.position.y = 0.0005; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.5, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ================= 资产加载 ================= */
const loader = new GLTFLoader();
const hitboxes = [];
const hbMap = new Map();       // 'PREFIX:idx' → hitbox mesh
const ledMap = new Map();      // 'PREFIX:idx:LNK|ACT' → material
const portData = new Map();    // 'PREFIX:idx' → { dev, port, state }
const deviceGroups = [];
let loaded = 0;
const lbar = document.getElementById('lbar');

function mapPos(mm){ return new THREE.Vector3(mm[0]/1000, mm[2]/1000, -mm[1]/1000); }

async function loadDevice(cfg, di){
  const [gltf, mani] = await Promise.all([
    loader.loadAsync(cfg.glb),
    fetch(cfg.manifest).then(r => r.json()),
  ]);
  const g = new THREE.Group();
  g.name = cfg.prefix;
  g.add(gltf.scene);
  g.position.set(cfg.x, 0.0218, 0);
  scene.add(g);
  deviceGroups[di] = { cfg, group:g, manifest:mani };

  g.traverse(o => {
    if (o.isMesh && /_LED_(P\d+|SYS_)/.test(o.name)) {
      o.material = o.material.clone();
      const m = o.name.match(/_LED_P(\d+)_(LNK|ACT)/);
      if (m) ledMap.set(`${cfg.prefix}:${+m[1]}:${m[2]}`, o.material);
    }
  });

  for (const p of mani.ports) {
    if (p.type === 'CONSOLE') continue;
    const dims = PORT_DIMS[p.type] || PORT_DIMS.RJ45;
    const hb = new THREE.Mesh(
      new THREE.BoxGeometry(dims[0]/1000, dims[1]/1000, 0.03),
      new THREE.MeshBasicMaterial({ visible:false }));
    const lp = mapPos(p.pos_mm);
    hb.position.set(lp.x, lp.y, lp.z + 0.012);
    hb.userData = { dev:cfg.prefix, idx:p.index, dims };
    g.add(hb);
    hitboxes.push(hb);
    hbMap.set(`${cfg.prefix}:${p.index}`, hb);
    const init = INIT[cfg.prefix];
    const st = init.alarm.includes(p.index) ? 'alarm' : (init.down.includes(p.index) ? 'down' : 'up');
    portData.set(`${cfg.prefix}:${p.index}`, { dev:cfg.prefix, group:g, port:p, state:st });
    applyLed(cfg.prefix, p.index, st);
  }
  buildHolo(di);
  loaded++; lbar.style.width = (loaded/DEVICES.length*100) + '%';
  if (loaded === DEVICES.length) {
    setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0;
      setTimeout(()=>l.remove(), 650); }, 150);
    refreshStats(); refreshCallouts(); refreshSide();
    startScan(-1);   // 全部面板播一次扫描
  }
}

function applyLed(prefix, idx, state){
  const s = LED_STYLE[state];
  for (const kind of ['LNK','ACT']) {
    const mat = ledMap.get(`${prefix}:${idx}:${kind}`);
    if (!mat) continue;
    const [color, inten] = s[kind.toLowerCase()];
    mat.emissive.setHex(color);
    mat.emissiveIntensity = inten;
  }
}

/* ================= 全息端口矩阵面板 ================= */
const HOLO_W = 1024, HOLO_H = 300;
const holoPanels = [];   // di → { mesh, canvas, ctx, tex, cells[], scanT, dirty }
const holoMeshes = [];   // 供 raycast

function buildHolo(di){
  const { cfg, manifest, group } = deviceGroups[di];
  const W_m = (manifest.dims_mm[0] + 40) / 1000;          // 面板宽 = 机箱宽 + 40mm
  const H_m = W_m * HOLO_H / HOLO_W;
  const canvas = document.createElement('canvas');
  canvas.width = HOLO_W; canvas.height = HOLO_H;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(W_m, H_m),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.96,
      blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }));
  mesh.position.set(cfg.x, 0.185, -0.04);   // 悬浮在设备上方 (后移防遮挡前面板)
  mesh.renderOrder = 10;
  mesh.userData = { holo:di };
  scene.add(mesh);
  holoMeshes.push(mesh);

  // 端口格布局: pos_mm 映射 canvas 坐标 (x→cx, z→cy)
  const ports = manifest.ports;
  const xs = ports.map(p=>p.pos_mm[0]), zs = ports.map(p=>p.pos_mm[2]);
  const minX=Math.min(...xs)-9, maxX=Math.max(...xs)+9;
  const minZ=Math.min(...zs)-8, maxZ=Math.max(...zs)+8;
  const padL=64, padR=28, padT=64, padB=22;
  const sx = (HOLO_W-padL-padR)/(maxX-minX), sy = (HOLO_H-padT-padB)/(maxZ-minZ);
  const s = Math.min(sx, sy);
  const ox = padL + ((HOLO_W-padL-padR) - (maxX-minX)*s)/2;
  const oy = padT + ((HOLO_H-padT-padB) - (maxZ-minZ)*s)/2;
  const cells = ports.map(p => {
    const dims = PORT_DIMS[p.type] || PORT_DIMS.RJ45;
    return {
      idx:p.index, type:p.type,
      cx: ox + (p.pos_mm[0]-minX)*s,
      cy: oy + (p.pos_mm[2]-minZ)*s,
      w: Math.max(10, dims[0]*s*0.94), h: Math.max(7, dims[1]*s*0.94),
    };
  });

  holoPanels[di] = { mesh, canvas, ctx, tex, cells, scanT: 1, dirty:true, W_m, H_m };
  drawHolo(holoPanels[di], 0);
}

function startScan(di){
  if (di < 0) { holoPanels.forEach(hp => hp && (hp.scanT = 0)); return; }
  const hp = holoPanels[di]; if (hp) hp.scanT = 0;
}

function drawHolo(hp, t){
  const { ctx, canvas, cells } = hp;
  const { cfg } = deviceGroups[hp.mesh.userData.holo];
  ctx.clearRect(0, 0, HOLO_W, HOLO_H);
  // 底板 + 扫描线纹理
  ctx.fillStyle = 'rgba(10,26,44,0.42)';
  ctx.fillRect(0, 0, HOLO_W, HOLO_H);
  ctx.fillStyle = 'rgba(120,200,255,0.045)';
  for (let y=0; y<HOLO_H; y+=4) ctx.fillRect(0, y, HOLO_W, 1);
  // 边框 + 角标
  ctx.strokeStyle = 'rgba(70,200,255,0.85)'; ctx.lineWidth = 2;
  ctx.strokeRect(3, 3, HOLO_W-6, HOLO_H-6);
  ctx.strokeStyle = '#7fe0ff'; ctx.lineWidth = 5;
  const cs = 30;
  for (const [x,y,dx,dy] of [[3,3,1,1],[HOLO_W-3,3,-1,1],[3,HOLO_H-3,1,-1],[HOLO_W-3,HOLO_H-3,-1,-1]]) {
    ctx.beginPath(); ctx.moveTo(x+dx*cs, y); ctx.lineTo(x, y); ctx.lineTo(x, y+dy*cs); ctx.stroke();
  }
  // 标题 + 迷你统计
  let up=0, al=0, dn=0;
  for (const c of cells) {
    const r = portData.get(`${cfg.prefix}:${c.idx}`);
    if (!r) continue;
    r.state==='up' ? up++ : (r.state==='alarm' ? al++ : dn++);
  }
  ctx.textBaseline = 'middle';
  ctx.font = '600 26px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#9fe4ff';
  ctx.shadowColor = 'rgba(70,200,255,.8)'; ctx.shadowBlur = 10;
  ctx.fillText(cfg.prefix + ' PORT MATRIX', 26, 32);
  ctx.shadowBlur = 0;
  ctx.font = '20px "Segoe UI",sans-serif';
  ctx.fillStyle = '#2dffa0'; ctx.fillText('UP ' + up, HOLO_W-300, 32);
  ctx.fillStyle = '#ff6b75'; ctx.fillText('ALARM ' + al, HOLO_W-196, 32);
  ctx.fillStyle = '#8a98a5'; ctx.fillText('DOWN ' + dn, HOLO_W-96, 32);
  ctx.strokeStyle = 'rgba(70,200,255,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(20, 50); ctx.lineTo(HOLO_W-20, 50); ctx.stroke();

  // 扫描带
  let scanX = -1;
  if (hp.scanT < 1) scanX = hp.scanT * (HOLO_W + 160) - 80;

  // 端口格
  const breathe = 0.55 + 0.45*Math.sin(t*4);
  for (const c of cells) {
    const rec = portData.get(`${cfg.prefix}:${c.idx}`);
    if (!rec) continue;
    const x = c.cx - c.w/2, y = c.cy - c.h/2;
    const near = scanX >= 0 && Math.abs(c.cx - scanX) < 70;
    const boost = near ? 1 - Math.abs(c.cx - scanX)/70 : 0;
    let stroke, fill, glow = 0;
    if (rec.state === 'up') {
      const up = IS_UPLINK(c.type);
      stroke = up ? 'rgba(70,200,255,0.95)' : 'rgba(0,230,105,0.9)';
      fill = up ? 'rgba(40,160,255,0.16)' : 'rgba(0,230,105,0.13)';
      glow = 4 + boost*14;
    } else if (rec.state === 'alarm') {
      stroke = `rgba(255,30,40,${0.7+0.3*breathe})`;
      fill = `rgba(255,25,35,${0.22+0.20*breathe})`;
      glow = 10 + 14*breathe;
    } else {
      stroke = 'rgba(80,95,110,0.5)'; fill = 'rgba(60,70,80,0.10)';
    }
    ctx.shadowColor = stroke; ctx.shadowBlur = glow;
    ctx.strokeStyle = stroke; ctx.lineWidth = 1.6 + boost*1.5;
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(x, y, c.w, c.h, 3); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    if (rec.state === 'alarm') {
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.max(12, c.h*0.62)|0}px "Segoe UI",sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('!', c.cx, c.cy + 1);
      ctx.textAlign = 'left';
    } else if (rec.state === 'up') {
      // 仿真双灯: 左 LNK 绿常亮 + 右 ACT 琥珀闪烁 (与物理 LED 同步)
      const r = Math.max(1.8, c.h*0.11);
      const lx = c.cx - c.w*0.22, ax = c.cx + c.w*0.22;
      ctx.fillStyle = '#2dffa0';
      ctx.shadowColor = '#00e659'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(lx, c.cy, r, 0, 6.29); ctx.fill();
      if (actHot.has(`${cfg.prefix}:${c.idx}`)) {
        ctx.fillStyle = '#ffb03a';
        ctx.shadowColor = '#ff8c0d'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(ax, c.cy, r, 0, 6.29); ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }
  // 扫描带绘制 (最上层)
  if (scanX >= 0) {
    const grad = ctx.createLinearGradient(scanX-70, 0, scanX+70, 0);
    grad.addColorStop(0, 'rgba(120,220,255,0)');
    grad.addColorStop(0.5, 'rgba(140,230,255,0.30)');
    grad.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(scanX-70, 0, 140, HOLO_H);
    ctx.fillStyle = 'rgba(190,245,255,0.85)';
    ctx.fillRect(scanX-1, 0, 2, HOLO_H);
  }
  hp.tex.needsUpdate = true;
}

/* ================= 告警自动标注 (引线卡) ================= */
const calloutBox = document.getElementById('callouts');
const calloutPool = new Map();  // key → div

function refreshCallouts(){
  const alarms = [...portData.values()].filter(r => r.state === 'alarm');
  const alive = new Set();
  for (const r of alarms) {
    const k = `${r.dev}:${r.port.index}`;
    alive.add(k);
    if (!calloutPool.has(k)) {
      const d = document.createElement('div');
      d.className = 'callout';
      d.innerHTML = `<b>${r.port.ifname}</b> ⚠ 告警`;
      calloutBox.appendChild(d);
      calloutPool.set(k, d);
    }
  }
  for (const [k, d] of calloutPool) if (!alive.has(k)) { d.remove(); calloutPool.delete(k); }
}

const _v = new THREE.Vector3();
function placeCallouts(){
  for (const [k, d] of calloutPool) {
    const hb = hbMap.get(k);
    if (!hb) { d.style.display='none'; continue; }
    hb.getWorldPosition(_v);
    _v.y += 0.055;
    _v.project(camera);
    if (_v.z > 1) { d.style.display='none'; continue; }
    d.style.display = 'block';
    d.style.left = ((_v.x*0.5+0.5)*innerWidth) + 'px';
    d.style.top  = ((-_v.y*0.5+0.5)*innerHeight - 26) + 'px';
  }
}

/* ================= 悬停/点击拾取 ================= */
const card = document.getElementById('portcard');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-9, -9);
let mouseClient = { x:0, y:0 };
const outline = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
  new THREE.LineBasicMaterial({ color:0x46d8ff, transparent:true, opacity:0.95 }));
outline.visible = false; scene.add(outline);
let hovered = null;       // hitbox
let hoverHolo = null;     // { di, cell }
let pinned = null;        // hitbox (单击定位后钉住)

addEventListener('pointermove', e => {
  mouse.x = (e.clientX/innerWidth)*2 - 1;
  mouse.y = -(e.clientY/innerHeight)*2 + 1;
  mouseClient = { x:e.clientX, y:e.clientY };
});

function showCard(rec, mode){
  const p = rec.port;
  const badgeTxt = { up:'LINK UP', alarm:'ALARM', down:'DOWN' }[rec.state];
  const rx = rec.state==='up' ? (Math.random()*p.speed_mbps*0.5) : 0;
  const tx = rec.state==='up' ? (Math.random()*p.speed_mbps*0.3) : 0;
  const bars = Array.from({length:12}, ()=> `<i style="height:${(3+Math.random()*13)|0}px"></i>`).join('');
  card.innerHTML = `
    <div class="ifname">${p.ifname}<span class="badge ${rec.state}">${badgeTxt}</span></div>
    <div class="rows">
      <div><span>端口类型</span><b>${p.port_type}</b></div>
      <div><span>标称速率</span><b>${p.speed_mbps>=1000 ? p.speed_mbps/1000+' G' : p.speed_mbps+' M'}</b>
           ${p.poe?'<b class="poe"> · PoE+</b>':''}</div>
      <div><span>下行/上行</span><b>${rx.toFixed(1)} / ${tx.toFixed(1)} Mbps</b></div>
      <div class="bars">${bars}</div>
      <div><span>用途</span><b>${p.purpose}</b></div>
      <div><span>VLAN</span><b>${p.vlan}</b></div>
    </div>
    ${rec.state==='alarm' ? '<div class="err">⚠ CRC errors rising · 光功率越限 (模拟告警)</div>' : ''}`;
  card.style.display = 'block';
  card._mode = mode;
}

function hoverCheck(){
  raycaster.setFromCamera(mouse, camera);
  // 1) 全息矩阵格 (优先, 总览浏览)
  const ph = raycaster.intersectObjects(holoMeshes, false)[0];
  if (ph) {
    const di = ph.object.userData.holo;
    const hp = holoPanels[di];
    const cx = ph.uv.x * HOLO_W, cy = (1 - ph.uv.y) * HOLO_H;
    const cell = hp.cells.find(c => Math.abs(cx-c.cx) <= c.w/2 && Math.abs(cy-c.cy) <= c.h/2);
    if (cell) {
      const rec = portData.get(`${deviceGroups[di].cfg.prefix}:${cell.idx}`);
      if (rec) {
        hovered = null; hoverHolo = { di, cell };
        document.body.style.cursor = 'pointer';
        outline.visible = false;
        showCard(rec, 'mouse');
        return;
      }
    }
  }
  hoverHolo = null;
  // 2) 物理端口
  const hits = raycaster.intersectObjects(hitboxes, false);
  const hb = hits[0]?.object || null;
  if (hb === hovered) { if (!hb && !pinned) card.style.display='none'; return; }
  hovered = hb;
  document.body.style.cursor = hb ? 'pointer' : 'default';
  if (!hb) { outline.visible = false; if (!pinned) card.style.display='none'; return; }
  outlinePort(hb);
  showCard(portData.get(`${hb.userData.dev}:${hb.userData.idx}`), 'port');
}

function outlinePort(hb){
  const { dims } = hb.userData;
  outline.visible = true;
  outline.position.copy(hb.getWorldPosition(new THREE.Vector3()));
  outline.scale.set(dims[0]/1000+0.002, dims[1]/1000+0.002, 0.032);
}

function placeCard(){
  if (card.style.display === 'none') return;
  if (card._mode === 'mouse') {
    card.style.left = (mouseClient.x) + 'px';
    card.style.top  = (mouseClient.y - 14) + 'px';
    return;
  }
  const hb = pinned || hovered;
  if (!hb) return;
  const v = hb.getWorldPosition(new THREE.Vector3());
  v.y += hb.userData.dims[1]/1000/2 + 0.012;
  v.project(camera);
  card.style.left = ((v.x*0.5+0.5)*innerWidth) + 'px';
  card.style.top  = ((-v.y*0.5+0.5)*innerHeight) + 'px';
}

/* ================= 单击定位 / 双击切换状态 ================= */
let camAnim = null;
function flyTo(target, camPos){
  camAnim = { cam:camPos.clone(), tgt:target.clone(), t:0,
              fromCam:camera.position.clone(), fromTgt:controls.target.clone() };
}
function flyToPort(dev, idx){
  const hb = hbMap.get(`${dev}:${idx}`);
  if (!hb) return;
  const wp = hb.getWorldPosition(new THREE.Vector3());
  flyTo(wp, wp.clone().add(new THREE.Vector3(0.015, 0.035, 0.30)));
  pinned = hb;
  outlinePort(hb);
  showCard(portData.get(`${dev}:${idx}`), 'port');
  startScan(deviceGroups.findIndex(d => d.cfg.prefix === dev));
}

addEventListener('click', e => {
  if (e.target.closest('#hud-top') || e.target.closest('#side')) return;
  if (hoverHolo) {   // 点击矩阵格 → 飞到物理端口
    flyToPort(deviceGroups[hoverHolo.di].cfg.prefix, hoverHolo.cell.idx);
    return;
  }
  if (hovered) { pinned = hovered; outlinePort(hovered); return; }
  pinned = null; card.style.display = 'none';
});

addEventListener('dblclick', e => {
  if (e.target.closest('#hud-top') || e.target.closest('#side')) return;
  const hb = hovered || pinned;
  if (!hb) return;
  const rec = portData.get(`${hb.userData.dev}:${hb.userData.idx}`);
  rec.state = rec.state==='up' ? 'alarm' : (rec.state==='alarm' ? 'down' : 'up');
  applyLed(rec.dev, rec.port.index, rec.state);
  markHoloDirty(); refreshStats(); refreshCallouts(); refreshSide();
  showCard(rec, pinned ? 'port' : (hoverHolo ? 'mouse' : 'port'));
});

/* ============ ACT 流量闪烁 (突发式, 对齐真机行为) ============ */
// 真机语义 (华为 S5735 STAT 模式 / H3C S5130 官方安装指导):
//   LNK 绿常亮 = Link Up; ACT 随数据收发"突发式"闪烁, 突发频率/长度∝流量; 灭 = 未连接
const actHot = new Set();   // 'PREFIX:idx' 本拍 ACT 灯亮 (矩阵格同步用)
const actModel = new Map(); // key → { rate, burstUntil, nextBurst, phase }
function actModelFor(key, type){
  let m = actModel.get(key);
  if (!m) {
    const isUp = IS_UPLINK(type);
    m = { rate: isUp ? 0.75+Math.random()*0.25 : 0.06+Math.random()*0.42,
          burstUntil: 0, nextBurst: performance.now()+Math.random()*3000, phase: 0 };
    actModel.set(key, m);
  }
  return m;
}
setInterval(() => {
  if (!portData.size) return;
  const now = performance.now();
  actHot.clear();
  for (const r of portData.values()) {
    const key = `${r.dev}:${r.port.index}`;
    const mat = ledMap.get(key + ':ACT');
    if (r.state !== 'up') { if (mat) mat.emissiveIntensity = 0.12; continue; }
    const m = actModelFor(key, r.port.type);
    if (now < m.burstUntil) {
      m.phase ^= 1;                          // 突发内 ~7Hz 快速开关
      if (m.phase) actHot.add(key);
    } else if (now >= m.nextBurst) {
      m.burstUntil = now + (120 + 700*m.rate) * (0.5+Math.random());
      m.nextBurst  = now + (4200 - 3900*m.rate) * (0.6+Math.random()*0.8);
      m.phase = 1; actHot.add(key);
    }
    if (mat) mat.emissiveIntensity = actHot.has(key) ? 2.4 : 0.12;
  }
  markHoloDirty();   // 矩阵格 ACT 灯同步
}, 70);

function markHoloDirty(){ holoPanels.forEach(hp => hp && (hp.dirty = true)); }

/* ================= 统计 / 演练 / 复位 / 侧栏 ================= */
function refreshStats(){
  let up=0, al=0, dn=0;
  for (const r of portData.values()) r.state==='up' ? up++ : (r.state==='alarm' ? al++ : dn++);
  document.getElementById('stats').innerHTML =
    `端口 <b>${portData.size}</b> · UP <b>${up}</b> · <span class="al">ALARM ${al}</span> · DOWN ${dn}`;
}

let curView = 'all';
function refreshSide(){
  const body = document.getElementById('side-body');
  const idxs = curView==='all' ? [0,1,2] : [+curView];
  body.innerHTML = idxs.map(di => {
    const { cfg } = deviceGroups[di];
    const recs = [...portData.values()].filter(r => r.dev === cfg.prefix);
    const up = recs.filter(r=>r.state==='up').length;
    const al = recs.filter(r=>r.state==='alarm').length;
    const dn = recs.filter(r=>r.state==='down').length;
    const tot = recs.length || 1;
    const upP = up/tot*100, alP = al/tot*100;
    const alarms = recs.filter(r=>r.state!=='up');
    const dot = al ? '#ff5f6b' : '#2dffa0';
    return `<div class="devblk">
      <div class="nm"><i style="background:${dot};box-shadow:0 0 6px ${dot}"></i>${cfg.prefix}</div>
      <div class="ring-row">
        <div class="ring" style="background:conic-gradient(#00e659 0 ${upP}%, #ff1419 ${upP}% ${upP+alP}%, #3a4550 ${upP+alP}% 100%)">
          <b>${Math.round(upP)}%</b></div>
        <div class="kv">
          <div>UP <b class="u">${up}</b> · ALARM <b class="a">${al}</b> · DOWN <b class="d">${dn}</b></div>
          <div>可用率 <b class="u">${Math.round(upP)}%</b></div>
        </div>
      </div>
      ${alarms.length ? `<div class="alarmlist">${alarms.map(r =>
        `<div class="li" data-d="${r.dev}" data-i="${r.port.index}">${r.port.ifname}
           <span class="st">${r.state==='alarm'?'ALARM':'DOWN'}</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  body.querySelectorAll('.li').forEach(li => li.onclick = () => flyToPort(li.dataset.d, +li.dataset.i));
}

document.getElementById('btn-alarm').onclick = () => {
  const ups = [...portData.values()].filter(r => r.state==='up');
  for (let i=0; i<3 && ups.length; i++) {
    const r = ups.splice((Math.random()*ups.length)|0, 1)[0];
    r.state='alarm'; applyLed(r.dev, r.port.index, 'alarm');
  }
  markHoloDirty(); refreshStats(); refreshCallouts(); refreshSide();
};
document.getElementById('btn-reset').onclick = () => {
  for (const r of portData.values()) {
    const init = INIT[r.dev];
    r.state = init.alarm.includes(r.port.index) ? 'alarm' : (init.down.includes(r.port.index) ? 'down' : 'up');
    applyLed(r.dev, r.port.index, r.state);
  }
  markHoloDirty(); refreshStats(); refreshCallouts(); refreshSide(); startScan(-1);
};

/* ================= 视图聚焦 ================= */
const VIEWS = {
  all: { cam:[0.05, 0.85, 1.55],  tgt:[0.02, 0.0, 0.05] },
  0:   { cam:[-0.86, 0.40, 0.86], tgt:[-0.53, 0.10, 0.02] },
  1:   { cam:[-0.30, 0.40, 0.90], tgt:[0.0, 0.10, 0.02] },
  2:   { cam:[0.32, 0.42, 0.94],  tgt:[0.56, 0.10, 0.02] },
};
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x===b));
  curView = b.dataset.f;
  const v = VIEWS[curView];
  flyTo(new THREE.Vector3(...v.tgt), new THREE.Vector3(...v.cam));
  refreshSide();
  if (curView !== 'all') startScan(+curView); else startScan(-1);
});

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let dirtyTimer = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt/0.9);
    const k = 1 - Math.pow(1-camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromCam, camAnim.cam, k);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.tgt, k);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  // 全息面板: billboard 朝向相机 + 扫描/节流重绘
  dirtyTimer += dt;
  const allowDirty = dirtyTimer > 0.12;
  for (const hp of holoPanels) {
    if (!hp) continue;
    hp.mesh.quaternion.copy(camera.quaternion);
    if (hp.scanT < 1) { hp.scanT = Math.min(1, hp.scanT + dt/1.3); drawHolo(hp, t); }
    else if (allowDirty && hp.dirty) { hp.dirty = false; drawHolo(hp, t); }
  }
  if (allowDirty) dirtyTimer = 0;
  hoverCheck();
  placeCard();
  placeCallouts();
  composer.render();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

DEVICES.forEach((cfg, i) => loadDevice(cfg, i).catch(err => {
  console.error('加载失败:', cfg.glb, err);
  document.querySelector('#loading .t').textContent = '加载失败: ' + cfg.glb + ' (需通过 HTTP 访问, 见 README)';
}));
tick();
</script>
