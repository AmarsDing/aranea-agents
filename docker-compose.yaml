# Aranea 后端全量 Docker 编排（参照 TwinMonitor 全量 Docker 化设计 §1）
# 形态：单 runtime 镜像（aranea-runtime:local）+ compose 编排 + 生成式 overlay 配置
# 中间件：PG(pgvector)/Redis 自带容器，不映射宿主机端口（仅 araneanet 内容器互访）
# 服务端口：8810(HTTP)/9910(gRPC)/8812(WS) 按 PORT-PLAN 部署版 1:1 映射宿主机
# 使用：
#   构建+启动：powershell -ExecutionPolicy Bypass -File docker/dev-up.ps1
#   仅启动：  docker compose up -d
#   停止：    docker compose down（加 -v 清空数据卷）

name: aranea

services:
  postgres:
    # 与本地 app\env\postgresql 主版本对齐（PG 18），保证 pg_dump/pg_restore 同大版本兼容
    image: pgvector/pgvector:pg18
    container_name: aranea-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: aranea
    # G2 观测面（agent-eval-20260818）：慢查询归因依赖 pg_stat_statements；
    # 首次启用后需执行一次 CREATE EXTENSION（见 docs/testing/agent-eval-20260818/00-master-plan.md §2）
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=200"
    volumes:
      # PG18+ 镜像数据路径改为 pg_ctlcluster 风格：挂载点须在 /var/lib/postgresql，
      # 实际数据落入其下 data/docker 子目录（docker-library/postgres#1259）
      - postgres-data:/var/lib/postgresql
    networks:
      - araneanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aranea"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: aranea-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - araneanet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    image: aranea-runtime:local
    container_name: aranea-admin
    environment:
      # 与 app 便携部署版 start-all.ps1 保持一致：DB 中已签发的 JWT/PAT 均由该密钥签名，
      # 更换会导致既有会话全部失效；生产部署必须改为随机 ≥32 字节密钥
      KRATOS_AUTH_SECRET: "aranea-portable-dev-secret-32chars!!"
      DEPLOY_ENV: "dev"
      DAO_VECTOR_PGVECTOR: "1"
      TZ: "Asia/Shanghai"
      # TwinMonitor OpenAPI 兼容门面机器 token（/api/v1/*，自校验 Bearer）；
      # 与 TwinMonitor aiops ai_aranea_instances.api_token（AES 加密落库）成对；
      # 生产部署必须更换为随机值并同步轮换 TwinMonitor 侧凭据
      ARANEA_TWINOPENAPI_TOKEN: "twin_fdfee1b8c9443c5338a781bd9a4e73074916333b631dad51"
      # TwinOps 工具集（internal/tools/twinops，方案10 §三）：经宿主机回环访问
      # TwinMonitor Gateway 与 gns3_agent。TWIN_API_KEY 为 gateway 服务账号
      # （aranea-ops-dept, id=1），轮换时同步更新本值。
      TWIN_GATEWAY_URL: "http://host.docker.internal:8000"
      TWIN_API_KEY: "twk_d2b2d33fb9372478f0256e182f71a1ea167a17b6cf4fee2705b9549f5dec4d83"
      GNS3_AGENT_URL: "http://host.docker.internal:18081"
      # outboundguard 精确主机放行（AR-SSRF 例外）：容器→宿主机合法私网目标，
      # 当前用于宿主机 Recordly MCP（host.docker.internal:8951）。精确匹配无通配，
      # 新增主机须逐个登记并保持与 app 部署包一致
      ARANEA_OUTBOUND_ALLOW_HOSTS: "host.docker.internal"
      # WebSocket Origin 放行：Docker 部署下前端可能通过宿主机 IP 或 dev server 访问，
      # 这些 Origin 不在默认 localhost/127.0.0.1 白名单内，必须显式配置。
      KRATOS_HTTP_EXTRA_CORS_ORIGINS: "http://0.0.0.0:9301,http://192.168.0.106:9301,http://192.168.0.106:8810,http://localhost:9301,http://127.0.0.1:9301"
      # G1 观测面（agent-eval-20260818）：pprof 独立端口，仅 araneanet 内网可达（不映射宿主机），
      # 抓取：docker exec aranea-admin wget -qO- http://127.0.0.1:8813/debug/pprof/heap
      # 缺省该环境变量即关闭（cmd/admin/pprof.go）；app 便携部署包不注入此变量。
      ARANEA_PPROF_ADDR: ":8813"
      # 包A装配预算诊断（2026-08-25，临时）：强制每次 model call 落 L0 装配快照
      # （segments_json 分解），用于 P-CTX-EXPLOSION 定位与 A 包前后对照。验收完成后移除。
      ARANEA_L0_SNAPSHOT: "force"
      # codeexecutor 方案 B（docker.sock 直通）：容器内 docker CLI 经下方挂载的
      # 宿主机 socket 调 daemon，拉起一次性沙箱容器（python:3.11-slim，镜像需
      # 预先存在于宿主机 daemon）。沙箱与 aranea-admin 平级（同在宿主机 daemon
      # 上），非容器套容器；沙箱自身 --network none 隔离，互不影响。
      CODE_EXECUTOR_BACKEND: "docker"
      CODE_EXECUTOR_DOCKER_IMAGE: "python:3.11-slim"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8810:8810"   # HTTP（TwinMonitor voice / 前端 dev 代理 / 监控探测入口）
      - "9910:9910"   # gRPC
      - "8812:8812"   # WebSocket
    extra_hosts:
      # 容器→宿主机回环（host 侧 Ollama embedding、TwinMonitor webhook 回调等）
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/config:/app/conf:ro
      - ./docker/volumes/logs:/app/logs
      - ./docker/volumes/data:/app/data
      # 技能文件根目录（ResolveRoot 默认 /root/.config/Aranea/skills）；
      # 不挂载则容器内无任何技能文件，skill.fs.sync 报 filesystem missing、
      # prompt section_skills=0（2026-08-16 fault-execution 缺失实证）。
      - ./docker/volumes/skills:/root/.config/Aranea/skills
      # codeexecutor 方案 B：直通宿主机 Docker daemon（Docker Desktop on Windows
      # 的 Linux VM socket 路径，compose 自动桥接）。容器内 root 可直接读写；
      # 沙箱容器由宿主机 daemon 创建，与 aranea-admin 平级。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - araneanet
    restart: unless-stopped

  # M82 P2-1 sandbox egress 代理：沙箱唯一受控出口。仅接 araneanet（外网
  # 上行）——沙箱侧不再有共享桥（r2 #9）：引擎为每个 egress 沙箱创建专属
  # internal 网络 aranea-egress-<sandboxID> 并把本代理动态 docker network
  # connect 进去（沙箱间互相不可达）。域名白名单见
  # docker/config/egress/allowed_domains.txt（精确主机逐个登记，
  # outboundguard 放行风格）；container_name 须与 config.yaml
  # sandbox.egress.proxy_http 的主机部分一致（沙箱经 embedded DNS 按名解析）。
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: aranea-egress-proxy
    volumes:
      - ./docker/config/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/config/egress/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro
    networks:
      - araneanet
    restart: unless-stopped
    # r3 review #3: bound the tail-forwarded docker logs (in-container files
    # are bounded by squid's own logfile_rotate + `squid -k rotate`).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # G3 压测执行器（agent-eval-20260818）：常驻容器，内网打 http://aranea-admin:8810，
  # 消除宿主机 PowerShell Start-Job 进程开销导致的客户端口径失真（realmachine-20260817 PERF-02 教训）。
  # 用法：docker compose --profile perf up -d k6 && docker exec aranea-k6 k6 run /scripts/baseline.js
  k6:
    image: grafana/k6:latest
    container_name: aranea-k6
    profiles: ["perf"]
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./test/agent-eval-20260818/k6:/scripts:ro
    networks:
      - araneanet

networks:
  araneanet:
    driver: bridge
  # 注：M82 P2 起不再有共享 aranea-egress 桥（r2 #9）——egress 沙箱的
  # internal 车道由引擎按 aranea-egress-<sandboxID> 逐沙箱创建/回收，
  # 代理容器按需动态接入，compose 不预建。

volumes:
  postgres-data:
  redis-data:
