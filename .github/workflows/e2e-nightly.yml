name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: go build -o bin/admin ./cmd/admin

      - name: Start backend
        run: |
          KRATOS_HTTP_AUTH_DISABLED=1 DEPLOY_ENV=dev ./bin/admin -conf ./configs &
          # Wait for backend to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8800/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Start frontend preview
        working-directory: web
        run: |
          npx vite preview --port 9301 --host 0.0.0.0 &
          # Wait for frontend to be ready (up to 15s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9301 > /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:9301

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: web/test-results/
