name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0，不带 v 前缀也行)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Configure git for long paths (Windows)
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $version = '${{ github.event.inputs.version }}' -replace '^v', ''
          } else {
            $version = '0.0.0-dev'
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # 确保 makensis 在 PATH 中
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Download dependencies (PostgreSQL + Redis)
        shell: pwsh
        run: |
          .\scripts\download-deps.ps1 -OutDir build/deps

      - name: Compile pgvector (non-blocking)
        shell: pwsh
        run: |
          # 非阻塞：pgvector 编译失败不中断构建。
          # 缺失 vector.dll 时 PostgreSQL 仍能启动，仅向量搜索功能不可用。
          # start.bat 中 "CREATE EXTENSION vector" 会失败但非致命，应用可降级运行。
          try {
            $bundledPgDir = Resolve-Path "build/deps/postgres"
            $vectorDll = Join-Path $bundledPgDir "lib\vector.dll"
            if (Test-Path $vectorDll) {
              Write-Host "vector.dll already exists, skipping compilation"
              return
            }

            # EnterpriseDB binaries zip 不含 include/server 开发头文件，
            # 需通过 installer 静默安装获取 PG17 dev headers 用于编译 pgvector。
            $pgInstallDir = "C:\Program Files\PostgreSQL\17"
            $serverInclude = Join-Path $pgInstallDir "include\server\postgres.h"
            if (-not (Test-Path $serverInclude)) {
              $installerUrl = "https://get.enterprisedb.com/postgresql/postgresql-17.5-1-windows-x64.exe"
              $installerPath = "$env:TEMP\pg17-installer.exe"
              Write-Host "Downloading PostgreSQL 17.5 installer for dev headers..."
              Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
              Write-Host "Installing PostgreSQL 17.5 silently..."
              $proc = Start-Process -FilePath $installerPath `
                -ArgumentList "--mode","unattended","--unattendedmodeui","none","--superpassword","postgres","--servicename","postgresql-17-build","--serverport","5433" `
                -Wait -NoNewWindow -PassThru
              if ($proc.ExitCode -ne 0) {
                throw "PostgreSQL installer exited with code $($proc.ExitCode)"
              }
              Remove-Item $installerPath -Force
            }

            # pgvector Makefile.win 强制要求 PGROOT（!ifndef PGROOT / !error PGROOT is not set）
            $env:PGROOT = $pgInstallDir
            Write-Host "PGROOT: $env:PGROOT"

            git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git C:\pgvector

            $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            if (-not (Test-Path $vsPath)) {
              $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
            }

            Push-Location C:\pgvector
            $buildOutput = cmd /c "`"$vsPath`" && nmake /F Makefile.win OPTIMIZE=0" 2>&1
            $buildExit = $LASTEXITCODE
            Write-Host $buildOutput
            Pop-Location
            if ($buildExit -ne 0) {
              throw "pgvector nmake failed (exit $buildExit)"
            }
            Copy-Item "C:\pgvector\vector.dll" $vectorDll -Force
            Write-Host "vector.dll compiled and copied to $vectorDll" -ForegroundColor Green
          } catch {
            Write-Host ""
            Write-Host "==========================================" -ForegroundColor Yellow
            Write-Host "  [WARN] pgvector compilation failed." -ForegroundColor Yellow
            Write-Host "  Reason: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "  Build will continue without vector.dll." -ForegroundColor Yellow
            Write-Host "  PostgreSQL will start normally but vector search" -ForegroundColor Yellow
            Write-Host "  will be unavailable. See start.bat line 78 for the" -ForegroundColor Yellow
            Write-Host "  non-fatal 'CREATE EXTENSION vector' step." -ForegroundColor Yellow
            Write-Host "==========================================" -ForegroundColor Yellow
            Write-Host ""
            exit 0
          }
          exit 0

      - name: Setup Electron template
        shell: pwsh
        run: |
          # build-electron.mjs requires AraneaAgents-deploy/frontend/ as Electron runtime template.
          # This directory is not in git (large binaries). Download Electron 43.1.0 for win32-x64.
          $electronVersion = "43.1.0"
          $templateDir = "AraneaAgents-deploy\frontend"
          $zipPath = "$env:TEMP\electron-v$electronVersion-win32-x64.zip"

          if (-not (Test-Path $templateDir)) {
            Write-Host "Downloading Electron v$electronVersion..."
            $url = "https://github.com/electron/electron/releases/download/v$electronVersion/electron-v$electronVersion-win32-x64.zip"
            Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing

            Write-Host "Extracting to $templateDir..."
            New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $templateDir -Force
            Remove-Item $zipPath -Force
            Write-Host "Electron template ready at $templateDir"
          } else {
            Write-Host "Electron template already exists at $templateDir"
          }

      - name: Build backend (go build)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = "${{ steps.version.outputs.version }}"
          $ldflags = "-s -w -X main.Version=$version -X main.Name=aranea-agents"
          Write-Host "Downloading Go modules..."
          & go mod download 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[WARN] go mod download failed, continuing with cache" -ForegroundColor Yellow
          }
          Write-Host "Building aranea-server.exe..."
          $buildOutput = & go build -tags pgvector -ldflags $ldflags -o build/aranea-server.exe ./cmd/admin 2>&1
          $buildExit = $LASTEXITCODE
          Write-Host $buildOutput
          if ($buildExit -ne 0) {
            Write-Host ""
            Write-Host "===== BUILD FAILED (exit $buildExit) =====" -ForegroundColor Red
            Write-Host "Go version:" -ForegroundColor Yellow
            & go version
            Write-Host "Module verify:" -ForegroundColor Yellow
            & go mod verify 2>&1
            Write-Host "Replace directives in go.mod:" -ForegroundColor Yellow
            Select-String -Path go.mod -Pattern "^replace" | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Backend built: build/aranea-server.exe" -ForegroundColor Green

      - name: Install frontend deps (pnpm install)
        shell: pwsh
        run: |
          Push-Location web
          & node --version
          & pnpm --version
          & pnpm install --frozen-lockfile
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            Write-Host "frozen-lockfile failed (exit $installExit), retrying..." -ForegroundColor Yellow
            & pnpm install
            $installExit = $LASTEXITCODE
          }
          Pop-Location
          if ($installExit -ne 0) {
            Write-Error "pnpm install failed (exit $installExit)"
            exit 1
          }
          Write-Host "pnpm install OK" -ForegroundColor Green

      - name: Build frontend (pnpm build)
        shell: pwsh
        run: |
          Push-Location web
          & pnpm build
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Pop-Location
            Write-Error "pnpm build failed (exit $buildExit)"
            exit 1
          }
          Pop-Location
          if (-not (Test-Path "web/dist/index.html")) {
            Write-Error "web/dist/index.html not found after pnpm build"
            exit 1
          }
          Write-Host "Frontend built: web/dist/" -ForegroundColor Green

      - name: Package Electron app
        shell: pwsh
        run: |
          Push-Location web
          $env:QUASAR_ELECTRON_PRELOAD_FOLDER = "preload"
          $env:QUASAR_ELECTRON_PRELOAD_EXTENSION = ".cjs"
          & node scripts/build-electron.mjs --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            Write-Error "Electron packaging failed (exit $LASTEXITCODE)"
            exit 1
          }
          Pop-Location
          $electronAppDir = "web/build/electron/AraneaAgents-win32-x64"
          if (-not (Test-Path $electronAppDir)) {
            $fallback = Get-ChildItem -Path "web/build" -Directory -Filter "electron-*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($fallback) { $electronAppDir = Join-Path $fallback.FullName "AraneaAgents-win32-x64" }
          }
          if (-not (Test-Path $electronAppDir)) {
            Write-Error "Electron app dir not found: $electronAppDir"
            exit 1
          }
          Write-Host "Electron app packaged: $electronAppDir"

      - name: Assemble staging & NSIS package
        shell: pwsh
        run: |
          .\scripts\build-package.ps1 `
            -Version ${{ steps.version.outputs.version }} `
            -DepsDir build/deps `
            -SkipDepsDownload `
            -SkipBackend `
            -SkipFrontend `
            -OutDir release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Staging/NSIS failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AraneaAgents-${{ steps.version.outputs.version }}-win-x64
          path: release/AraneaAgents-*.exe
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Aranea-Agents ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release/AraneaAgents-*.exe
          body: |
            ## Aranea-Agents ${{ steps.version.outputs.version }}

            ### Windows 安装包
            - 下载 `AraneaAgents-${{ steps.version.outputs.version }}-win-x64.exe`
            - 双击安装，点击桌面快捷方式启动
            - 默认登录：`admin` / `changeme`

            ### 系统要求
            - Windows 10 64位及以上
            - 最低 4GB 内存（推荐 8GB+）
            - 1GB 可用磁盘空间

            ### 内置组件
            - 后端服务（Go + Kratos + trpc-agent-go）
            - 前端桌面应用（Vue 3 + Quasar + Electron）
            - PostgreSQL 17 + pgvector
            - Redis 5
