name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0，不带 v 前缀也行)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Configure git for long paths (Windows)
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $version = '${{ github.event.inputs.version }}' -replace '^v', ''
          } else {
            $version = '0.0.0-dev'
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # 确保 makensis 在 PATH 中
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Download dependencies (PostgreSQL + Redis)
        shell: pwsh
        run: |
          .\scripts\download-deps.ps1 -OutDir build/deps

      - name: Compile pgvector (non-blocking)
        shell: pwsh
        run: |
          # Prefer vendored pgvector matched to bundled PG major (PG18).
          # Compile remains a best-effort fallback; missing vector.dll must not ship.
          $bundledPgDir = Resolve-Path "build/deps/postgres"
          $vectorDll = Join-Path $bundledPgDir "lib\vector.dll"
          $vectorControl = Join-Path $bundledPgDir "share\extension\vector.control"
          $vendored = "installer\bundled\pgvector-pg18"

          if (-not (Test-Path $vectorDll) -and (Test-Path "$vendored\lib\vector.dll")) {
            Write-Host "Injecting vendored pgvector from $vendored"
            New-Item -ItemType Directory -Force -Path (Join-Path $bundledPgDir "lib") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $bundledPgDir "share\extension") | Out-Null
            Copy-Item "$vendored\lib\vector.dll" $vectorDll -Force
            Copy-Item "$vendored\share\extension\vector*" (Join-Path $bundledPgDir "share\extension\") -Force
          }

          if ((Test-Path $vectorDll) -and (Test-Path $vectorControl)) {
            Write-Host "pgvector ready: $vectorDll"
            Get-Item $vectorDll, $vectorControl | Format-Table FullName, Length
            exit 0
          }

          Write-Host "Vendored pgvector missing; attempting compile (best-effort)..."
          try {
            $pgInstallDir = "C:\Program Files\PostgreSQL\18"
            $serverInclude = Join-Path $pgInstallDir "include\server\postgres.h"
            if (-not (Test-Path $serverInclude)) {
              $pgInstallDir = "C:\Program Files\PostgreSQL\17"
              $serverInclude = Join-Path $pgInstallDir "include\server\postgres.h"
            }
            if (-not (Test-Path $serverInclude)) {
              throw "PostgreSQL server headers not found for compile fallback"
            }
            $env:PGROOT = $pgInstallDir
            git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git C:\pgvector
            $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            if (-not (Test-Path $vsPath)) {
              $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
            }
            Push-Location C:\pgvector
            cmd /c "`"$vsPath`" && nmake /F Makefile.win OPTIMIZE=0"
            if ($LASTEXITCODE -ne 0) { throw "nmake failed" }
            Pop-Location
            Copy-Item "C:\pgvector\vector.dll" $vectorDll -Force
            Copy-Item "C:\pgvector\vector.control" (Join-Path $bundledPgDir "share\extension\vector.control") -Force -ErrorAction SilentlyContinue
            Copy-Item "C:\pgvector\sql\vector*" (Join-Path $bundledPgDir "share\extension\") -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "[WARN] pgvector compile fallback failed: $($_.Exception.Message)" -ForegroundColor Yellow
          }
          exit 0

      - name: Verify pgvector in bundled Postgres
        shell: pwsh
        run: |
          $dll = "build\deps\postgres\lib\vector.dll"
          $ctl = "build\deps\postgres\share\extension\vector.control"
          if (-not (Test-Path $dll)) { throw "FATAL: $dll missing — installer would fail knowledge/vector startup" }
          if (-not (Test-Path $ctl)) { throw "FATAL: $ctl missing — CREATE EXTENSION vector cannot succeed" }
          Write-Host "Verified pgvector assets:"
          Get-Item $dll, $ctl | Format-Table FullName, Length

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build backend (go build)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = "${{ steps.version.outputs.version }}"
          $ldflags = "-s -w -X main.Version=$version -X main.Name=aranea-agents"
          Write-Host "Downloading Go modules..."
          & go mod download 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[WARN] go mod download failed, continuing with cache" -ForegroundColor Yellow
          }
          Write-Host "Building aranea-server.exe..."
          $buildOutput = & go build -tags pgvector -ldflags $ldflags -o build/aranea-server.exe ./cmd/admin 2>&1
          $buildExit = $LASTEXITCODE
          Write-Host $buildOutput
          if ($buildExit -ne 0) {
            Write-Host ""
            Write-Host "===== BUILD FAILED (exit $buildExit) =====" -ForegroundColor Red
            Write-Host "Go version:" -ForegroundColor Yellow
            & go version
            Write-Host "Module verify:" -ForegroundColor Yellow
            & go mod verify 2>&1
            Write-Host "Replace directives in go.mod:" -ForegroundColor Yellow
            Select-String -Path go.mod -Pattern "^replace" | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Backend built: build/aranea-server.exe" -ForegroundColor Green
          Write-Host "Building AraneaLauncher.exe (windowsgui, no console)..."
          $launcherOut = & go build -ldflags "-s -w -H windowsgui" -o build/AraneaLauncher.exe ./cmd/launcher 2>&1
          $launcherExit = $LASTEXITCODE
          Write-Host $launcherOut
          if ($launcherExit -ne 0) {
            Write-Error "AraneaLauncher build failed (exit $launcherExit)"
            exit 1
          }
          Write-Host "Launcher built: build/AraneaLauncher.exe" -ForegroundColor Green

      - name: Install frontend deps (pnpm install)
        shell: pwsh
        run: |
          Push-Location web
          & node --version
          & pnpm --version
          & pnpm install --frozen-lockfile
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            Write-Host "frozen-lockfile failed (exit $installExit), retrying..." -ForegroundColor Yellow
            & pnpm install
            $installExit = $LASTEXITCODE
          }
          Pop-Location
          if ($installExit -ne 0) {
            Write-Error "pnpm install failed (exit $installExit)"
            exit 1
          }
          Write-Host "pnpm install OK" -ForegroundColor Green

      - name: Build frontend (pnpm build)
        shell: pwsh
        run: |
          Push-Location web
          $output = & pnpm build 2>&1
          $buildExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            Pop-Location
            $lastLines = ($output | Select-Object -Last 10) -join " | "
            Write-Host "::error::pnpm build failed (exit $buildExit). Last 10 lines: $lastLines"
            exit 1
          }
          Pop-Location
          if (-not (Test-Path "web/dist/spa/index.html")) {
            Write-Host "::error::web/dist/spa/index.html not found after pnpm build"
            exit 1
          }
          Write-Host "Frontend built: web/dist/" -ForegroundColor Green

      - name: Package Tauri app
        shell: pwsh
        run: |
          Push-Location web
          & node scripts/build-tauri.mjs
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            Write-Error "Tauri packaging failed (exit $LASTEXITCODE)"
            exit 1
          }
          Pop-Location
          $tauriAppDir = "web/build/tauri/AraneaAgents-win32-x64"
          if (-not (Test-Path (Join-Path $tauriAppDir "AraneaAgents.exe"))) {
            Write-Error "Tauri app not found: $tauriAppDir"
            exit 1
          }
          Write-Host "Tauri app packaged: $tauriAppDir"

      - name: Assemble staging & NSIS package
        shell: pwsh
        run: |
          .\scripts\build-package.ps1 `
            -Version ${{ steps.version.outputs.version }} `
            -SkipDepsDownload `
            -SkipBackend `
            -SkipFrontend `
            -OutDir release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Staging/NSIS failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AraneaAgents-${{ steps.version.outputs.version }}-win-x64
          path: release/AraneaAgents-*.exe
          retention-days: 30

      - name: List release directory (debug)
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -Recurse | ForEach-Object {
              $rel = $_.FullName.Replace((Get-Location).Path, "")
              $size = if ($_.PSIsContainer) { "<DIR>" } else { "$([math]::Round($_.Length / 1MB, 1)) MB" }
              Write-Host "  $rel  $size"
            }
          } else {
            Write-Host "  release/ directory not found!"
          }
          Write-Host "=== pwd ==="
          Get-Location

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Aranea-Agents ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/AraneaAgents-*.exe
          body: |
            ## Aranea-Agents ${{ steps.version.outputs.version }}

            ### Windows 安装包（推荐）
            1. 下载 `AraneaAgents-${{ steps.version.outputs.version }}-win-x64.exe`
            2. 双击安装（默认装到 `%LOCALAPPDATA%\AraneaAgents`，**无需管理员**）
            3. 点击桌面「Aranea-Agents」启动（**无黑框控制台**，静默拉起服务）
            4. 默认登录：`admin` / `changeme`

            ### 使用说明
            - **启动**：桌面快捷方式 / `AraneaLauncher.exe`（自动环境检查）
            - **环境检查**：开始菜单「环境检查」或 `AraneaLauncher.exe -check`
            - **停止**：开始菜单「停止 Aranea-Agents」或 `AraneaLauncher.exe -stop`（不关闭系统 PG/Redis）
            - **本机已有 PostgreSQL/Redis**：优先复用（PG 默认 `:5432`）；否则启用内置实例
            - **系统 PG 需要密码**：环境变量 `ARANEA_PG_PASSWORD`，或安装目录 `configs\pg.password`
            - **调试**：开始菜单「启动（调试控制台）」；日志：`logs\launcher.log` / `preflight.txt` / `server.log`
            - 首次启动需 10~30 秒，请稍候桌面窗口出现

            ### 系统要求
            - Windows 10 64位及以上
            - 最低 4GB 内存（推荐 8GB+）
            - 约 1.5GB 可用磁盘空间

            ### 内置组件
            - 静默启动器（AraneaLauncher，无控制台）
            - 后端服务（Go + Kratos + trpc-agent-go）
            - 前端桌面应用（Vue 3 + Quasar + Tauri(Rust)，WebView2 渲染，同源反代 API）
            - PostgreSQL 17 + pgvector
            - Redis 5
