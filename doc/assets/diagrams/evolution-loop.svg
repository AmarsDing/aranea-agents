<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B6B8C"/>
    </marker>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16223C" stroke-width="1"/>
    </pattern>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1200" height="760" fill="#0B1220"/>
    <rect x="0" y="0" width="1200" height="760" fill="url(#grid)"/>
    <circle cx="1120" cy="60" r="320" fill="url(#glowCyan)"/>
  </g>

  <g id="containers">
    <rect x="40" y="150" width="280" height="330" rx="10" fill="#101B30" stroke="#22304F" stroke-width="1"/>
    <rect x="360" y="150" width="280" height="330" rx="10" fill="#101B30" stroke="#22304F" stroke-width="1"/>
    <rect x="680" y="150" width="220" height="330" rx="10" fill="#101B30" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="940" y="150" width="220" height="330" rx="10" fill="#101B30" stroke="#22304F" stroke-width="1"/>
    <rect x="40" y="560" width="1120" height="70" rx="10" fill="#101B30" stroke="#22304F" stroke-width="1"/>
    <rect x="40" y="660" width="1120" height="60" rx="10" fill="#101B30" stroke="#F87171" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <g id="nodes">
    <rect x="70" y="200" width="220" height="42" rx="8" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="70" y="262" width="220" height="42" rx="8" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="70" y="324" width="220" height="42" rx="8" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="70" y="386" width="220" height="42" rx="8" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1.5"/>

    <rect x="390" y="200" width="220" height="42" rx="8" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="390" y="262" width="220" height="42" rx="8" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="390" y="324" width="220" height="42" rx="8" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="390" y="386" width="220" height="42" rx="8" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.8" stroke-width="1.5"/>

    <rect x="710" y="220" width="160" height="50" rx="8" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="1.5"/>
    <rect x="710" y="300" width="160" height="50" rx="8" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="1.5"/>
    <rect x="710" y="380" width="160" height="50" rx="8" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="1.5"/>

    <rect x="970" y="200" width="160" height="42" rx="8" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="970" y="262" width="160" height="42" rx="8" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="970" y="324" width="160" height="42" rx="8" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="970" y="386" width="160" height="42" rx="8" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5"/>

    <rect x="400" y="580" width="400" height="44" rx="8" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-opacity="0.9" stroke-width="1.5"/>
  </g>

  <g id="labels" font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="24" font-weight="bold" fill="#E5EAF5">自动进化闭环</text>
    <text x="40" y="66" font-size="13" fill="#8FA3C8">指明方向 → 系统从运行数据中学习 → 生成进化提案 → 人工审批 → 应用生效 → 验证回灌</text>

    <text x="60" y="176" font-size="13" font-weight="bold" fill="#8B5CF6">① 观察信号</text>
    <text x="180" y="226" font-size="13" fill="#E5EAF5" text-anchor="middle">工具调用模式</text>
    <text x="180" y="288" font-size="13" fill="#E5EAF5" text-anchor="middle">用户反馈 / 评分</text>
    <text x="180" y="350" font-size="13" fill="#E5EAF5" text-anchor="middle">错误与失败</text>
    <text x="180" y="412" font-size="13" fill="#E5EAF5" text-anchor="middle">检索质量</text>

    <text x="380" y="176" font-size="13" font-weight="bold" fill="#F472B6">② 检测与提案</text>
    <text x="500" y="226" font-size="13" fill="#E5EAF5" text-anchor="middle">模式检测（置信度 ≥ 0.15）</text>
    <text x="500" y="288" font-size="13" fill="#E5EAF5" text-anchor="middle">Pattern Hash 去重</text>
    <text x="500" y="350" font-size="13" fill="#E5EAF5" text-anchor="middle">六维相似度融合</text>
    <text x="500" y="412" font-size="13" fill="#E5EAF5" text-anchor="middle">生成 Proposal</text>

    <text x="700" y="176" font-size="13" font-weight="bold" fill="#22D3EE">③ 人工审批</text>
    <text x="790" y="249" font-size="13" fill="#E5EAF5" text-anchor="middle">批准 approve</text>
    <text x="790" y="329" font-size="13" fill="#E5EAF5" text-anchor="middle">拒绝 reject</text>
    <text x="790" y="409" font-size="13" fill="#E5EAF5" text-anchor="middle">过期 expire</text>

    <text x="960" y="176" font-size="13" font-weight="bold" fill="#34D399">④ 应用与注册</text>
    <text x="1050" y="226" font-size="13" fill="#E5EAF5" text-anchor="middle">写入 SKILL.md</text>
    <text x="1050" y="288" font-size="13" fill="#E5EAF5" text-anchor="middle">修改 Prompt</text>
    <text x="1050" y="350" font-size="13" fill="#E5EAF5" text-anchor="middle">版本管理</text>
    <text x="1050" y="412" font-size="13" fill="#E5EAF5" text-anchor="middle">沙箱验证</text>

    <text x="60" y="586" font-size="12" font-weight="bold" fill="#FBBF24">⑤ 验证回灌</text>
    <text x="600" y="607" font-size="14" fill="#E5EAF5" text-anchor="middle">效果指标采集 → DQ 评分 → 学习记录回灌运行数据</text>

    <text x="60" y="686" font-size="12" font-weight="bold" fill="#F87171">三重护栏</text>
    <text x="170" y="686" font-size="12" fill="#8FA3C8">变更限速 GuardrailMaxChangePerPeriod · 最低数据点 GuardrailMinDataPoints · 质量下降自动回滚 GuardrailRollbackOnDeclinePercent</text>
  </g>

  <g id="connections">
    <line x1="322" y1="315" x2="358" y2="315" stroke="#5B6B8C" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="642" y1="315" x2="678" y2="315" stroke="#5B6B8C" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="902" y1="315" x2="938" y2="315" stroke="#5B6B8C" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 1050 432 L 1050 520 L 820 520 L 820 576" fill="none" stroke="#5B6B8C" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 400 602 L 180 602 L 180 484" fill="none" stroke="#5B6B8C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
    <text x="260" y="592" font-size="11" fill="#8FA3C8" font-family="Arial, Helvetica, sans-serif">回灌观察</text>
  </g>
</svg>
