# 独立测试环境配置（chat UI team/agent 派遣测试）
# 与主环境隔离：独立端口 18000/19000/18002 + 独立数据库 aranea_test
# 启动: admin-test.exe -conf F:\aranea-agents\.test-env\config\config.yaml
# 可选: KRATOS_HTTP_AUTH_DISABLED=1 跳过 cookie 认证
server:
  http:
    addr: 0.0.0.0:18000
    timeout: 0s
  grpc:
    addr: 0.0.0.0:19000
    timeout: 120s
  ws:
    enable: true
    network: tcp
    addr: 0.0.0.0:18002
  monitor:
    process_log_enabled: true
data:
  driver: postgres
  sqlite:
    enable: false
    source: file:./data/arenea.sqlite?_fk=1
  initial_admin:
    name: dev
    email: dev@local.invalid
    password: dev
    access: admin
  postgres:
    source: "postgres://postgres:Hangshan%40123@127.0.0.1:5432/aranea_test?sslmode=disable"
    vector_dim: 1536
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
logging:
  level: info
  output_dir: "F:\\aranea-agents\\.test-env\\logs"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
  stdout_enabled: true
  hook_level: info
