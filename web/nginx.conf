# Aranea 前端容器 nginx 配置（SPA + 同源反代）
# 前端构建产物走 history 路由，所有非静态资源回退 index.html；
# /v1 /v2 /api /healthz 同源反代到 aranea-admin:8810（compose 内网服务名）。
# /v1 同时承载 WebSocket（前端 buildWsUrl 恒为 `<同源>/v1/ws`），因此必须带升级头。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 上传上限：任务附件单个 ≤50MB（multipart 再留余量）；nginx 默认只有 1MB，
  # 超过就 413，邮件附件、会话产物上传同样受益
  client_max_body_size 64m;

  # 构建产物带 hash，长缓存；index.html 不缓存，避免发版后拿到旧入口
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # fleetctl 入口只给宿主机上 agent 终端直连后端用，不经前端反代暴露：
  # 后端在宿主机上跑时，经反代进来的请求在它看来也是回环来源。
  location = /v1/fleet/cli {
    return 403;
  }

  location ~ ^/(v1|v2|api|healthz) {
    proxy_pass http://aranea-admin:8810;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 事件流为长连接，禁用缓冲并放宽读超时
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
