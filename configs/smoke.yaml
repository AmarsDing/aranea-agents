# SQLite-only config for CLI maintenance tools and in-memory tests.
# NOTE: This config CANNOT be used with the main admin server because NewData
# hardcodes Postgres as the primary database. For Postgres smoke tests, use
# configs/smoke_postgres.yaml instead.
#
# data.initial_admin: when admins table is empty, seeds id=1 (password → MD5, same as AdminService.Login).
# Optional: KRATOS_HTTP_AUTH_DISABLED=1 skips cookie auth for local SPA.
server:
  http:
    addr: 0.0.0.0:8800
    timeout: 600s
  grpc:
    addr: 0.0.0.0:9900
    timeout: 120s
  ws:
    enable: true
    network: tcp
    addr: 0.0.0.0:8802
  monitor:
    process_log_enabled: true
data:
  sqlite:
    enable: true
    # NOTE: cache=shared was removed (2026-06-04 fix for agent-save-timeout).
    # In a single-process admin, shared cache is redundant and triggers a
    # modernc.org/sqlite + WAL deadlock that hangs every write until the
    # SQLite connection is leaked.  Use the default per-connection cache.
    source: file:./data/arenea.sqlite?_fk=1
  initial_admin:
    name: dev
    email: dev@local.invalid
    password: dev
    access: admin
logging:
  level: info
  output_dir: "./bin/logs"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
  stdout_enabled: true
  hook_level: info
