server:
  http:
    addr: 0.0.0.0:8000
    # Chat/completions can exceed seconds; 1s causes context deadline errors after the model returns.
    timeout: 600s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 120s
  ws:
    enable: true
    network: tcp
    addr: 0.0.0.0:8002
data:
  sqlite:
    enable: true
    source: file:./data.sqlite?cache=shared&_fk=1
  # First boot only (empty admins): id=1, password MD5-hashed like Login.
  initial_admin:
    name: admin
    email: admin@local.invalid
    password: changeme
    access: admin
  postgres:
    source: postgres://postgres:postgres@127.0.0.1:5432/aranea?sslmode=disable
    vector_dim: 1536
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

