server:
  http:
    addr: 0.0.0.0:8800
    # P1 fix (2026-06-18): Raised from 600s to 0 (no timeout) to support 24h
    # long tasks. The turn-level hard deadline (24h in chat_orchestrator_turn.go)
    # is the real safety net. HTTP timeout was previously the first blocker in
    # the "timeout waterfall" (HTTP 10min 鈫?Turn 2h 鈫?LLM 5min 鈫?DB 30s).
    # Set to a positive duration (e.g., 600s) to restore sync HTTP timeout.
    timeout: 0s
  grpc:
    addr: 0.0.0.0:9900
    timeout: 120s
  ws:
    enable: true
    network: tcp
    addr: 0.0.0.0:8802
  monitor:
    process_log_enabled: true
  # Public A2A endpoint prefix (no trailing slash). Prefer System Settings UI or env A2A_PUBLIC_BASE_URL.
  # a2a_public_base_url: ""
data:
  # Primary database driver. "postgres" is the only supported driver in
  # production (NewData hardcodes Postgres). "sqlite" is kept only for
  # offline CLI maintenance tools and test infrastructure.
  driver: postgres
  sqlite:
    # Used only by CLI maintenance tools (OpenSQLiteEntClient/NewCLIData) and
    # in-memory tests. Ignored by NewData in production.
    enable: false
    source: file:./data/arenea.sqlite?cache=shared&_fk=1
  # First boot only (empty admins): id=1, password MD5-hashed like Login.
  # SECURITY: Override via env var DATA__INITIAL_ADMIN__PASSWORD in production.
  initial_admin:
    name: admin
    email: admin@local.invalid
    password: changeme
    access: admin
  # SECURITY: Override via env var DATA__POSTGRES__SOURCE in production.
  # pgvector extension is required (DAO_VECTOR_PGVECTOR=1).
  postgres:
    source: "postgres://postgres:123456@127.0.0.1:5432/aranea?sslmode=disable" # app 便携实例（2026-08-12 起，原 5433 手工实例已废弃）
    vector_dim: 1024 # bge-m3 via local Ollama (2026-08-08; was 1536 for text-embedding-3-small)
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
logging:
  level: info
  output_dir: "./bin/logs"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
  stdout_enabled: true
  hook_level: info
# Runtime infrastructure tuning. All fields default to sensible values when
# zero/empty, so this section is optional. Uncomment and adjust per deployment.
# runtime:
#   ws:
#     pong_wait_ms: 60000           # wait for client pong (default 60 s)
#     ping_period_ms: 30000         # server ping interval (default 30 s)
#     write_wait_ms: 10000          # single write deadline (default 10 s)
#     max_session_conns: 5          # per-session WS limit
#     max_global_monitor_conns: 32  # global monitor WS limit
#   hook:
#     default_max_attempts: 3       # max delivery attempts
#     default_timeout_sec: 8        # HTTP request timeout
#     retry_poll_interval_ms: 60000 # stale-poll interval
#   self_heal:
#     min_confidence: 0.7           # min confidence to fire alert
#     circuit_breaker_threshold: 5  # events in window to trip breaker
#   memory_queue:
#     normal_cap: 256               # normal-priority lane capacity
#   webhook:
#     rate_limit_per_min: 120       # per-channel requests/min
#   auto_memory:
#     max_retries: 3                # extraction attempts per job
#     max_messages: 40              # recent messages to analyze
#   activity_flusher:
#     batch_size: 10                # rows per flush
# Platform self-improvement (V3) pipeline (73-self-iteration-v3). Default off;
# enable only after reviewing the governance model (design 搂6).
# 2026-08-09锛氭寜榛樿閰嶇疆鍚敤锛堢伆搴﹀紑鍚紝绔埌绔繍琛屾椂楠岃瘉锛夈€?
self_improvement:
  enabled: true                   # master switch (gray rollout)
  observe_interval: 900s          # observe-worker scan interval (15m; proto Duration 浠呮敮鎸佺鍗曚綅)
  error_cluster:
    window_days: 7                # error-cluster observation window
    min_count: 5                  # min occurrences in window to fire
  perf:
    latency_factor: 2.0           # p95 regression factor vs baseline
    token_factor: 1.5             # token usage anomaly factor
  eval:
    regression_threshold: 0.10    # eval score drop ratio to fire
  test_runs_dir: ""               # test-run JSON dir (external cron output); empty = test_failure signal inert
  patch:
    max_diff_lines: 500           # diff size cap in changed lines
    daily_auto_apply_quota: 5     # DEV: auto-apply ON (explicit quota; production default is 0)
    max_attempts: 3               # patch-verify retry cap
  sandbox:
    gate_timeouts:
      g1: 300s                    # build gate timeout (5m)
      g2: 600s                    # test gate timeout (10m)
      g3: 300s                    # lint gate timeout (5m)
    worktree_root: ".aranea-self-improve"  # sandbox worktree root (relative to repo root, gitignored)
    repo_root: "f:\\myproject\\aranea-agents" # platform repo root the sandbox/applier operates on (empty = process working directory)
  observe_window:
    duration: 86400s              # post-apply observing window length (24h)
    error_rate_factor: 1.5        # rollback when error_rate > before*factor
    p95_factor: 1.3               # rollback when p95 > before*factor
    max_concurrent_observing: 3   # observing-window concurrency cap
  watchdog_interval: 300s         # observing-window evaluator tick (5m)
  outcome_interval: 3600s         # outcome attribution tick (1h)
  drive_interval: 60s             # full-chain drive tick (1m)
  stale_timeout: 1800s            # mid-pipeline stale threshold before recover (30m)

