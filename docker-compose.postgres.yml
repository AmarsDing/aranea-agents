# Local Postgres 16 + pgvector — 仅离线/隔离调试用（默认不启动）。
#
# 2026-11-10 起 PostgreSQL 统一由工作区共享栈提供：
#   E:\teamwork\infra（127.0.0.1:5436，库 aranea / 角色 aranea_app，口令见 infra/.env）
# 本文件保留仅为「不依赖共享栈的自包含调试」，必须显式启用：
#   docker compose -f docker-compose.postgres.yml --profile standalone-db up -d
# 不得映射共享栈保留端口（5436），也不得作为默认部署路径。

services:
  postgres:
    profiles: ["standalone-db"]
    image: pgvector/pgvector:pg16
    container_name: aranea-pgvector
    environment:
      POSTGRES_USER: aranea
      POSTGRES_PASSWORD: aranea
      POSTGRES_DB: aranea
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aranea_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aranea -d aranea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aranea_pg_data:
