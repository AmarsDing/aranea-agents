syntax = "proto3";

package kratos.organization.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/organization/v1;organizationv1";
option java_multiple_files = true;
option java_package = "api.kratos.organization.v1";

// OrganizationNode represents a node in the organization hierarchy.
// Level values: "company" | "department" | "position".
message OrganizationNode {
  string id = 1;
  string org_key = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  bool enabled = 6;
  int32 sort_order = 7;
  string parent_id = 8;
  // Level: "company" | "department" | "position"
  string level = 9;
  string workspace_id = 10;
  string owner_user_id = 11;
  bool is_system = 12;
  string config_json = 13;
  string metadata_json = 14;
  string created_at = 15;
  string updated_at = 16;
  string deleted_at = 17;
  // Department-level fields
  string dept_lead_agent_id = 18;
  string dept_lead_config_json = 19;
}

message ListOrganizationResponse {
  repeated OrganizationNode items = 1;
}

message ListOrganizationTreeResponse {
  repeated OrganizationTreeNode items = 1;
}

message OrganizationTreeNode {
  OrganizationNode node = 1;
  repeated OrganizationTreeNode children = 2;
}

message CreateOrganizationRequest {
  string org_key = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string status = 4;
  optional bool enabled = 5;
  int32 sort_order = 6;
  string parent_id = 7;
  // Level: "company" | "department" | "position"
  string level = 8;
  string workspace_id = 9;
  string owner_user_id = 10;
  string config_json = 11;
  string metadata_json = 12;
  // Department-level fields
  string dept_lead_agent_id = 13;
  string dept_lead_config_json = 14;
}

message GetOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  OrganizationNode node = 2;
}

message DeleteOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReorderOrganizationRequest {
  repeated string ids = 1;
}

message ReorderOrganizationResponse {}

service OrganizationService {
  rpc ListOrganization(google.protobuf.Empty) returns (ListOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organization"};
  }
  rpc ListOrganizationTree(google.protobuf.Empty) returns (ListOrganizationTreeResponse) {
    option (google.api.http) = {get: "/v1/organization/tree"};
  }
  rpc CreateOrganization(CreateOrganizationRequest) returns (OrganizationNode) {
    option (google.api.http) = {
      post: "/v1/organization"
      body: "*"
    };
  }
  rpc GetOrganization(GetOrganizationRequest) returns (OrganizationNode) {
    option (google.api.http) = {get: "/v1/organization/{id}"};
  }
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (OrganizationNode) {
    option (google.api.http) = {
      patch: "/v1/organization/{id}"
      body: "node"
    };
  }
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/organization/{id}"};
  }
  rpc ReorderOrganization(ReorderOrganizationRequest) returns (ReorderOrganizationResponse) {
    option (google.api.http) = {
      put: "/v1/organization/reorder"
      body: "*"
    };
  }
}
