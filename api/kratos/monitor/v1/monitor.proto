syntax = "proto3";

package kratos.monitor.v1;

import "google/api/annotations.proto";

option go_package = "aranea-agents/api/kratos/monitor/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.monitor.v1";

message AuditLog {
  string id = 1;
  string action = 2;
  string resource = 3;
  string resource_id = 4;
  string request_id = 5;
  string detail = 6;
  string created_at = 7;
  string actor = 8;
  string ip = 9;
  string user_agent = 10;
  string severity = 11;
  string metadata_json = 12;
}

message ListAuditLogsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string action = 3;
  string resource = 4;
  string actor = 5;
  string keyword = 6;
  // Hide system-generated noise (sync.* actions); ignored when action is set.
  bool exclude_system = 7;
}

message ListAuditLogsResponse {
  repeated AuditLog items = 1;
  int32 total = 2;
}

message DeleteAuditLogsRequest {
  // Safety gate: must be "CONFIRM" to proceed with the clear-all delete.
  string confirm = 1;
}

message DeleteAuditLogsResponse {
  int32 deleted = 1;
}

// Mirrors legacy domain.PlatformResource JSON for monitor-events / monitor-traces rows.
message MonitorPlatformRow {
  string id = 1;
  string resource = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  bool enabled = 7;
  int32 sort_order = 8;
  string parent_id = 9;
  string level = 10;
  string agent_id = 11;
  string provider = 12;
  string model = 13;
  string config_json = 14;
  string metadata_json = 15;
  string created_at = 16;
  string updated_at = 17;
  string deleted_at = 18;
  // Resolved display names joined from agents/teams (traces only); empty when
  // the reference is dangling or the row is an event row.
  string agent_name = 19;
  string team_name = 20;
  // Correlation keys for trace rows (traces only); empty for event rows.
  // Exposed so the detail dialog can query flow-log history by session/run.
  string session_id = 21;
  string run_id = 22;
}

message ListMonitorEventsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string event_type = 3;
  string agent_id = 4;
  string status = 5;
  // Prefix match ANY (union with event_type); e.g. ["alert.","runner.completion"].
  repeated string event_types = 6;
  // Prefix exclusion applied after the include set; e.g. ["skill.filesystem."].
  repeated string exclude_event_types = 7;
  // Hide runner.completion rows already materialized as Runs (monitor_traces):
  // rows with usage_event_id, or whose trace_id matches a trace row. Keeps the
  // Events history deduplicated server-side so pagination total matches what
  // the table actually renders.
  bool hide_linked_completions = 8;
}

message ListMonitorEventsResponse {
  repeated MonitorPlatformRow items = 1;
  int32 total = 2;
}

message GetMonitorEventRequest {
  string id = 1;
}

message ListMonitorTracesRequest {
  int32 limit = 1;
  int32 offset = 2;
  string agent_id = 3;
  string provider = 4;
  string model = 5;
  // Run status: running/ok/error/timeout/interrupted/cancelled; empty = all.
  string status = 6;
  // Substring search over name/trace_key/agent_id/provider/model and the
  // resolved display names (agent/team display_name, session title).
  string keyword = 7;
  // Hide internal domains (system/skill cron & sync noise); name column carries the run domain.
  bool exclude_internal = 8;
  // Exact run domain filter (chat/team/graph/system/skill); wins over
  // exclude_internal so internal domains stay reachable. Empty = no filter.
  string domain = 9;
}

message ListMonitorTracesResponse {
  repeated MonitorPlatformRow items = 1;
  int32 total = 2;
  // Rows per status under current filters (status condition excluded) — filter chips.
  map<string, int32> status_counts = 3;
  // Rows per run domain under current filters (domain condition and
  // exclude_internal excluded) so chips reveal hidden internal rows.
  map<string, int32> domain_counts = 4;
}

message MonitorTraceDetail {
  MonitorPlatformRow trace = 1;
  string config_json = 2;
  string metadata_json = 3;
  string spans_json = 4;
}

message GetMonitorTraceRequest {
  string id = 1;
}

message MonitorLogLine {
  string id = 1;
  string time = 2;
  string level = 3;
  string message = 4;
  string source = 5;
  string created_at = 6;
}

message GetMonitorLogsResponse {
  repeated MonitorLogLine items = 1;
  // Mirrors server.monitor.process_log_enabled (Gateway process log / EnvelopeTypeLog).
  bool enabled = 2;
  string message = 3;
}

message GetMonitorLogsRequest {}

message FlowLogEntry {
  string id = 1;
  string trace_id = 2;
  string session_id = 3;
  string run_id = 4;
  string team_id = 5;
  string domain = 6;
  string agent_key = 7;
  string step_id = 8;
  string flow_phase = 9;
  string severity = 10;
  string title = 11;
  string message = 12;
  string payload_json = 13;
  string created_at = 14;
}

message ListFlowLogsRequest {
  string trace_id = 1;
  string session_id = 2;
  string run_id = 3;
  string severity = 4;
  string domain = 5;
  int32 limit = 6;
  int32 offset = 7;
  // RFC3339 bounds (optional).
  string since = 8;
  string until = 9;
}

message ListFlowLogsResponse {
  repeated FlowLogEntry items = 1;
  int32 total = 2;
}

message MonitorAlertRule {
  string id = 1;
  string name = 2;
  string metric_key = 3;
  double threshold = 4;
  int32 window_minutes = 5;
  bool enabled = 6;
  string severity = 7;
  string notify_webhook_url = 8;
  string notify_channel_id = 9;
  int32 cooldown_minutes = 10;
}

message ListMonitorAlertRulesResponse {
  repeated MonitorAlertRule items = 1;
}

// AlertMetricInfo is one entry of the alert metric directory: human-readable
// metadata for a metric that alert rules can target, plus its current value.
message AlertMetricInfo {
  string key = 1;                    // technical key, e.g. "runner.error_rate"
  string name = 2;                   // short English display name (frontend localizes known keys)
  string description = 3;            // what the metric measures and when it fires
  string unit = 4;                   // "ratio" (0..1) or "count"
  int32 default_window_minutes = 5;  // recommended evaluation window
  double suggested_threshold = 6;    // recommended threshold; rule fires when value >= threshold
  double current_value = 7;          // value evaluated at request time over the default window
  string evaluated_at = 8;           // RFC3339 timestamp of the evaluation
}

message ListAlertMetricsResponse {
  repeated AlertMetricInfo items = 1;
}

message PutMonitorAlertRulesRequest {
  repeated MonitorAlertRule items = 1;
}

message PutMonitorAlertRulesResponse {
  repeated MonitorAlertRule items = 1;
}

message GetRunnerMetricsRequest {
  int32 window_minutes = 1;
}

message RunnerMetricsSummary {
  int32 window_minutes = 1;
  int32 total_runs = 2;
  int32 error_runs = 3;
  double error_rate = 4;
  double success_rate = 5;
  double avg_duration_ms = 6;
  double p50_duration_ms = 7;
  double p95_duration_ms = 8;
  double p99_duration_ms = 9;
}

message CodeExecutorCapability {
  string type = 1;
  bool available = 2;
  string reason = 3;
}

message GetCodeExecutorCapabilitiesResponse {
  repeated CodeExecutorCapability backends = 1;
}

message GenerateDiagnosticBundleRequest {
  string trigger_type = 1;
  string trace_id = 2;
  string session_id = 3;
  string run_id = 4;
  string step_id = 5;
  int32  context_minutes = 6;
}

message GenerateDiagnosticBundleResponse {
  string bundle_id = 1;
  string manifest_json = 2;
  int32  total_entries = 3;
  string flow_jsonl = 4;
  string trace_json = 5;
  string usage_json = 6;
  string alerts_jsonl = 7;
}

message DiagnoseAndHealRequest {
  string trigger_type = 1;
  string trace_id = 2;
  string session_id = 3;
  string run_id = 4;
  string step_id = 5;
  int32  context_minutes = 6;
}

message AutoHealedCondition {
  bool auto_healed = 1;
  string heal_strategy = 2;
}

message HealAttemptsCondition {
  int32 attempts = 1;
  int32 max_attempts = 2;
  string last_strategy = 3;
}

message SelfCheckStatusCondition {
  string check_name = 1;
  string status = 2; // "passed" | "warning" | "failed"
  string message = 3;
}

message RootCauseCondition {
  oneof condition {
    AutoHealedCondition auto_healed = 10;
    HealAttemptsCondition heal_attempts = 11;
    SelfCheckStatusCondition self_check_status = 12;
  }
}

message DiagnoseAndHealResponse {
  string heal_id = 1;
  string rule_id = 2;
  string status = 3;
  string reason = 4;
  double confidence = 5;
  string fix_action_type = 6;
  int32  fix_action_max_attempts = 7;
  string fix_action_params_json = 8;
  string created_at = 9;
  RootCauseCondition root_cause_condition = 10;
  bool runtime_auto_healed = 11;
  int32 runtime_heal_attempts = 12;
}

// Self-check messages.

message SelfCheckResultEntry {
  string check_id = 1;
  string checker = 2;
  string status = 3; // "passed" | "warning" | "failed"
  string message = 4;
  string details_json = 5;
  string checked_at = 6;
}

message RepairActionEntry {
  bool success = 1;
  string action = 2;
  string message = 3;
}

message SelfCheckReportEntry {
  string id = 1;
  repeated SelfCheckResultEntry check_results = 2;
  string overall_status = 3;
  repeated RepairActionEntry repair_actions = 4;
  string started_at = 5;
  string finished_at = 6;
  int64  duration_ms = 7;
}

message TriggerSelfCheckRequest {}

message TriggerSelfCheckResponse {
  SelfCheckReportEntry report = 1;
}

message ListSelfCheckReportsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListSelfCheckReportsResponse {
  repeated SelfCheckReportEntry items = 1;
  int32 total = 2;
}

// Heal stats and records messages.

message HealStatsRequest {}

message HealStatsResponse {
  int32 total_heals = 1;
  double success_rate = 2;
  repeated RuleFailCount top_fail_rules = 3;
}

message RuleFailCount {
  string rule_id = 1;
  int32 count = 2;
}

message ListHealRecordsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string rule_id = 3;
  string status = 4;
  string session_id = 5;
}

message HealRecordEntry {
  string id = 1;
  string rule_id = 2;
  string trigger_type = 3;
  string trace_id = 4;
  string session_id = 5;
  string step_id = 6;
  string fix_action_type = 7;
  double confidence = 8;
  string status = 9;
  bool runtime_auto_healed = 10;
  int32 runtime_heal_attempts = 11;
  string reason = 12;
  string created_at = 13;
}

message ListHealRecordsResponse {
  repeated HealRecordEntry items = 1;
  int32 total = 2;
}

service MonitorService {
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (google.api.http) = {get: "/v1/monitor/audit"};
  }
  rpc DeleteAuditLogs(DeleteAuditLogsRequest) returns (DeleteAuditLogsResponse) {
    option (google.api.http) = {delete: "/v1/monitor/audit-logs"};
  }
  rpc ListMonitorEvents(ListMonitorEventsRequest) returns (ListMonitorEventsResponse) {
    option (google.api.http) = {get: "/v1/monitor/events"};
  }
  rpc GetMonitorEvent(GetMonitorEventRequest) returns (MonitorPlatformRow) {
    option (google.api.http) = {get: "/v1/monitor/events/{id}"};
  }
  rpc ListMonitorTraces(ListMonitorTracesRequest) returns (ListMonitorTracesResponse) {
    option (google.api.http) = {get: "/v1/monitor/traces"};
  }
  rpc GetMonitorTrace(GetMonitorTraceRequest) returns (MonitorTraceDetail) {
    option (google.api.http) = {get: "/v1/monitor/traces/{id}"};
  }
  // Snapshot hint only; live lines use WebSocket GET /v1/ws (session_id=* or session-scoped, channel=monitor, type=log).
  rpc GetMonitorLogs(GetMonitorLogsRequest) returns (GetMonitorLogsResponse) {
    option (google.api.http) = {get: "/v1/monitor/logs"};
  }
  rpc ListFlowLogs(ListFlowLogsRequest) returns (ListFlowLogsResponse) {
    option (google.api.http) = {get: "/v1/monitor/flow-logs"};
  }
  rpc ListMonitorAlertRules(GetMonitorLogsRequest) returns (ListMonitorAlertRulesResponse) {
    option (google.api.http) = {get: "/v1/monitor/alert-rules"};
  }
  // Alert metric directory: which metrics rules can target, what they mean,
  // and their current values.
  rpc ListAlertMetrics(GetMonitorLogsRequest) returns (ListAlertMetricsResponse) {
    option (google.api.http) = {get: "/v1/monitor/alert-metrics"};
  }
  rpc PutMonitorAlertRules(PutMonitorAlertRulesRequest) returns (PutMonitorAlertRulesResponse) {
    option (google.api.http) = {
      put: "/v1/monitor/alert-rules"
      body: "*"
    };
  }
  rpc GetRunnerMetrics(GetRunnerMetricsRequest) returns (RunnerMetricsSummary) {
    option (google.api.http) = {get: "/v1/monitor/runner-metrics"};
  }
  rpc GetCodeExecutorCapabilities(GetMonitorLogsRequest) returns (GetCodeExecutorCapabilitiesResponse) {
    option (google.api.http) = {get: "/v1/monitor/code-executor-capabilities"};
  }
  rpc GenerateDiagnosticBundle(GenerateDiagnosticBundleRequest) returns (GenerateDiagnosticBundleResponse) {
    option (google.api.http) = {
      post: "/v1/monitor/diagnostic-bundle"
      body: "*"
    };
  }
  rpc DiagnoseAndHeal(DiagnoseAndHealRequest) returns (DiagnoseAndHealResponse) {
    option (google.api.http) = {
      post: "/v1/monitor/diagnose-and-heal"
      body: "*"
    };
  }
  rpc TriggerSelfCheck(TriggerSelfCheckRequest) returns (TriggerSelfCheckResponse) {
    option (google.api.http) = {
      post: "/v1/monitor/self-check"
      body: "*"
    };
  }
  rpc ListSelfCheckReports(ListSelfCheckReportsRequest) returns (ListSelfCheckReportsResponse) {
    option (google.api.http) = {get: "/v1/monitor/self-check-reports"};
  }
  rpc GetHealStats(HealStatsRequest) returns (HealStatsResponse) {
    option (google.api.http) = {get: "/v1/monitor/heal-stats"};
  }
  rpc ListHealRecords(ListHealRecordsRequest) returns (ListHealRecordsResponse) {
    option (google.api.http) = {get: "/v1/monitor/heal-records"};
  }
}
