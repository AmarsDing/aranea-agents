syntax = "proto3";

package kratos.monitor.v1;

import "google/api/annotations.proto";

option go_package = "aranea-agents/api/kratos/monitor/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.monitor.v1";

message AuditLog {
  string id = 1;
  string action = 2;
  string resource = 3;
  string resource_id = 4;
  string request_id = 5;
  string detail = 6;
  string created_at = 7;
  string actor = 8;
  string ip = 9;
  string user_agent = 10;
  string severity = 11;
  string metadata_json = 12;
}

message ListAuditLogsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string action = 3;
  string resource = 4;
  string actor = 5;
  string keyword = 6;
}

message ListAuditLogsResponse {
  repeated AuditLog items = 1;
  int32 total = 2;
}

// Mirrors legacy domain.PlatformResource JSON for monitor-events / monitor-traces rows.
message MonitorPlatformRow {
  string id = 1;
  string resource = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  bool enabled = 7;
  int32 sort_order = 8;
  string parent_id = 9;
  string level = 10;
  string agent_id = 11;
  string provider = 12;
  string model = 13;
  string config_json = 14;
  string metadata_json = 15;
  string created_at = 16;
  string updated_at = 17;
  string deleted_at = 18;
}

message ListMonitorEventsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string event_type = 3;
  string agent_id = 4;
  string status = 5;
}

message ListMonitorEventsResponse {
  repeated MonitorPlatformRow items = 1;
  int32 total = 2;
}

message GetMonitorEventRequest {
  string id = 1;
}

message ListMonitorTracesRequest {
  int32 limit = 1;
  int32 offset = 2;
  string agent_id = 3;
  string provider = 4;
  string model = 5;
  string status = 6;
}

message ListMonitorTracesResponse {
  repeated MonitorPlatformRow items = 1;
  int32 total = 2;
}

message MonitorTraceDetail {
  MonitorPlatformRow trace = 1;
  string config_json = 2;
  string metadata_json = 3;
  string spans_json = 4;
}

message GetMonitorTraceRequest {
  string id = 1;
}

message MonitorLogLine {
  string id = 1;
  string time = 2;
  string level = 3;
  string message = 4;
  string source = 5;
  string created_at = 6;
}

message GetMonitorLogsResponse {
  repeated MonitorLogLine items = 1;
  bool enabled = 2;
  string message = 3;
}

message GetMonitorLogsRequest {}

message MonitorAlertRule {
  string id = 1;
  string name = 2;
  string metric_key = 3;
  double threshold = 4;
  int32 window_minutes = 5;
  bool enabled = 6;
  string severity = 7;
  string notify_webhook_url = 8;
  string notify_channel_id = 9;
  int32 cooldown_minutes = 10;
}

message ListMonitorAlertRulesResponse {
  repeated MonitorAlertRule items = 1;
}

message PutMonitorAlertRulesRequest {
  repeated MonitorAlertRule items = 1;
}

message PutMonitorAlertRulesResponse {
  repeated MonitorAlertRule items = 1;
}

message GetRunnerMetricsRequest {
  int32 window_minutes = 1;
}

message RunnerMetricsSummary {
  int32 window_minutes = 1;
  int32 total_runs = 2;
  int32 error_runs = 3;
  double error_rate = 4;
  double success_rate = 5;
}

service MonitorService {
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (google.api.http) = {get: "/v1/monitor/audit"};
  }
  rpc ListMonitorEvents(ListMonitorEventsRequest) returns (ListMonitorEventsResponse) {
    option (google.api.http) = {get: "/v1/monitor/events"};
  }
  rpc GetMonitorEvent(GetMonitorEventRequest) returns (MonitorPlatformRow) {
    option (google.api.http) = {get: "/v1/monitor/events/{id}"};
  }
  rpc ListMonitorTraces(ListMonitorTracesRequest) returns (ListMonitorTracesResponse) {
    option (google.api.http) = {get: "/v1/monitor/traces"};
  }
  rpc GetMonitorTrace(GetMonitorTraceRequest) returns (MonitorTraceDetail) {
    option (google.api.http) = {get: "/v1/monitor/traces/{id}"};
  }
  // Snapshot hint only; live lines use WebSocket GET /v1/ws (session_id=* or session-scoped, channel=monitor, type=log).
  rpc GetMonitorLogs(GetMonitorLogsRequest) returns (GetMonitorLogsResponse) {
    option (google.api.http) = {get: "/v1/monitor/logs"};
  }
  rpc ListMonitorAlertRules(GetMonitorLogsRequest) returns (ListMonitorAlertRulesResponse) {
    option (google.api.http) = {get: "/v1/monitor/alert-rules"};
  }
  rpc PutMonitorAlertRules(PutMonitorAlertRulesRequest) returns (PutMonitorAlertRulesResponse) {
    option (google.api.http) = {
      put: "/v1/monitor/alert-rules"
      body: "*"
    };
  }
  rpc GetRunnerMetrics(GetRunnerMetricsRequest) returns (RunnerMetricsSummary) {
    option (google.api.http) = {get: "/v1/monitor/runner-metrics"};
  }
}
