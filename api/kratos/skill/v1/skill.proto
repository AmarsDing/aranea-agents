syntax = "proto3";

package kratos.skill.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/skill/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.skill.v1";

message SkillTag {
  string name = 1;
  string source = 2;
}

// SkillTagInfo 是字典标签 + 实时使用计数。
message SkillTagInfo {
  string name = 1;
  // `:` 前缀维度（file_type/domain），无维度为空串。
  string dimension = 2;
  // system | user | orphan（orphan = 使用中但未收录进字典）。
  string source = 3;
  int32 used_count = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListSkillTagsResponse {
  repeated SkillTagInfo items = 1;
}

message CreateSkillTagRequest {
  string name = 1;
}

message RenameSkillTagRequest {
  string old_name = 1;
  string new_name = 2;
}

message RenameSkillTagResponse {
  // 重写引用该标签的 skill 条数。
  int32 rewritten = 1;
}

message DeleteSkillTagRequest {
  string name = 1;
}

message DeleteSkillTagResponse {
  int32 rewritten = 1;
}

message SkillVersionSummary {
  string id = 1;
  string version = 2;
  string validation_status = 3;
  string published_at = 4;
}

message SkillPermissions {
  bool can_edit = 1;
  bool can_delete = 2;
  bool can_toggle_enabled = 3;
  bool can_duplicate = 4;
}

message Skill {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  repeated SkillTag tags = 5;
  string extends_skill_id = 6;
  string status = 7;
  bool enabled = 8;
  SkillVersionSummary current_version = 9;
  int32 invoke_count = 10;
  int32 success_count = 11;
  int32 failure_count = 12;
  int32 usage_count_7d = 13;
  double avg_duration_ms = 14;
  string last_agent_id = 15;
  string last_agent_display_name = 16;
  string last_invoked_at = 17;
  int32 last_duration_ms = 18;
  string created_at = 19;
  string updated_at = 20;
  SkillPermissions permissions = 21;
  bool filesystem_missing = 22;
  // filesystem | import | manual
  string sync_origin = 23;
  // system | workspace | agent | private | public
  string visibility = 24;
  string default_config_json = 25;
}

message SkillFilesystemHealth {
  bool root_accessible = 1;
  string resolved_root = 2;
  int32 missing_count = 3;
  int32 pending_filesystem_count = 4;
}

message ListSkillsRequest {
  string search = 1;
  string tags = 2;
  string enabled = 3;
  string status = 4;
  int32 page = 5;
  int32 page_size = 6;
  string filesystem_missing = 7;
  string sync_origin = 8;
  // 排序字段：tag（按首个标签名）| name（按名称）；空 = 默认按更新时间倒序。
  string sort_by = 9;
  // 排序方向：asc | desc；空 = asc。
  string sort_order = 10;
}

message ListSkillsResponse {
  repeated Skill items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ToggleSkillEnabledRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 2;
}

message DuplicateSkillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSkillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListSkillFilesRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SkillFile {
  string path = 1;
  string name = 2;
  string language = 3;
  int64 size = 4;
  string updated_at = 5;
}

message ListSkillFilesResponse {
  repeated SkillFile items = 1;
}

message GetSkillFileRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string path = 2 [(google.api.field_behavior) = REQUIRED];
}

message SkillFileContent {
  string path = 1;
  string content = 2;
  string language = 3;
}

message UpdateSkillFileRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string path = 2 [(google.api.field_behavior) = REQUIRED];
  string content = 3 [(google.api.field_behavior) = REQUIRED];
}

message SkillInvocationPermissions {
  bool can_view_detail = 1;
}

message SkillInvocation {
  string id = 1;
  string skill_id = 2;
  string skill_name = 3;
  string skill_version = 4;
  string agent_id = 5;
  string agent_display_name = 6;
  string user_id = 7;
  string session_id = 8;
  string status = 9;
  int32 duration_ms = 10;
  string started_at = 11;
  string ended_at = 12;
  string input_preview = 13;
  string input_hash = 14;
  string output_preview = 15;
  string error_code = 16;
  string error_message = 17;
  SkillInvocationPermissions permissions = 18;
  string source = 19;
  string activation_id = 20;
  string message_id = 21;
}

message ListSkillRunsRequest {
  string skill_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string status = 4;
  string from = 5;
  string to = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListSkillRunsResponse {
  repeated SkillInvocation items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetSkillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetSkillResponse {
  Skill skill = 1;
  string body_markdown = 2;
}

message CreateSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string slug = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3 [(google.api.field_behavior) = REQUIRED];
  string body_markdown = 4 [(google.api.field_behavior) = REQUIRED];
  repeated SkillTag tags = 5;
}

message UpdateSkillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string name = 2;
  optional string description = 3;
  bool replace_tags = 4;
  repeated SkillTag tags = 5;
  optional string body_markdown = 6;
}

message PublishSkillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSkillFileRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string path = 2 [(google.api.field_behavior) = REQUIRED];
}

message PreviewSkillRuntimeRequest {
  // Optional: preview for a specific agent (applies Layer A/B policy).
  string agent_id = 1;
  // Optional: simulate a user query for intent routing (Layer B).
  string user_query = 2;
}

message PreviewSkillRuntimeResponse {
  string resolved_storage_root = 1;
  int32 enabled_published_count = 2;
  repeated string enabled_skill_slugs = 3;
  // Per-slug reason: why each skill was included or excluded.
  map<string, string> reasons = 4;
}

// Skill import (ZIP batch). JSON field names match web/src/features/skills/types.ts (snake_case).
message SkillImportIssue {
  string type = 1;
  string message = 2;
}

message SkillImportCandidate {
  string candidate_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string body_preview = 5;
  string target_dir = 6;
  string validation_status = 7;
  string status_icon = 8;
  repeated SkillImportIssue warnings = 9;
  repeated SkillImportIssue blocks = 10;
}

message SkillSimilarityMetrics {
  double similarity_score = 1;
  double name_similarity = 2;
  double description_similarity = 3;
  double body_similarity = 4;
  double trigger_similarity = 5;
  double tool_similarity = 6;
  string conflict_risk = 7;
  string recommendation = 8;
  double confidence = 9;
}

message SkillSimilaritySource {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string version = 5;
  string body_preview = 6;
}

message SkillConflictGroup {
  string group_id = 1;
  double highest_similarity_score = 2;
  SkillSimilarityMetrics metrics = 3;
  string reason = 4;
  repeated string evidence = 5;
  repeated string candidate_ids = 6;
  repeated SkillSimilaritySource existing_skills = 7;
  bool can_refine = 8;
}

message SkillImportJob {
  string job_id = 1;
  string status = 2;
  string validation_status = 3;
  string storage_root = 4;
  repeated SkillImportCandidate candidates = 5;
  repeated SkillConflictGroup conflict_groups = 6;
  string message = 7;
}

message ImportSkillZipResponse {
  string job_id = 1;
}

message GetSkillImportJobRequest {
  string job_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SkillImportDecision {
  string candidate_id = 1;
  string group_id = 2;
  string action = 3 [(google.api.field_behavior) = REQUIRED];
  string merged_name = 4;
  string merged_description = 5;
  string merged_body = 6;
  repeated SkillTag merged_tags = 7;
  // merge_group_with_ai: archive the conflict group's existing skills after
  // a successful merge apply (status=archived, enabled=false).
  bool retire_sources = 8;
}

message ApplySkillImportRequest {
  string job_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated SkillImportDecision decisions = 2;
}

message SkillImportApplyResult {
  repeated string created_skill_ids = 1;
  repeated string skipped_candidate_ids = 2;
  string message = 3;
}

message RefineSkillImportConflictRequest {
  string job_id = 1 [(google.api.field_behavior) = REQUIRED];
  string group_id = 2 [(google.api.field_behavior) = REQUIRED];
  string provider = 3;
  string model = 4;
  string instructions = 5;
}

message SkillRefineResult {
  string merged_name = 1;
  string merged_description = 2;
  string merged_body = 3;
  repeated SkillTag merged_tags = 4;
  repeated string source_candidate_ids = 5;
  repeated string source_existing_skill_ids = 6;
}

message SkillVersionDetail {
  string id = 1;
  string skill_id = 2;
  string version = 3;
  string status = 4;
  string content_markdown = 5;
  string validation_status = 6;
  string published_at = 7;
  string created_at = 8;
  string file_manifest_json = 9;
}

message GetSkillVersionsRequest {
  string skill_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message GetSkillVersionsResponse {
  repeated SkillVersionDetail items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message RollbackSkillVersionRequest {
  string skill_id = 1 [(google.api.field_behavior) = REQUIRED];
  string version_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Skill Intelligence messages (P0 observability)

message GetSkillHealthRequest {
  string skill_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SkillHealthMetric {
  string skill_id = 1;
  int32 total_invocations_7d = 2;
  int32 success_count_7d = 3;
  double success_rate_7d = 4;
  int32 p95_duration_ms_7d = 5;
  int32 total_invocations_30d = 6;
  int32 success_count_30d = 7;
  double success_rate_30d = 8;
  int32 p95_duration_ms_30d = 9;
  repeated SkillHealthDailyMetric daily_metrics = 10;
  double route_hit_rate_7d = 11;
  double route_hit_rate_30d = 12;
}

message SkillHealthDailyMetric {
  string date = 1;
  int32 invocations = 2;
  int32 successes = 3;
  double avg_duration_ms = 4;
  int32 routed_count = 5;
  int32 loaded_count = 6;
}

service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {get: "/v1/skills"};
  }
  rpc GetSkillFilesystemHealth(google.protobuf.Empty) returns (SkillFilesystemHealth) {
    option (google.api.http) = {get: "/v1/skills/filesystem-health"};
  }
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse) {
    option (google.api.http) = {get: "/v1/skills/{id}"};
  }
  rpc CreateSkill(CreateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/v1/skills"
      body: "*"
    };
  }
  rpc UpdateSkill(UpdateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      patch: "/v1/skills/{id}"
      body: "*"
    };
  }
  rpc PublishSkill(PublishSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/v1/skills/{id}/publish"
      body: "*"
    };
  }
  rpc PreviewSkillRuntime(PreviewSkillRuntimeRequest) returns (PreviewSkillRuntimeResponse) {
    option (google.api.http) = {get: "/v1/skill-runtime-preview"};
  }
  rpc ToggleSkillEnabled(ToggleSkillEnabledRequest) returns (Skill) {
    option (google.api.http) = {
      patch: "/v1/skills/{id}/enabled"
      body: "*"
    };
  }
  rpc DuplicateSkill(DuplicateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/v1/skills/{id}/duplicate"
      body: "*"
    };
  }
  rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/skills/{id}"};
  }
  rpc ListSkillFiles(ListSkillFilesRequest) returns (ListSkillFilesResponse) {
    option (google.api.http) = {get: "/v1/skills/{id}/files"};
  }
  rpc GetSkillFile(GetSkillFileRequest) returns (SkillFileContent) {
    option (google.api.http) = {get: "/v1/skills/{id}/file"};
  }
  rpc UpdateSkillFile(UpdateSkillFileRequest) returns (SkillFileContent) {
    option (google.api.http) = {
      put: "/v1/skills/{id}/file"
      body: "*"
    };
  }
  rpc DeleteSkillFile(DeleteSkillFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/skills/{id}/files:delete"
      body: "*"
    };
  }
  rpc ListSkillRuns(ListSkillRunsRequest) returns (ListSkillRunsResponse) {
    option (google.api.http) = {get: "/v1/skill-runs"};
  }
  // ImportSkillZip accepts a ZIP file via multipart/form-data at POST /v1/skills/import.
  // The actual handler is registered by RegisterSkillImportMultipart (not proto codegen)
  // because proto cannot express multipart uploads. This RPC declaration exists solely
  // to include the endpoint in the generated OpenAPI spec.
  rpc ImportSkillZip(google.protobuf.Empty) returns (ImportSkillZipResponse) {
    option (google.api.http) = {
      post: "/v1/skills/import"
      body: "*"
    };
  }
  rpc GetSkillImportJob(GetSkillImportJobRequest) returns (SkillImportJob) {
    option (google.api.http) = {get: "/v1/skills/import/{job_id}"};
  }
  rpc ApplySkillImport(ApplySkillImportRequest) returns (SkillImportApplyResult) {
    option (google.api.http) = {
      post: "/v1/skills/import/{job_id}/apply"
      body: "*"
    };
  }
  rpc RefineSkillImportConflict(RefineSkillImportConflictRequest) returns (SkillRefineResult) {
    option (google.api.http) = {
      post: "/v1/skills/import/{job_id}/conflict-groups/{group_id}/refine"
      body: "*"
    };
  }
  rpc GetSkillVersions(GetSkillVersionsRequest) returns (GetSkillVersionsResponse) {
    option (google.api.http) = {get: "/v1/skills/{skill_id}/versions"};
  }
  rpc RollbackSkillVersion(RollbackSkillVersionRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/v1/skills/{skill_id}/versions/{version_id}/rollback"
      body: "*"
    };
  }
  rpc GetSkillHealth(GetSkillHealthRequest) returns (SkillHealthMetric) {
    option (google.api.http) = {get: "/v1/skills/{skill_id}/health"};
  }
  // 标签字典：治理 + 预建 + 实时使用计数。
  // 路由用独立前缀 /v1/skill-tags，避免被 /v1/skills/{id} 吞掉。
  rpc ListSkillTags(google.protobuf.Empty) returns (ListSkillTagsResponse) {
    option (google.api.http) = {get: "/v1/skill-tags"};
  }
  rpc CreateSkillTag(CreateSkillTagRequest) returns (SkillTagInfo) {
    option (google.api.http) = {
      post: "/v1/skill-tags"
      body: "*"
    };
  }
  rpc RenameSkillTag(RenameSkillTagRequest) returns (RenameSkillTagResponse) {
    option (google.api.http) = {
      post: "/v1/skill-tags:rename"
      body: "*"
    };
  }
  rpc DeleteSkillTag(DeleteSkillTagRequest) returns (DeleteSkillTagResponse) {
    option (google.api.http) = {delete: "/v1/skill-tags/{name}"};
  }
}
