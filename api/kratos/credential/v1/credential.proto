syntax = "proto3";

package kratos.credential.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "aranea/auth/v1/requirement.proto";

option go_package = "aranea-agents/api/kratos/credential/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.credential.v1";

// ============================================================================
// CredentialService —— 凭据托管（E 阶段新模块，需求文档 §3，拍板 V-1/V-2/V-3）
//
// 硬规则（需求概要 §4.5）：
//   - 明文三不进：不进日志、不进 prompt、不进任何 API 响应（本 proto 无任何
//     返回 secret 的 RPC，Get 只回元数据；与 llm_provider_model 的 Reveal 不同，
//     本域连 secops 回显都不开）。
//   - agent 侧仅两个动词（credential.login_execute / credential.token_issue），
//     以工具形态挂 approval-policy（高敏站点默认拒绝，清单配置化）；执行面不
//     走本服务 RPC。
//   - 全量审计：管理面写路径与每次执行落 credential_executions + 审计表。
// 加密：服务端信封加密（AES-GCM，复用 biz/credential_crypto 设施，主密钥
// ARANEA_CREDENTIAL_KEY / system settings）；「零知识」= 人与 agent 对明文
// 零可知（V-1 拍板口径）。
// ============================================================================

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_PASSWORD = 1; // 用户名+密码
  SECRET_KIND_TOKEN = 2;    // 令牌 / API key（如 GitHub PAT）
  SECRET_KIND_COOKIE = 3;   // 会话 cookie
}

enum Sensitivity {
  SENSITIVITY_UNSPECIFIED = 0;
  SENSITIVITY_NORMAL = 1; // 普通站点：策略引擎按 approval-policy 裁决
  SENSITIVITY_HIGH = 2;   // 高敏站点：默认拒绝执行（never），清单配置化
}

// Credential 凭据元数据（永不含 secret 明文）。
message Credential {
  string id = 1;
  string workspace_id = 2;
  string name = 3;   // 展示名，如「GitHub 主账号」
  string site = 4;   // 目的站点标识（策略裁决键），如 "github.com"
  string url = 5;    // 登录/使用入口 URL
  string username = 6;
  SecretKind secret_kind = 7;
  Sensitivity sensitivity = 8;
  string note = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListCredentialsRequest {
  int32 page = 1;      // 1-based
  int32 page_size = 2; // <=0 默认 50，>200 截 200
  string site = 3;     // 可选过滤
}

message ListCredentialsResponse {
  repeated Credential items = 1;
  int64 total = 2;
}

message CreateCredentialRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string site = 2 [(google.api.field_behavior) = REQUIRED];
  string url = 3;
  string username = 4;
  SecretKind secret_kind = 5 [(google.api.field_behavior) = REQUIRED];
  Sensitivity sensitivity = 6;
  string note = 7;
  string secret = 8 [(google.api.field_behavior) = REQUIRED]; // 写后即弃，仅本次传输
}

message GetCredentialRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// UpdateCredentialRequest 全字段 optional：nil = 不动该列（PATCH 语义，
// 允许把 url/username/note 显式置空）。
message UpdateCredentialRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string name = 2;
  optional string url = 3;
  optional string username = 4;
  optional Sensitivity sensitivity = 5;
  optional string note = 6;
  optional string secret = 7; // 非空 = 轮换 secret
}

message DeleteCredentialRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ImportBitwardenRequest Bitwarden vault 导出 JSON（v5 拍板导入兼容）。
message ImportBitwardenRequest {
  string vault_json = 1 [(google.api.field_behavior) = REQUIRED]; // 导入后调用方应立即丢弃源文件
}

message ImportBitwardenResponse {
  int32 imported_count = 1;
  int32 skipped_count = 2; // 无 login 段落/缺密码等跳过项
}

// CredentialExecution 执行审计明细（谁/哪个 agent/何站点/何动作/裁决；永不
// 含 secret 明文）。
message CredentialExecution {
  string id = 1;
  string credential_id = 2;
  string site = 3;
  string action = 4; // login_execute | token_issue
  string actor_type = 5; // user | agent | system
  string actor_key = 6;
  string agent_id = 7;
  string session_id = 8;
  string verdict = 9;  // allowed | denied_policy | denied_sensitivity | failed
  string reason = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListExecutionsRequest {
  string credential_id = 1; // 可选过滤
  string site = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListExecutionsResponse {
  repeated CredentialExecution items = 1;
  int64 total = 2;
}

service CredentialService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {get: "/v1/credentials"};
  }
  rpc CreateCredential(CreateCredentialRequest) returns (Credential) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {
      post: "/v1/credentials"
      body: "*"
    };
  }
  rpc GetCredential(GetCredentialRequest) returns (Credential) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {get: "/v1/credentials/{id}"};
  }
  rpc UpdateCredential(UpdateCredentialRequest) returns (Credential) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {
      patch: "/v1/credentials/{id}"
      body: "*"
    };
  }
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {delete: "/v1/credentials/{id}"};
  }
  rpc ImportBitwarden(ImportBitwardenRequest) returns (ImportBitwardenResponse) {
    option (aranea.auth.v1.requirement) = {permission: "credential.manage"};
    option (google.api.http) = {
      post: "/v1/credentials:importBitwarden"
      body: "*"
    };
  }
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse) {
    option (aranea.auth.v1.requirement) = {permission: "audit.read"};
    option (google.api.http) = {get: "/v1/credential-executions"};
  }
}
