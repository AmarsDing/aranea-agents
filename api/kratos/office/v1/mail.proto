syntax = "proto3";

package kratos.office.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "aranea/auth/v1/requirement.proto";

option go_package = "aranea-agents/api/kratos/office/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.office.v1";

// ============================================================================
// OfficeMailService —— 邮件（自 workbench imap.go/misc.go 平移 + E-1..E-5）
//
// 平移语义（验收用例随 verify-imap.ps1 九节平移）：
//   - IMAP tls/starttls/none 三模式；IDLE 推送 + 轮询兜底（E-5）；
//   - (account_id,uid) 部分唯一索引幂等去重；每封邮件一个事务（邮件+附件
//     同生共死，失败可重试）；
//   - 附件 BYTEA 入库，16MB 上限（对齐 IMAP 字面量上限，E-4）。
// 变更（拍板）：
//   - E-1 账号密码迁入即加密（password 写后即弃，存储 password_enc，复用
//     biz/credential_crypto 设施）；本服务无任何明文回显 RPC；
//   - 补齐现状缺口：账号更新/删除、邮件删除、.eml 导出；
//   - mailToTask 契约修正：workbench 前端未带 space_id 必 400，新版
//     workspace 由服务端从调用者上下文解析（统一任务中心落位后接线）；
//   - E-2 发信（SMTP）：邮件 P1 实现（09-邮件.md §4）——只有登录用户在页面上点
//     「发送」才发，智能体没有发信工具，AI 起草（P2）只产草稿；
//   - E-3 四象限分拣为 F2 项：quadrant 字段先占位。
// 邮件 P1 增量：添加邮箱向导（服务商识别 + 测试连接）、已读 / 星标 / 归档、
// 视图 + 关键字搜索、收件人 / 抄送、清洗后的 HTML 正文、草稿。
// ============================================================================

enum TlsMode {
  TLS_MODE_UNSPECIFIED = 0;
  TLS_MODE_TLS = 1;       // 993 直连 TLS
  TLS_MODE_STARTTLS = 2;  // 明文起跳后 STARTTLS 升级
  TLS_MODE_NONE = 3;      // 明文（仅测试/mock）
}

// MailAccount 邮箱账号（永不含密码）。
message MailAccount {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // 展示名
  string host = 4;
  int32 port = 5;
  TlsMode tls_mode = 6;
  string username = 7;
  int64 last_uid = 8;
  google.protobuf.Timestamp last_sync_at = 9; // 从未同步留空
  google.protobuf.Timestamp created_at = 10;
  string email = 11;      // 发件地址
  string provider = 12;   // 服务商预设键（qq / exmail / 163 …），手动填为空
  string smtp_host = 13;  // 空 = 没配发信
  int32 smtp_port = 14;
  TlsMode smtp_tls = 15;
  string status = 16;     // '' 未检查 | ok | auth_failed | unreachable
  string last_error = 17; // 错误类别：dns | unreachable | tls | auth | protocol
  google.protobuf.Timestamp sync_since = 18; // 首次同步从这天开始；空 = 全部
  string signature = 19; // 签名（纯文本），写信时自动带上
  bool save_sent = 20;   // 发出的信同时存一份到服务器的「已发送」（Gmail / Outlook 会自己存，不用开）
}

message CreateAccountRequest {
  string name = 1;
  string host = 2 [(google.api.field_behavior) = REQUIRED];
  int32 port = 3; // 0=按 tls_mode 默认（993/143）
  TlsMode tls_mode = 4 [(google.api.field_behavior) = REQUIRED];
  string username = 5 [(google.api.field_behavior) = REQUIRED];
  string password = 6 [(google.api.field_behavior) = REQUIRED]; // 写后即弃
  string email = 7;      // 空 = 用户名是邮箱时取用户名
  string provider = 8;   // 预设键；smtp_host 空时按它补 SMTP
  string smtp_host = 9;
  int32 smtp_port = 10;  // 0 = 按 smtp_tls 默认（465 / 587）
  TlsMode smtp_tls = 11;
  google.protobuf.Timestamp sync_since = 12; // 首次只同步这天之后的；空 = 全部
  string signature = 13;
  bool save_sent = 14;
}

message UpdateAccountRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  string host = 3;
  int32 port = 4;
  TlsMode tls_mode = 5;
  string username = 6;
  string password = 7; // 非空 = 轮换
  string email = 8;
  string provider = 9;
  string smtp_host = 10;
  int32 smtp_port = 11;
  TlsMode smtp_tls = 12;
  optional string signature = 13;
  optional bool save_sent = 14;
}

message GetAccountRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteAccountRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListAccountsResponse {
  repeated MailAccount items = 1;
}

message SyncAccountRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SyncAccountResponse {
  int32 imported_count = 1;
  int32 skipped_count = 2; // 幂等命中
}

message MailMessage {
  string id = 1;
  string account_id = 2; // .eml 导入为空串
  int64 uid = 3;
  string subject = 4;
  string sender = 5;
  string snippet = 6; // 列表用摘要（正文前 200 字符）
  string received_at = 7; // RFC3339（邮件头原样时间，多格式兼容解析后归一）
  string task_ref = 8;    // 转任务回链
  string quadrant = 9;    // F2 四象限：urgent-important 等，未分拣为空
  bool has_attachments = 10;
  google.protobuf.Timestamp created_at = 11;
  string to = 12;       // 收件人（解码后原文）
  string cc = 13;
  bool seen = 14;
  bool flagged = 15;
  bool archived = 16;
  string folder = 17;   // inbox | sent | drafts | junk（服务器垃圾邮件文件夹同步来的）
  bool trashed = 18;    // 在「已删除」里
  bool spam = 19;       // 垃圾邮件
  repeated string labels = 20; // 自己加的标签
  google.protobuf.Timestamp send_at = 21; // 定时发送的草稿：到点自动发出；空 = 普通草稿
}

message ListMessagesRequest {
  string account_id = 1; // 空 = 全部账号聚合
  string quadrant = 2;   // 旧口径，已不用
  int32 page = 3;
  int32 page_size = 4; // <=0 默认 50，>200 截 200
  // 视图：inbox（默认）| unread | flagged | task | attachments | sent | drafts | archived | spam | trash
  string view = 5;
  string keyword = 6; // 主题、发件人、收件人、抄送、正文、附件名
  string label = 7;   // 只看带这个标签的（view 照常生效）
}

message ListMessagesResponse {
  repeated MailMessage items = 1;
  int64 total = 2;
}

message GetMessageRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// MailMessageDetail 阅读窗全文。
message MailMessageDetail {
  MailMessage message = 1;
  string body = 2; // text/plain 优先（平移 parseMailRaw 语义）
  string body_html = 3; // 入库时清洗过；外链图片在 data-mail-src 上，前端点「显示图片」才换回 src
}

// MailboxSummary 左栏计数。
message MailboxSummary {
  int64 inbox_unread = 1;
  int64 flagged = 2;
  int64 task = 3;
  int64 attachments = 4;
  int64 sent = 5;
  int64 drafts = 6;
  int64 archived = 7;
  repeated MailAccountUnread accounts = 8;
  int64 spam_unread = 9; // 垃圾邮件里没读的
  int64 trash = 10;      // 已删除里的总数
  repeated MailLabelCount labels = 11; // 各标签的邮件数（不含已删除）
}

message MailLabelCount {
  string name = 1;
  int64 count = 2;
}

message MailAccountUnread {
  string account_id = 1;
  int64 unread = 2;
}

// MarkMessagesRequest 批量标记；不传 = 不改。已读 / 星标会尽力回写到邮箱服务器。
message MarkMessagesRequest {
  repeated string ids = 1 [(google.api.field_behavior) = REQUIRED];
  optional bool seen = 2;
  optional bool flagged = 3;
  optional bool archived = 4;
  optional bool trashed = 5; // true = 删到「已删除」，false = 恢复
  optional bool spam = 6;    // 标为 / 移出垃圾邮件（同时尽力在服务器上移到垃圾邮件 / 收件箱）
  string add_label = 7;      // 加标签（不能含逗号，最长 20 字）
  string remove_label = 8;   // 去标签
}

// MarkAllReadRequest 把一个视图（可限定账户）里的未读全部标为已读。
message MarkAllReadRequest {
  string view = 1;
  string account_id = 2;
}

message ListThreadRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SuggestContactsRequest {
  string q = 1;     // 名字或地址里的片段；空 = 最常联系的
  int32 limit = 2;  // <=0 默认 8，>20 截 20
}

message MailContact {
  string name = 1;
  string address = 2;
  int32 count = 3; // 来往次数
}

message SuggestContactsResponse {
  repeated MailContact items = 1;
}

message BlockSenderRequest {
  string address = 1 [(google.api.field_behavior) = REQUIRED];
}

message BlockSenderResponse {
  int64 marked = 1; // 顺手把这个发件人已有的信标成垃圾邮件的数量
}

message ListBlockedSendersResponse {
  repeated string addresses = 1;
}

message MarkMessagesResponse {
  int64 updated = 1;
}

// PurgeMessagesRequest 彻底删除：只认 trash / spam 两个视图。ids 空 = 清空整个视图。
message PurgeMessagesRequest {
  string view = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string ids = 2;
}

message PurgeMessagesResponse {
  int64 deleted = 1;
}

// MailProviderInfo 服务商预设（授权码怎么生成的说明在前端文案里，按 key 取）。
message MailProviderInfo {
  bool found = 1;
  string key = 2;
  string name = 3;
  string imap_host = 4;
  int32 imap_port = 5;
  TlsMode imap_tls = 6;
  string smtp_host = 7;
  int32 smtp_port = 8;
  TlsMode smtp_tls = 9;
  bool supported = 10;     // false = 要 OAuth（暂不支持）
  string detected_by = 11; // domain | mx
}

message DetectProviderRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListProvidersResponse {
  repeated MailProviderInfo items = 1;
}

// TestAccountRequest 测连接：给 id = 测已保存的账号（并记账号状态）；
// 不给 id = 测向导里还没保存的配置（口令只在这次调用里用）。
message TestAccountRequest {
  string id = 1;
  string host = 2;
  int32 port = 3;
  TlsMode tls_mode = 4;
  string username = 5;
  string password = 6;
  string smtp_host = 7;
  int32 smtp_port = 8;
  TlsMode smtp_tls = 9;
}

message TestAccountResponse {
  bool imap_ok = 1;
  string imap_error = 2; // dns | unreachable | tls | auth | protocol
  int32 inbox_count = 3;
  bool smtp_ok = 4;
  string smtp_error = 5;
  bool smtp_skipped = 6; // 没配发信服务器
}

message OutgoingAttachment {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}

message SaveDraftRequest {
  string draft_id = 1; // 空 = 新草稿；有 = 替换（旧草稿的附件会带过来）
  string account_id = 2 [(google.api.field_behavior) = REQUIRED];
  string to = 3;
  string cc = 4;
  string subject = 5;
  string body = 6;
  string reply_to_id = 7;
  string forward_of_id = 8;
  repeated OutgoingAttachment attachments = 9;
  string body_html = 10;
}

message SaveDraftResponse {
  string draft_id = 1;
}

message DeleteMessageRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MailAttachment {
  string id = 1;
  string message_id = 2;
  string filename = 3;
  string content_type = 4;
  int64 size = 5;
  string knowledge_doc_id = 6; // 入知识库后回链
}

message ListAttachmentsRequest {
  string message_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListAttachmentsResponse {
  repeated MailAttachment items = 1;
}

message GetAttachmentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ImportEmlRequest .eml 导入（account_id 为空串语义平移）。
message ImportEmlRequest {
  bytes eml = 1 [(google.api.field_behavior) = REQUIRED];
}

message ExportEmlRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// MailToTaskRequest 邮件转任务（契约修正：space 由服务端上下文解析）。
message MailToTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string title_override = 2;
}

message MailToTaskResponse {
  string task_ref = 1;
}

// AttachmentToKnowledgeRequest 附件入知识库（密级随行）。
message AttachmentToKnowledgeRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 classification = 2; // L1-L5，缺省沿用调用者默认
}

message AttachmentToKnowledgeResponse {
  string knowledge_doc_id = 1;
}

// SendMailRequest SMTP 发信（邮件 P1）。发出后存一份到「已发送」，从草稿发出会删掉草稿。
message SendMailRequest {
  string account_id = 1 [(google.api.field_behavior) = REQUIRED];
  string to = 2 [(google.api.field_behavior) = REQUIRED]; // 逗号 / 分号分隔，可带名字
  string subject = 3;
  string body = 4; // 纯文本
  string reply_to_id = 5; // 回复的本地邮件 id（带 In-Reply-To / References）
  string cc = 6;
  string forward_of_id = 7; // 转发的本地邮件 id（带上原附件）
  string draft_id = 8;      // 从草稿发出（带上草稿里的附件，发完删草稿）
  repeated OutgoingAttachment attachments = 9;
  string body_html = 10; // 带格式的正文（同时发 body 纯文本）；空 = 纯文本
  google.protobuf.Timestamp send_at = 11; // 定时发送：晚于现在就存成定时草稿，到点自动发
}

message SendMailResponse {
  string send_id = 1; // 「已发送」里那封信的 id
}

// OfficeTask 个人任务（负责人是调用者本人；邮件转任务与手工新建同表）。
message OfficeTask {
  string id = 1;
  string title = 2;
  string body = 3;
  string source = 4; // manual | mail | delegate | note
  string source_ref = 5; // 邮件转任务：邮件 id；指令栏交办：承载会话 id
  string status = 6; // open | doing | done
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // 负责人：assignee_kind 为空 = 本人；agent / team = 交办对象（有承载会话）；
  // tool / run / flow = 运行台的编码工具、几个工具一起做、流程（没有承载会话，进度看任务的执行）。
  string assignee_kind = 9;
  string assignee_id = 10;
  string assignee_name = 11; // 交办当时的显示名
  string session_id = 12; // AI 执行的承载会话；没派给 AI 为空
  google.protobuf.Timestamp due_at = 13; // 到期时间；空 = 没设
  int32 file_count = 14; // 附件数
}

message ListOfficeTasksRequest {
  string status = 1; // 空 = open；doing | done；active = open + doing
  int32 limit = 2; // 缺省 50，上限 200
  // 空 = 我的任务（manual + mail，且没派给 AI）；delegate = 派给了 AI 的；note = 随手记录
  string source = 3;
}

message ListOfficeTasksResponse {
  repeated OfficeTask items = 1;
}

message CreateOfficeTaskRequest {
  string title = 1 [(google.api.field_behavior) = REQUIRED];
  string body = 2;
  // 空 = manual；delegate 须带 source_ref（会话 id）与 assignee_*；note = 随手记录。
  // mail 只能由邮件转任务产生，此处拒绝。
  string source = 3;
  string source_ref = 4;
  string assignee_kind = 5; // agent | team（须带会话）| tool | run | flow（不带会话）
  string assignee_id = 6;
  string assignee_name = 7;
  google.protobuf.Timestamp due_at = 8;
}

message SetOfficeTaskStatusRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2 [(google.api.field_behavior) = REQUIRED]; // open | doing | done
}

// UpdateOfficeTaskRequest 改任务：只改带了的字段（optional 区分「没带」和「清空」）。
message UpdateOfficeTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string title = 2;
  optional string body = 3;
  google.protobuf.Timestamp due_at = 4;
  bool clear_due = 5; // true = 清掉到期时间（优先于 due_at）
}

// AssignOfficeTaskRequest 派给 AI：assignee_kind 为 agent / team，带上承载会话；
// assignee_kind 为空 = 收回自己做。
message AssignOfficeTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string assignee_kind = 2;
  string assignee_id = 3;
  string assignee_name = 4;
  string session_id = 5;
}

message DeleteOfficeTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// OfficeTaskFile 任务附件元数据。
message OfficeTaskFile {
  string id = 1;
  string task_id = 2;
  string filename = 3;
  string content_type = 4;
  int64 size = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOfficeTaskFilesRequest {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListOfficeTaskFilesResponse {
  repeated OfficeTaskFile items = 1;
}

// UploadOfficeTaskFileRequest 上传附件：页面走 multipart/form-data（字段 file），
// 服务端解码器转成本消息；也收 JSON（content 为 base64）。单个文件 ≤50MB。
message UploadOfficeTaskFileRequest {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message OfficeTaskFileRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// OfficeTaskExecution 任务的一次执行：指向别处的一条记录，执行自己的状态由各自的接口读。
message OfficeTaskExecution {
  string id = 1;
  string task_id = 2;
  // session | team_run | graph_execution | coding_task | fleet_terminal | fleet_run | cron_run
  string kind = 3;
  string ref_id = 4;
  // 执行者键：agent:<id> / team:<id> / flow:<graphId> / 工具键
  string executor = 5;
  string executor_name = 6;
  // 派出时发给执行者的交接单原文
  string hand = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListOfficeTaskExecutionsRequest {
  // 空 = 本人全部任务的执行
  string task_id = 1;
  int32 limit = 2;
}

message ListOfficeTaskExecutionsResponse {
  repeated OfficeTaskExecution items = 1;
}

message AddOfficeTaskExecutionRequest {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  string kind = 2 [(google.api.field_behavior) = REQUIRED];
  string ref_id = 3 [(google.api.field_behavior) = REQUIRED];
  string executor = 4;
  string executor_name = 5;
  string hand = 6;
}

message OfficeTaskExecutionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message TriggerDigestRequest {
  google.protobuf.Timestamp since = 1; // 空 = 默认昨夜今晨窗口
}

message TriggerDigestResponse {
  int32 message_count = 1;
  string summary = 2;
}

service OfficeMailService {
  rpc ListAccounts(google.protobuf.Empty) returns (ListAccountsResponse) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {get: "/v1/office/mail/accounts"};
  }
  rpc CreateAccount(CreateAccountRequest) returns (MailAccount) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {
      post: "/v1/office/mail/accounts"
      body: "*"
    };
  }
  rpc UpdateAccount(UpdateAccountRequest) returns (MailAccount) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {
      patch: "/v1/office/mail/accounts/{id}"
      body: "*"
    };
  }
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {delete: "/v1/office/mail/accounts/{id}"};
  }
  rpc SyncAccount(SyncAccountRequest) returns (SyncAccountResponse) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {
      post: "/v1/office/mail/accounts/{id}/sync"
      body: "*"
    };
  }
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {get: "/v1/office/mail/messages"};
  }
  rpc GetMessage(GetMessageRequest) returns (MailMessageDetail) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {get: "/v1/office/mail/messages/{id}"};
  }
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {delete: "/v1/office/mail/messages/{id}"};
  }
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
    option (google.api.http) = {get: "/v1/office/mail/attachments"};
  }
  // GetAttachment 附件下载（application/octet-stream + Content-Disposition）。
  rpc GetAttachment(GetAttachmentRequest) returns (google.api.HttpBody) {
    option (aranea.auth.v1.requirement) = {permission: "office.mail"};
