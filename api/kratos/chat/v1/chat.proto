syntax = "proto3";

package kratos.chat.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

option go_package = "aranea-agents/api/kratos/chat/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.chat.v1";

// Send / options mirror legacy JSON (snake_case on wire, same as web `features/chat/api.ts`).
// Streaming events are delivered via WebSocket + EventBus (no SSE route).
message SendChatMessageRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string agent_key = 2;
  optional string team_id = 3;
  string content = 4 [(google.api.field_behavior) = REQUIRED];
  SendMessageOptions options = 5;
}

	message SendMessageOptions {
  optional string dialog_mode = 1;
  optional string provider = 2;
  optional string model = 3;
  repeated AttachmentRef attachments = 4;
  // knowledge_bases limits knowledge_search to these collection IDs for this turn.
  repeated string knowledge_bases = 5;
}

message AttachmentRef {
  string id = 1;
}

// Opaque message objects match legacy `domain.Message` JSON without duplicating every field in proto.
message SendChatMessageResponse {
  google.protobuf.Struct user_message = 1;
  google.protobuf.Struct agent_message = 2;
}

// SubmitChatMessageResponse is the ACK-only response for the async command
// channel (B2). Full message/state/streaming data arrives via the WS data
// channel — this response intentionally carries no message content.
message SubmitChatMessageResponse {
  // accepted = true means the message was accepted and turn processing started.
  bool accepted = 1;
  // status: "accepted" = turn started; "queued" = enqueued for later (active run).
  string status = 2;
  // message_id is empty on accept (assigned when the user message is persisted,
  // delivered via WS `message.persisted` event). For queued messages, this is
  // the pending queue entry ID.
  string message_id = 3;
  // turn_id is empty on accept (assigned when the turn starts, delivered via
  // WS `run_status=running` event).
  string turn_id = 4;
}

message GetChatOptionsRequest {
  // Query: ?type=
  string type = 1;
}

message ChatOption {
  string type = 1;
  string key = 2;
  string label = 3;
  bool enabled = 4;
  int32 sort_order = 5;
  string metadata_json = 6;
}

message GetChatOptionsResponse {
  repeated ChatOption items = 1;
}

message StopGenerationRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message StopGenerationResponse {
  bool stopped = 1;
}

message RetrySessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetrySessionResponse {
  bool retried = 1;
}

// PauseSessionRequest pauses a running chat session (running → paused).
// User-initiated pause for an agent card; the current step completes before pausing.
message PauseSessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PauseSessionResponse {
  bool paused = 1;
}

// ResumeSessionRequest resumes a paused chat session (paused → running).
// User-initiated resume; used by AgentCard resume button.
message ResumeSessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ResumeSessionResponse {
  bool resumed = 1;
}

message GetPendingMessagesRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PendingMessage {
  string id = 1;
  string content = 2;
  string status = 3;
  string created_at = 4;
}

message GetPendingMessagesResponse {
  repeated PendingMessage items = 1;
}

message CancelPendingMessageRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string pending_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelPendingMessageResponse {
  bool cancelled = 1;
}

message UpdatePendingMessageRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string pending_id = 2 [(google.api.field_behavior) = REQUIRED];
  string content = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePendingMessageResponse {
  bool updated = 1;
}

message InterruptAndSendMessageRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string pending_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message InterruptAndSendMessageResponse {
  bool sent = 1;
}

// RunStatus represents the lifecycle state of an agent run within a session.
message RunStatus {
  // run_id is the unique identifier of the current or most-recent run.
  string run_id = 1;
  // status is one of: idle | pending | running | awaiting_user | completed | failed | cancelled | sync.
  string status = 2;
  // error_message is only set when status == failed.
  string error_message = 3;
  // updated_at is an RFC3339 timestamp of the last status transition.
  string updated_at = 4;
  // invocation_id is the framework invocation id when a run is active (ManagedRunner.RunStatus).
  string invocation_id = 5;
  // agent_name is the root agent name for the active invocation.
  string agent_name = 6;
  // started_at is RFC3339 when the framework run started.
  string started_at = 7;
  // last_event_at is RFC3339 of the last runner event for the invocation.
  string last_event_at = 8;
  // event_count is the number of events observed for the invocation.
  int32 event_count = 9;
  // await_kind distinguishes awaiting_user reasons: "" | "reply" | "tool_confirm".
  string await_kind = 10;
  // await_tool_key is set when await_kind == "tool_confirm".
  string await_tool_key = 11;
  // await_tool_call_id is set when await_kind == "tool_confirm".
  string await_tool_call_id = 12;
}

message GetRunStatusRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// AwaitUserReplyRequest submits the human reply for a paused run that is in awaiting_user state.
message AwaitUserReplyRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  // run_id identifies which run to resume. If omitted, resumes the latest awaiting_user run.
  optional string run_id = 2;
  string reply = 3 [(google.api.field_behavior) = REQUIRED];
}

message AwaitUserReplyResponse {
  bool accepted = 1;
}

message EnqueueUserMessageRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  // kind 是注入级别（P2-3 三级注入语义）：
  //   "" / "steer" = 用户插话，优先经框架 steer 队列在下一 step 边界消费；
  //   "followup"   = 显式追问，跳过 steer 直接入 pending 队列；
  //   "inject"     = 系统上下文静默排队，不单独唤醒 turn。
  string kind = 3;
}

message EnqueueUserMessageResponse {
  // accepted is true when the message was accepted by either runner steering or the pending queue.
  bool accepted = 1;
  // queued is true when the message fell back to the service pending queue.
  bool queued = 2;
  string pending_id = 3;
}

message ListChatBackgroundJobsRequest {
  optional string session_id = 1;
  optional string agent_id = 2;
  optional string status = 3;
  optional int32 limit = 4;
}

message ChatBackgroundJob {
  string id = 1;
  string source = 2;
  string session_id = 3;
  string agent_id = 4;
  string status = 5;
  string target_type = 6;
  string target_id = 7;
  string created_at = 8;
  string updated_at = 9;
  optional string summary = 10;
  optional string error_message = 11;
  string channel_id = 12;
  optional string graph_id = 13;
  optional string turn_id = 14;
  optional string session_run_id = 15;
  optional string phase = 16;
}

message ListChatBackgroundJobsResponse {
  repeated ChatBackgroundJob items = 1;
}

message CancelChatBackgroundJobRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string source = 2;
}

message CancelChatBackgroundJobResponse {
  bool cancelled = 1;
}

service ChatService {
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/messages"
      body: "*"
    };
  }
  // SubmitChatMessage submits a user message asynchronously and returns an ACK
  // only (B2 channel separation). Turn execution runs in the background; all
  // message/state/streaming data arrives via the WS data channel.
  // Use this instead of SendChatMessage when the client is WS-connected and
  // only needs a fire-and-ack command channel.
  rpc SubmitChatMessage(SendChatMessageRequest) returns (SubmitChatMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/messages/submit"
      body: "*"
    };
  }
  rpc GetChatOptions(GetChatOptionsRequest) returns (GetChatOptionsResponse) {
    option (google.api.http) = {get: "/v1/chat/options"};
  }
  rpc StopGeneration(StopGenerationRequest) returns (StopGenerationResponse) {
    option (google.api.http) = {
      post: "/v1/chat/stop"
      body: "*"
    };
  }
  // RetrySession re-triggers the last failed/interrupted turn for a session.
  // Used by AgentCard retry button to recover a stuck/failed sub-agent run.
  // Finds the last user message in the session and re-enqueues it.
  rpc RetrySession(RetrySessionRequest) returns (RetrySessionResponse) {
    option (google.api.http) = {
      post: "/v1/chat/sessions/{session_id}/retry"
      body: "*"
    };
  }
  // PauseSession pauses a running chat session (running → paused).
  // Used by AgentCard pause button; the current step completes before pausing.
  rpc PauseSession(PauseSessionRequest) returns (PauseSessionResponse) {
    option (google.api.http) = {
      post: "/v1/chat/sessions/{session_id}/pause"
      body: "*"
    };
  }
  // ResumeSession resumes a paused chat session (paused → running).
  // Used by AgentCard resume button.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse) {
    option (google.api.http) = {
      post: "/v1/chat/sessions/{session_id}/resume"
      body: "*"
    };
  }
  rpc GetPendingMessages(GetPendingMessagesRequest) returns (GetPendingMessagesResponse) {
    option (google.api.http) = { get: "/v1/chat/pending" };
  }
  rpc CancelPendingMessage(CancelPendingMessageRequest) returns (CancelPendingMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/pending/cancel"
      body: "*"
    };
  }
  rpc UpdatePendingMessage(UpdatePendingMessageRequest) returns (UpdatePendingMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/pending/update"
      body: "*"
    };
  }
  rpc InterruptAndSendMessage(InterruptAndSendMessageRequest) returns (InterruptAndSendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/pending/interrupt-and-send"
      body: "*"
    };
  }
  rpc GetRunStatus(GetRunStatusRequest) returns (RunStatus) {
    option (google.api.http) = {get: "/v1/chat/run-status"};
  }
  rpc AwaitUserReply(AwaitUserReplyRequest) returns (AwaitUserReplyResponse) {
    option (google.api.http) = {
      post: "/v1/chat/await-reply"
      body: "*"
    };
  }
  rpc EnqueueUserMessage(EnqueueUserMessageRequest) returns (EnqueueUserMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/enqueue"
      body: "*"
    };
  }

  rpc ListChatBackgroundJobs(ListChatBackgroundJobsRequest) returns (ListChatBackgroundJobsResponse) {
    option (google.api.http) = {get: "/v1/chat/jobs"};
  }

  rpc CancelChatBackgroundJob(CancelChatBackgroundJobRequest) returns (CancelChatBackgroundJobResponse) {
    option (google.api.http) = {
      post: "/v1/chat/jobs/{id}/cancel"
      body: "*"
    };
  }

  rpc SubmitMessageFeedback(SubmitMessageFeedbackRequest) returns (SubmitMessageFeedbackResponse) {
    option (google.api.http) = {
      post: "/v1/chat/messages/{message_id}/feedback"
      body: "*"
    };
  }
  rpc ConfirmActivity(ConfirmActivityRequest) returns (ConfirmActivityResponse) {
    option (google.api.http) = {
      post: "/v1/chat/activities/{activity_id}/confirm"
      body: "*"
    };
  }

  // ConfirmPlan allows the user to confirm or reject a draft TaskPlan created
  // by the pre-planning hard gate. When approved=true, the plan transitions
  // from draft → confirmed and execution may proceed; when approved=false,
  // the plan is abandoned and the turn aborts with a "plan rejected" status.
  rpc ConfirmPlan(ConfirmPlanRequest) returns (ConfirmPlanResponse) {
    option (google.api.http) = {
      post: "/v1/chat/plans/{plan_id}/confirm"
      body: "*"
    };
  }

  // ListPlans returns all TaskPlans for a spirit session, newest first (T3.2).
  // Used by the Observability Dashboard to display task planning history.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option (google.api.http) = {
      get: "/v1/chat/plans"
    };
  }

  // GetPlan returns a single TaskPlan by ID with full details (T3.2).
  // Used by the Observability Dashboard to display plan details.
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option (google.api.http) = {
      get: "/v1/chat/plans/{plan_id}"
    };
  }

  // SubmitClarification submits user answers to a clarification step and
  // resumes the turn with the clarified context.
  rpc SubmitClarification(SubmitClarificationRequest) returns (SubmitClarificationResponse) {
    option (google.api.http) = {
      post: "/v1/chat/clarifications/{step_id}"
      body: "*"
    };
  }
}

message SubmitMessageFeedbackRequest {
  string message_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
  // rating: "positive" | "negative"
  string rating = 3 [(google.api.field_behavior) = REQUIRED];
  optional string comment = 4;
  // context_json: optional JSON snapshot making the review list self-contained,
  // e.g. {"task_id":"...","input":"...","output":"..."}. Leniently parsed.
  optional string context_json = 5;
}

message SubmitMessageFeedbackResponse {
  bool accepted = 1;
}

// ConfirmActivityRequest is the request for confirming a tool-blocked activity.
message ConfirmActivityRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string activity_id = 2 [(google.api.field_behavior) = REQUIRED];
  // approved = true → resume tool execution; approved = false → cancel tool
  bool approved = 3 [(google.api.field_behavior) = REQUIRED];
  // reply is an optional structured confirm token (see
  // internal/tools/serviceawaitreply: __aranea:tool_confirm:approve |
  // deny | approve_session | approve_always). When set, it takes
  // precedence over the approved flag and carries the grant scope.
  string reply = 4;
}

message ConfirmActivityResponse {
  bool accepted = 1;
  string status = 2; // "completed" or "cancelled"
}

// SubmitClarificationRequest is the request for submitting clarification answers.
message SubmitClarificationRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string step_id = 2 [(google.api.field_behavior) = REQUIRED];
  // answers is the user's answers to each clarification question.
  // The array index corresponds to the question index in the step content.
  // Empty selected array means the user skipped that question (use recommended).
  repeated ClarificationAnswer answers = 3 [(google.api.field_behavior) = REQUIRED];
}

// ClarificationAnswer represents the user's answer to a single clarification question.
message ClarificationAnswer {
  // selected contains the selected option values (empty = use recommended).
  repeated string selected = 1;
  // other is an optional free-form text input for additional context.
  string other = 2;
}

message SubmitClarificationResponse {
  bool accepted = 1;
  string status = 2; // "completed"
  // clarified_context is the rendered context text injected into the resumed turn.
  string clarified_context = 3;
}

// ConfirmPlanRequest is the request for confirming or rejecting a draft TaskPlan
// produced by the pre-planning hard gate (P1-2).
message ConfirmPlanRequest {
  string plan_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
  // approved = true → confirm plan (draft → confirmed); approved = false → reject plan
  bool approved = 3 [(google.api.field_behavior) = REQUIRED];
  // strategy_override optionally overrides the suggested orchestration strategy.
  // Valid values: direct | single_agent | parallel | dag | coordinator
  optional string strategy_override = 4;
  // reason is an optional user-supplied justification for the decision.
  optional string reason = 5;
}

message ConfirmPlanResponse {
  bool accepted = 1;
  string status = 2; // "confirmed" or "rejected"
  string plan_id = 3;
  // strategy is the final strategy after applying any override.
  string strategy = 4;
  // subtask_count is the number of subtasks in the confirmed plan.
  int32 subtask_count = 5;
}

// ── Task Plan Query API (T3.2) ──────────────────────────────────────────

// ListPlansRequest is the request for listing TaskPlans of a spirit session.
message ListPlansRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListPlansResponse contains the list of TaskPlans, newest first.
message ListPlansResponse {
  repeated TaskPlanSummary plans = 1;
}

// TaskPlanSummary is a compact view of a TaskPlan for list display.
message TaskPlanSummary {
  string plan_id = 1;
  string session_id = 2;
  string trace_id = 3;
  string user_message = 4;
  string complexity_level = 5;
  double complexity_score = 6;
  string strategy = 7;
  string status = 8;
  int32 subtask_count = 9;
  string created_at = 10;
  string updated_at = 11;
}

// GetPlanRequest is the request for fetching a single TaskPlan by ID.
message GetPlanRequest {
  string plan_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetPlanResponse contains the full TaskPlan details.
message GetPlanResponse {
  TaskPlanDetail plan = 1;
}

// TaskPlanDetail is the full view of a TaskPlan for detail display.
message TaskPlanDetail {
  string plan_id = 1;
  string session_id = 2;
  string trace_id = 3;
  string user_message = 4;
  string intent_artifact_json = 5;
  string complexity_level = 6;
  double complexity_score = 7;
  DimensionScores dimensions = 8;
  repeated SubTask sub_tasks = 9;
  PlanTaskDAG task_dag = 10;
  string decompose_reason = 11;
  string strategy = 12;
  string strategy_reason = 13;
  string topology_hint = 14;
  MemoryHit memory_hit = 15;
  string status = 16;
  string created_at = 17;
  string updated_at = 18;
}

// DimensionScores holds the six-dimension complexity assessment.
message DimensionScores {
  double semantic = 1;
  double structural = 2;
  double domain = 3;
  double tool = 4;
  double context = 5;
  double historical = 6;
}

// SubTask represents a decomposed sub-task within a TaskPlan.
message SubTask {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string depends_on = 4;
  repeated string required_capabilities = 5;
  int32 priority = 6;
  double estimated_complexity = 7;
}

// PlanTaskDAG represents the dependency graph of subtasks.
message PlanTaskDAG {
  repeated SubTask nodes = 1;
  repeated string root_ids = 2;
  repeated string leaf_ids = 3;
}

// MemoryHit represents a memory cache hit from OrchestrationCache.
message MemoryHit {
  string cache_id = 1;
  double dq_score = 2;
  string topology_used = 3;
  repeated string agent_keys_used = 4;
}
