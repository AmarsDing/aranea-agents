syntax = "proto3";

package kratos.memory.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "aranea-agents/api/kratos/memory/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.memory.v1";

// Memory HTTP shapes mirror legacy SQLite L0–L4 + evolution JSON (**snake_case** on wire).
// **`internal/service.MemoryService`** reads/writes **`internal/data/sessionmemory`** (**cmd/admin**) over the Ent SQLite connection (**biz/memory** pgvector is separate — see playbook §6).

message ListL0SnapshotsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  string agent_id = 3; // optional: filter snapshots by agent (Team mode isolation)
}

message ListL0SnapshotsResponse {
  repeated L0AssemblySnapshot items = 1;
}

message L0AssemblySnapshot {
  string id = 1;
  string session_id = 2;
  string run_id = 3;
  string turn_id = 4;
  string span_id = 5;
  string agent_id = 6;
  string team_id = 7;
  string provider = 8;
  string model = 9;
  int32 context_window_tokens = 10;
  int32 budget_tokens = 11;
  int32 recent_window_turns = 12;
  int32 recent_window_tokens = 13;
  int32 summary_token_estimate = 14;
  int32 l1_field_count = 15;
  int32 l1_token_estimate = 16;
  int32 l3_chunk_count = 17;
  int32 l3_token_estimate = 18;
  int32 l4_path_count = 19;
  int32 l4_token_estimate = 20;
  int32 prompt_token_estimate = 21;
  int32 prompt_token_actual = 22;
  double used_ratio = 23;
  string truncate_strategy = 24;
  int32 truncated_message_count = 25;
  int32 summarized_turn_from = 26;
  int32 summarized_turn_to = 27;
  string segments_json = 28;
  string warning_codes_json = 29;
  string metadata_json = 30;
  string created_at = 31;
}

message ListL1TasksRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string agent_id = 2;
  string status = 3;
  string include_ended = 4;
}

message ListL1TasksResponse {
  repeated L1Task items = 1;
}

message L1Task {
  string id = 1;
  string session_id = 2;
  string run_id = 3;
  string team_id = 4;
  string agent_id = 5;
  string task_key = 6;
  string task_title = 7;
  string task_goal = 8;
  string status = 9;
  int32 schema_version = 10;
  int32 budget_tokens = 11;
  int32 used_tokens = 12;
  string parent_task_id = 13;
  string shared_with_json = 14;
  string started_at = 15;
  string ended_at = 16;
  string archived_at = 17;
  string metadata_json = 18;
  string created_at = 19;
  string updated_at = 20;
}

message ListL1FieldsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string task_id = 2 [(google.api.field_behavior) = REQUIRED];
  string include_internal = 3;
  string agent_id = 4; // optional: filter fields by requesting agent (shared_with aware)
}

message ListL1FieldsResponse {
  repeated L1Field items = 1;
}

message L1Field {
  string id = 1;
  string task_id = 2;
  string session_id = 3;
  string agent_id = 4;
  string field_path = 5;
  string field_kind = 6;
  string visibility = 7;
  bool pin_to_prompt = 8;
  bool is_required = 9;
  string value_text = 10;
  string value_json = 11;
  string value_ref = 12;
  string preview = 13;
  int32 token_estimate = 14;
  string source = 15;
  string source_ref = 16;
  int32 ttl_seconds = 17;
  string expires_at = 18;
  int32 revision = 19;
  string last_read_at = 20;
  int32 read_count = 21;
  string metadata_json = 22;
  string created_at = 23;
  string updated_at = 24;
}

message ListMemoryFactsRequest {
  string scope_type = 1;
  string scope_id = 2;
  string kind = 3;
  string status = 4;
  string keyword = 5;
  int32 limit = 6;
  int32 offset = 7;
  // optional: filter by ORIGINATING agent (memory_facts.agent_id) across all
  // scopes — AND-combined with the scope namespace filters. Used by the memory
  // center so the L3 browse tab matches the panorama card count (which counts
  // facts an agent produced into session/user scopes as well).
  string agent_id = 8;
}

message ListMemoryFactsResponse {
  repeated MemoryFact items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListConflictingFactsRequest {
  string scope_type = 1;
  string scope_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListConflictingFactsResponse {
  repeated MemoryFact items = 1;
  int32 total = 2;
}

message MemoryFact {
  string id = 1;
  string scope_type = 2;
  string scope_id = 3;
  string workspace_id = 4;
  string user_id = 5;
  string team_id = 6;
  string agent_id = 7;
  string statement = 8;
  string details_markdown = 9;
  string fact_kind = 10;
  string tags_json = 11;
  double confidence = 12;
  double importance = 13;
  int32 use_count = 14;
  int32 hit_count = 15;
  int32 positive_feedback_count = 16;
  int32 negative_feedback_count = 17;
  int32 conflict_count = 18;
  string source_kind = 19;
  string source_episode_id = 20;
  string source_session_id = 21;
  string source_message_id = 22;
  int32 version = 23;
  string status = 24;
  bool pii_flag = 25;
  string created_at = 26;
  string updated_at = 27;
  double quality_score = 28;
  string pii_types_json = 29;  // JSON array of PII type tags
  // FR-12.6 three-stage counters. use_count (14) is legacy and no longer
  // maintained; these carry the precise semantics:
  //   recalled_count  — entered a recall result set
  //   injected_count  — actually written into the LLM prompt
  //   cited_count     — explicitly referenced by the assistant reply
  int32 recalled_count = 30;
  int32 injected_count = 31;
  int32 cited_count = 32;
}

message ListMemoryEntitiesRequest {
  string scope_type = 1;
  string scope_id = 2;
  string workspace_id = 3;
  string user_id = 4;
  string entity_type = 5;
  string status = 6;
  string keyword = 7;
  int32 limit = 8;
  int32 offset = 9;
}

message ListMemoryEntitiesResponse {
  repeated MemoryEntity items = 1;
  int32 total = 2;
}

message MemoryEntity {
  string id = 1;
  string scope_type = 2;
  string scope_id = 3;
  string workspace_id = 4;
  string user_id = 5;
  string entity_type = 6;
  string name = 7;
  string name_normalized = 8;
  repeated string aliases = 9;
  string description = 10;
  double importance = 11;
  double confidence = 12;
  int32 use_count = 13;
  string source_kind = 14;
  string status = 15;
  string created_at = 16;
  string updated_at = 17;
}

message MemoryRelation {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string relation_type = 4;
  double weight = 5;
  double confidence = 6;
  string status = 7;
  string valid_from = 8;
  string valid_to = 9;
}

message GetMemoryNeighborhoodRequest {
  string center_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 hops = 2;
  int32 max_nodes = 3;
  string query_at = 4;
}

message GraphNeighborhood {
  MemoryEntity center = 1;
  int32 hops = 2;
  repeated MemoryEntity entities = 3;
  repeated MemoryRelation relations = 4;
  string query_at = 5;
}

// Spreading activation (Phase E, FR-10.3 / FR-10.8 / AC-9)

message SpreadingActivationRequest {
  string center_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 hops = 2;   // default 3 when <= 0
  int32 top_k = 3;  // default 20 when <= 0
}

message ActivationPathStep {
  string from_node_id = 1;
  string to_node_id = 2;
  double edge_weight = 3;
  string relation_type = 4;
}

message ActivationResult {
  string node_id = 1;
  double activation = 2;
  int32 hop_count = 3;
  repeated ActivationPathStep activation_path = 4;
}

message SpreadingActivationResponse {
  string center_id = 1;
  int32 hops = 2;
  int32 top_k = 3;
  repeated ActivationResult items = 4;
}

message GetAgentIdentityRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AgentIdentity {
  string agent_id = 1;
  string persona = 2;
  repeated string values = 3;
  string tone = 4;
  repeated string domains = 5;
  string user_expectations = 6;
  string current_phase = 7;
  int32 version = 8;
}

message GetAgentStrategyRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AgentStrategyProfile {
  string agent_id = 1;
  double exploration = 2;
  double conciseness = 3;
  double caution = 4;
  double delegation = 5;
  map<string, double> tool_preference = 6;
  repeated string tool_blacklist = 7;
  map<string, double> provider_preference = 8;
  map<string, double> model_preference = 9;
  int32 version = 10;
}

message ListEvolutionProposalsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2;
  int32 limit = 3;
}

message ListEvolutionProposalsResponse {
  repeated EvolutionProposal items = 1;
}

message EvolutionProposal {
  string id = 1;
  string agent_id = 2;
  string proposal_kind = 3;
  string kind = 4;
  string target_field = 5;
  string rationale = 6;
  string expected_impact = 7;
  string risk_level = 8;
  string status = 9;
  string created_at = 10;
}

message ListEvolutionEventsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
}

message ListEvolutionEventsResponse {
  repeated EvolutionEvent items = 1;
}

message EvolutionEvent {
  string id = 1;
  string agent_id = 2;
  string event_kind = 3;
  string kind = 4;
  string target_field = 5;
  string reason = 6;
  bool reverted = 7;
  string created_at = 8;
}

message GetEvolutionMetricsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string range = 2;
}

message AgentSkillStat {
  string agent_id = 1;
  string tool_key = 2;
  int32 invocations = 3;
  int32 successes = 4;
  int32 failures = 5;
  double preference_score = 6;
  string last_used_at = 7;
}

message EvolutionMetricsReport {
  int32 events_total = 1;
  int32 events_reverted = 2;
  int32 proposals_total = 3;
  map<string, int32> proposals_by_status = 4;
  repeated AgentSkillStat skill_stats = 5;
}

// UpsertMemoryFactRequest persists or updates one L3 fact (dedupe via scope + fingerprint of statement).
message UpsertMemoryFactRequest {
  MemoryFact fact = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpsertMemoryFactResponse {
  MemoryFact fact = 1;
}

// AppendEvolutionEventRequest registers a persisted evolution timeline row (SQLite agent_evolution_events).
message AppendEvolutionEventRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string workspace_id = 2;
  // event_kind identifies the lineage record (preferred over kind).
  string event_kind = 3 [(google.api.field_behavior) = REQUIRED];
  // kind mirrors legacy list JSON when different from event_kind; optional duplicate of event_kind.
  string kind = 4;
  string target_field = 5;
  string reason = 6;
  string trigger_kind = 7 [(google.api.field_behavior) = REQUIRED];
  string trigger_source = 8;
  string metadata_json = 9;
}

message AppendEvolutionEventResponse {
  EvolutionEvent event = 1;
}

message CascadeAffectedEntity {
  string entity_id = 1;
  string entity_name = 2;
  string entity_type = 3;
  string relation_type = 4;
  int32 hops = 5;
}

message CascadeProposal {
  string id = 1;
  string agent_id = 2;
  string workspace_id = 3;
  string trigger_entity_id = 4;
  string trigger_entity_name = 5;
  string trigger_attribute = 6;
  string old_value = 7;
  string new_value = 8;
  repeated CascadeAffectedEntity affected_entities = 9;
  string status = 10;
  string risk_level = 11;
  string rationale = 12;
  string reviewed_by = 13;
  string reviewed_at = 14;
  string expires_at = 15;
  string created_at = 16;
  string updated_at = 17;
}

message ListCascadeProposalsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2;
  int32 limit = 3;
}

message ListCascadeProposalsResponse {
  repeated CascadeProposal items = 1;
}

message ApproveCascadeProposalRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string reviewer = 2;
}

message ApproveCascadeProposalResponse {
  CascadeProposal proposal = 1;
}

message RejectCascadeProposalRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string reviewer = 2;
  string reason = 3;
}

	message RejectCascadeProposalResponse {
  CascadeProposal proposal = 1;
}

message CascadeFactDiff {
  string fact_id = 1;
  string before_statement = 2;
  string after_statement = 3;
  string scope = 4;
}

message CascadeEntityRename {
  string entity_id = 1;
  string entity_type = 2;
  string old_name = 3;
  string new_name = 4;
}

message CascadePreview {
  int32 affected_entities_count = 1;
  int32 affected_facts_count = 2;
  repeated CascadeFactDiff fact_diffs = 3;
  repeated CascadeEntityRename entity_renames = 4;
}

message PreviewCascadeApproveRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PreviewCascadeApproveResponse {
  CascadePreview preview = 1;
}

message CascadeSagaStep {
  string id = 1;
  string proposal_id = 2;
  int32 step_index = 3;
  string step_name = 4;
  string state = 5;
  bool is_critical = 6;
  int32 attempts = 7;
  string started_at = 8;
  string finished_at = 9;
  string payload_json = 10;
  string result_json = 11;
  string error = 12;
}

message GetCascadeSagaStepsRequest {
  string proposal_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetCascadeSagaStepsResponse {
  repeated CascadeSagaStep steps = 1;
}

message RetryCascadeApproveRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string reviewer = 2;
}

message RetryCascadeApproveResponse {
  CascadeProposal proposal = 1;
}

message CompensateCascadeApproveRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string reviewer = 2;
}

message CompensateCascadeApproveResponse {
  CascadeProposal proposal = 1;
}

message MemoryRecallScoreBreakdown {
  double keyword = 1;
  double vector = 2;
  double importance = 3;
  double recency = 4;
  double cross_encoder = 5;
  double total = 6;
  double quality_score = 7;
}

message MemoryRecallHit {
  string layer = 1;
  string id = 2;
  string title = 3;
  string summary = 4;
  string statement = 5;
  MemoryRecallScoreBreakdown scores = 6;
}

message DebugMemoryRecallRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2;
  string user_id = 3;
  string query = 4;
  int32 l2_limit = 5;
  int32 l3_limit = 6;
}

message DebugMemoryRecallResponse {
  repeated MemoryRecallHit l2_hits = 1;
  repeated MemoryRecallHit l3_hits = 2;
}

message CompositeSearchHit {
  string layer = 1;
  string id = 2;
  string text = 3;
  double score = 4;
}

message CompositeSearchMemoriesRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2;
  string user_id = 3;
  string query = 4 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 5;
}

message CompositeSearchMemoriesResponse {
  repeated CompositeSearchHit items = 1;
}

message GetMemoryWorkerStatusRequest {}

message MemoryWorkerStatus {
  int64 jobs_done = 1;
  int64 jobs_dead = 2;
  int64 llm_fallback_total = 3;
  double avg_extraction_seconds = 4;
  int64 episode_backfill_total = 5;
  // MEM-OPT-01: index health
  int64 fact_index_stale_count = 6;
  int64 fact_index_disabled_count = 7;
  // MEM-OPT-03: queue stats
  message QueueStats {
    int64 capacity = 1;
    int64 in_flight = 2;
    int64 dropped_total = 3;
    int64 debounced_total = 4;
  }
  QueueStats queue_high = 10;
  QueueStats queue_normal = 11;
  QueueStats queue_low = 12;
  int64 oldest_pending_age_ms = 20;
  // DB health: false when underlying store queries fail (counts may be stale/zero).
  bool db_available = 21;
  // Global dead-letter pending count (not queue-specific).
  int64 dead_letter_pending = 22;
}

message MemoryPlatformSettings {
  bool policy_strict = 1;
  bool episode_backfill_disabled = 2;
  // Read-only: env MEMORY_POLICY_STRICT overrides DB when true.
  bool env_policy_strict_override = 3;
  // Read-only: env MEMORY_EPISODE_BACKFILL_DISABLED overrides DB when true.
  bool env_episode_backfill_disabled_override = 4;
}

message GetMemoryPlatformSettingsRequest {}

message UpdateMemoryPlatformSettingsRequest {
  bool policy_strict = 1;
  bool episode_backfill_disabled = 2;
}

// MEM-OPT-03: Dead-Letter messages

message MemoryDeadLetterEntry {
  int64 id = 1;
  string enqueued_at = 2;
  string failed_at = 3;
  string session_id = 4;
  string app_name = 5;
  string drop_reason = 6;
  int32 priority = 7;
  int32 attempts = 8;
  string state = 9;
  string last_error = 10;
}

message ListMemoryDeadLettersRequest {
  string state = 1;
  int32 limit = 2;
}

message ListMemoryDeadLettersResponse {
  repeated MemoryDeadLetterEntry items = 1;
}

message ReplayMemoryDeadLetterRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReplayMemoryDeadLetterResponse {
  MemoryDeadLetterEntry entry = 1;
}

message AbandonMemoryDeadLetterRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2;
}

message AbandonMemoryDeadLetterResponse {
  MemoryDeadLetterEntry entry = 1;
}

// MEM-OPT-04: PII Review

message ListPIIFlaggedFactsRequest {
  string scope_type = 1;
  string scope_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListPIIFlaggedFactsResponse {
  repeated MemoryFact items = 1;
  int32 total = 2;
}

message ReviewPIIFactRequest {
  string fact_id = 1 [(google.api.field_behavior) = REQUIRED];
  string action = 2 [(google.api.field_behavior) = REQUIRED]; // "approve" or "reject"
}

message ReviewPIIFactResponse {
  MemoryFact fact = 1;
}

// ── 记忆中心重设计：层级全景 + 跨层关联图谱（2026-07-25，设计 memory.design.md §10）──

message GetMemoryLayerOverviewRequest {
  string agent_id = 1;
  string session_id = 2;
}

message MemoryLayerStat {
  string layer = 1;              // L0..L4
  int32 item_count = 2;
  int32 today_added = 3;
  int32 recall_hits = 4;
  string health = 5;             // ok | warn
  string headline_json = 6;      // 各层头部指标（见设计 §10.2）
}

message MemoryActionItem {
  string kind = 1;
  int32 count = 2;
  string target_tab = 3;
}

message MemoryActivityItem {
  string ts = 1;
  string kind = 2;
  string layer_from = 3;
  string layer_to = 4;
  string summary = 5;
}

message GetMemoryLayerOverviewResponse {
  repeated MemoryLayerStat layers = 1;
  repeated MemoryActionItem action_items = 2;
  repeated MemoryActivityItem activity_feed = 3;
}

message GetUnifiedMemoryGraphRequest {
  string agent_id = 1;
  string focus = 2;
  int32 hops = 3;
  double min_weight = 4;
  repeated string layers = 5;
}

message UnifiedGraphNode {
  string id = 1;
  string layer = 2;
  string kind = 3;
  string label = 4;
  double weight = 5;
  string meta_json = 6;
}

message UnifiedGraphEdge {
  string source = 1;
  string target = 2;
  string type = 3;
  string label = 4;
  double weight = 5;
  string polarity = 6;
}

message GetUnifiedMemoryGraphResponse {
  string focus = 1;
  repeated UnifiedGraphNode nodes = 2;
  repeated UnifiedGraphEdge edges = 3;
  int32 node_count = 4;
  int32 edge_count = 5;
  int32 filtered_edge_count = 6;
  string empty_reason = 7;
}

// ── 记忆中心重设计 P3：L2 情景浏览 ──

message ListMemoryEpisodesRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2; // optional: filter by session
  int32 limit = 3;
  int32 offset = 4;
}

message MemoryEpisode {
  string id = 1;
  string session_id = 2;
  string agent_id = 3;
  string episode_kind = 4;
  string title = 5;
  string outcome_summary = 6;
  double importance = 7;
  string consolidation_status = 8; // pending | consolidated
  int32 consolidated_l3_count = 9;
  string ended_at = 10;
  string created_at = 11;
}

message ListMemoryEpisodesResponse {
  repeated MemoryEpisode items = 1;
  int32 total = 2;
}

service MemoryService {
  rpc ListL0Snapshots(ListL0SnapshotsRequest) returns (ListL0SnapshotsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/l0/snapshots"};
  }
  rpc ListL1Tasks(ListL1TasksRequest) returns (ListL1TasksResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/l1/tasks"};
  }
  rpc ListL1Fields(ListL1FieldsRequest) returns (ListL1FieldsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/l1/tasks/{task_id}/fields"};
  }
  rpc ListMemoryFacts(ListMemoryFactsRequest) returns (ListMemoryFactsResponse) {
    option (google.api.http) = {get: "/v1/memory/l3/facts"};
  }
  rpc ListConflictingFacts(ListConflictingFactsRequest) returns (ListConflictingFactsResponse) {
    option (google.api.http) = {get: "/v1/memory/l3/facts/conflicts"};
  }
  rpc ListMemoryEntities(ListMemoryEntitiesRequest) returns (ListMemoryEntitiesResponse) {
    option (google.api.http) = {get: "/v1/memory/l4/entities"};
  }
  rpc GetMemoryNeighborhood(GetMemoryNeighborhoodRequest) returns (GraphNeighborhood) {
    option (google.api.http) = {get: "/v1/memory/l4/entities/{center_id}/neighborhood"};
  }
  rpc SpreadingActivation(SpreadingActivationRequest) returns (SpreadingActivationResponse) {
    option (google.api.http) = {get: "/v1/memory/l4/spreading-activation"};
  }
  rpc GetAgentIdentity(GetAgentIdentityRequest) returns (AgentIdentity) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/identity"};
  }
  rpc GetAgentStrategy(GetAgentStrategyRequest) returns (AgentStrategyProfile) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/strategy"};
  }
  rpc ListEvolutionProposals(ListEvolutionProposalsRequest) returns (ListEvolutionProposalsResponse) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/evolution/proposals"};
  }
  rpc ListEvolutionEvents(ListEvolutionEventsRequest) returns (ListEvolutionEventsResponse) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/evolution/events"};
  }
  rpc GetEvolutionMetrics(GetEvolutionMetricsRequest) returns (EvolutionMetricsReport) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/evolution/metrics"};
  }

  rpc UpsertMemoryFact(UpsertMemoryFactRequest) returns (UpsertMemoryFactResponse) {
    option (google.api.http) = {
      post: "/v1/memory/l3/facts"
      body: "*"
    };
  }

  rpc AppendEvolutionEvent(AppendEvolutionEventRequest) returns (AppendEvolutionEventResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/evolution/events"
      body: "*"
    };
  }

  rpc ListCascadeProposals(ListCascadeProposalsRequest) returns (ListCascadeProposalsResponse) {
