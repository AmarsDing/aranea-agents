syntax = "proto3";

package kratos.usage.v1;

import "google/api/annotations.proto";

option go_package = "aranea-agents/api/kratos/usage/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.usage.v1";

// Mirrors legacy query `/model-usage/*` GET params.
message UsageQuery {
  string range = 1;
  string start_date = 2;
  string end_date = 3;
  string provider_code = 4;
  string model_api_id = 5;
  string agent_id = 6;
  string status = 7;
  int32 limit = 8;
  string granularity = 9; // "" | "day" | "hour"
  string team_id = 10;
  string usage_kind = 11; // exact kind filter (detail/export); aggregates always billable (exclude team_turn)
  // Offset for ListUsageEvents server-side pagination (ignored by aggregate RPCs).
  int32 offset = 12;
}

message UsageSummary {
  int32 call_count = 1;
  int32 request_count = 2;
  int32 success_count = 3;
  int32 failed_count = 4;
  int32 cancelled_count = 5;
  int32 input_tokens = 6;
  int32 output_tokens = 7;
  int32 total_tokens = 8;
  int64 total_cost_micro_usd = 9;
  double avg_latency_ms = 10;
  double avg_tokens_per_second = 11;
  double success_rate = 12;
}

message UsageTrendPoint {
  string date_key = 1;
  int32 call_count = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  int32 total_tokens = 5;
  int64 total_cost_micro_usd = 6;
  int32 success_count = 7;
  int32 failed_count = 8;
  int32 cancelled_count = 9;
  double avg_latency_ms = 10;
  double avg_tokens_per_second = 11;
}

message UsageBreakdownRow {
  string provider_code = 1;
  string model_api_id = 2;
  string model_display_name = 3;
  string agent_id = 4;
  string agent_key = 5;
  int32 call_count = 6;
  int32 input_tokens = 7;
  int32 output_tokens = 8;
  int32 total_tokens = 9;
  int64 total_cost_micro_usd = 10;
  double avg_latency_ms = 11;
  double avg_tokens_per_second = 12;
  double success_rate = 13;
}

// UsageModelInsight marks models with high cost and poor efficiency (low TPS / failures).
message UsageModelInsight {
  string provider_code = 1;
  string model_api_id = 2;
  string model_display_name = 3;
  int32 call_count = 4;
  int32 total_tokens = 5;
  int64 total_cost_micro_usd = 6;
  double avg_latency_ms = 7;
  double avg_tokens_per_second = 8;
  double success_rate = 9;
  repeated string flags = 10;
}

message TokenUsageEvent {
  string id = 1;
  string occurred_at = 2;
  string date_key = 3;
  string hour_key = 4;
  string workspace_id = 5;
  string user_id = 6;
  string team_id = 7;
  string agent_id = 8;
  string agent_key = 9;
  string session_id = 10;
  string message_id = 11;
  string request_id = 12;
  string provider_code = 13;
  string provider_type = 14;
  string provider_display_name = 15;
  string model_api_id = 16;
  string model_display_name = 17;
  string model_category_json = 18;
  string usage_kind = 19;
  int32 call_count = 20;
  int32 input_tokens = 21;
  int32 output_tokens = 22;
  int32 cached_input_tokens = 23;
  int32 reasoning_tokens = 24;
  int32 embedding_tokens = 25;
  int32 total_tokens = 26;
  int64 input_price_micro_usd_per_1k = 27;
  int64 output_price_micro_usd_per_1k = 28;
  int64 cached_input_price_micro_usd_per_1k = 29;
  int64 reasoning_price_micro_usd_per_1k = 30;
  int64 embedding_price_micro_usd_per_1k = 31;
  int64 input_cost_micro_usd = 32;
  int64 output_cost_micro_usd = 33;
  int64 cached_input_cost_micro_usd = 34;
  int64 reasoning_cost_micro_usd = 35;
  int64 embedding_cost_micro_usd = 36;
  int64 total_cost_micro_usd = 37;
  int32 latency_ms = 38;
  int32 time_to_first_token_ms = 39;
  double tokens_per_second = 40;
  string status = 41;
  string error_code = 42;
  string error_message = 43;
  int32 retry_count = 44;
  string prompt_mode = 45;
  int32 max_output_tokens = 46;
  int32 context_window_k = 47;
  bool stream_enabled = 48;
  string metadata_json = 49;
  string created_at = 50;
}

message UsageQuotaDashboard {
  int32 configured_count = 1;
  int64 total_cap_micro_usd = 2;
  int64 total_spent_micro_usd = 3;
  double max_utilization_ratio = 4;
}

message UsageOverview {
  UsageSummary today = 1;
  UsageSummary yesterday = 2;
  UsageSummary month = 3;
  UsageSummary range_summary = 4;
  repeated UsageTrendPoint trends = 5;
  repeated UsageBreakdownRow top_models = 6;
  repeated UsageBreakdownRow top_agents = 7;
  repeated TokenUsageEvent anomalies = 8;
  UsageQuotaDashboard quota_dashboard = 9;
  repeated UsageModelInsight inefficient_models = 10;
}

message BudgetAlert {
  string id = 1;
  string scope_type = 2;
  string scope_id = 3;
  double alert_ratio = 4;
  bool enabled = 5;
  string last_fired_at = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListBudgetAlertsRequest {
  string scope_type = 1;
  string scope_id = 2;
}

message ListBudgetAlertsResponse {
  repeated BudgetAlert items = 1;
}

message SetBudgetAlertRequest {
  string scope_type = 1;
  string scope_id = 2;
  double alert_ratio = 3;
  bool enabled = 4;
}

message ExportUsageEventsResponse {
  string csv = 1;
}

message ListUsageTrendsResponse {
  repeated UsageTrendPoint items = 1;
}

message ListBreakdownResponse {
  repeated UsageBreakdownRow items = 1;
}

message ListUsageEventsResponse {
  repeated TokenUsageEvent items = 1;
  // Total matching rows for the query filters (same scope as items).
  int32 total = 2;
}

message UsageQuota {
  string id = 1;
  string scope_type = 2;
  string scope_id = 3;
  int64 monthly_micro_usd = 4;
  string period_start = 5;
  string period_end = 6;
  string created_at = 7;
  string updated_at = 8;
}

message GetUsageQuotaRequest {
  string scope_type = 1;
  string scope_id = 2;
}

message SetUsageQuotaRequest {
  string scope_type = 1;
  string scope_id = 2;
  int64 monthly_micro_usd = 3;
  string period_start = 4;
  string period_end = 5;
}

message CheckUsageQuotaRequest {
  string scope_type = 1;
  string scope_id = 2;
}

message CheckUsageQuotaResponse {
  bool allowed = 1;
  UsageQuota quota = 2;
  int64 spent_micro_usd = 3;
  int64 remaining_micro_usd = 4;
  string reason = 5;
}

message PurgeUsageEventsRequest {
  int32 retain_days = 1;
}

message PurgeUsageEventsResponse {
  int64 deleted_count = 1;
}

// ListAllModelsBreakdownRequest is the paginated query for the full-model consumption overview table.
// Unlike ListTopModels (capped at 200 rows, fixed cost sort), this RPC supports server-side
// pagination, dynamic sorting, and LIKE search across provider_code + model_api_id.
message ListAllModelsBreakdownRequest {
  string range = 1;          // today | 7d | 30d | month (resolved to start_date/end_date server-side)
  string start_date = 2;     // explicit override (YYYY-MM-DD); empty = use range
  string end_date = 3;       // explicit override (YYYY-MM-DD); empty = use range
  string provider_code = 4;   // optional exact provider filter
  string search = 5;          // optional LIKE search on provider_code + model_api_id
  string sort_field = 6;      // call_count | total_tokens | total_cost_micro_usd | success_rate | avg_latency_ms
  string sort_dir = 7;        // asc | desc (default: desc)
  int32 page = 8;             // 1-based (default: 1)
  int32 page_size = 9;        // default: 20, max: 100
}

message ListAllModelsBreakdownResponse {
  repeated UsageBreakdownRow items = 1;
  int32 total = 2;            // total matching rows (pre-pagination)
  int32 page = 3;
  int32 page_size = 4;
}

service UsageService {
  rpc GetUsageOverview(UsageQuery) returns (UsageOverview) {
    option (google.api.http) = {get: "/v1/usage/overview"};
  }
  rpc ListUsageTrends(UsageQuery) returns (ListUsageTrendsResponse) {
    option (google.api.http) = {get: "/v1/usage/trends"};
  }
  rpc ListTopModels(UsageQuery) returns (ListBreakdownResponse) {
    option (google.api.http) = {get: "/v1/usage/top-models"};
  }
  rpc ListTopAgents(UsageQuery) returns (ListBreakdownResponse) {
    option (google.api.http) = {get: "/v1/usage/top-agents"};
  }
  rpc ListUsageEvents(UsageQuery) returns (ListUsageEventsResponse) {
    option (google.api.http) = {get: "/v1/usage/events"};
  }
  // Inserts model_token_usage_events, rolls up sessions counters, upserts model_token_usage_daily (parity with pkg/backend AddModelTokenUsageEvent + UpsertModelTokenUsageDaily).
  rpc RecordTokenUsageEvent(TokenUsageEvent) returns (TokenUsageEvent) {
    option (google.api.http) = {
      post: "/v1/usage/token-events"
      body: "*"
    };
  }
  rpc GetUsageQuota(GetUsageQuotaRequest) returns (UsageQuota) {
    option (google.api.http) = {get: "/v1/usage/quotas/{scope_type}/{scope_id}"};
  }
  rpc SetUsageQuota(SetUsageQuotaRequest) returns (UsageQuota) {
    option (google.api.http) = {
      put: "/v1/usage/quotas/{scope_type}/{scope_id}"
      body: "*"
    };
  }
  rpc CheckUsageQuota(CheckUsageQuotaRequest) returns (CheckUsageQuotaResponse) {
    option (google.api.http) = {get: "/v1/usage/quotas/{scope_type}/{scope_id}/check"};
  }
  rpc ListBudgetAlerts(ListBudgetAlertsRequest) returns (ListBudgetAlertsResponse) {
    option (google.api.http) = {get: "/v1/usage/budget-alerts"};
  }
  rpc SetBudgetAlert(SetBudgetAlertRequest) returns (BudgetAlert) {
    option (google.api.http) = {
      post: "/v1/usage/budget-alerts"
      body: "*"
    };
  }
  rpc ExportUsageEvents(UsageQuery) returns (ExportUsageEventsResponse) {
    option (google.api.http) = {get: "/v1/usage/events/export"};
  }
  rpc PurgeUsageEvents(PurgeUsageEventsRequest) returns (PurgeUsageEventsResponse) {
    option (google.api.http) = {
      post: "/v1/usage/events/purge"
      body: "*"
    };
  }
  // ListAllModelsBreakdown returns a paginated, searchable, sortable breakdown of all models
  // for the full-model consumption overview table. Server-side pagination/sort/search.
  rpc ListAllModelsBreakdown(ListAllModelsBreakdownRequest) returns (ListAllModelsBreakdownResponse) {
    option (google.api.http) = {get: "/v1/usage/all-models-breakdown"};
  }
}
