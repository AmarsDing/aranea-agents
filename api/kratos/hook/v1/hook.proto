syntax = "proto3";

package kratos.hook.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/hook/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.hook.v1";

message Hook {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  bool enabled = 6;
  int32 sort_order = 7;
  string config_json = 8;
  string metadata_json = 9;
  string created_at = 10;
  string updated_at = 11;
  string deleted_at = 12;
}

message ListHooksResponse {
  repeated Hook items = 1;
}

message CreateHookRequest {
  string key = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string status = 4;
  bool enabled = 5;
  int32 sort_order = 6;
  string config_json = 7;
  string metadata_json = 8;
}

message GetHookRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateHookRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  Hook hook = 2;
}

message DeleteHookRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message HookDelivery {
  string id = 1;
  string hook_key = 2;
  string hook_id = 3;
  string webhook_url = 4;
  string payload_json = 5;
  string status = 6;
  int32 attempt_count = 7;
  int32 max_attempts = 8;
  string last_error = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListHookDeliveriesRequest {
  string hook_key = 1;
  string status = 2;
  string from = 3;
  string to = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListHookDeliveriesResponse {
  repeated HookDelivery items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service HookService {
  rpc ListHooks(google.protobuf.Empty) returns (ListHooksResponse) {
    option (google.api.http) = {get: "/v1/hooks"};
  }
  rpc CreateHook(CreateHookRequest) returns (Hook) {
    option (google.api.http) = {
      post: "/v1/hooks"
      body: "*"
    };
  }
  rpc GetHook(GetHookRequest) returns (Hook) {
    option (google.api.http) = {get: "/v1/hooks/{id}"};
  }
  rpc UpdateHook(UpdateHookRequest) returns (Hook) {
    option (google.api.http) = {
      patch: "/v1/hooks/{id}"
      body: "hook"
    };
  }
  rpc DeleteHook(DeleteHookRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hooks/{id}"};
  }
  rpc ListHookDeliveries(ListHookDeliveriesRequest) returns (ListHookDeliveriesResponse) {
    option (google.api.http) = {get: "/v1/hooks/deliveries"};
  }
}
