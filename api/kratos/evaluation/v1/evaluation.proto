syntax = "proto3";

package kratos.evaluation.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/evaluation/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.evaluation.v1";

// EvalDataset holds a named set of evaluation cases.
message EvalDataset {
  string id = 1;
  string name = 2;
  string description = 3;
  int32  case_count = 4;
  string workspace = 5;
  string created_at = 6;
  string updated_at = 7;
}

// EvalCase is one input/expected-output pair in a dataset.
message EvalCase {
  string id = 1;
  string dataset_id = 2;
  string input = 3;
  string expected_output = 4;
  string metadata_json = 5;
}

// EvalRun is one async evaluation execution over a dataset.
message EvalRun {
  string id = 1;
  string dataset_id = 2;
  string agent_id = 3;
  string status = 4;           // pending | running | completed | failed
  int32  total_cases = 5;
  int32  completed_cases = 6;
  float  exact_match_score = 7;
  float  contains_match_score = 8;
  float  llm_judge_score = 9;
  float  tool_call_accuracy = 10;
  string error_message = 11;
  string started_at = 12;
  string finished_at = 13;
  string created_at = 14;
  string trigger_source = 15; // manual | after_turn | gate
  int32  num_runs = 16;
  float  pass_at_k = 17;
  float  pass_hat_k = 18;
  // scores_json holds extended metric averages (json_match, rouge_l, tool_trajectory, etc.).
  string scores_json = 19;
  // dataset_hash is the dataset content snapshot at run start (P3-5);
  // differing hashes across compared runs mean scores are not directly comparable.
  string dataset_hash = 20;
}

// EvalCaseResult is the output for one case in a run.
message EvalCaseResult {
  string id = 1;
  string run_id = 2;
  string case_id = 3;
  string actual_output = 4;
  bool   exact_match = 5;
  bool   contains_match = 6;
  float  llm_judge_score = 7;
  float  tool_call_accuracy = 8;
  string error_message = 9;
  string created_at = 10;
  optional bool human_pass = 11;
  optional float human_score = 12;
  string human_comment = 13;
  string annotated_at = 14;
  string annotated_by = 15;
  string scores_json = 16;
}

// --- Requests / Responses ---

message CreateDatasetRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string description = 2;
}

message GetDatasetRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListDatasetsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListDatasetsResponse {
  repeated EvalDataset items = 1;
  int32 total = 2;
}

message DeleteDatasetRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateDatasetRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
}

message UploadCasesRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  // cases_json is a JSON array of {input, expected_output, metadata_json} objects.
  string cases_json = 2 [(google.api.field_behavior) = REQUIRED];
}

message UploadCasesResponse {
  int32 imported = 1;
}

message RunEvaluationRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  string agent_id = 2 [(google.api.field_behavior) = REQUIRED];
  // metrics is a comma-separated list of metrics to compute (empty = all).
  string metrics = 3;
  // num_runs repeats each case N times (AgentEvaluator MultiRun, default 1).
  int32 num_runs = 4;
  // use_user_simulation enables scripted user simulation when cases define metadata_json.user_simulation.
  bool use_user_simulation = 5;
}

message GetRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListRunsRequest {
  string dataset_id = 1;
  string agent_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListRunsResponse {
  repeated EvalRun items = 1;
  int32 total = 2;
}

message GetRunResultsRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  int32 offset = 3;
}

message GetRunResultsResponse {
  repeated EvalCaseResult items = 1;
  int32 total = 2;
}

message AnnotateCaseResultRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
  string result_id = 2 [(google.api.field_behavior) = REQUIRED];
  optional bool human_pass = 3;
  optional float human_score = 4;
  optional string human_comment = 5;
}

message GetAgentEvalTrendRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string dataset_id = 2;
  int32 limit = 3;
}

message EvalTrendPoint {
  string run_id = 1;
  string created_at = 2;
  string trigger_source = 3;
  float exact_match_score = 4;
  float contains_match_score = 5;
  float llm_judge_score = 6;
  float tool_call_accuracy = 7;
  float pass_at_k = 8;
  float pass_hat_k = 9;
}

message GetAgentEvalTrendResponse {
  repeated EvalTrendPoint points = 1;
}

message CompareEvalRunsRequest {
  repeated string run_ids = 1 [(google.api.field_behavior) = REQUIRED];
}
message EvalRunComparison {
  string run_id = 1;
  string agent_id = 2;
  string dataset_id = 3;
  string created_at = 4;
  float exact_match_score = 5;
  float contains_match_score = 6;
  float llm_judge_score = 7;
  float tool_call_accuracy = 8;
  float pass_at_k = 9;
  float pass_hat_k = 10;
  float delta_exact_match = 11;
  float delta_contains_match = 12;
  float delta_llm_judge = 13;
  float delta_tool_call_accuracy = 14;
  // dataset_hash enables the dataset-changed comparability warning (P3-5).
  string dataset_hash = 15;
}

message CompareEvalRunsResponse {
  repeated EvalRunComparison items = 1;
}

// GetJudgeDivergenceRequest asks for judge-vs-human agreement over annotated
// results of one dataset (P1-3, judge calibration).
message GetJudgeDivergenceRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  // agent_id optionally restricts to one agent's runs.
  string agent_id = 2;
  // threshold is the llm_judge_score pass cutoff (0 means default 0.5).
  float threshold = 3;
  // limit caps the returned divergent case list (0 means default 50);
  // counts always cover the full divergent set regardless of limit.
  int32 limit = 4;
}

// JudgeDivergenceCase is one annotated result where judge and human disagree.
message JudgeDivergenceCase {
  string result_id = 1;
  string run_id = 2;
  string case_id = 3;
  string input = 4;
  string expected_output = 5;
  string actual_output = 6;
  float  llm_judge_score = 7;
  bool   human_pass = 8;
  string human_comment = 9;
  // divergence_kind: false_pass (judge pass, human fail — judge too lenient)
  // or false_fail (judge fail, human pass — judge too strict).
  string divergence_kind = 10;
  string created_at = 11;
}

message GetJudgeDivergenceResponse {
  float threshold = 1;
  // annotated_total counts annotated results where llm_as_judge actually ran
  // (detected via scores_json key, so legacy-path zeros are excluded).
  int32 annotated_total = 2;
  int32 agree_count = 3;
  int32 diverge_count = 4;
  float agreement_rate = 5;
  int32 false_pass_count = 6;
  int32 false_fail_count = 7;
  repeated JudgeDivergenceCase divergent_cases = 8;
}

// --- P2-3: failure grouping ---

message GetFailureGroupsRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  // agent_id optionally restricts to one agent's runs.
  string agent_id = 2;
  // limit caps the returned group list (0 means default 20);
  // total_failed always covers the full failed-result set.
  int32 limit = 3;
}

// EvalFailureGroup aggregates failed case results sharing one error_message.
message EvalFailureGroup {
  string error_message = 1;
  int32  count = 2;
  int32  run_count = 3;
  string latest_at = 4;
}

message GetFailureGroupsResponse {
  int32 total_failed = 1;
  repeated EvalFailureGroup groups = 2;
}

// --- P3-3: pairwise run preference ---

// EvalRunPreference records a human judgment that one run is better than
// another for the same dataset.
message EvalRunPreference {
  string id = 1;
  string dataset_id = 2;
  string run_id_a = 3;
  string run_id_b = 4;
  // winner_run_id must equal run_id_a or run_id_b.
  string winner_run_id = 5;
  string comment = 6;
  string created_by = 7;
  string created_at = 8;
}

message SubmitRunPreferenceRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  string run_id_a = 2 [(google.api.field_behavior) = REQUIRED];
  string run_id_b = 3 [(google.api.field_behavior) = REQUIRED];
  string winner_run_id = 4 [(google.api.field_behavior) = REQUIRED];
  string comment = 5;
}

message ListRunPreferencesRequest {
  string dataset_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
}

message ListRunPreferencesResponse {
  repeated EvalRunPreference items = 1;
}

// --- P2-1: publish regression gate ---

// EvalGateConfig is the singleton publish-gate configuration. The gate runs
// the configured dataset against the configured agent on skill publish /
// pack install and blocks the operation when the score breaches the
// configured floor (min_score) or drops too far vs the latest completed
// baseline (max_drop).
message EvalGateConfig {
  bool   enabled = 1;
  string agent_id = 2;
  string dataset_id = 3;
  // metric: exact_match | contains_match | llm_as_judge | tool_call_accuracy
  // (or any extended scores_json key).
  string metric = 4;
  // min_score: absolute floor in [0,1]; 0 disables the absolute check.
  float min_score = 5;
  // max_drop: allowed drop vs baseline in [0,1]; 0 disables the relative check.
  float max_drop = 6;
  string updated_at = 7;
}

message GetEvalGateRequest {}

message UpdateEvalGateRequest {
  bool   enabled = 1;
  string agent_id = 2;
  string dataset_id = 3;
  string metric = 4;
  float  min_score = 5;
  float  max_drop = 6;
}

service EvaluationService {
  // Datasets
  rpc CreateDataset(CreateDatasetRequest) returns (EvalDataset) {
    option (google.api.http) = {
      post: "/v1/evaluation/datasets"
      body: "*"
    };
  }
  rpc GetDataset(GetDatasetRequest) returns (EvalDataset) {
    option (google.api.http) = {
      get: "/v1/evaluation/datasets/{id}"
    };
  }
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/datasets"
    };
  }
  rpc DeleteDataset(DeleteDatasetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/evaluation/datasets/{id}"
    };
  }
  rpc UpdateDataset(UpdateDatasetRequest) returns (EvalDataset) {
    option (google.api.http) = {
      patch: "/v1/evaluation/datasets/{id}"
      body: "*"
    };
  }
  rpc UploadCases(UploadCasesRequest) returns (UploadCasesResponse) {
    option (google.api.http) = {
      post: "/v1/evaluation/datasets/{dataset_id}/cases"
      body: "*"
    };
  }

  // Runs
  rpc RunEvaluation(RunEvaluationRequest) returns (EvalRun) {
    option (google.api.http) = {
      post: "/v1/evaluation/runs"
      body: "*"
    };
  }
  rpc GetRun(GetRunRequest) returns (EvalRun) {
    option (google.api.http) = {
      get: "/v1/evaluation/runs/{id}"
    };
  }
  rpc DeleteRun(DeleteRunRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/evaluation/runs/{id}"
    };
  }
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/runs"
    };
  }
  rpc GetRunResults(GetRunResultsRequest) returns (GetRunResultsResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/runs/{run_id}/results"
    };
  }
  rpc AnnotateCaseResult(AnnotateCaseResultRequest) returns (EvalCaseResult) {
    option (google.api.http) = {
      patch: "/v1/evaluation/runs/{run_id}/results/{result_id}/annotation"
      body: "*"
    };
  }
  rpc GetAgentEvalTrend(GetAgentEvalTrendRequest) returns (GetAgentEvalTrendResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/agents/{agent_id}/trend"
    };
  }
  rpc CompareEvalRuns(CompareEvalRunsRequest) returns (CompareEvalRunsResponse) {
    option (google.api.http) = {
      post: "/v1/evaluation/runs/compare"
      body: "*"
    };
  }
  rpc GetJudgeDivergence(GetJudgeDivergenceRequest) returns (GetJudgeDivergenceResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/datasets/{dataset_id}/judge-divergence"
    };
  }
  rpc GetFailureGroups(GetFailureGroupsRequest) returns (GetFailureGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/datasets/{dataset_id}/failure-groups"
    };
  }
  rpc SubmitRunPreference(SubmitRunPreferenceRequest) returns (EvalRunPreference) {
    option (google.api.http) = {
      post: "/v1/evaluation/preferences"
      body: "*"
    };
  }
  rpc ListRunPreferences(ListRunPreferencesRequest) returns (ListRunPreferencesResponse) {
    option (google.api.http) = {
      get: "/v1/evaluation/preferences"
    };
  }
  rpc GetEvalGate(GetEvalGateRequest) returns (EvalGateConfig) {
    option (google.api.http) = {
      get: "/v1/evaluation/gate"
    };
  }
  rpc UpdateEvalGate(UpdateEvalGateRequest) returns (EvalGateConfig) {
    option (google.api.http) = {
      put: "/v1/evaluation/gate"
      body: "*"
    };
  }
}
