syntax = "proto3";

package kratos.taxonomy.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/taxonomy/v1;taxonomyv1";
option java_multiple_files = true;
option java_package = "api.kratos.taxonomy.v1";

message TaxonomyNode {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  bool enabled = 6;
  int32 sort_order = 7;
  string parent_id = 8;
  string level = 9;
  string workspace_id = 10;
  string owner_user_id = 11;
  bool is_system = 12;
  string config_json = 13;
  string metadata_json = 14;
  string created_at = 15;
  string updated_at = 16;
  string deleted_at = 17;
}

message ListTaxonomyResponse {
  repeated TaxonomyNode items = 1;
}

message ListTaxonomyTreeResponse {
  repeated TaxonomyTreeNode items = 1;
}

message TaxonomyTreeNode {
  TaxonomyNode node = 1;
  repeated TaxonomyTreeNode children = 2;
}

message CreateTaxonomyRequest {
  string key = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string status = 4;
  optional bool enabled = 5;
  int32 sort_order = 6;
  string parent_id = 7;
  string level = 8;
  string workspace_id = 9;
  string owner_user_id = 10;
  string config_json = 11;
  string metadata_json = 12;
}

message GetTaxonomyRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTaxonomyRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  TaxonomyNode node = 2;
}

message DeleteTaxonomyRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReorderTaxonomyRequest {
  repeated string ids = 1;
}

message ReorderTaxonomyResponse {}

service TaxonomyService {
  rpc ListTaxonomy(google.protobuf.Empty) returns (ListTaxonomyResponse) {
    option (google.api.http) = {get: "/v1/taxonomy"};
  }
  rpc ListTaxonomyTree(google.protobuf.Empty) returns (ListTaxonomyTreeResponse) {
    option (google.api.http) = {get: "/v1/taxonomy/tree"};
  }
  rpc CreateTaxonomy(CreateTaxonomyRequest) returns (TaxonomyNode) {
    option (google.api.http) = {
      post: "/v1/taxonomy"
      body: "*"
    };
  }
  rpc GetTaxonomy(GetTaxonomyRequest) returns (TaxonomyNode) {
    option (google.api.http) = {get: "/v1/taxonomy/{id}"};
  }
  rpc UpdateTaxonomy(UpdateTaxonomyRequest) returns (TaxonomyNode) {
    option (google.api.http) = {
      patch: "/v1/taxonomy/{id}"
      body: "node"
    };
  }
  rpc DeleteTaxonomy(DeleteTaxonomyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/taxonomy/{id}"};
  }
  rpc ReorderTaxonomy(ReorderTaxonomyRequest) returns (ReorderTaxonomyResponse) {
    option (google.api.http) = {
      put: "/v1/taxonomy/reorder"
      body: "*"
    };
  }
}
