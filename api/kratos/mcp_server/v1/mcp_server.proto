syntax = "proto3";

package kratos.mcp_server.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/mcp_server/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.mcp_server.v1";

message MCPServer {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  bool enabled = 6;
  int32 sort_order = 7;
  string config_json = 8;
  string metadata_json = 9;
  string created_at = 10;
  string updated_at = 11;
  string deleted_at = 12;
  // Derived from workspace_id == "": shared/system built-in server, readable by
  // all workspaces but read-only for tenant callers (no real workspace ID is
  // exposed to avoid leaking tenant topology).
  bool shared = 13;
}

// ListMCPServersRequest carries server-side pagination + search params.
// Zero/absent page params keep the legacy unpaginated path (pickers, health
// runner, CLI); the HTTP query fallback (page/page_size/search) is retained
// for older clients.
message ListMCPServersRequest {
  int32 page = 1;      // 1-based
  int32 page_size = 2; // default: 20
  string search = 3;
}

message ListMCPServersResponse {
  repeated MCPServer items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  // summary 是 MCP 采纳汇总统计（使用方数量），供管理页提示「配置了但无 Agent 使用」。
  MCPUsageSummary summary = 5;
}

// MCPUsageSummary 是 MCP 采纳汇总：多少 Agent 的有效工具策略开启了 MCP 门禁。
message MCPUsageSummary {
  int32 enabled_agent_count = 1; // 开启 mcp_tool_set / mcp_broker 门禁的 agent 数
  int32 total_agent_count = 2;   // 全部 agent 数，供展示「N / M」
}

message CreateMCPServerRequest {
  string key = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string status = 4;
  bool enabled = 5;
  int32 sort_order = 6;
  string config_json = 7;
  string metadata_json = 8;
}

message GetMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  MCPServer mcp_server = 2;
}

message DeleteMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message TestMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MCPServerTestResponse {
  bool ok = 1;
  string status = 2;
  string message = 3;
  string details_json = 4;
}

message ValidateMCPServerRequest {
  bool enabled = 1;
  string config_json = 2;
}

message ValidateMCPServerResponse {
  bool ok = 1;
  string status = 2;
  string message = 3;
  string details_json = 4;
}

message MCPServerUserCredential {
  string id = 1;
  string mcp_server_id = 2;
  string user_id = 3;
  string credential_key = 4;
  string status = 5;
  bool configured = 6;
  string masked_preview = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListMCPServerUserCredentialsRequest {
  string mcp_server_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2;
}

message ListMCPServerUserCredentialsResponse {
  repeated MCPServerUserCredential items = 1;
}

message UpsertMCPServerUserCredentialRequest {
  string mcp_server_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
  string credential_key = 3 [(google.api.field_behavior) = REQUIRED];
  string secret = 4;
  string status = 5;
}

message DeleteMCPServerUserCredentialRequest {
  string mcp_server_id = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
  string credential_key = 3 [(google.api.field_behavior) = REQUIRED];
}

service MCPServerService {
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse) {
    option (google.api.http) = {get: "/v1/mcp-servers"};
  }
  rpc CreateMCPServer(CreateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      post: "/v1/mcp-servers"
      body: "*"
    };
  }
  rpc GetMCPServer(GetMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {get: "/v1/mcp-servers/{id}"};
  }
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      patch: "/v1/mcp-servers/{id}"
      body: "mcp_server"
    };
  }
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/mcp-servers/{id}"};
  }
  rpc TestMCPServer(TestMCPServerRequest) returns (MCPServerTestResponse) {
    option (google.api.http) = {
      post: "/v1/mcp-servers/{id}/test"
      body: "*"
    };
  }
  rpc ValidateMCPServer(ValidateMCPServerRequest) returns (ValidateMCPServerResponse) {
    option (google.api.http) = {
      post: "/v1/mcp-servers/validate"
      body: "*"
    };
  }
  rpc ListMCPServerUserCredentials(ListMCPServerUserCredentialsRequest) returns (ListMCPServerUserCredentialsResponse) {
    option (google.api.http) = {get: "/v1/mcp-servers/{mcp_server_id}/user-credentials"};
  }
  rpc UpsertMCPServerUserCredential(UpsertMCPServerUserCredentialRequest) returns (MCPServerUserCredential) {
    option (google.api.http) = {
      post: "/v1/mcp-servers/{mcp_server_id}/user-credentials"
      body: "*"
    };
  }
  rpc DeleteMCPServerUserCredential(DeleteMCPServerUserCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/mcp-servers/{mcp_server_id}/user-credentials/delete"
      body: "*"
    };
  }
}
