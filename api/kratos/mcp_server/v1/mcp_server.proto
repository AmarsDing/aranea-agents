syntax = "proto3";

package kratos.mcp_server.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/mcp_server/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.mcp_server.v1";

message MCPServer {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  bool enabled = 6;
  int32 sort_order = 7;
  string config_json = 8;
  string metadata_json = 9;
  string created_at = 10;
  string updated_at = 11;
  string deleted_at = 12;
}

message ListMCPServersResponse {
  repeated MCPServer items = 1;
}

message CreateMCPServerRequest {
  string key = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  string status = 4;
  bool enabled = 5;
  int32 sort_order = 6;
  string config_json = 7;
  string metadata_json = 8;
}

message GetMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  MCPServer mcp_server = 2;
}

message DeleteMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message TestMCPServerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MCPServerTestResponse {
  bool ok = 1;
  string status = 2;
  string message = 3;
  string details_json = 4;
}

service MCPServerService {
  rpc ListMCPServers(google.protobuf.Empty) returns (ListMCPServersResponse) {
    option (google.api.http) = {get: "/v1/mcp-servers"};
  }
  rpc CreateMCPServer(CreateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      post: "/v1/mcp-servers"
      body: "*"
    };
  }
  rpc GetMCPServer(GetMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {get: "/v1/mcp-servers/{id}"};
  }
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (MCPServer) {
    option (google.api.http) = {
      patch: "/v1/mcp-servers/{id}"
      body: "mcp_server"
    };
  }
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/mcp-servers/{id}"};
  }
  rpc TestMCPServer(TestMCPServerRequest) returns (MCPServerTestResponse) {
    option (google.api.http) = {
      post: "/v1/mcp-servers/{id}/test"
      body: "*"
    };
  }
}
