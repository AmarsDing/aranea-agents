syntax = "proto3";

package kratos.agentbridge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/agentbridge/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.agentbridge.v1";

// CodingAgent 是已注册的外部编程 CLI（ACP stdio 子进程配置）。
message CodingAgent {
  string id = 1;
  string agent_key = 2;     // claude_code / codex / codebuddy
  string display_name = 3;
  string command = 4;
  repeated string args = 5;
  map<string, string> env = 6; // 响应中密钥值掩码（设计 §12）
  bool enabled = 7;
  bool last_probe_ok = 8;
  string last_probe_error = 9;
  string created_at = 10;
  string updated_at = 11;
  // M4 P3-6：liveness 阈值覆盖（JSON 文本，空=用全局默认；键见设计「活跃性监管」§E）
  string liveness_override_json = 12;
  // 03 P0（实施与交互设计）：工具图标（前端静态资源路径或 URL；
  // 空=前端按工具名首字母占位，不允许白块）。
  string icon_url = 13;
  // 能力声明（看板/表单展示）：read_workspace / write_workspace / exec_command。
  repeated string capabilities = 14;
  // 默认自治级别：readonly / workspace / full（发起表单高级项默认值）。
  string default_autonomy = 15;
}

message UpsertAgentRequest {
  string agent_key = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2;
  string command = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string args = 4;
  map<string, string> env = 5;
  bool enabled = 6;
  // M4 P3-6：liveness 阈值覆盖（JSON 文本；省略=保留旧值，"{}"=显式清空回全局默认）
  string liveness_override_json = 7;
  // 03 P0：图标与能力声明（省略=保留旧值；capabilities 传空数组=清空）。
  string icon_url = 8;
  repeated string capabilities = 9;
  string default_autonomy = 10;
}

message ListAgentsResponse {
  repeated CodingAgent items = 1;
}

message ProbeAgentRequest {
  string agent_key = 1 [(google.api.field_behavior) = REQUIRED];
}

message ProbeAgentResponse {
  bool ok = 1;
  string error = 2;
}

// CodingProject 是可派发任务的本机项目目录（cwd 白名单）。
message CodingProject {
  string id = 1;
  string name = 2;
  string path = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
}

message UpsertProjectRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string path = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
}

message ListProjectsResponse {
  repeated CodingProject items = 1;
}

message DeleteProjectRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// CodingTask 是一次外部编程 agent 任务执行记录。
message CodingTask {
  string id = 1;
  string session_id = 2;
  string agent_key = 3;
  string project_name = 4;
  string prompt = 5;
  string status = 6; // dispatched/running/awaiting_approval/cancelling/done/failed/cancelled
  string summary = 7;
  string error = 8;
  int32 progress_count = 9;
  string created_at = 10;
  string completed_at = 11;
  // M4：子进程 PID（进程组根）+ 活跃性监管（UI 徽标数据源，设计 §B/§F）
  int32 child_pid = 12;
  string last_active_at = 13;
  string last_excerpt = 14;
  int32 heartbeat_miss = 15;
  string liveness_state = 16; // healthy/silent/suspect/lost，默认 healthy
  // 03 P0：发起来源（chat=会话内 LLM 派发 / workbench=看板表单直发）与验收结果。
  string origin = 17;
  string review_status = 18; // 空=未验收 / approved / rejected / archived
  string review_comment = 19;
  string reviewed_at = 20;
}

message ListTasksRequest {
  // 03 P0：空=全部会话（看板跨会话视图）；传值=该会话任务（会话内播报）。
  string session_id = 1;
  int32 limit = 2;
  // 空=全部工具；传值=按工具过滤（看板泳道）。
  string agent_key = 3;
}

message ListTasksResponse {
  repeated CodingTask items = 1;
}

message GetTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CancelTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// 03 P0（实施与交互设计）：工作台表单直发任务（不经 LLM）。
// agent_key 空=自动路由（服务端写死的分工表按序挑首个 enabled 工具）。
message DispatchTaskRequest {
  string session_id = 1; // 可选：留痕会话（前端先建会话传入，进度/终态通知路由目标）
  string agent_key = 2;
  string project_query = 3 [(google.api.field_behavior) = REQUIRED]; // 项目名（消歧同 LLM 路径）
  string prompt = 4 [(google.api.field_behavior) = REQUIRED];
  string origin = 5; // 空=workbench；chat 由 LLM 工具路径使用
}

message ProjectCandidate {
  string id = 1;
  string name = 2;
  string path = 3;
  string description = 4;
}

message DispatchTaskResponse {
  CodingTask task = 1; // 歧义时为空
  repeated ProjectCandidate candidates = 2; // 项目名歧义候选（未落任务）
}

// CodingTaskEvent 是统一步骤事件（03 P0 ④：所有工具输出归一化为同一套
// 步骤结构并持久化，支持刷新后回看与回放）。
message CodingTaskEvent {
  string id = 1;
  string task_id = 2;
  int64 seq = 3;        // 任务内单调序号（回放游标）
  string kind = 4;      // agent_message_chunk / tool_call / plan / permission / error / heartbeat
  string title = 5;     // 步骤标题（tool_call 的工具名等）
  string text = 6;      // 步骤详情（截断存储）
  string created_at = 7;
}

message ListTaskEventsRequest {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 after_seq = 2; // 增量拉取游标（0=从头）
  int32 limit = 3;
}

message ListTaskEventsResponse {
  repeated CodingTaskEvent items = 1;
}

// ReviewTaskRequest 验收三动作：approve=通过 / reject=打回（comment 必填，
// 重做由前端以原 prompt+意见重新派发）/ archive=仅存档。
message ReviewTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string action = 2 [(google.api.field_behavior) = REQUIRED];
  string comment = 3;
}

service AgentBridgeService {
  // 工具注册管理（删除经 enabled=false，M1 不提供物理删除）
  rpc UpsertAgent(UpsertAgentRequest) returns (CodingAgent) {
    option (google.api.http) = {
      post: "/v1/agentbridge/agents"
      body: "*"
    };
  }
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/agentbridge/agents"};
  }
  rpc ProbeAgent(ProbeAgentRequest) returns (ProbeAgentResponse) {
    option (google.api.http) = {
      post: "/v1/agentbridge/agents/probe"
      body: "*"
    };
  }
  // 项目目录注册管理
  rpc UpsertProject(UpsertProjectRequest) returns (CodingProject) {
    option (google.api.http) = {
      post: "/v1/agentbridge/projects"
      body: "*"
    };
  }
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/v1/agentbridge/projects"};
  }
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/agentbridge/projects/{id}"};
  }
  // 任务查询/取消
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {get: "/v1/agentbridge/tasks"};
  }
  rpc GetTask(GetTaskRequest) returns (CodingTask) {
    option (google.api.http) = {get: "/v1/agentbridge/tasks/{id}"};
  }
  rpc CancelTask(CancelTaskRequest) returns (CodingTask) {
    option (google.api.http) = {
      post: "/v1/agentbridge/tasks/{id}/cancel"
      body: "*"
    };
  }
  // 03 P0：工作台直发 / 步骤事件回放 / 验收
  rpc DispatchTask(DispatchTaskRequest) returns (DispatchTaskResponse) {
    option (google.api.http) = {
      post: "/v1/agentbridge/tasks"
      body: "*"
    };
  }
  rpc ListTaskEvents(ListTaskEventsRequest) returns (ListTaskEventsResponse) {
    option (google.api.http) = {get: "/v1/agentbridge/tasks/{task_id}/events"};
  }
  rpc ReviewTask(ReviewTaskRequest) returns (CodingTask) {
    option (google.api.http) = {
      post: "/v1/agentbridge/tasks/{id}/review"
      body: "*"
    };
  }
}
