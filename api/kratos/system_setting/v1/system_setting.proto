syntax = "proto3";

package kratos.system_setting.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "aranea-agents/api/kratos/system_setting/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.system_setting.v1";

message SystemSettings {
  // Absolute or workspace-relative path used as the platform working directory.
  string work_directory = 1;
  google.protobuf.Timestamp update_time = 2;
  // Platform root path (install / deployment root for data and resources).
  string root_directory = 3;
  // Platform-wide monthly spend cap (micro-USD). 0 = disabled. Synced to usage_quotas scope global/global.
  int64 global_monthly_micro_usd = 4;
  // Public A2A endpoint URL prefix (no trailing slash). Empty uses env/config/derived chain.
  string a2a_public_base_url = 5;
  // True when platform credential_encryption_key is stored (auto-generated on first use). Key value is not exposed.
  bool credential_encryption_key_configured = 6;
  // Knowledge RAG embedder defaults (persisted; env KRATOS_KNOWLEDGE_EMBED_* overrides at startup).
  KnowledgeEmbedSettings knowledge_embed = 7;
  // Allow MCP Broker mcp_call against ad-hoc HTTP endpoints (production off by default).
  bool mcp_allow_adhoc_http = 8;
  // Evaluation UserSim / LLM-as-Judge defaults (env KRATOS_EVAL_* overrides at runtime).
  EvalLLMSettings eval_llm = 9;
}

message EvalLLMSettings {
  string sim_provider = 1;
  string sim_model = 2;
  string judge_provider = 3;
  string judge_model = 4;
  bool configured = 5;
}

message KnowledgeEmbedSettings {
  string provider = 1;   // openai | ollama | gemini | huggingface
  string base_url = 2;   // TEI / custom API base
  string model = 3;      // e.g. gemini-embedding-001
  int32 dim = 4;
  bool configured = 5;
  bool has_api_key = 6;  // key value never returned
}

message UpdateSystemSettingsRequest {
  string work_directory = 1;
  string root_directory = 2;
  int64 global_monthly_micro_usd = 3;
  string a2a_public_base_url = 4;
  string knowledge_embed_provider = 5;
  string knowledge_embed_base_url = 6;
  // Empty = do not change stored key; non-empty replaces.
  string knowledge_embed_api_key = 7;
  string knowledge_embed_model = 8;
  int32 knowledge_embed_dim = 9;
  bool mcp_allow_adhoc_http = 10;
  string eval_sim_provider = 11;
  string eval_sim_model = 12;
  string eval_judge_provider = 13;
  string eval_judge_model = 14;
}

service SystemSettingService {
  rpc GetSystemSettings(google.protobuf.Empty) returns (SystemSettings) {
    option (google.api.http) = {
      get: "/v1/system-settings"
    };
  }
  rpc UpdateSystemSettings(UpdateSystemSettingsRequest) returns (SystemSettings) {
    option (google.api.http) = {
      put: "/v1/system-settings"
      body: "*"
    };
  }
}
