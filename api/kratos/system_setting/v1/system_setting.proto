syntax = "proto3";

package kratos.system_setting.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "aranea-agents/api/kratos/system_setting/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.system_setting.v1";

message SystemSettings {
  // Absolute or workspace-relative path used as the platform working directory.
  string work_directory = 1;
  google.protobuf.Timestamp update_time = 2;
  // Platform root path (install / deployment root for data and resources).
  string root_directory = 3;
  // Platform-wide monthly spend cap (micro-USD). 0 = disabled. Synced to usage_quotas scope global/global.
  int64 global_monthly_micro_usd = 4;
  // Public A2A endpoint URL prefix (no trailing slash). Empty uses env/config/derived chain.
  string a2a_public_base_url = 5;
  // True when platform credential_encryption_key is stored (auto-generated on first use). Key value is not exposed.
  bool credential_encryption_key_configured = 6;
  // Knowledge RAG embedder defaults (persisted; env KRATOS_KNOWLEDGE_EMBED_* overrides at startup).
  KnowledgeEmbedSettings knowledge_embed = 7;
  // Allow MCP Broker mcp_call against ad-hoc HTTP endpoints (production off by default).
  bool mcp_allow_adhoc_http = 8;
  // Evaluation UserSim / LLM-as-Judge defaults (env KRATOS_EVAL_* overrides at runtime).
  EvalLLMSettings eval_llm = 9;
  // Web research (Tavily / SerpAPI) defaults for web_research tool. Env TAVILY_API_KEY / SERPAPI_API_KEY overrides api_key when DB empty.
  WebResearchSettings web_research = 10;
  // Voice companion (M74) ASR/TTS provider config. Empty fields fall back to
  // SPEECH_* env vars at read time (field-level merge); credentials never returned.
  SpeechSettings speech = 11;
  // Platform default Refine LLM (PGO-3): shared by PromptRefiner / self-improvement
  // Analyst-Patcher-Critic / knowledge organizer / skill auto-creator / evolution
  // drafter. Credentials resolve via model catalog first; stored api_key is the
  // fallback and is never returned.
  RefineLLMSettings default_refine = 12;
}

message SpeechSettings {
  SpeechASRSettings asr = 1;
  SpeechTTSSettings tts = 2;
  // Stored voice-archive toggle. False may mean "explicitly off" or "unset →
  // env SPEECH_ARCHIVE_USER_AUDIO fallback" (tri-state collapsed for display).
  bool archive_user_audio = 3;
}

message SpeechASRSettings {
  string driver = 1;      // volcengine
  string endpoint = 2;
  string resource_id = 3;
  string language = 4;    // default zh-CN
  bool configured = 5;
  bool has_api_key = 6;   // app_key/access_key never returned
}

message SpeechTTSSettings {
  string driver = 1;      // volcengine
  string endpoint = 2;
  string resource_id = 3;
  string voice = 4;       // provider voice ID
  double speed_ratio = 5; // 0 = unset (env/default 1.0)
  bool configured = 6;
  bool has_api_key = 7;   // app_key/access_key never returned
}

message RefineLLMSettings {
  string provider = 1;   // model catalog provider code, e.g. deepseek
  string model = 2;      // model api id, e.g. deepseek-v4-flash
  string base_url = 3;   // optional override; empty = catalog provider base url
  bool configured = 4;   // provider && model both non-empty
  bool has_api_key = 5;  // fallback key stored; key value never returned
}

message WebResearchSettings {
  string provider = 1;       // tavily | serpapi
  int32 max_results = 2;
  int32 fetch_top = 3;
  string search_depth = 4;   // Tavily: basic | advanced | fast | ultra-fast
  int32 timeout_sec = 5;
  string http_proxy = 6;     // optional outbound proxy for search/fetch
  bool configured = 7;
  bool has_api_key = 8;      // key value never returned
}

message EvalLLMSettings {
  string sim_provider = 1;
  string sim_model = 2;
  string judge_provider = 3;
  string judge_model = 4;
  bool configured = 5;
}

message KnowledgeEmbedSettings {
  string provider = 1;   // openai | ollama | gemini | huggingface
  string base_url = 2;   // TEI / custom API base
  string model = 3;      // e.g. gemini-embedding-001
  int32 dim = 4;
  bool configured = 5;
  bool has_api_key = 6;  // key value never returned
}

message UpdateSystemSettingsRequest {
  string work_directory = 1;
  string root_directory = 2;
  int64 global_monthly_micro_usd = 3;
  string a2a_public_base_url = 4;
  string knowledge_embed_provider = 5;
  string knowledge_embed_base_url = 6;
  // Empty = do not change stored key; non-empty replaces.
  string knowledge_embed_api_key = 7;
  string knowledge_embed_model = 8;
  int32 knowledge_embed_dim = 9;
  bool mcp_allow_adhoc_http = 10;
  string eval_sim_provider = 11;
  string eval_sim_model = 12;
  string eval_judge_provider = 13;
  string eval_judge_model = 14;
  string web_research_provider = 15;
  // Empty = do not change stored key; non-empty replaces.
  string web_research_api_key = 16;
  int32 web_research_max_results = 17;
  int32 web_research_fetch_top = 18;
  string web_research_search_depth = 19;
  int32 web_research_timeout_sec = 20;
  string web_research_http_proxy = 21;
  // Voice companion speech settings (M74 V2-T7). Empty string / 0 = keep stored
  // value; credential fields: empty = do not change stored key, non-empty replaces.
  string speech_asr_driver = 22;
  string speech_asr_endpoint = 23;
  string speech_asr_app_key = 24;
  string speech_asr_access_key = 25;
  string speech_asr_resource_id = 26;
  string speech_asr_language = 27;
  string speech_tts_driver = 28;
  string speech_tts_endpoint = 29;
  string speech_tts_app_key = 30;
  string speech_tts_access_key = 31;
  string speech_tts_resource_id = 32;
  string speech_tts_voice = 33;
  double speech_tts_speed_ratio = 34;
  // Tri-state via proto3 optional: unset = keep stored value; explicit true/false
  // replaces (explicit value ends env fallback for the toggle).
  optional bool speech_archive_user_audio = 35;
  // X-Api-Key 鉴权模式（火山控制台新 API Key，M74 真机校准）：write-only，
  // 非空即替换并存值；与 app_key/access_key legacy 对并存，api_key 非空优先。
  string speech_asr_api_key = 36;
  string speech_tts_api_key = 37;
  // Platform default Refine LLM (PGO-3-PROTO-02). Section applied when any of
  // provider/model/base_url is non-empty (same convention as knowledge_embed);
  // api_key: empty = do not change stored key, non-empty replaces.
  string refine_llm_provider = 38;
  string refine_llm_model = 39;
  string refine_llm_base_url = 40;
  string refine_llm_api_key = 41;
}

message TestWebResearchRequest {
  string provider = 1;
  // Empty = use stored system_settings key or env fallback.
  string api_key = 2;
  int32 max_results = 3;
  int32 fetch_top = 4;
  string search_depth = 5;
  int32 timeout_sec = 6;
  string http_proxy = 7;
}

message TestWebResearchResponse {
  bool ok = 1;
  string message = 2;
  string provider = 3;
  int32 result_count = 4;
  int32 latency_ms = 5;
  double response_time_sec = 6;
}

service SystemSettingService {
  rpc GetSystemSettings(google.protobuf.Empty) returns (SystemSettings) {
    option (google.api.http) = {
      get: "/v1/system-settings"
    };
  }
  rpc UpdateSystemSettings(UpdateSystemSettingsRequest) returns (SystemSettings) {
    option (google.api.http) = {
      put: "/v1/system-settings"
      body: "*"
    };
  }
  rpc TestWebResearch(TestWebResearchRequest) returns (TestWebResearchResponse) {
    option (google.api.http) = {
      post: "/v1/system-settings/web-research/test"
      body: "*"
    };
  }
}
