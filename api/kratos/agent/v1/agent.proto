syntax = "proto3";

package kratos.agent.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/agent/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.agent.v1";

// AgentRuntimeSettings mirrors legacy agent_runtime_settings / frontend AgentRuntimeSettings.
message AgentRuntimeSettings {
  string agent_id = 1;
  bool self_evolve = 2;
  bool subagents_enabled = 3;
  int32 subagents_max_concurrency = 4;
  int32 subagents_max_generation_depth = 5;
  int32 subagents_max_children_per_agent = 6;
  int32 subagents_archive_after_minutes = 7;
  int32 subagents_max_retries = 8;
  string subagents_model_override = 9;
  bool tools_enabled = 10;
  string tools_profile = 11;
  string tools_tool_call_prefix = 12;
  string tools_allow_json = 13;
  string tools_deny_json = 14;
  string tools_concurrent_allow_json = 15;
  bool memory_enabled = 16;
  int32 memory_max_chunk_length = 17;
  int32 memory_max_results = 18;
  double memory_min_score = 19;
  bool heartbeat_enabled = 20;
  int32 heartbeat_interval_minutes = 21;
  bool evolution_self_evolve = 22;
  bool evolution_skill_evolve = 23;
  bool evolution_metrics_enabled = 24;
  bool evolution_suggestions_enabled = 25;
  double guardrail_max_change_per_period = 26;
  int32 guardrail_min_data_points = 27;
  int32 guardrail_rollback_on_decline_percent = 28;
  int32 l0_recent_window_turns = 29;
  int32 l0_recent_window_tokens = 30;
  double l0_summary_threshold = 31;
  int32 l0_summary_keep_turns = 32;
  string l0_truncate_strategy = 33;
  bool l0_inject_l1 = 34;
  bool l0_inject_l3 = 35;
  bool l0_inject_l4 = 36;
  int32 l0_l3_max_chunks = 37;
  int32 l0_l4_max_paths = 38;
  string l0_snapshot_mode = 39;
  bool l0_snapshot_enabled = 124;
  bool l1_enabled = 40;
  int32 l1_budget_tokens = 41;
  int32 l1_field_max_tokens = 42;
  int32 l1_history_keep_revisions = 43;
  string l1_default_schema_id = 44;
  int32 l1_archive_on_idle_minutes = 45;
  bool l2_episode_enabled = 46;
  double l2_episode_min_importance = 47;
  bool l2_index_enabled = 48;
  string l2_index_embedding_model = 49;
  bool l2_recall_enabled = 50;
  int32 l2_recall_max = 51;
  int32 l2_retention_days = 52;
  int32 l2_archive_after_days = 53;
  bool l3_enabled = 54;
  int32 l3_recall_top_k = 55;
  double l3_recall_min_score = 56;
  string l3_recall_scopes_json = 57;
  string l3_embedding_model = 58;
  int32 l3_decay_interval_hours = 59;
  double l3_archive_threshold = 60;
  int32 l3_max_per_recall_chars = 61;
  bool l4_enabled = 62;
  bool l4_graph_inject_neighbors = 63;
  int32 l4_graph_max_neighbors = 64;
  int32 l4_graph_max_hops = 65;
  bool l4_identity_inject = 66;
  bool l4_strategy_inject = 67;
  bool evo_enabled = 68;
  bool evo_auto_apply = 69;
  int32 evo_min_episodes = 70;
  int32 evo_min_negative_feedback = 71;
  int32 evo_throttle_hours = 72;
  int32 evo_proposal_ttl_days = 73;
  int32 evo_persona_max_chars = 74;
  int32 evo_system_prompt_max_appends = 75;
  string created_at = 76;
  string updated_at = 77;
  string skill_runtime_json = 78;
  optional bool intent_pass_enabled = 79;
  string variables_json = 80;
  string model_instructions_json = 81;
  bool context_compaction_enabled = 82;
  // 121: removed (micro_compact_enabled, L1 MicroCompact retired 2026-07-20).
  reserved 121;
  bool memory_compact_enabled = 122;
  bool tool_result_gate_enabled = 123;
  bool session_summary_enabled = 83;
  // skill_load_mode controls how skill content is loaded:
  //   "once"      - load for one model request, then offload
  //   "turn"      - load for the current invocation, offload on next (default)
  //   "session"   - keep loaded across invocations (legacy)
  //   "progressive" - 3-phase progressive loading: L0 manifest only in prompt,
  //                   L1 body via skill_load tool, L2 refs via skill_select_docs
  string skill_load_mode = 84;
  string output_schema_json = 85;
  string model_selector = 86;
  bool tools_retry_enabled = 87;
  int32 tools_retry_max_attempts = 88;
  int32 tools_retry_initial_interval_ms = 89;
  double tools_retry_backoff_factor = 90;
  int32 tools_retry_max_interval_ms = 91;
  bool tools_retry_jitter = 92;
  bool tools_parallel_enabled = 93;
  bool tools_streaming_enabled = 94;
  string channel_id = 95;
  string chat_id = 96;
  string workspace = 97;
  string reasoning_mode = 98;
  string reasoning_level = 99;
  // planner_kind selects the planning strategy: "" | "builtin" | "react" | "a2ui"
  string planner_kind = 100;
  // code_executor_type selects Skill code execution backend: local | docker | e2b | container
  string code_executor_type = 101;
  // planner_config_json holds planner-specific options (shape depends on planner_kind)
  string planner_config_json = 102;
  // Ralph Loop: iterative run until completion_promise and/or verify_command succeeds
  int32 ralph_loop_max_iterations = 103;
  string ralph_loop_completion_promise = 104;
  string ralph_loop_verify_command = 105;
  int32 ralph_loop_verify_timeout_seconds = 106;
  string ralph_loop_promise_tag_open = 107;
  string ralph_loop_promise_tag_close = 108;
  string ralph_loop_verify_work_dir = 109;
  // L0CompressProvider / L0CompressModel: cheaper catalog model for session summarization; empty → chat model.
  string l0_compress_provider = 110;
  string l0_compress_model = 111;
  // MemoryWorkerProvider / MemoryWorkerModel: LLM for async memory extraction; empty → L0 compress, then chat model.
  string memory_worker_provider = 112;
  string memory_worker_model = 113;
  bool tools_circuit_breaker_enabled = 114;
  string tools_circuit_breaker_overrides_json = 115;
  string tools_deferred_json = 116;
  bool tools_command_safety_enabled = 117;
  // CompressLLMCacheEnabled enables LLM compression response caching (LRU + TTL).
  bool compress_llm_cache_enabled = 118;
  // CompressLLMCacheMaxEntries is the maximum number of cache entries (default 256).
  int32 compress_llm_cache_max_entries = 119;
  // CompressLLMCacheTTLSec is the cache TTL in seconds (default 600).
  int32 compress_llm_cache_ttl_sec = 120;
  // CompressionBufferRatio is the fraction of contextWindow reserved as compression buffer (default 0.15, range 0.10–0.25).
  double compression_buffer_ratio = 128;
  // SoftTriggerRatio is the fraction of effective_budget at which async compression triggers (default 0.70).
  double soft_trigger_ratio = 129;
  // HardTriggerRatio is the fraction of effective_budget at which sync compression triggers (default 0.90).
  double hard_trigger_ratio = 130;
  // SubagentsStoredResultRunes is the max rune count for stored subagent results (default 4000).
  int32 subagents_stored_result_runes = 125;
  // SubagentsStoredSummaryRunes is the max rune count for stored subagent summaries (default 240).
  int32 subagents_stored_summary_runes = 126;
  // VerificationTruncateChars is the max character count for truncating team output in verification gate prompts (default 2000).
  int32 verification_truncate_chars = 127;
  // L1HistoryEnabled controls whether old field values are archived to memory_l1_field_history on upsert (default false).
  bool l1_history_enabled = 131;
  // L3RecallBudgetTokens is the token budget for the fused L2/L3 recall block
  // in the prompt (FR-12/P2). Hits are packed score-descending and the block is
  // truncated once the estimated tokens exceed this budget. 0 = default 800.
  // Preset tiers: 400 (compact) / 800 (standard) / 1600 (generous).
  int32 l3_recall_budget_tokens = 132;
}

message AgentPromptFile {
  string id = 1;
  string agent_id = 2;
  string name = 3;
  string body = 4;
  int32 sort_order = 5;
  string created_at = 6;
  string updated_at = 7;
}

// A2AProxyConfig connects an a2a_proxy catalog agent to a remote A2A service.
message A2AProxyConfig {
  string remote_url = 1;
  string agent_card_url = 2;
  bool enable_streaming = 3;
  string auth_type = 4;
  string auth_config_json = 5;
  int32 timeout_seconds = 6;
}

message Agent {
  string id = 1;
  string agent_key = 2;
  string display_name = 3;
  string provider = 4;
  string model = 5;
  string status = 6;
  bool is_default = 7;
  bool is_favorite = 8;
  string icon = 9;
  string agent_description = 10;
  string position_id = 11;
  string system_prompt_mode = 12;
  int32 context_window = 13;
  int32 budget_monthly_cents = 14;
  string config_json = 15;
  string created_at = 16;
  string updated_at = 17;
  string deleted_at = 18;
  AgentRuntimeSettings settings = 19;
  repeated AgentPromptFile files = 20;
  // agent_kind: "" | "llm" | "a2a_proxy"
  string agent_kind = 21;
  A2AProxyConfig a2a_proxy_config = 22;
  // a2a_endpoint_enabled: true when A2A AgentCard is enabled (list enrichment).
  bool a2a_endpoint_enabled = 23;
  // List enrichment: latest session run lifecycle (runtime.status) or idle/completed.
  string last_run_status = 24;
  string last_run_at = 25;
  int32 pending_evolution_count = 26;
  // Creator user id (stringified auth UserID).
  string created_by = 27;
  // readonly: system agents cannot be deleted.
  bool readonly = 28;
  string position_key = 29;
  string agent_variant = 30;
  string variant_description = 31;
  // source: user | system | imported (origin tracking, maps from DB source column).
  string source = 32;
  // kind: user | system_builtin | ecosystem_preset | marketplace | certified (ownership classification, maps from DB kind column).
  string kind = 33;
}

message ListAgentsRequest {
  string keyword = 1;
  string status = 2;
  string provider = 3;
  string org_node_id = 4;
  int32 limit = 5;
  int32 offset = 6;
  // Filter by creator: empty = all; "mine" = current user; otherwise specific user id.
  string created_by = 7;
}

message AgentCreator {
  string user_id = 1;
  string label = 2;
}

message ListAgentCreatorsResponse {
  repeated AgentCreator items = 1;
}

message ListAgentsResponse {
  repeated Agent items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreateAgentRequest {
  string agent_key = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Required for llm; omit for agent_kind=a2a_proxy (server defaults provider=a2a, model=proxy).
  string provider = 3;
  string model = 4;
  string icon = 5;
  string agent_description = 6;
  string position_id = 7;
  string system_prompt_mode = 8;
  int32 context_window = 9;
  int32 budget_monthly_cents = 10;
  string config_json = 11;
  AgentRuntimeSettings settings = 12;
  repeated AgentPromptFile files = 13;
  string agent_kind = 14;
  A2AProxyConfig a2a_proxy_config = 15;
  string position_key = 16;
  string agent_variant = 17;
  string variant_description = 18;
}

message GetAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  Agent agent = 2;
}

message DeleteAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetAgentPromptPreviewRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string mode = 2;
}

message GetAgentPromptPreviewResponse {
  string preview = 1;
  // instruction is the static build-time system instruction (Description + prompt files + RuntimeCapabilityCue).
  string instruction = 2;
  repeated PromptSectionEstimate sections = 3;
  int32 static_total_tokens = 4;
  int32 runtime_overlay_est_tokens = 5;
  string runtime_note = 6;
}

message PromptSectionEstimate {
  string key = 1;
  string label = 2;
  int32 est_tokens = 3;
  // build = included in instruction; runtime = injected per LLM call when enabled.
  string source = 4;
}

// EffectiveAgentTool is one evaluated tool row for an agent (legacy /agents/{id}/tools/effective JSON).
message EffectiveAgentTool {
  string tool_key = 1;
  string display_name = 2;
  string category = 3;
  string source = 4;
  bool enabled = 5;
  string effective_state = 6;
  string reason = 7;
}

message AgentEffectiveToolsView {
  bool tools_enabled = 1;
  string profile = 2;
  repeated string allow = 3;
  repeated string deny = 4;
  repeated EffectiveAgentTool items = 5;
}

message ToggleFavoriteRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetAgentEffectiveToolsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateAgentToolPolicyRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool tools_enabled = 2;
  string profile = 3;
  repeated string allow = 4;
  repeated string deny = 5;
}

message CreateAgentPromptFileRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string body = 3;
  int32 sort_order = 4;
}

message UpdateAgentPromptFileRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3;
  string body = 4;
  int32 sort_order = 5;
}

message DeleteAgentPromptFileRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

message EstimateTokensRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message FileTokenEstimate {
  string file_id = 1;
  string file_name = 2;
  int32 estimated_tokens = 3;
}

message EstimateTokensResponse {
  int32 total_tokens = 1;
  repeated FileTokenEstimate file_estimates = 2;
}

message CheckAgentKeyRequest {
  string agent_key = 1 [(google.api.field_behavior) = REQUIRED];
}

message CheckAgentKeyResponse {
  bool available = 1;
  string message = 2;
}

message GetAgentEvolutionMetricsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string time_range = 2;
}

message MetricDataPoint {
  string date = 1;
  double value = 2;
}

message EvolutionMetricsResponse {
  string agent_id = 1;
  string time_range = 2;
  double tool_success_rate = 3;
  double retrieval_quality = 4;
  int32 total_episodes = 5;
  int32 negative_feedback = 6;
  repeated MetricDataPoint tool_success_series = 7;
  repeated MetricDataPoint retrieval_quality_series = 8;
  // S-05: true when metrics are incomplete due to partial query failures.
  bool partial = 9;
  // S-08: which sub-queries failed (for observability).
  repeated string partial_errors = 10;
}

message GetAgentEvolutionSuggestionsRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2;
}

message EvolutionSuggestion {
  string id = 1;
  string agent_id = 2;
  string type = 3;
  string title = 4;
  string content = 5;
  string status = 6;
  string diff_preview = 7;
  string created_at = 8;
  string applied_at = 9;
  // applicable 为 true 时前端才显示「应用」按钮：仅 persona/prompt
  // 且 metadata 携带 apply_payload 的建议可应用；通知类建议为 false。
  bool applicable = 10;
}

message ListEvolutionSuggestionsResponse {
  repeated EvolutionSuggestion items = 1;
}

message ApplyEvolutionSuggestionRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string suggestion_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message RejectEvolutionSuggestionRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string suggestion_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 拒绝原因（可选），持久化到 metadata.rejection_reason 供审计。
  string reason = 3;
}

message RollbackEvolutionSuggestionRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string suggestion_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message EditPromptFileByAIRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
  string file_id = 2 [(google.api.field_behavior) = REQUIRED];
  string instruction = 3 [(google.api.field_behavior) = REQUIRED];
}

message EditPromptFileByAIResponse {
  AgentPromptFile file = 1;
}

message AgentTemplate {
  string key = 1;
  string label = 2;
  string icon = 3;
  string description = 4;
  string display_name = 5;
  string provider = 6;
  string model = 7;
}

message ListAgentTemplatesResponse {
  repeated AgentTemplate items = 1;
}

message DuplicateAgentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// BatchUpdateAgentsRequest is LIST-04 bulk enable/disable/delete.
// status and delete are mutually exclusive; exactly one must be set.
message BatchUpdateAgentsRequest {
  repeated string ids = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2; // optional: active | inactive
  bool delete = 3;
}

message BatchUpdateAgentsResponse {
  int32 affected = 1;
}

service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {get: "/v1/agents"};
  }
  rpc CreateAgent(CreateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/v1/agents"
      body: "*"
    };
  }
  // Static sub-resource GET paths MUST be registered before /v1/agents/{id}
  // to avoid gorilla/mux matching the variable segment first
  // (e.g. "creators" as {id}).
  rpc ListAgentCreators(google.protobuf.Empty) returns (ListAgentCreatorsResponse) {
    option (google.api.http) = {get: "/v1/agents/creators"};
  }
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      patch: "/v1/agents/{id}"
      body: "agent"
    };
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (Agent) {
    option (google.api.http) = {
      patch: "/v1/agents/{id}/favorite"
      body: "*"
    };
  }
  rpc GetAgentPromptPreview(GetAgentPromptPreviewRequest) returns (GetAgentPromptPreviewResponse) {
    option (google.api.http) = {get: "/v1/agents/{id}/system-prompt/preview"};
  }
  rpc GetAgentEffectiveTools(GetAgentEffectiveToolsRequest) returns (AgentEffectiveToolsView) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/tools/effective"};
  }
  rpc UpdateAgentToolPolicy(UpdateAgentToolPolicyRequest) returns (AgentEffectiveToolsView) {
    option (google.api.http) = {
      put: "/v1/agents/{agent_id}/tools/policy"
      body: "*"
    };
  }
  rpc CreateAgentPromptFile(CreateAgentPromptFileRequest) returns (AgentPromptFile) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/files"
      body: "*"
    };
  }
  rpc UpdateAgentPromptFile(UpdateAgentPromptFileRequest) returns (AgentPromptFile) {
    option (google.api.http) = {
      patch: "/v1/agents/{agent_id}/files/{id}"
      body: "*"
    };
  }
  rpc DeleteAgentPromptFile(DeleteAgentPromptFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/agents/{agent_id}/files/{id}"};
  }
  rpc EstimateTokens(EstimateTokensRequest) returns (EstimateTokensResponse) {
    option (google.api.http) = {post: "/v1/agents/{agent_id}/files/estimate-tokens" body: "*"};
  }
  rpc EditPromptFileByAI(EditPromptFileByAIRequest) returns (EditPromptFileByAIResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/files/{file_id}/ai-edit"
      body: "*"
    };
  }
  rpc ListAgentTemplates(google.protobuf.Empty) returns (ListAgentTemplatesResponse) {
    option (google.api.http) = {get: "/v1/agent-templates"};
  }
  rpc DuplicateAgent(DuplicateAgentRequest) returns (Agent) {
    option (google.api.http) = {post: "/v1/agents/{id}/duplicate" body: "*"};
  }
  rpc BatchUpdateAgents(BatchUpdateAgentsRequest) returns (BatchUpdateAgentsResponse) {
    option (google.api.http) = {post: "/v1/agents:batchUpdate" body: "*"};
  }
  rpc CheckAgentKey(CheckAgentKeyRequest) returns (CheckAgentKeyResponse) {
    option (google.api.http) = {get: "/v1/agent-keys/check"};
  }
  rpc GetAgentEvolutionMetrics(GetAgentEvolutionMetricsRequest) returns (EvolutionMetricsResponse) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/evolution/metrics"};
  }
  rpc GetAgentEvolutionSuggestions(GetAgentEvolutionSuggestionsRequest) returns (ListEvolutionSuggestionsResponse) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/evolution/suggestions"};
  }
  rpc ApplyEvolutionSuggestion(ApplyEvolutionSuggestionRequest) returns (EvolutionSuggestion) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/evolution/suggestions/{suggestion_id}/apply"
      body: "*"
    };
  }
  rpc RejectEvolutionSuggestion(RejectEvolutionSuggestionRequest) returns (EvolutionSuggestion) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/evolution/suggestions/{suggestion_id}/reject"
      body: "*"
    };
  }
  rpc RollbackEvolutionSuggestion(RollbackEvolutionSuggestionRequest) returns (EvolutionSuggestion) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/evolution/suggestions/{suggestion_id}/rollback"
      body: "*"
    };
  }
}
