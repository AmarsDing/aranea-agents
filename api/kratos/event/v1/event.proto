syntax = "proto3";

package kratos.event.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "aranea-agents/api/kratos/event/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.event.v1";

// EnvelopeRecord is a persisted event.Envelope snapshot.
message EnvelopeRecord {
  string id = 1;
  string session_id = 2;
  string type = 3;
  string author = 4;
  string channel = 5;
  string envelope_json = 6;
  string created_at = 7;
}

message ListEventsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  // RFC3339 / RFC3339Nano lower bound (inclusive).
  string since = 2;
  // RFC3339 / RFC3339Nano upper bound (inclusive).
  string until = 3;
  string type = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListEventsResponse {
  repeated EnvelopeRecord items = 1;
  int32 total = 2;
}

service EventService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {
      get: "/v1/events"
    };
  }
}
