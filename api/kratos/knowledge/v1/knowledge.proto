syntax = "proto3";

package kratos.knowledge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/knowledge/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.knowledge.v1";

// KnowledgeCollection is a named vector store with a fixed embedding model.
message KnowledgeCollection {
  string id = 1;
  string name = 2;
  string description = 3;
  string embedding_model = 4;
  int32  dim = 5;
  string status = 6;          // active | indexing | error
  int32  document_count = 7;
  int32  chunk_count = 8;
  string workspace = 9;
  string created_at = 10;
  string updated_at = 11;
  // Vault fields (V2: local folder as source of truth). Empty = legacy collection.
  string root_path = 12;
  string sync_state = 13;     // active | paused | error | migrating
  string last_sync_at = 14;
}

// KnowledgeDocument is one source document ingested into a collection.
message KnowledgeDocument {
  string id = 1;
  string collection_id = 2;
  string source = 3;          // filename, URL, or description
  string mime_type = 4;
  int64  size_bytes = 5;
  int32  chunk_count = 6;
  string status = 7;          // pending | indexing | indexed | error
  string error_message = 8;
  string created_at = 9;
  string updated_at = 10;
  bool   extract_supported = 11;  // true when backend can extract text from this MIME type (REV-D)
  bool   organized = 12;          // true when content was organized into Markdown by LLM
  // Vault + summary-card fields (P3 explorer list/hover-card first-density).
  string rel_path = 13;       // vault-relative path ('/' separator); empty = non-vault doc
  string summary = 14;        // LLM summary card (may be stale; empty when unavailable)
  repeated string tags = 15;  // LLM tags from summary card
  string doc_type = 16;       // report | manual | note | faq | ...
}

// DocumentContent is the full extracted/organized text of one document (preview).
message DocumentContent {
  string id = 1;
  string content_text = 2;    // organized Markdown (or raw extracted text when not organized)
  bool   organized = 3;
}

// KnowledgeChunk is one indexed text chunk with its embedding vector.
message KnowledgeChunk {
  string id = 1;
  string doc_id = 2;
  string collection_id = 3;
  string content = 4;
  repeated float embedding = 5;
  string metadata_json = 6;
  int32  chunk_index = 7;
  float  score = 8;           // similarity score (only in search results)
}

// --- Requests / Responses ---

// CreateCollectionRequest creates a Vault (V2: local folder as source of truth).
// root_path is required; embedding_model is optional (empty = lexical-only vault, no semantic layer).
message CreateCollectionRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string description = 2;
  string embedding_model = 3;
  string root_path = 4 [(google.api.field_behavior) = REQUIRED];
}

message GetCollectionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListCollectionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListCollectionsResponse {
  repeated KnowledgeCollection items = 1;
  int32 total = 2;
}

message DeleteCollectionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message IngestDocumentRequest {
  // US-14: optional. Empty = auto-fall into the lazily-created "默认知识库" (default collection).
  string collection_id = 1;
  string source = 2 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 3;
  // content_base64 is the raw document payload (base64-encoded).
  string content_base64 = 4 [(google.api.field_behavior) = REQUIRED];
  string metadata_json = 5;
  // chunk_size is the target token/char size per chunk (0 = server default 512).
  int32 chunk_size = 6;
  // chunk_overlap is the token/char overlap between consecutive chunks (0 = server default 64).
  int32 chunk_overlap = 7;
  // chunk_strategy: char | token | markdown | json | recursive (empty = char).
  string chunk_strategy = 8;
  // organize_to_markdown: unset/true = organize extracted text into Markdown via LLM
  // (falls back to raw text when LLM unavailable); false = ingest raw text as-is.
  optional bool organize_to_markdown = 9;
}

message GetDocumentContentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListDocumentsRequest {
  string collection_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// VaultTreeNode is one entry of a vault folder listing (P3 explorer).
// kind=dir nodes are aggregates derived from document rel_paths;
// kind=file nodes mirror one indexed document.
message VaultTreeNode {
  string name = 1;            // base name (last path segment)
  string path = 2;            // vault-relative path ('/' separator); '' = root
  string kind = 3;            // dir | file
  // file-only fields (empty/zero for dir):
  string doc_id = 4;
  string summary = 5;
  repeated string tags = 6;
  string doc_type = 7;
  string status = 8;
  int64  size_bytes = 9;
  string updated_at = 10;
  string error_message = 11;  // populated when status=error (parse failure reason)
}

message ListVaultTreeRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  // prefix selects the folder whose DIRECT children are returned; empty = root.
  string prefix = 2;
}

message ListVaultTreeResponse {
  repeated VaultTreeNode items = 1;
}

// KnowledgeLink is one resolved document relation (P3 关联区, R-3 来源标注).
message KnowledgeLink {
  string target_doc_id = 1;
  string target_source = 2;
  string target_rel_path = 3;
  string link_type = 4;       // explicit | entity | semantic
  string context = 5;         // explicit: [[ref]] raw; entity: shared entity names
  string direction = 6;       // out (this doc references target) | in (target references this doc)
}

message ListDocumentLinksRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];  // document id
  string link_type = 2;     // empty = all types
}

message ListDocumentLinksResponse {
  repeated KnowledgeLink items = 1;
}

message ListDocumentsResponse {
  repeated KnowledgeDocument items = 1;
  int32 total = 2;
}

message DeleteDocumentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// MoveDocumentRequest moves a document (with its chunks) to another collection (US-14).
// Rejected with CodeConflict when the target collection dim differs (vector incompatibility).
message MoveDocumentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string target_collection_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message SearchRequest {
  // US-14: optional. Empty = federated smart-routing across all collections.
  string collection_id = 1;
  string query = 2 [(google.api.field_behavior) = REQUIRED];
  int32 top_k = 3;            // default 5
  float min_score = 4;        // minimum similarity threshold (0 = no filter)
  string filter_json = 5;     // optional metadata filter (JSON)
  optional bool use_rerank = 6;       // unset = use global reranker when configured
  int32 rerank_candidates = 7;        // vector candidates before rerank (0 = default)
  // rewrite_strategy: hyde | decomposition | multi_query (empty = no rewrite).
  string rewrite_strategy = 10;
  // hybrid_search: auto | dense | sparse | rrf (empty = auto).
  string hybrid_search = 11;
}

message SearchResponse {
  repeated KnowledgeChunk chunks = 1;
}

message GetEmbedderConfigRequest {}

message EmbedderConfig {
  string provider = 1;
  string base_url = 2;
  string model = 3;
  int32  dim = 4;
  bool   configured = 5;
  bool   has_api_key = 6;
}

message UpdateEmbedderConfigRequest {
  string provider = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
  int32  dim = 5;
}

message UpdateEmbedderConfigResponse {
  EmbedderConfig config = 1;
}

service KnowledgeService {
  // Collections
  rpc CreateCollection(CreateCollectionRequest) returns (KnowledgeCollection) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections"
      body: "*"
    };
  }
  rpc GetCollection(GetCollectionRequest) returns (KnowledgeCollection) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections/{id}"
    };
  }
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections"
    };
  }
  rpc DeleteCollection(DeleteCollectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/knowledge/collections/{id}"
    };
  }

  // Documents
  rpc IngestDocument(IngestDocumentRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/documents"
      body: "*"
    };
  }
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents"
    };
  }
  rpc GetDocumentContent(GetDocumentContentRequest) returns (DocumentContent) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{id}/content"
    };
  }
  rpc DeleteDocument(DeleteDocumentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/knowledge/documents/{id}"
    };
  }
  rpc MoveDocument(MoveDocumentRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/documents/{id}/move"
      body: "*"
    };
  }
  // Vault explorer (P3): lazy folder listing derived from document rel_paths.
  rpc ListVaultTree(ListVaultTreeRequest) returns (ListVaultTreeResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/vaults/{collection_id}/tree"
    };
  }
  // Document relations with source-type annotation (P3 关联区, R-3).
  rpc ListDocumentLinks(ListDocumentLinksRequest) returns (ListDocumentLinksResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{id}/links"
    };
  }

  // Search
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/search"
      body: "*"
    };
  }
  rpc GetEmbedderConfig(GetEmbedderConfigRequest) returns (EmbedderConfig) {
    option (google.api.http) = {
      get: "/v1/knowledge/embedder-config"
    };
  }
  rpc UpdateEmbedderConfig(UpdateEmbedderConfigRequest) returns (UpdateEmbedderConfigResponse) {
    option (google.api.http) = {
      put: "/v1/knowledge/embedder-config"
      body: "*"
    };
  }
}
