syntax = "proto3";

package kratos.knowledge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/knowledge/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.knowledge.v1";

// KnowledgeCollection is a named vector store with a fixed embedding model.
message KnowledgeCollection {
  string id = 1;
  string name = 2;
  string description = 3;
  string embedding_model = 4;
  int32  dim = 5;
  string status = 6;          // active | indexing | error
  int32  document_count = 7;
  int32  chunk_count = 8;
  string workspace = 9;
  string created_at = 10;
  string updated_at = 11;
  // Vault fields (V2: local folder as source of truth). Empty = legacy collection.
  string root_path = 12;
  string sync_state = 13;     // active | paused | error | migrating
  string last_sync_at = 14;
  // SP1-F: storage backend dimension. local = filesystem source of truth
  // (root_path set); team = Postgres source of truth (root_path empty).
  string vault_backend = 15;  // local | team
}

// KnowledgeDocument is one source document ingested into a collection.
message KnowledgeDocument {
  string id = 1;
  string collection_id = 2;
  string source = 3;          // filename, URL, or description
  string mime_type = 4;
  int64  size_bytes = 5;
  int32  chunk_count = 6;
  string status = 7;          // pending | indexing | indexed | error
  string error_message = 8;
  string created_at = 9;
  string updated_at = 10;
  bool   extract_supported = 11;  // true when backend can extract text from this MIME type (REV-D)
  bool   organized = 12;          // true when content was organized into Markdown by LLM
  // Vault + summary-card fields (P3 explorer list/hover-card first-density).
  string rel_path = 13;       // vault-relative path ('/' separator); empty = non-vault doc
  string summary = 14;        // LLM summary card (may be stale; empty when unavailable)
  repeated string tags = 15;  // LLM tags from summary card
  string doc_type = 16;       // report | manual | note | faq | ...
}

// DocumentContent is the full extracted/organized text of one document (preview).
message DocumentContent {
  string id = 1;
  string content_text = 2;    // organized Markdown (or raw extracted text when not organized)
  bool   organized = 3;
  // raw_content (G2-B5): vault 文件 body 原文（编辑器数据源；frontmatter 不含，
  // 保存时后端自动保留合并）。非 vault 文档为空。
  string raw_content = 4;
  // base_hash (G2-B5): vault 文件 sha1，UpdateDocumentContent 的 CAS expectedHash。
  string base_hash = 5;
}

// KnowledgeChunk is one indexed text chunk with its embedding vector.
message KnowledgeChunk {
  string id = 1;
  string doc_id = 2;
  string collection_id = 3;
  string content = 4;
  repeated float embedding = 5;
  string metadata_json = 6;
  int32  chunk_index = 7;
  float  score = 8;           // similarity score (only in search results)
}

// --- Requests / Responses ---

// CreateCollectionRequest creates a knowledge collection (Vault V2 / SP1-F team library).
// vault_backend = local (default): local folder as source of truth, root_path required.
// vault_backend = team: Postgres as source of truth, root_path must be empty.
// embedding_model is optional (empty = lexical-only vault, no semantic layer).
message CreateCollectionRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string description = 2;
  string embedding_model = 3;
  string root_path = 4;       // required when vault_backend = local; must be empty when team
  string vault_backend = 5;   // local (default) | team
}

message GetCollectionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListCollectionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListCollectionsResponse {
  repeated KnowledgeCollection items = 1;
  int32 total = 2;
}

message DeleteCollectionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message IngestDocumentRequest {
  // US-14: optional. Empty = auto-fall into the lazily-created "默认知识库" (default collection).
  string collection_id = 1;
  string source = 2 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 3;
  // content_base64 is the raw document payload (base64-encoded).
  string content_base64 = 4 [(google.api.field_behavior) = REQUIRED];
  string metadata_json = 5;
  // chunk_size is the target token/char size per chunk (0 = server default 512).
  int32 chunk_size = 6;
  // chunk_overlap is the token/char overlap between consecutive chunks (0 = server default 64).
  int32 chunk_overlap = 7;
  // chunk_strategy: char | token | markdown | json | recursive (empty = char).
  string chunk_strategy = 8;
  // organize_to_markdown: unset/true = organize extracted text into Markdown via LLM
  // (falls back to raw text when LLM unavailable); false = ingest raw text as-is.
  optional bool organize_to_markdown = 9;
  // target_dir (G1-B3): optional vault-relative directory to upload into.
  // Non-empty requires a vault collection (root_path set): the raw file is
  // written to <root>/<target_dir>/<filename> (create semantics; same-name
  // conflict = CodeConflict) and the document gets rel_path + content_hash so
  // the vault sync chain treats it as already-applied. Empty = legacy behavior
  // (no filesystem write).
  string target_dir = 10;
}

message GetDocumentContentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListDocumentsRequest {
  string collection_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// VaultTreeNode is one entry of a vault folder listing (P3 explorer).
// kind=dir nodes come from filesystem scan ∪ document rel_path aggregation
// (G1-B1: empty dirs visible, dir mtime in updated_at; legacy collections
// without root_path fall back to pure index aggregation);
// kind=file nodes mirror one indexed document.
message VaultTreeNode {
  string name = 1;            // base name (last path segment)
  string path = 2;            // vault-relative path ('/' separator); '' = root
  string kind = 3;            // dir | file
  // file-only fields (empty/zero for dir):
  string doc_id = 4;
  string summary = 5;
  repeated string tags = 6;
  string doc_type = 7;
  string status = 8;
  int64  size_bytes = 9;
  string updated_at = 10;     // file: doc updated_at; dir: filesystem mtime (RFC3339, vault mode only)
  string error_message = 11;  // populated when status=error (parse failure reason)
}

message ListVaultTreeRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  // prefix selects the folder whose DIRECT children are returned; empty = root.
  string prefix = 2;
}

// CreateVaultDirRequest creates a (nested) directory inside the vault (G1-B2).
message CreateVaultDirRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  // dir_path is the vault-relative directory path ('/' separator), e.g. "guides/setup".
  string dir_path = 2 [(google.api.field_behavior) = REQUIRED];
}

// CreateVaultDocumentRequest creates a template .md document inside the vault (G1-B2).
message CreateVaultDocumentRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  // rel_path is the vault-relative .md path ('/' separator), e.g. "notes/new-doc.md".
  string rel_path = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListVaultTreeResponse {
  repeated VaultTreeNode items = 1;
}

// KnowledgeLink is one resolved document relation (P3 关联区, R-3 来源标注).
message KnowledgeLink {
  string target_doc_id = 1;
  string target_source = 2;
  string target_rel_path = 3;
  string link_type = 4;       // explicit | entity | semantic
  string context = 5;         // explicit: [[ref]] raw; entity: shared entity names
  string direction = 6;       // out (this doc references target) | in (target references this doc)
}

message ListDocumentLinksRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];  // document id
  string link_type = 2;     // empty = all types
}

message ListDocumentLinksResponse {
  repeated KnowledgeLink items = 1;
}

// CollectionGraphNode is one document node in the collection link graph (G4-B8).
message CollectionGraphNode {
  string doc_id = 1;
  string name = 2;
  string rel_path = 3;
  string doc_type = 4;
  int32 degree = 5;           // in-edge count (size mapping; isolated nodes keep 0)
}

// CollectionGraphEdge is one directed link between two in-scope documents.
message CollectionGraphEdge {
  string source = 1;          // source doc_id
  string target = 2;          // target doc_id
  string type = 3;            // explicit | entity | semantic
}

message ListCollectionGraphRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string link_types = 2;  // empty = all types
  string path_prefix = 3;          // vault dir prefix filter; empty = whole collection
}

message ListCollectionGraphResponse {
  repeated CollectionGraphNode nodes = 1;
  repeated CollectionGraphEdge edges = 2;
}

// ListDocumentNeighborhoodRequest asks for the N-hop undirected neighborhood
// subgraph around one document (SP2-8 右栏局部图). Server-side BFS over the
// collection link graph avoids full-graph transfer for large vaults.
message ListDocumentNeighborhoodRequest {
  string doc_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 hops = 2;  // BFS depth (undirected); <=0 = default 2, capped at 5
}

// BlockBacklink is one inbound reference edge to a block/document (SP1-E).
// Block-granular: a document backlink list is the aggregate of its blocks' edges.
message BlockBacklink {
  string src_block_id = 1;
  string src_doc_id = 2;
  string src_collection_id = 3;
  string src_doc_name = 4;    // source document display name (rel_path)
  string raw_target = 5;      // original link text as written
  string edge_type = 6;       // ref | embed
  string context = 7;         // 引用上下文片段
  bool ambiguous = 8;         // cross-collection ambiguous resolution (deterministic first pick)
}

message ListBlockBacklinksRequest {
  string block_id = 1;  // path binding: single block's backlinks
  string doc_id = 2;    // binding/query: aggregate all blocks of one document (takes precedence)
}

message ListBlockBacklinksResponse {
  repeated BlockBacklink items = 1;
}

// DanglingLink aggregates references whose target does not exist (yet), grouped
// by raw_target — the "uncreated notes" view (SP1-E). The link revives
// automatically once the target document is created and indexed.
message DanglingLink {
  string raw_target = 1;
  int32 ref_count = 2;
  repeated BlockBacklink refs = 3;  // block-level sources of this dangling target
}

message ListDanglingLinksRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];  // collection id
}

message ListDanglingLinksResponse {
  repeated DanglingLink items = 1;
}

// UnlinkedMention is one document that mentions the target doc's display name
// in plain text (outside [[wikilinks]]) without linking to it (P2-7,
// Obsidian "Unlinked mentions").
message UnlinkedMention {
  string src_doc_id = 1;
  string src_doc_name = 2;  // source document display name (rel_path)
  int32 count = 3;          // plain-text occurrence count
  string snippet = 4;       // first-occurrence context excerpt
}

message ListUnlinkedMentionsRequest {
  string doc_id = 1 [(google.api.field_behavior) = REQUIRED];  // target document
}

message ListUnlinkedMentionsResponse {
  repeated UnlinkedMention items = 1;
}

// RecordLinkUseRequest records one wikilink completion apply (B4 #8): the
// picked target becomes the most-recently-used link target of the collection
// (upsert on (collection_id, doc_id), best-effort).
message RecordLinkUseRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  string doc_id = 2 [(google.api.field_behavior) = REQUIRED];  // picked target document
}

message RecordLinkUseResponse {}

// LinkUseEntry is one recently used wikilink target (recency-ordered).
message LinkUseEntry {
  string doc_id = 1;
  string last_used_at = 2;  // RFC3339
}

// ListRecentLinkUsesRequest asks for the recency ordering of wikilink targets
// in one collection (B4 #8); drives empty-query [[ completion ordering.
message ListRecentLinkUsesRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;  // default 32, max 128
}

message ListRecentLinkUsesResponse {
  repeated LinkUseEntry items = 1;
}

// PromoteBlocksRequest clones the given blocks into a team collection (SP1-G).
message PromoteBlocksRequest {
  repeated string block_ids = 1 [(google.api.field_behavior) = REQUIRED];
  string target_collection_id = 2 [(google.api.field_behavior) = REQUIRED];  // must be vault_backend=team
  // SP1-I: document-level convenience for the explorer UI — the server resolves
  // every block of each document (ordinal order) and promotes them through the
  // same pipeline. Mutually exclusive with block_ids.
  repeated string doc_ids = 3;
}

// PromotedBlockLineage is one source→clone lineage pair (US-27).
message PromotedBlockLineage {
  string src_block_id = 1;     // source block (personal vault); gets promoted_to
  string new_block_id = 2;     // cloned block in the team collection; gets promoted_from
  string target_doc_id = 3;    // team document holding the clone
}

// PromoteCascadeCandidate is a reference from a promoted block into a target
// that was NOT promoted along (left dangling on the team side, raw_target kept).
message PromoteCascadeCandidate {
  string src_block_id = 1;
  string raw_target = 2;
  string dst_doc_id = 3;         // referenced private document (empty = already dangling)
  string dst_collection_id = 4;  // referenced collection (empty = dangling)
}

message PromoteBlocksResponse {
  repeated PromotedBlockLineage created_blocks = 1;
  repeated PromoteCascadeCandidate cascade_candidates = 2;
}

// RebuildKnowledgeIndexRequest triggers a streaming rebuild of the block-level
// derived index (blocks/refs) for all documents of one collection (SP1-H, US-29).
// Idempotent: re-running after interruption is equivalent to running from scratch.
message RebuildKnowledgeIndexRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];  // collection id
}

// RebuildKnowledgeIndexResponse acknowledges the accepted asynchronous rebuild.
// Progress is broadcast on the knowledge WS channel (EP-KN-02 pattern,
// event_type = knowledge_rebuild_index); sync_state = "rebuilding" while running.
message RebuildKnowledgeIndexResponse {
  string status = 1;  // "rebuilding" (task accepted)
}

// EntityMergeSuggestion is one entity merge candidate pair (G5-F B11).
// source = "norm" (same name_norm, different display name) or "embedding"
// (cosine similarity of entity-name embeddings).
message EntityMergeSuggestion {
  int64 keeper_id = 1;       // suggested survivor entity id
  string keeper_name = 2;    // survivor display name
  int64 mergee_id = 3;       // entity id suggested to merge in
  string mergee_name = 4;    // mergee display name
  string source = 5;         // norm | embedding
  double similarity = 6;     // cosine similarity (norm source = 1.0)
  string tier = 7;           // auto (>=0.90) | suggest (0.80-0.90); norm = auto
}

message ListEntityMergeSuggestionsRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListEntityMergeSuggestionsResponse {
  repeated EntityMergeSuggestion items = 1;
}

// MergeKnowledgeEntitiesRequest merges mergee entities into the keeper (G5-F B10).
// Atomic: doc-entity mentions rewritten to keeper (summed on conflict), entity
// link contexts rewritten to keeper display name, mergee name_norms become
// keeper aliases (merge persists across re-syncs), mergee rows deleted.
message MergeKnowledgeEntitiesRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 keeper_id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated int64 mergee_ids = 3;
}

message MergeKnowledgeEntitiesResponse {
  int32 rewritten_mentions = 1;  // doc-entity mention rows rewritten
  int32 rewritten_links = 2;     // entity-track link rows with context rewritten
  int32 merged_entities = 3;     // mergee entities actually merged
}

message ListDocumentsResponse {
  repeated KnowledgeDocument items = 1;
  int32 total = 2;
}

// GovernanceProposal is one knowledge-curation governance proposal (M4 自治理层).
// High-risk kinds (conflict/orphan) stay pending until a human resolves them
// via ResolveGovernanceProposal; low-risk kinds (stale) are auto-applied.
message GovernanceProposal {
  int64  id = 1;
  string collection_id = 2;
  string kind = 3;            // conflict | orphan | stale | relation_promote
  string risk = 4;            // high | low
  string status = 5;          // pending | applied | rejected
  string payload_json = 6;    // dedup_key + kind-specific fields (JSON object)
  string created_at = 7;      // RFC3339
  string resolved_at = 8;     // RFC3339; empty = 未审
}

message ListGovernanceProposalsRequest {
  string collection_id = 1;   // empty = 不过滤
  string status = 2;          // pending | applied | rejected; empty = 不过滤
  int32 limit = 3;            // default 50, max 200
}

message ListGovernanceProposalsResponse {
  repeated GovernanceProposal items = 1;
}

// ResolveGovernanceProposalRequest closes one pending proposal (人工二审).
message ResolveGovernanceProposalRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string decision = 2 [(google.api.field_behavior) = REQUIRED];  // applied | rejected | keep_old | keep_new
}

message ResolveGovernanceProposalResponse {
  int64 id = 1;
  string status = 2;  // 二审后状态：applied | rejected
}

message DeleteDocumentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ReembedDocumentsRequest re-chunks and re-embeds documents from their stored
// content_text (B1: heals UI-uploaded docs whose embeddings were nulled by
// reconcileEmbeddingDim; vault docs self-heal via vault_sync and are skipped).
message ReembedDocumentsRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string doc_ids = 2;  // 空 = 全集合待重嵌入文档（chunks embedding IS NULL 或无 chunks）
  int32 chunk_size = 3;
  int32 chunk_overlap = 4;
}

message ReembedDocumentsResponse {
  int32 accepted_count = 1;  // 已受理进入重嵌入队列的文档数
  int32 skipped_count = 2;   // 跳过数（content_text 空 / 正在 indexing / vault 文档走 sync 自愈）
}

// EnableCollectionSemanticRequest enables the semantic layer on a lexical-only
// collection (B2: one-way binding; embedding_model empty -> bound to the current
// global embedder, then all content documents are re-embedded via the B1 pipeline).
message EnableCollectionSemanticRequest {
  string collection_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message EnableCollectionSemanticResponse {
  int32 enqueued_docs = 1;    // 进入重嵌入队列的文档数
  string embedding_model = 2; // 绑定的模型名（当前全局 embedder）
  int32 dim = 3;
}

// MoveDocumentRequest moves a document (with its chunks) to another collection (US-14).
// Rejected with CodeConflict when the target collection dim differs (vector incompatibility).
message MoveDocumentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string target_collection_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// MoveDocumentToDirRequest moves a vault document to another directory within the
// same collection (G3-B4). Document identity, chunks and content hash are kept
// (content unchanged, no reindex); inbound explicit links are rebuilt.
message MoveDocumentToDirRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // target_dir: vault-relative target directory ("" or "/" = vault root).
  string target_dir = 2;
  // conflict_policy on name clash at target:
  //   "" (default) = reject with CodeConflict (frontend prompts overwrite/rename/cancel);
  //   "overwrite"  = back up the existing target to .aranea/trash, then overwrite;
  //   "rename"     = keep both, auto-rename the moved file to "name (2).ext".
  string conflict_policy = 3;
}

// UpdateDocumentContentRequest saves the edited body back to the vault file (G2-B5).
message UpdateDocumentContentRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // content is the new Markdown body (frontmatter is preserved server-side).
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  // base_hash is the file hash the editor started from (DocumentContent.base_hash);
  // empty = expect file to not exist.
  string base_hash = 3;
}

message UpdateDocumentContentResponse {
  KnowledgeDocument document = 1;
  // conflict=true: the file changed on disk since base_hash; the edit was still
  // written and the disk version backed up to .aranea/trash (both copies kept).
  bool conflict = 2;
}

message SearchRequest {
  // US-14: optional. Empty = federated smart-routing across all collections.
  string collection_id = 1;
  string query = 2 [(google.api.field_behavior) = REQUIRED];
  int32 top_k = 3;            // default 5
  float min_score = 4;        // minimum similarity threshold (0 = no filter)
  string filter_json = 5;     // optional metadata filter (JSON)
  optional bool use_rerank = 6;       // unset = use global reranker when configured
  int32 rerank_candidates = 7;        // vector candidates before rerank (0 = default)
  // rewrite_strategy: hyde | decomposition | multi_query (empty = no rewrite).
  string rewrite_strategy = 10;
  // hybrid_search: auto | dense | sparse | rrf (empty = auto).
  string hybrid_search = 11;
  // path_prefix: optional vault-relative directory scope (G3-B7 search scope
  // selector). Empty = whole collection. Only chunks whose document rel_path
  // sits under "<prefix>/" match; leading/trailing slashes are tolerated.
  string path_prefix = 12;
}

message SearchResponse {
  repeated KnowledgeChunk chunks = 1;
}

message GetEmbedderConfigRequest {}

message EmbedderConfig {
  string provider = 1;
  string base_url = 2;
  string model = 3;
  int32  dim = 4;
  bool   configured = 5;
  bool   has_api_key = 6;
}

message UpdateEmbedderConfigRequest {
  string provider = 1;
  string base_url = 2;
  string api_key = 3;
  string model = 4;
  int32  dim = 5;
}

message UpdateEmbedderConfigResponse {
  EmbedderConfig config = 1;
}

service KnowledgeService {
  // Collections
  rpc CreateCollection(CreateCollectionRequest) returns (KnowledgeCollection) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections"
      body: "*"
    };
  }
  rpc GetCollection(GetCollectionRequest) returns (KnowledgeCollection) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections/{id}"
    };
  }
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections"
    };
  }
  rpc DeleteCollection(DeleteCollectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/knowledge/collections/{id}"
    };
  }

  // Documents
  rpc IngestDocument(IngestDocumentRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/documents"
      body: "*"
    };
  }
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents"
    };
  }
  rpc GetDocumentContent(GetDocumentContentRequest) returns (DocumentContent) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{id}/content"
    };
  }
  rpc DeleteDocument(DeleteDocumentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/knowledge/documents/{id}"
    };
  }
  rpc MoveDocument(MoveDocumentRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/documents/{id}/move"
      body: "*"
    };
  }
  // MoveDocumentToDir moves a vault document to another directory within the same
  // collection (G3-B4): atomic fs move + rel_path update (identity/chunks kept) +
  // inbound explicit links rebuild. Name clash -> CodeConflict unless
  // conflict_policy=overwrite|rename. Vault documents only (rel_path required).
  rpc MoveDocumentToDir(MoveDocumentToDirRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/documents/{id}/move_to_dir"
      body: "*"
    };
  }
  // ReembedDocuments re-chunks and re-embeds documents from their stored
  // content_text (B1: heals UI-uploaded docs whose embeddings were nulled by
  // reconcileEmbeddingDim; vault docs self-heal via vault_sync and are skipped).
  rpc ReembedDocuments(ReembedDocumentsRequest) returns (ReembedDocumentsResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections/{collection_id}/documents:reembed"
      body: "*"
    };
  }
  // EnableCollectionSemantic one-way enables the semantic layer on a lexical-only
  // collection (B2): binds the current global embedder model/dim (guarded UPDATE,
  // conflict when already enabled) and enqueues all content documents into the
  // B1 re-embed pipeline. CodeBadRequest when the embedder is not configured.
  rpc EnableCollectionSemantic(EnableCollectionSemanticRequest) returns (EnableCollectionSemanticResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections/{collection_id}:enable-semantic"
      body: "*"
    };
  }
  // UpdateDocumentContent saves editor body back to the vault file (G2-B5):
  // frontmatter preserved, CAS via base_hash; conflict still writes (disk copy
  // backed up to trash) and returns conflict=true. Triggers immediate reindex.
  rpc UpdateDocumentContent(UpdateDocumentContentRequest) returns (UpdateDocumentContentResponse) {
    option (google.api.http) = {
      put: "/v1/knowledge/documents/{id}/content"
      body: "*"
    };
  }
  // Vault explorer (P3): lazy folder listing derived from document rel_paths.
  rpc ListVaultTree(ListVaultTreeRequest) returns (ListVaultTreeResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/vaults/{collection_id}/tree"
    };
  }
  // CreateVaultDir creates a directory inside the vault (G1-B2; idempotent).
  rpc CreateVaultDir(CreateVaultDirRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/knowledge/vaults/{collection_id}/dirs"
      body: "*"
    };
  }
  // CreateVaultDocument writes a template .md (frontmatter + empty heading) and
  // indexes it immediately (G1-B2; no 45s poll wait). Existing path = conflict.
  rpc CreateVaultDocument(CreateVaultDocumentRequest) returns (KnowledgeDocument) {
    option (google.api.http) = {
      post: "/v1/knowledge/vaults/{collection_id}/docs"
      body: "*"
    };
  }
  // Document relations with source-type annotation (P3 关联区, R-3).
  rpc ListDocumentLinks(ListDocumentLinksRequest) returns (ListDocumentLinksResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{id}/links"
    };
  }
  // ListCollectionGraph returns the full link graph of one collection (G4-B8):
  // nodes = documents (after path_prefix filter), edges = links (link_types filter;
  // endpoints outside scope/dangling dropped), degree = in-edge count per node.
  rpc ListCollectionGraph(ListCollectionGraphRequest) returns (ListCollectionGraphResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/vaults/{collection_id}/graph"
    };
  }
  // ListDocumentNeighborhood returns the N-hop undirected neighborhood subgraph
  // of one document (SP2-8 右栏局部图): same node/edge shape as the full graph,
  // but only the small vicinity is transferred (large-vault friendly).
  rpc ListDocumentNeighborhood(ListDocumentNeighborhoodRequest) returns (ListCollectionGraphResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{doc_id}/neighborhood"
    };
  }
  // ListBlockBacklinks returns block-level inbound references (SP1-E): context
  // excerpt + source block/document per edge. Single block via block_id path;
  // aggregate all blocks of a document via the doc_id binding.
  rpc ListBlockBacklinks(ListBlockBacklinksRequest) returns (ListBlockBacklinksResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/blocks/{block_id}/backlinks"
      additional_bindings {
        get: "/v1/knowledge/documents/{doc_id}/block-backlinks"
      }
    };
  }
  // ListDanglingLinks aggregates dangling references of one collection by
  // raw_target with ref counts (SP1-E; "uncreated notes" view).
  rpc ListDanglingLinks(ListDanglingLinksRequest) returns (ListDanglingLinksResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections/{id}/dangling-links"
    };
  }
  // ListUnlinkedMentions returns documents that mention the target doc's name
  // in plain text (outside [[wikilinks]]) without linking to it (P2-7).
  rpc ListUnlinkedMentions(ListUnlinkedMentionsRequest) returns (ListUnlinkedMentionsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/documents/{doc_id}/unlinked-mentions"
    };
  }
  // RecordLinkUse upserts the (collection, doc) recency row when a wikilink
  // completion is applied (B4 #8); best-effort, callers may ignore failures.
  rpc RecordLinkUse(RecordLinkUseRequest) returns (RecordLinkUseResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections/{collection_id}/link-uses"
      body: "*"
    };
  }
  // ListRecentLinkUses returns recently used wikilink targets of one
  // collection, most recent first (B4 #8); drives empty-query [[ completion
  // ordering on the client.
  rpc ListRecentLinkUses(ListRecentLinkUsesRequest) returns (ListRecentLinkUsesResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/collections/{collection_id}/link-uses"
    };
  }
  // PromoteBlocks clones blocks from a personal vault into a team collection
  // (SP1-G, US-27): copy-not-move with lineage pair (promoted_from/promoted_to),
  // cascade candidates for references into private blocks, and immediate
  // re-indexing of the target document so promoted content is searchable.
  rpc PromoteBlocks(PromoteBlocksRequest) returns (PromoteBlocksResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/blocks/promote"
      body: "*"
    };
  }
  // RebuildKnowledgeIndex rebuilds the block-level derived index (blocks/refs)
  // for every document of the collection (SP1-H, US-29). Asynchronous and
  // idempotent; 409 Conflict while a rebuild is already running for the same
  // collection. Progress via knowledge WS events (EP-KN-02 pattern); chunks/FTS
  // stay on old data during the rebuild (degraded but available).
  rpc RebuildKnowledgeIndex(RebuildKnowledgeIndexRequest) returns (RebuildKnowledgeIndexResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/collections/{id}/rebuild-index"
      body: "*"
    };
  }
  // ListEntityMergeSuggestions lists entity merge candidates (G5-F B11):
  // normalization conflict groups (same name_norm, different display name)
  // plus high-similarity embedding pairs when the embedder is configured.
  // Computed in real time; no queue table.
  rpc ListEntityMergeSuggestions(ListEntityMergeSuggestionsRequest) returns (ListEntityMergeSuggestionsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/vaults/{collection_id}/entity-merge-suggestions"
    };
  }
  // MergeKnowledgeEntities merges mergee entities into the keeper (G5-F B10)
  // atomically; returns rewrite counts for inline UI feedback.
  rpc MergeKnowledgeEntities(MergeKnowledgeEntitiesRequest) returns (MergeKnowledgeEntitiesResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/vaults/{collection_id}/entity-merges"
      body: "*"
    };
  }
  // ListGovernanceProposals lists curation governance proposals (M4 自治理层
  // 人工二审出口): high-risk conflict/orphan proposals wait here for human review.
  rpc ListGovernanceProposals(ListGovernanceProposalsRequest) returns (ListGovernanceProposalsResponse) {
    option (google.api.http) = {
      get: "/v1/knowledge/governance-proposals"
    };
  }
  // ResolveGovernanceProposal closes one pending proposal (人工二审):
  // decision=applied approves the action; rejected dismisses it;
  // keep_old/keep_new resolve fact-level conflicts by choosing which section to keep.
  rpc ResolveGovernanceProposal(ResolveGovernanceProposalRequest) returns (ResolveGovernanceProposalResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/governance-proposals/{id}:resolve"
      body: "*"
    };
  }

  // Search
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      post: "/v1/knowledge/search"
      body: "*"
    };
  }
  rpc GetEmbedderConfig(GetEmbedderConfigRequest) returns (EmbedderConfig) {
    option (google.api.http) = {
      get: "/v1/knowledge/embedder-config"
    };
  }
  rpc UpdateEmbedderConfig(UpdateEmbedderConfigRequest) returns (UpdateEmbedderConfigResponse) {
    option (google.api.http) = {
      put: "/v1/knowledge/embedder-config"
      body: "*"
    };
  }
}
