syntax = "proto3";

package kratos.artifact.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/artifact/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.artifact.v1";

// ArtifactMeta holds metadata for a stored artifact (no binary payload).
message ArtifactMeta {
  string id = 1;
  string session_id = 2;
  string name = 3;
  string mime_type = 4;
  int64 size = 5;
  string sha256 = 6;
  string storage_kind = 7;
  string storage_uri = 8;
  int32 version = 9;
  string created_at = 10;
}

// ArtifactData bundles metadata with the raw binary encoded as base64.
message ArtifactData {
  ArtifactMeta meta = 1;
  // data_base64 is the artifact payload encoded in standard base64.
  string data_base64 = 2;
}

message UploadArtifactRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 3;
  // data_base64 is the artifact payload encoded in standard base64.
  string data_base64 = 4 [(google.api.field_behavior) = REQUIRED];
}

message GetArtifactRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // version selects a specific version; 0 or omitted means latest.
  int32 version = 2;
}

message ListArtifactsRequest {
  // session_id selects a single session's artifacts.
  // Empty means "all artifacts" browse scoped to the caller workspace
  // (system workspace lists across all sessions).
  string session_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // query filters by name, session_id, or mime_type (case-insensitive substring).
  string query = 4;
  // mime_type_prefix filters by MIME prefix, e.g. "image/" or "text/".
  string mime_type_prefix = 5;
}

message ListArtifactsResponse {
  repeated ArtifactMeta items = 1;
  int32 total = 2;
}

message DeleteArtifactRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteArtifactVersionRequest removes exactly one version of a logical artifact.
// Use the ID of any version as the lookup handle, and specify the version number
// to delete. If it is the only remaining version the logical artifact is gone.
message DeleteArtifactVersionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // version is 0-based (first upload is v0), so 0 is a legitimate value.
  // It is NOT marked REQUIRED on purpose: the fieldbehavior validator treats
  // proto3 scalar zero as "missing", which would wrongly reject v0. Presence
  // is guaranteed by the HTTP path binding `/v1/artifacts/{id}/versions/{version}`;
  // the service layer rejects negative values.
  int32 version = 2;
}

message PreviewArtifactRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 version = 2;
}

message PreviewArtifactResponse {
  ArtifactMeta meta = 1;
  // preview_kind: text | image | pdf | binary
  string preview_kind = 2;
  // text_content for text previews; empty for binary kinds.
  string text_content = 3;
  // data_base64 for image/pdf inline preview.
  string data_base64 = 4;
}

message SignDownloadUrlRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 version = 2;
  // ttl_seconds overrides default expiry (max 86400).
  int32 ttl_seconds = 3;
}

message SignDownloadUrlResponse {
  string url = 1;
  string expires_at = 2;
}

message ListArtifactVersionsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListArtifactVersionsResponse {
  repeated ArtifactMeta items = 1;
}

service ArtifactService {
  rpc UploadArtifact(UploadArtifactRequest) returns (ArtifactMeta) {
    option (google.api.http) = {
      post: "/v1/artifacts"
      body: "*"
    };
  }
  rpc GetArtifact(GetArtifactRequest) returns (ArtifactData) {
    option (google.api.http) = {
      get: "/v1/artifacts/{id}"
    };
  }
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {
    option (google.api.http) = {
      get: "/v1/artifacts"
    };
  }
  rpc DeleteArtifact(DeleteArtifactRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/artifacts/{id}"
    };
  }
  // DeleteArtifactVersion removes a single version of a logical artifact.
  // DELETE /v1/artifacts/{id}/versions/{version}
  rpc DeleteArtifactVersion(DeleteArtifactVersionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/artifacts/{id}/versions/{version}"
    };
  }
  rpc PreviewArtifact(PreviewArtifactRequest) returns (PreviewArtifactResponse) {
    option (google.api.http) = {
      get: "/v1/artifacts/{id}/preview"
    };
  }
  rpc SignDownloadUrl(SignDownloadUrlRequest) returns (SignDownloadUrlResponse) {
    option (google.api.http) = {
      post: "/v1/artifacts/{id}/sign-download"
      body: "*"
    };
  }
  rpc ListArtifactVersions(ListArtifactVersionsRequest) returns (ListArtifactVersionsResponse) {
    option (google.api.http) = {
      get: "/v1/artifacts/{id}/versions"
    };
  }
}
