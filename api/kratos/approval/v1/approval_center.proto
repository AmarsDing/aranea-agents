syntax = "proto3";

package kratos.approval.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "aranea/auth/v1/requirement.proto";

option go_package = "aranea-agents/api/kratos/approval/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.approval.v1";

// ============================================================================
// ApprovalCenterService —— 统一审批中心（D2，A-1/A-4 拍板）
//
// 聚合语义（v5 §5.5 拍板，照抄 workbench approvals.go「不返回无权对象」）：
//   - 只读聚合，决议出口仍走各领域 RPC（任务 review、脱敏 approve…），
//     本服务不开写旁路；
//   - 逐类按角色/密级/reviewer 规则在 SQL 内过滤，无权对象零泄漏；
//   - 五类（v5）+ 扩展类：schedule_draft（日程草案）、memory_fact（记忆
//     高风险写扣留，收编 twinmonitor 桥为库内直读）。
// 分级审批矩阵（A-4，F2）：三级风险 × approval-policy 四档的默认档映射，
// 配置存库可审计；GetRiskMatrix/PutRiskMatrix 本期随端点一并落地。
// ============================================================================

enum ApprovalKind {
  APPROVAL_KIND_UNSPECIFIED = 0;
  APPROVAL_KIND_TASK_REVIEW = 1;         // 任务验收（agentbridge 编码任务 + 统一任务中心业务任务预留）
  APPROVAL_KIND_MASK_PROPOSAL = 2;       // 脱敏提案（secops 五闸，D6 落位后接入）
  APPROVAL_KIND_OFFBOARD_EXPORT = 3;     // 离职导出（D3 落位后接入）
  APPROVAL_KIND_EVOLUTION_SUGGESTION = 4; // 自改进建议（补决议回写闭环）
  APPROVAL_KIND_SKILL_APPROVAL = 5;      // 技能审批
  APPROVAL_KIND_SCHEDULE_DRAFT = 6;      // agent 日程草案（office.schedule）
  APPROVAL_KIND_MEMORY_FACT = 7;         // 记忆高风险写扣留
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;    // 自动留痕
  RISK_LEVEL_MEDIUM = 2; // 可批量/同类自动批准 N 次（矩阵配置）
  RISK_LEVEL_HIGH = 3;   // 逐项 + 移动端二次确认（F3）
}

// ApprovalItem 统一审批条目形状。
message ApprovalItem {
  ApprovalKind kind = 1;
  string id = 2;          // 领域内条目 id（决议时回传各领域 RPC）
  string title = 3;
  string summary = 4;
  string context_json = 5; // 类别特定上下文（任务=密级/创建者/reviewer；脱敏=样本召回率…）
  RiskLevel risk_level = 6;
  string requester = 7;    // 申请人/来源 agent（不可自批判定展示用）
  google.protobuf.Timestamp created_at = 8;
  // 归因：由来源带出的 agent key（任务验收=AgentID、日程草案=AgentID、
  // 自改进建议目标 agent=TargetID），供业务线看板聚合；空 = 无法归因。
  string agent_key = 9;
}

message ListApprovalsRequest {
  ApprovalKind kind = 1; // UNSPECIFIED = 全部
  int32 page = 2;
  int32 page_size = 3; // <=0 默认 50，>200 截 200
  // 按请求人筛选（精确匹配）；空 = 不筛选。
  string requester = 4;
}

message ListApprovalsResponse {
  repeated ApprovalItem items = 1;
  int64 total = 2;
}

message ApprovalKindCount {
  ApprovalKind kind = 1;
  int64 count = 2;
}

// ApprovalSummary 铃铛/金门徽标用计数。
message ApprovalSummary {
  repeated ApprovalKindCount counts = 1;
  int64 total = 2;
}

// RiskMatrixRow 三级风险 → approval-policy 默认档映射（A-4）。
message RiskMatrixRow {
  string matcher_key = 1;  // 匹配键（tool_pattern/动作类名，见 approval-policy 三维匹配）
  RiskLevel risk = 2;
  string default_mode = 3; // never | auto | ask | trusted
  int32 auto_approve_times = 4; // 中风险同类自动批准次数上限（0=不启用）
  string updated_by = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetRiskMatrixResponse {
  repeated RiskMatrixRow rows = 1;
}

message PutRiskMatrixRequest {
  repeated RiskMatrixRow rows = 1 [(google.api.field_behavior) = REQUIRED];
}

// ============================================================================
// 统一收件箱（2026-11-15，工作台与经营看板重新设计 §4.1）
//
// 所有「需要人处理」的事项由服务端投影为同一种条目，网页/移动端/Agent 读
// 同一份口径；取代前端 useYouQueue 的七接口拼装。
//   - 来源（source）：七类审批（同 ApprovalKind 小写名）+ hitl_confirm（工具
//     确认）+ publish_review（发文评审）+ opportunity（上架确认）+
//     dead_letter（任务死信）+ cron_failure（定时任务失败）；
//   - 可见性：逐源按调用方权限过滤，无权来源表现为空（不报错、不计数）；
//   - 单源故障不拖垮整体：失败来源进 degraded_sources，其余照常返回；
//   - 决议统一走 DecideInboxItem：服务端按 id 重新解析条目（不信任客户端
//     回传的上下文），再分发到各领域原有写路径，领域内的归属/并发校验照旧。
// ============================================================================

// InboxItem 统一收件箱条目。
message InboxItem {
  string id = 1;      // `<source>:<领域内 id>`，决议时原样回传
  string source = 2;  // 见上方来源清单
  string kind = 3;    // decide（审批）| confirm（确认执行）| review（验收）| exception（异常）
  string title = 4;
  string summary = 5;
  RiskLevel risk_level = 6;
  string requester = 7;  // 提出者（agent / 触发源）
  string agent_key = 8;  // 归因 agent；空 = 无法归因
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp due_at = 10; // 处理截止（如工具确认的可签窗口）；空 = 无截止
  repeated string actions = 11;          // 可执行动作：approve | reject | ack | resolve
  bool reject_requires_note = 12;        // 驳回是否必须填写理由
  string link = 13;                      // 前端深链（查看详情）
  string context_json = 14;              // 来源特定上下文（仅展示用）
}

message InboxSourceCount {
  string source = 1;
  int64 count = 2;
}

message ListInboxRequest {
  repeated string sources = 1; // 空 = 全部来源
  int32 page = 2;
  int32 page_size = 3; // <=0 默认 50，>200 截 200
}

message ListInboxResponse {
  repeated InboxItem items = 1; // 排序：风险高→低，有截止的按截止近→远，其余按创建新→旧
  int64 total = 2;
  repeated InboxSourceCount counts = 3;  // 各来源待办数（已注册来源全量输出，含 0）
  repeated string degraded_sources = 4;  // 本次读取失败的来源（其计数不可信）
}

// InboxSummary 全站唯一待办数口径（侧栏角标/工作台/经营看板/移动端）。
message InboxSummary {
  int64 total = 1;
  int64 high_risk = 2;
  repeated InboxSourceCount counts = 3;
  repeated string degraded_sources = 4;
}

message DecideInboxItemRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string action = 2 [(google.api.field_behavior) = REQUIRED]; // approve | reject | ack | resolve
  string note = 3; // 驳回理由 / 批注
}

message DecideInboxItemResponse {
  string id = 1;
  string action = 2;
  google.protobuf.Timestamp decided_at = 3;
}

service ApprovalCenterService {
  // ---- 统一收件箱：仅需登录，可见性由各来源按权限码自行过滤 ----
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse) {
    option (aranea.auth.v1.requirement) = {authenticated: true};
    option (google.api.http) = {get: "/v1/inbox"};
  }
  rpc GetInboxSummary(google.protobuf.Empty) returns (InboxSummary) {
    option (aranea.auth.v1.requirement) = {authenticated: true};
    option (google.api.http) = {get: "/v1/inbox/summary"};
  }
  rpc DecideInboxItem(DecideInboxItemRequest) returns (DecideInboxItemResponse) {
    option (aranea.auth.v1.requirement) = {authenticated: true};
    option (google.api.http) = {
      post: "/v1/inbox/decide"
      body: "*"
    };
  }
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option (aranea.auth.v1.requirement) = {permission: "approval.review"};
    option (google.api.http) = {get: "/v1/approvals"};
  }
  rpc GetApprovalSummary(google.protobuf.Empty) returns (ApprovalSummary) {
    option (aranea.auth.v1.requirement) = {permission: "approval.review"};
    option (google.api.http) = {get: "/v1/approvals/summary"};
  }
  rpc GetRiskMatrix(google.protobuf.Empty) returns (GetRiskMatrixResponse) {
    option (aranea.auth.v1.requirement) = {permission: "approval.review"};
    option (google.api.http) = {get: "/v1/approvals/risk-matrix"};
  }
  rpc PutRiskMatrix(PutRiskMatrixRequest) returns (GetRiskMatrixResponse) {
    option (aranea.auth.v1.requirement) = {permission: "approval.policy"};
    option (google.api.http) = {
      put: "/v1/approvals/risk-matrix"
      body: "*"
    };
  }
}
