syntax = "proto3";

package kratos.computeruse.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/computeruse/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.computeruse.v1";

// ComputerUseStep 一步桌面动作的审计记录（监控页步骤流）。
message ComputerUseStep {
  int64 id = 1;
  string session_id = 2;
  string agent_key = 3;
  int32 step_index = 4;
  string target = 5;
  string path = 6;   // a11y|vision|vlm_direct|grounder
  string action = 7; // invoke|click|type|key|launch...
  string params_json = 8;
  string result = 9; // ok|retry|failed|cancelled|dry_run
  string error = 10;
  int64 duration_ms = 11;
  string confirmed_by = 12;
  bool danger = 13;
  string created_at = 14;
  string screenshot_ref = 15;
  bool degraded = 16;
}

message KillComputerUseSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message KillComputerUseSessionResponse {
  string session_id = 1;
  string status = 2;
}

message ListComputerUseStepsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED]; // 会话 ID
}

message ListComputerUseStepsResponse {
  repeated ComputerUseStep items = 1;
}

// GetComputerUseStatusResponse sidecar / 视觉组件健康状态。
message GetComputerUseStatusResponse {
  string sidecar = 1; // up|down
  string platform = 2;
  double scale_factor = 3;
  bool vision = 4;
}

service ComputerUseService {
  // 急停：取消进行中动作并将会话置为 cancelled。
  rpc KillComputerUseSession(KillComputerUseSessionRequest) returns (KillComputerUseSessionResponse) {
    option (google.api.http) = {post: "/v1/computeruse/sessions/{id}/kill"};
  }
  // 审计步骤查询（监控页）。
  rpc ListComputerUseSteps(ListComputerUseStepsRequest) returns (ListComputerUseStepsResponse) {
    option (google.api.http) = {get: "/v1/computeruse/sessions/{id}/steps"};
  }
  // sidecar / OmniParser 健康状态。
  rpc GetComputerUseStatus(google.protobuf.Empty) returns (GetComputerUseStatusResponse) {
    option (google.api.http) = {get: "/v1/computeruse/status"};
  }
}
