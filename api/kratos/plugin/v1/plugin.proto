syntax = "proto3";

package kratos.plugin.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "aranea-agents/api/kratos/plugin/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.plugin.v1";

message PluginPermissions {
  bool can_view = 1;
  bool can_toggle = 2;
  bool can_edit_config = 3;
  bool can_view_logs = 4;
}

message Plugin {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string risk_level = 6;
  bool enabled = 7;
  string scope = 8;
  repeated string callback_points = 9;
  int32 sort_order = 10;
  string config_schema_json = 11;
  string config_json = 12;
  string default_config_json = 13;
  int32 invoke_count = 14;
  int32 block_count = 15;
  int32 error_count = 16;
  string last_invoked_at = 17;
  string last_status = 18;
  string created_at = 19;
  string updated_at = 20;
  PluginPermissions permissions = 21;
}

message ListPluginsRequest {
  string search = 1;
  string category = 2;
  string enabled = 3;
  string callback_point = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListPluginsResponse {
  repeated Plugin items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message TogglePluginEnabledRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 2;
}

message UpdatePluginConfigRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string config_json = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePluginSortOrderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 2;
}

message UpdatePluginScopeRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string scope = 2 [(google.api.field_behavior) = REQUIRED];
}

message PluginRun {
  string id = 1;
  string plugin_key = 2;
  string plugin_id = 3;
  string session_id = 4;
  string agent_id = 5;
  string callback_point = 6;
  string status = 7;
  int32 duration_ms = 8;
  string detail_json = 9;
  string created_at = 10;
}

message ListPluginRunsRequest {
  string plugin_key = 1;
  string plugin_id = 2;
  string session_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListPluginRunsResponse {
  repeated PluginRun items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service PluginService {
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option (google.api.http) = {get: "/v1/plugins"};
  }
  rpc TogglePluginEnabled(TogglePluginEnabledRequest) returns (Plugin) {
    option (google.api.http) = {
      patch: "/v1/plugins/{id}/enabled"
      body: "*"
    };
  }
  rpc UpdatePluginConfig(UpdatePluginConfigRequest) returns (Plugin) {
    option (google.api.http) = {
      put: "/v1/plugins/{id}/config"
      body: "*"
    };
  }
  rpc UpdatePluginSortOrder(UpdatePluginSortOrderRequest) returns (Plugin) {
    option (google.api.http) = {
      patch: "/v1/plugins/{id}/sort-order"
      body: "*"
    };
  }
  rpc UpdatePluginScope(UpdatePluginScopeRequest) returns (Plugin) {
    option (google.api.http) = {
      patch: "/v1/plugins/{id}/scope"
      body: "*"
    };
  }
  rpc ListPluginRuns(ListPluginRunsRequest) returns (ListPluginRunsResponse) {
    option (google.api.http) = {get: "/v1/plugins/runs"};
  }
}
