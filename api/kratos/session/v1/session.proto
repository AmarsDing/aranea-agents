syntax = "proto3";

package kratos.session.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "aranea-agents/api/kratos/session/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.session.v1";

message Session {
  string id = 1;
  string workspace_id = 31;
  string user_id = 32;
  string owner_type = 2;
  string agent_id = 3;
  string team_id = 4;
  string title = 5;
  string summary = 6;
  string tags_json = 33;
  string dialog_mode = 12;
  string default_provider = 34;
  string default_model = 35;
  int32 default_context_window_tokens = 36;
  string last_provider = 37;
  string last_model = 38;
  int32 last_context_window_tokens = 10;
  string status = 15;
  string visibility = 39;
  int32 message_count = 16;
  int32 run_count = 17;
  int32 model_call_count = 18;
  int32 tool_call_count = 19;
  int32 skill_call_count = 20;
  int32 mcp_call_count = 21;
  int32 input_tokens = 22;
  int32 output_tokens = 23;
  int32 total_tokens = 24;
  int64 total_cost_micro_usd = 25;
  double avg_latency_ms = 40;
  int32 error_count = 41;
  int32 context_used_tokens = 8;
  double context_used_ratio = 7;
  double max_context_used_ratio = 9;
  string context_status = 11;
  string first_message_at = 42;
  string last_message_at = 26;
  string last_run_at = 43;
  string created_at = 27;
  string updated_at = 28;
  string archived_at = 29;
  string deleted_at = 30;
  string runner_snapshot_json = 44;
  string metadata_json = 45;
  string state_json = 46;
  string pinned_at = 47;
  string status_reason = 48;
  string status_changed_at = 49;
  string parent_session_id = 50;
  string root_session_id = 51;
  int32 agent_depth = 52;
  // Session tree hierarchy (Phase 2 additive).
  // session_type: spirit (root) | team | agent (member or sub-agent) | standalone.
  string session_type = 53;
  // member_agent_key identifies the executing agent for agent-type sessions.
  string member_agent_key = 54;
  // member_role is the agent's role within a team (e.g. coordinator/worker).
  string member_role = 55;
  // execution_stage tracks the current stage:
  // idle | planning | allocating | executing | completed | failed.
  string execution_stage = 56;
  int32 completed_steps = 57;
  int32 total_steps = 58;
  double progress_pct = 59;
}

message SessionTimelineSummary {
  int32 total = 1;
  int32 message_count = 2;
  int32 tool_count = 3;
  int32 skill_count = 4;
  int32 mcp_count = 5;
}

message SessionTimelineItem {
  string id = 1;
  string kind = 2;
  string side = 3;
  string title = 4;
  string subtitle = 5;
  string actor_id = 6;
  string actor_name = 7;
  string status = 8;
  string occurred_at = 9;
  int32 duration_ms = 10;
  string content_markdown = 11;
  string preview = 12;
  string detail_json = 13;
  repeated string tags = 14;
}

message SessionTimeline {
  string session_id = 1;
  repeated SessionTimelineItem items = 2;
  SessionTimelineSummary summary = 3;
}

message SearchSessionsRequest {
  string owner_type = 1;
  string agent_id = 2;
  string team_id = 3;
  string status = 4;
  string context_status = 5;
  string keyword = 6;
  int32 limit = 7;
  int32 offset = 8;
  int32 page = 9;
  int32 page_size = 10;
  string user_id = 11;
  string sort_by = 12;
  string sort_order = 13;
}

message SearchSessionsResponse {
  repeated Session items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreateSessionRequest {
  string owner_type = 1;
  string agent_id = 2;
  string team_id = 3;
  string title = 4 [(google.api.field_behavior) = REQUIRED];
  string dialog_mode = 5;
  string default_provider = 6;
  string default_model = 7;
  string workspace_id = 8;
  string user_id = 9;
  string tags_json = 10;
  string metadata_json = 11;
}

message GetSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string title = 2;
  string tags_json = 3;
  string visibility = 4;
  string metadata_json = 5;
  string dialog_mode = 6;
  string default_provider = 7;
  string default_model = 8;
}

message DeleteSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSessionsByAgentRequest {
  string agent_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ArchiveSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RestoreSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PinSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnpinSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ExportSessionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // markdown | json
  string format = 2;
}

message ExportSessionResponse {
  string content = 1;
  string filename = 2;
  string content_type = 3;
}

message SessionRunRecord {
  string id = 1;
  string session_id = 2;
  string turn_id = 3;
  string runtime_run_id = 4;
  string source = 5;
  string phase = 6;
  int32 soft_budget_sec = 7;
  int32 hard_budget_sec = 8;
  string checkpoint_id = 9;
  string workflow_job_id = 10;
  string agent_id = 11;
  string error_message = 12;
  string started_at = 13;
  string phase_changed_at = 14;
  string finished_at = 15;
  string created_at = 16;
  string updated_at = 17;
}

message ListSessionRunsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  int32 offset = 3;
}

message ListSessionRunsResponse {
  repeated SessionRunRecord items = 1;
  int32 total = 2;
}

message SessionParticipant {
  string id = 1;
  string session_id = 2;
  string participant_type = 3;
  string participant_id = 4;
  string display_name = 5;
  string role_in_session = 6;
  string status = 7;
  string first_active_at = 8;
  string last_active_at = 9;
  int32 message_count = 10;
  int32 run_step_count = 11;
  int32 input_tokens = 12;
  int32 output_tokens = 13;
  double context_used_ratio = 14;
  string metadata_json = 15;
  string created_at = 16;
  string updated_at = 17;
}

message ListSessionParticipantsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListSessionParticipantsResponse {
  repeated SessionParticipant items = 1;
}

message GetSessionTimelineRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  int32 offset = 3;
  string kind_filter = 4;
  string sort_order = 5;
}

message ChatMessageRow {
  string id = 1;
  string session_id = 2;
  string parent_message_id = 3;
  string turn_id = 4;
  int32 turn_number = 16;
  int32 seq_in_turn = 17;
  string role = 5;
  string content_markdown = 6;
  string model_name = 7;
  int32 token_in = 8;
  int32 token_out = 9;
  int32 latency_ms = 10;
  string status = 11;
  int32 attachments_count = 12;
  string options_json = 13;
  string error_message = 14;
  string created_at = 15;
}

message ListSessionMessagesRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  int32 offset = 3;
  optional int64 after_revision = 4;
}

message ListSessionMessagesResponse {
  repeated ChatMessageRow items = 1;
  int32 total = 2;
  int64 current_revision = 3;
}

message SearchSessionMessagesRequest {
  string session_id = 1;
  string keyword = 2 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 3;
  int32 offset = 4;
}

message MessageSearchHit {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string content_markdown = 4;
  string highlight = 5;
  string created_at = 6;
}

message SearchSessionMessagesResponse {
  repeated MessageSearchHit items = 1;
  int32 total = 2;
}

message SessionTurn {
  string id = 1;
  string session_id = 2;
  string run_id = 3;
  int32 turn_number = 4;
  string user_message_id = 5;
  string assistant_message_id = 6;
  string owner_type = 7;
  string agent_id = 8;
  string team_id = 9;
  string status = 10;
  string started_at = 11;
  string ended_at = 12;
  int32 duration_ms = 13;
  int32 first_token_ms = 14;
  int32 model_call_count = 15;
  int32 tool_call_count = 16;
  int32 skill_call_count = 17;
  int32 mcp_call_count = 18;
  int32 input_tokens = 19;
  int32 output_tokens = 20;
  int32 total_tokens = 21;
  int64 total_cost_micro_usd = 22;
  string final_provider = 23;
  string final_model = 24;
  string final_content_preview = 25;
  string error_code = 26;
  string error_message = 27;
  string metadata_json = 28;
  string created_at = 29;
  string updated_at = 30;
}

message ListSessionTurnsRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 limit = 2;
  int32 offset = 3;
}

message ListSessionTurnsResponse {
  repeated SessionTurn items = 1;
  int32 total = 2;
}

message SessionBatchScope {
  string owner_type = 1;
  string agent_id = 2;
  string team_id = 3;
  string status = 4;
  string context_status = 5;
  string keyword = 6;
  string user_id = 7;
}

// BatchPreviewSessionsRequest targets sessions by explicit ids and/or retention cutoff within scope.
// When ids is non-empty: only those sessions are candidates; older_than_days further filters by activity time.
// When ids is empty: all sessions matching scope are scanned (paginated server-side); older_than_days >= 1 is required.
message BatchPreviewSessionsRequest {
  repeated string ids = 1;
  int32 older_than_days = 2;
  SessionBatchScope scope = 3;
  bool include_archived = 4;
  // archive | delete
  string mode = 5 [(google.api.field_behavior) = REQUIRED];
}

message BatchPreviewSessionsResponse {
  int32 matched = 1;
  int32 skipped_running = 2;
  repeated string sample_ids = 3;
  int32 skipped_not_found = 4;
  bool truncated = 5;
}

// BatchArchiveSessionsRequest: ids and/or older_than_days + scope (same semantics as BatchPreviewSessionsRequest).
message BatchArchiveSessionsRequest {
  repeated string ids = 1;
  int32 older_than_days = 2;
  SessionBatchScope scope = 3;
}

// BatchDeleteSessionsRequest: ids and/or older_than_days + scope; include_archived applies to delete mode only.
message BatchDeleteSessionsRequest {
  repeated string ids = 1;
  int32 older_than_days = 2;
  SessionBatchScope scope = 3;
  bool include_archived = 4;
}

message BatchSessionsResponse {
  int32 matched = 1;
  int32 processed = 2;
  int32 skipped_running = 3;
  repeated string failed_ids = 4;
  int32 skipped_not_found = 5;
  bool truncated = 6;
}

message CompactSessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string preserve_instruction = 2;
}

message CompactSessionResponse {
  bool compacted = 1;
  int32 from_turn = 2;
  int32 to_turn = 3;
  int32 estimated_tokens_before = 4;
  int32 estimated_tokens_after = 5;
  string compression_level = 6;
}

message GetCompressStatusRequest {
  string session_id = 1;
}

message GetCompressStatusReply {
  string status = 1; // "normal" | "optimizing" | "optimized" | "compressing"
}

// ListChildSessions messages (B-2)

message ListChildSessionsRequest {
  string parent_session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListChildSessionsResponse {
  repeated Session sessions = 1;
}

// GetSessionTree messages (Phase B-1): recursive session tree for sidebar.

message SessionTreeNode {
  Session session = 1;
  repeated SessionTreeNode children = 2;
}

message GetSessionTreeRequest {
  string spirit_session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetSessionTreeResponse {
  SessionTreeNode root = 1;
}

// AF-BE-17: Activity-First — List activities for a session/turn
message Activity {
  string id = 1;
  string kind = 2;
  string status = 3;
  string session_id = 4;
  string turn_id = 5;
  string parent_activity_id = 6;
  string timestamp = 7;
  int64 duration_ms = 8;
  string content = 9;
  string reasoning = 10;
  string tool_name = 11;
  string tool_call_id = 12;
  string tool_arguments = 13;
  string tool_result = 14;
  int64 tool_duration_ms = 15;
  string tool_error_code = 16;
  string child_board_id = 17;
  string spirit_session_id = 18;
  string team_id = 19;
  string dag_node_id = 20;
  string depends_on_json = 21;
  string agent_key = 22;
  string agent_name = 23;
  bool collapsed = 24;
  string label = 25;
  int64 prompt_tokens = 26;
  int64 completion_tokens = 27;
  int64 seq = 28;
  // AF-BE-17: kind-specific metadata (is_final, member_id, as_display, etc.)
  // JSON-serialized map<string, any>. Empty string when no metadata is set.
  string meta_json = 29;
}

message ListActivitiesRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string turn_id = 2;
}

message ListActivitiesResponse {
  repeated Activity items = 1;
}

service SessionService {
  rpc SearchSessions(SearchSessionsRequest) returns (SearchSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions"};
  }
  rpc CreateSession(CreateSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/sessions"
      body: "*"
    };
  }
  rpc DeleteSessionsByAgent(DeleteSessionsByAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/sessions"};
  }
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {get: "/v1/sessions/{id}"};
  }
  rpc UpdateSession(UpdateSessionRequest) returns (Session) {
    option (google.api.http) = {
      patch: "/v1/sessions/{id}"
      body: "*"
    };
  }
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/sessions/{id}"};
  }
  rpc ArchiveSession(ArchiveSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/sessions/{id}/archive"
      body: "*"
    };
  }
  rpc RestoreSession(RestoreSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/sessions/{id}/restore"
      body: "*"
    };
  }
  rpc PinSession(PinSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/sessions/{id}/pin"
      body: "*"
    };
  }
  rpc UnpinSession(UnpinSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/v1/sessions/{id}/unpin"
      body: "*"
    };
  }
  rpc ExportSession(ExportSessionRequest) returns (ExportSessionResponse) {
    option (google.api.http) = {get: "/v1/sessions/{id}/export"};
  }
  rpc ListSessionRuns(ListSessionRunsRequest) returns (ListSessionRunsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/runs"};
  }
  rpc ListSessionParticipants(ListSessionParticipantsRequest) returns (ListSessionParticipantsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/participants"};
  }
  rpc GetSessionTimeline(GetSessionTimelineRequest) returns (SessionTimeline) {
    option (google.api.http) = {get: "/v1/sessions/{id}/timeline"};
  }
  rpc ListSessionMessages(ListSessionMessagesRequest) returns (ListSessionMessagesResponse) {
    option (google.api.http) = {get: "/v1/sessions/{id}/messages"};
  }
  rpc SearchSessionMessages(SearchSessionMessagesRequest) returns (SearchSessionMessagesResponse) {
    option (google.api.http) = {get: "/v1/sessions/messages/search"};
  }
  rpc ListSessionTurns(ListSessionTurnsRequest) returns (ListSessionTurnsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/turns"};
  }
  rpc BatchPreviewSessions(BatchPreviewSessionsRequest) returns (BatchPreviewSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:batchPreview"
      body: "*"
    };
  }
  rpc BatchArchiveSessions(BatchArchiveSessionsRequest) returns (BatchSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:batchArchive"
      body: "*"
    };
  }
  rpc BatchDeleteSessions(BatchDeleteSessionsRequest) returns (BatchSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:batchDelete"
      body: "*"
    };
  }
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions:compact"
      body: "*"
    };
  }
  rpc GetCompressStatus(GetCompressStatusRequest) returns (GetCompressStatusReply) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/compress-status"};
  }
  // ListChildSessions returns child sessions of a parent session (session tree model).
  rpc ListChildSessions(ListChildSessionsRequest) returns (ListChildSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{parent_session_id}/children"};
  }
  // GetSessionTree returns the complete recursive session tree rooted at a spirit session.
  rpc GetSessionTree(GetSessionTreeRequest) returns (GetSessionTreeResponse) {
    option (google.api.http) = {get: "/v1/sessions/{spirit_session_id}/tree"};
  }
  // ListActivities returns activities for a session turn (Activity-First architecture).
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/activities"};
  }
}

// SessionV2Service exposes v2 entity read RPCs (Task/Turn/Step) backed by the
// v2 repo tables (tasks_v2/turns_v2/steps_v2). Replaces v1 ListActivities.
service SessionV2Service {
  // ListTasks lists tasks for a session.
  rpc ListTasks(ListTasksV2Request) returns (ListTasksV2Response) {
    option (google.api.http) = {get: "/v2/sessions/{session_id}/tasks"};
  }
  // ListTurns lists turns for a task.
  rpc ListTurns(ListTurnsV2Request) returns (ListTurnsV2Response) {
    option (google.api.http) = {get: "/v2/tasks/{task_id}/turns"};
  }
  // ListSteps lists steps for a turn, task, or session.
  rpc ListSteps(ListStepsV2Request) returns (ListStepsV2Response) {
    option (google.api.http) = {get: "/v2/sessions/{session_id}/steps"};
  }
  // GetStep returns a single step by ID (replaces v1 GetActivity for confirm).
  rpc GetStep(GetStepV2Request) returns (GetStepV2Response) {}
  // === 2026-07-04 问题 6 修复：补齐 7 个 v2 entity 的 REST API ===
  // 刷新页面后前端 fetchSessionHistory 需要重建完整活动树（Plan/Graph/Team/Member），
  // 原先只有 Task/Turn/Step 三个端点，其余 7 类实体无 REST API → 刷新后全部丢失。
  rpc ListTeamStages(ListTeamStagesV2Request) returns (ListTeamStagesV2Response) {
    option (google.api.http) = {get: "/v2/tasks/{task_id}/team_stages"};
  }
  rpc ListTeamRuns(ListTeamRunsV2Request) returns (ListTeamRunsV2Response) {
    option (google.api.http) = {get: "/v2/team_stages/{stage_id}/team_runs"};
  }
  rpc ListMemberSessions(ListMemberSessionsV2Request) returns (ListMemberSessionsV2Response) {
    option (google.api.http) = {get: "/v2/team_runs/{run_id}/member_sessions"};
  }
  rpc ListPlanBoards(ListPlanBoardsV2Request) returns (ListPlanBoardsV2Response) {
    option (google.api.http) = {get: "/v2/tasks/{task_id}/plan_boards"};
  }
  rpc ListPlanSteps(ListPlanStepsV2Request) returns (ListPlanStepsV2Response) {
    option (google.api.http) = {get: "/v2/tasks/{task_id}/plan_steps"};
  }
  rpc ListGraphStages(ListGraphStagesV2Request) returns (ListGraphStagesV2Response) {
    option (google.api.http) = {get: "/v2/tasks/{task_id}/graph_stages"};
  }
  rpc ListGraphNodes(ListGraphNodesV2Request) returns (ListGraphNodesV2Response) {
    option (google.api.http) = {get: "/v2/graph_stages/{stage_id}/graph_nodes"};
  }
}

message ListTasksV2Request {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListTasksV2Response {
  repeated TaskV2 tasks = 1;
}

message ListTurnsV2Request {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListTurnsV2Response {
  repeated TurnV2 turns = 1;
}

message ListStepsV2Request {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string turn_id = 2;
  string task_id = 3;
}
message ListStepsV2Response {
  repeated StepV2 steps = 1;
}

message GetStepV2Request {
  string step_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message GetStepV2Response {
  StepV2 step = 1;
}

// TaskV2 mirrors biz.Task (SessionID = spirit_session_id per biz comment).
message TaskV2 {
  string id = 1;
  string session_id = 2;
  string user_message = 3;
  string status = 4;
  int64 seq = 5;
  int64 version = 6;
  string created_at = 7;
  string updated_at = 8;
  string completed_at = 9;
}

// TurnV2 mirrors biz.Turn.
message TurnV2 {
  string id = 1;
  string task_id = 2;
  string session_id = 3;
  string spirit_session_id = 4;
  string parent_turn_id = 5;
  string agent_key = 6;
  string team_id = 7;
  string team_stage_id = 8;
  int64 seq = 9;
  int64 version = 10;
  string status = 11;
  string started_at = 12;
  string completed_at = 13;
}

// StepV2 mirrors biz.Step. ToolArgs/ToolResult are bytes (json.RawMessage).
message StepV2 {
  string id = 1;
  string turn_id = 2;
  string task_id = 3;
  string session_id = 4;
  string spirit_session_id = 5;
  string kind = 6;
  string author_agent_key = 7;
  int64 seq = 8;
  int64 version = 9;
  string content = 10;
  string reasoning = 11;
  string tool_name = 12;
  string tool_call_id = 13;
  bytes tool_args = 14;
  bytes tool_result = 15;
  int64 tool_duration_ms = 16;
  string tool_error_code = 17;
  string notice_type = 18;
  string status = 19;
  bool is_final = 20;
  string started_at = 21;
  string completed_at = 22;
}

// === 2026-07-04 问题 6 修复：v2 entity 消息定义（7 类） ===
// 镜像 biz 包对应 struct，字段顺序与 biz struct 一致。

// --- TeamStage ---
message TeamStageV2 {
  string id = 1;
  string task_id = 2;
  string turn_id = 3;
  string session_id = 4;
  string team_id = 5;
  string team_name = 6;
  string dag_node_id = 7;
  repeated string depends_on = 8;
  string status = 9;
  string stage = 10;
  repeated MemberInfoV2 members = 11;
  string strategy = 12;
  string started_at = 13;
  string completed_at = 14;
  int64 seq = 15;
  int64 version = 16;
}

message MemberInfoV2 {
  string agent_key = 1;
  string agent_name = 2;
  string avatar_url = 3;
  string child_session_id = 4;
  string status = 5;
}

message ListTeamStagesV2Request {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListTeamStagesV2Response {
  repeated TeamStageV2 team_stages = 1;
}

// --- TeamRun ---
message TeamRunV2 {
  string id = 1;
  string team_stage_id = 2;
  string task_id = 3;
  string session_id = 4;
  string spirit_session_id = 5;
  string dag_node_id = 6;
  repeated string depends_on = 7;
  string status = 8;
  string started_at = 9;
  string completed_at = 10;
  int64 seq = 11;
  int64 version = 12;
  string error = 13;
}

message ListTeamRunsV2Request {
  string stage_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListTeamRunsV2Response {
  repeated TeamRunV2 team_runs = 1;
}

// --- MemberSession ---
message MemberSessionV2 {
  string id = 1;
  string team_run_id = 2;
  string team_stage_id = 3;
  string task_id = 4;
  string session_id = 5;
  string spirit_session_id = 6;
  string agent_key = 7;
  string agent_name = 8;
  string avatar_url = 9;
  string status = 10;
  int64 seq = 11;
  int64 version = 12;
  string started_at = 13;
  string finished_at = 14;
  string error = 15;
}

message ListMemberSessionsV2Request {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListMemberSessionsV2Response {
  repeated MemberSessionV2 member_sessions = 1;
}

// --- PlanBoard ---
message PlanBoardV2 {
  string id = 1;
  string task_id = 2;
  string turn_id = 3;
  string session_id = 4;
  string strategy = 5;
  string status = 6;
  repeated PlanStepV2 steps = 7;
  string started_at = 8;
  string completed_at = 9;
  int64 seq = 10;
  int64 version = 11;
}

message ListPlanBoardsV2Request {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListPlanBoardsV2Response {
  repeated PlanBoardV2 plan_boards = 1;
}

// --- PlanStep ---
message PlanStepV2 {
  string id = 1;
  string plan_id = 2;
  string task_id = 3;
  string label = 4;
  string description = 5;
  repeated string depends_on = 6;
  string mapped_team_stage_id = 7;
  string status = 8;
  bool auto_synthesis = 9;
  string started_at = 10;
  string completed_at = 11;
  int64 seq = 12;
  int64 version = 13;
  StepResultV2 result = 14;
  StepErrorV2 error = 15;
}

message StepResultV2 {
  string output = 1;
  repeated MemberReportV2 member_reports = 2;
  TokenUsageV2 tokens_used = 3;
  int64 duration_ms = 4;
}

message StepErrorV2 {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  MemberReportV2 failed_member = 4;
}

message MemberReportV2 {
  string agent_key = 1;
  string agent_name = 2;
  string output = 3;
  TokenUsageV2 tokens_used = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message TokenUsageV2 {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
}

message ListPlanStepsV2Request {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListPlanStepsV2Response {
  repeated PlanStepV2 plan_steps = 1;
}

// --- GraphStage ---
message GraphStageV2 {
  string id = 1;
  string task_id = 2;
  string turn_id = 3;
  string session_id = 4;
  string plan_board_id = 5;
  repeated GraphNodeV2 nodes = 6;
  string status = 7;
  string started_at = 8;
  string completed_at = 9;
  int64 seq = 10;
  int64 version = 11;
}

message ListGraphStagesV2Request {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListGraphStagesV2Response {
  repeated GraphStageV2 graph_stages = 1;
}

// --- GraphNode ---
message GraphNodeV2 {
  string id = 1;
  string graph_stage_id = 2;
  string label = 3;
  string dag_node_id = 4;
  string team_stage_id = 5;
  string status = 6;
  repeated string depends_on = 7;
}

message ListGraphNodesV2Request {
  string stage_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListGraphNodesV2Response {
  repeated GraphNodeV2 graph_nodes = 1;
}
