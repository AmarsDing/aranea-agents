syntax = "proto3";

package kratos.team.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "aranea-agents/api/kratos/team/v1;v1";
option java_multiple_files = true;
option java_package = "api.kratos.team.v1";

message Team {
  string id = 1;
  string team_key = 2;
  string display_name = 3;
  string status = 4;
  bool is_default = 5;
  string definition_json = 6;
  string adk_app_name = 7;
  string created_at = 8;
  string updated_at = 9;
  string deleted_at = 10;
  // OrchestrationSpec.linked_graph_id (stored in definition_json).
  string linked_graph_id = 11;
  // True when the team has a running or pending TeamRun (orchestration read-only).
  bool has_active_run = 12;
  // Strong-typed OrchestrationSpec v2 (parallel to definition_json; M53 TG-CMP-V2).
  OrchestrationSpec orchestration_spec = 13;
  // Department node ID for team grouping.
  string department_id = 14;
  string spirit_session_id = 15;
  string task_description = 16;
  bool auto_created = 17;
  string dag_node_id = 18;
  repeated string depends_on = 19;
  string parallel_config_json = 20;
  // readonly: system teams cannot be deleted.
  bool readonly = 21;
  // source: user | system | imported.
  string source = 22;
  // kind: user | system_builtin | ecosystem_preset | marketplace | certified (ownership classification, maps from DB kind column).
  string kind = 23;
  // JSON array of team deliverables.
  string deliverables = 24;
  // JSON schema for team input contract.
  string input_contract = 25;
  // Agent ID of the department lead.
  string dept_lead_agent_id = 26;
  // JSON array of cross-department member IDs.
  string cross_dept_member_ids = 27;
}

message TeamRun {
  string id = 1;
  string team_id = 2;
  string session_id = 3;
  string message_id = 4;
  string mode = 5;
  string status = 6;
  string input_preview = 7;
  string output_preview = 8;
  int32 token_in = 9;
  int32 token_out = 10;
  int64 cost_micro_usd = 11;
  int32 duration_ms = 12;
  string error_message = 13;
  string topology_json = 14;
  string started_at = 15;
  string finished_at = 16;
  string created_at = 17;
  string updated_at = 18;
  string graph_execution_id = 19;
  // Frozen OrchestrationSpec JSON captured at run start (M53 TG-API-03).
  string definition_snapshot_json = 20;
  // Cross-domain trace id (M53 OPS-TRACE-01).
  string trace_id = 21;
  // 79-runtime-governance Phase 0 任务 0.1：run 级 prompt-cache 命中率
  // （cached/prompt，0..1），读时从 usage 事件面派生（team_turn 对账行优先，
  // 失败 run 回退 genuine 成员行求和）。optional：null = 无 usage 数据，
  // 区别于真实 0% 命中。
  optional double cache_hit_ratio = 22;
}

message TeamRunStep {
  string id = 1;
  string run_id = 2;
  string team_id = 3;
  string agent_id = 4;
  string agent_key = 5;
  string agent_name = 6;
  string role = 7;
  int32 sort_order = 8;
  string status = 9;
  string input_preview = 10;
  string output_preview = 11;
  int32 token_in = 12;
  int32 token_out = 13;
  int64 cost_micro_usd = 14;
  int32 duration_ms = 15;
  string error_message = 16;
  string started_at = 17;
  string finished_at = 18;
  string created_at = 19;
  int32 tool_call_count = 20;
}

message TeamRunMemberSummary {
  string agent_id = 1;
  string agent_key = 2;
  string agent_name = 3;
  string role = 4;
  int32 sort_order = 5;
  string status = 6;
  int32 token_in = 7;
  int32 token_out = 8;
  int32 duration_ms = 9;
  int64 cost_micro_usd = 10;
  string output_preview = 11;
  int32 tool_call_count = 12;
}

message TeamRunSummary {
  string run_id = 1;
  string team_id = 2;
  string session_id = 3;
  string mode = 4;
  string status = 5;
  int32 duration_ms = 6;
  int32 token_in = 7;
  int32 token_out = 8;
  int64 cost_micro_usd = 9;
  int32 member_count = 10;
  int32 tool_call_count = 11;
  string output_preview = 12;
  string error_message = 13;
  repeated TeamRunMemberSummary members = 14;
}

message GetTeamRunSummaryRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetTeamRunSummaryResponse {
  TeamRunSummary summary = 1;
}

// 79-runtime-governance R7：run 级 stats 聚合（数据源全部是既有记账点：
// model_token_usage_events / team_run_steps / decision_records system_guard，
// 不落新表）。
message TeamRunMemberStats {
  string agent_key = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  int64 cached_tokens = 4;
  // calls 是 genuine 模型调用行数（非 step 数）。
  int32 calls = 5;
  // steps 是 team_run_steps 中该成员的行数（装配层按 agent_key 合流）。
  int32 steps = 6;
}

message TeamRunStats {
  string run_id = 1;
  string team_id = 2;
  string session_id = 3;
  string status = 4;
  string created_at = 5;
  // turns = team_run_steps 行数；tool_calls = steps.tool_call_count 求和。
  int32 turns = 6;
  int32 tool_calls = 7;
  int64 prompt_tokens = 8;
  int64 completion_tokens = 9;
  int64 cached_tokens = 10;
  double cache_hit_ratio = 11;
  // G-2：run 内单成员模型用量 input tokens 峰值（2026-08-27 R7 最终裁定：
  // 纳入 attribution 标记行，语义为「单成员 run 总量峰值」，非单次调用）。
  int64 max_turn_input_tokens = 12;
  int32 loop_guard_blocks = 13;
  int32 prune_count = 14;
  int64 prune_bytes = 15;
  // G-1：终审压缩触发次数。
  int32 compact_count = 16;
  bool budget_tripped = 17;
  bool no_progress_tripped = 18;
  repeated TeamRunMemberStats members = 19;
  // R9：工具参数门禁 deny 记录条数（param_rule_deny）。
  int32 param_rule_denies = 20;
  // 输入级确定性安全扫描命中记录条数（input_risk_flagged，2026-08-28 方案② S3）。
  int32 input_risk_flagged = 21;
}

message GetTeamRunStatsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetTeamRunStatsResponse {
  TeamRunStats stats = 1;
}

message ExportTeamRunStatsRequest {
  // from/to 为 RFC3339 窗口（created_at，含边界）；空 = 不限。
  string from = 1;
  string to = 2;
  // session_id 空 = 跨会话。
  string session_id = 3;
  // limit 上限由服务端收口（默认 500，硬上限 1000）。
  int32 limit = 4;
}

message ExportTeamRunStatsResponse {
  // jsonl 每行一个 TeamRunStats JSON 对象（\n 分隔，行内无换行）。
  string jsonl = 1;
  int32 count = 2;
}

message ActivitySnapshotView {
  string kind = 1;
  string display_label = 2;
  string tool_name = 3;
  string status = 4;
  string summary = 5;
  string arguments_json = 6;
  string result_json = 7;
  string started_at = 8;
  string finished_at = 9;
  int64 duration_ms = 10;
  string error_code = 11;
}

message AgentNodeStateView {
  string node_id = 1;
  string agent_id = 2;
  string agent_key = 3;
  string agent_name = 4;
  string role = 5;
  string status = 6;
  string display_status = 7;
  string phase = 8;
  int32 retry_count = 9;
  string input_preview = 10;
  string output_preview = 11;
  string error_message = 12;
  ActivitySnapshotView current_activity = 13;
  repeated ActivitySnapshotView activity_history = 14;
}

message GetTeamRunObservatoryRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetTeamRunObservatoryResponse {
  string run_id = 1;
  string team_id = 2;
  string session_id = 3;
  string status = 4;
  string mode = 5;
  repeated AgentNodeStateView nodes = 6;
  // Backend-compiled topology from run snapshot (CompileTeamGraph parity).
  CompileTeamGraphResponse compiled_topology = 7;
  // Echo of frozen definition JSON used for bootstrap (empty for legacy runs).
  string definition_snapshot_json = 8;
  // Graph execution id when run uses compiled graph runtime (M54 task board).
  string graph_execution_id = 9;
  // Cross-domain trace id for Monitor deep link (M53 OPS-TRACE-01).
  string trace_id = 10;
}

message GetTeamRunObservatoryTimelineRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string node_id = 2;
  optional int32 limit = 3;
}

message ActivityTimelineRow {
  string node_id = 1;
  string kind = 2;
  string display_label = 3;
  string status = 4;
  string started_at = 5;
  string finished_at = 6;
  int64 duration_ms = 7;
  string trace_id = 8;
}

message GetTeamRunObservatoryTimelineResponse {
  repeated ActivityTimelineRow rows = 1;
  string trace_id = 2;
}

// --- OrchestrationSpec v2 (M53 TG-CMP-V2) ---

message OrchestrationMember {
  string agent_id = 1;
  string role = 2;
  string name = 3;
  string task_prompt = 4;
  bool enabled = 5;
  int32 sort_order = 6;
}

message EmbeddedGraphNode {
  string id = 1;
  string type = 2;
  string label = 3;
  string agent_id = 4;
  string role = 5;
  bool interrupt_before = 6;
  bool interrupt_after = 7;
  repeated string destinations = 8;
  string task_prompt = 9;
  optional bool enabled = 10;
  // Runtime node fields (C-21): round-trip through OrchestrationSpec API.
  int32 retry_max_attempts = 11;
  string fallback_agent = 12;
  string reviewer_agent = 13;
  string review_rules = 14;
  string func_ref = 15;
}

message EmbeddedGraphEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string label = 4;
  string condition = 5;
}

message EmbeddedGraph {
  int32 version = 1;
  string layout = 2;
  repeated EmbeddedGraphNode nodes = 3;
  repeated EmbeddedGraphEdge edges = 4;
}

message TeamRetryPolicySpec {
  int32 max_attempts = 1;
  int32 initial_interval_ms = 2;
  double backoff_factor = 3;
  int32 max_interval_ms = 4;
}

message TeamNodeFailureOverrideSpec {
  string policy = 1;
  TeamRetryPolicySpec retry = 2;
  string fallback_agent = 3;
}

message CircuitBreakerSpec {
  int32 failure_threshold = 1;
  int32 reset_timeout_seconds = 2;
  string fallback_node = 3;
}

message FailurePolicySpec {
  string default_policy = 1;
  string parallel_fail = 2;
  TeamRetryPolicySpec retry = 3;
  map<string, TeamNodeFailureOverrideSpec> node_overrides = 4;
  CircuitBreakerSpec circuit_breaker = 5;
  string on_error = 6; // await_review | halt | ...
}

message OrchestrationSpec {
  int32 version = 1;
  // Legal values (six): sequential | parallel | coordinator | critic_loop | swarm | adaptive.
  // swarm and adaptive share the Swarm runtime. Not a mode: graph/native (runtime_engine),
  // preset/custom (graph source).
  string mode = 2;
  repeated OrchestrationMember members = 3;
  EmbeddedGraph graph = 4;
  string linked_graph_id = 5;
  FailurePolicySpec failure_policy = 6;
  string runtime_engine = 7;
  int32 turn_timeout_sec = 8;
  int32 first_byte_timeout_sec = 9;
  string intent_anchor_agent_id = 10;
  string description = 11;
  int32 max_concurrency = 12;
  int32 timeout_seconds = 13;
  int32 loop_max_iterations = 14;
  bool enable_checkpoint = 15;
}

message ResumeTeamRunExecutionRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Struct resume_value = 2;
}

message ResumeTeamRunExecutionResponse {
  string run_id = 1;
  string graph_execution_id = 2;
  string status = 3;
}

message ListTeamsRequest {
  // When true, return total only (items empty). Used by Overview KPI without
  // loading the full team list or HasActiveRun enrichment.
  bool count_only = 1;
}

message ListTeamsResponse {
  repeated Team items = 1;
  // Total teams matching the caller workspace visibility (same scope as items).
  int32 total = 2;
}

message CreateTeamRequest {
  string team_key = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string status = 3;
  string definition_json = 4;
  string adk_app_name = 5;
  string department_id = 6;
}

message GetTeamRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTeamRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  Team team = 2;
}

message DeleteTeamRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DuplicateTeamRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListTeamRunsRequest {
  string team_id = 1;
  int32 limit = 2;
}

message ListTeamRunsResponse {
  repeated TeamRun items = 1;
}

message ListTeamRunStepsRequest {
  string run_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListTeamRunStepsResponse {
  repeated TeamRunStep items = 1;
}

message GetTeamRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CancelTeamRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RunTeamTestRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2;
}

message RunTeamTestResponse {
  TeamRun run = 1;
  string reply = 2;
}

message UpdateSwarmMembersRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string add_agent_ids = 2;
  repeated string remove_agent_ids = 3;
}

message UpdateSwarmMembersResponse {
  bool updated = 1;
}

message ExportTeamStructureRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ExportTeamStructureResponse {
  string entry_node_id = 1;
  repeated StructureNode nodes = 2;
  repeated StructureEdge edges = 3;
  repeated StructureSurface surfaces = 4;
}

message StructureNode {
  string node_id = 1;
  string kind = 2;
  string name = 3;
}

message StructureEdge {
  string from_node_id = 1;
  string to_node_id = 2;
}

message StructureSurface {
  string node_id = 1;
  string name = 2;
}

message CompileTeamGraphRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional override; when set, compiles this JSON instead of persisted team definition.
  string definition_json = 2;
}

message CompileTeamGraphValidationIssue {
  string code = 1;
  string node_id = 2;
  string field = 3;
  string message = 4;
  bool warning = 5;
}

message CompiledGraphNodeView {
  string id = 1;
  string type = 2;
  string agent_name = 3;
  string role = 4;
  string description = 5;
  // Catalog display name resolved from member.agent_id (falls back to description).
  string agent_display_name = 6;
  // Member task_prompt / responsibility text for UI "做什么".
  string task_prompt = 7;
}

message CompiledGraphEdgeView {
  string from = 1;
  string to = 2;
  string edge_kind = 3;
}

message CompiledGraphConditionalEdgeView {
  string from = 1;
  map<string, string> path_map = 2;
}

message CompileTeamGraphResponse {
  string template_id = 1;
  string mode = 2;
  string entry_point = 3;
  string finish_point = 4;
  repeated CompiledGraphNodeView nodes = 5;
  repeated CompiledGraphEdgeView edges = 6;
  repeated CompiledGraphConditionalEdgeView conditional_edges = 7;
  string graph_json = 8;
  repeated CompileTeamGraphValidationIssue issues = 9;
  bool valid = 10;
  // Canonical embedded graph spec (version/layout/nodes/edges incl. start/end decor
  // nodes) generated from mode/members by the backend template registry. Empty when
  // the definition carries its own embedded graph (custom path). ADR-08 A2: frontend
  // editors consume this instead of re-implementing mode->graph generation locally.
  string definition_graph_json = 11;
}

message TaskDeadLetter {
  string id = 1;
  string source_type = 2;
  string source_id = 3;
  string team_id = 4;
  string team_run_id = 5;
  string session_id = 6;
  string graph_execution_id = 7;
  string error_message = 8;
  string payload_json = 9;
  string status = 10;
  string created_at = 11;
  string resolved_at = 12;
}

message ListTaskDeadLettersRequest {
  string session_id = 1;
  string team_id = 2;
  string status = 3;
  int32 limit = 4;
}

message ListTaskDeadLettersResponse {
  repeated TaskDeadLetter items = 1;
}

message ResolveTaskDeadLetterRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ResolveTaskDeadLetterResponse {
  TaskDeadLetter item = 1;
}

// Spirit team view messages (B-3)

message SpiritMemberView {
  string agent_id = 1;
  string agent_key = 2;
  string display_name = 3;
  string role = 4;
  string status = 5;
  string avatar_url = 6;
}

message SpiritTeamView {
  string id = 1;
  string team_name = 2;
  string task_summary = 3;
  string status = 4;
  string mode = 5;
  repeated string member_avatars = 6;
  int32 completed_steps = 7;
  int32 total_steps = 8;
  int64 duration_ms = 9;
  string spirit_session_id = 10;
  string team_session_id = 11;
  repeated SpiritMemberView members = 12;
  repeated string shared_agent_ids = 13;
  string dag_node_id = 14;
  string graph_execution_id = 15;
  repeated string depends_on = 16;
  string topology_reason = 17;
  string interrupt_reason = 18;
  int64 token_in = 19;
  int64 token_out = 20;
}

// ListSpiritTeams messages (B-1)

message ListSpiritTeamsRequest {
  string spirit_session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListSpiritTeamsResponse {
  repeated SpiritTeamView teams = 1;
}

// SynthesizeResults messages (B-4)

message SynthesizeResultsRequest {
  string spirit_session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string strategy = 2; // "template" | "prompt" | "hybrid" | "" (auto-infer)
}

message SynthesisTeamResult {
  string team_id = 1;
  string team_name = 2;
  string status = 3;
  string result_summary = 4;
  repeated string key_findings = 5;
}

message SynthesizeResultsResponse {
  string strategy = 1;
  string unified_summary = 2;
  repeated SynthesisTeamResult team_results = 3;
  double success_rate = 4;
  bool partial_failure = 5;
  string cascade_note = 6;
}

message ArchiveTeamRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ArchiveTeamResponse {
  string team_id = 1;
  string status = 2;
}

message RetryTeamRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetryTeamResponse {
  string team_id = 1;
  string status = 2;
}

// PauseTeamRunRequest pauses a running team run.
// The team transitions to 'paused' state after the current member step completes.
message PauseTeamRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PauseTeamRunResponse {
  string run_id = 1;
  string status = 2;
}

// UnpauseTeamRunRequest resumes a paused team run.
// The team transitions back to 'running' state and continues execution.
// Note: this is distinct from ResumeTeamRunExecution which is used for HITL graph recovery.
message UnpauseTeamRunRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnpauseTeamRunResponse {
  string run_id = 1;
  string status = 2;
}

// InjectTeamMessageRequest injects a user message into a team run's pending queue.
// The message is processed at the next step boundary during execution.
message InjectTeamMessageRequest {
  string team_id = 1 [(google.api.field_behavior) = REQUIRED];
  string message = 2 [(google.api.field_behavior) = REQUIRED];
}

message InjectTeamMessageResponse {
  bool accepted = 1;
  bool queued = 2;
  string pending_id = 3;
}

service TeamService {
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (google.api.http) = {get: "/v1/teams"};
  }
  rpc CreateTeam(CreateTeamRequest) returns (Team) {
    option (google.api.http) = {
      post: "/v1/teams"
      body: "*"
    };
  }
  rpc GetTeam(GetTeamRequest) returns (Team) {
    option (google.api.http) = {get: "/v1/teams/{id}"};
  }
  rpc UpdateTeam(UpdateTeamRequest) returns (Team) {
    option (google.api.http) = {
      patch: "/v1/teams/{id}"
      body: "team"
    };
  }
  rpc DeleteTeam(DeleteTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/teams/{id}"};
  }
  rpc DuplicateTeam(DuplicateTeamRequest) returns (Team) {
    option (google.api.http) = {
      post: "/v1/teams/{id}/duplicate"
      body: "*"
    };
  }
  rpc ListTeamRuns(ListTeamRunsRequest) returns (ListTeamRunsResponse) {
    option (google.api.http) = {get: "/v1/team-runs"};
  }
  rpc ListTeamRunSteps(ListTeamRunStepsRequest) returns (ListTeamRunStepsResponse) {
    option (google.api.http) = {get: "/v1/team-runs/{run_id}/steps"};
  }
  rpc GetTeamRun(GetTeamRunRequest) returns (TeamRun) {
    option (google.api.http) = {get: "/v1/team-runs/{id}"};
  }
  rpc CancelTeamRun(CancelTeamRunRequest) returns (TeamRun) {
    option (google.api.http) = {
      post: "/v1/team-runs/{id}/cancel"
      body: "*"
    };
  }
  rpc RunTeamTest(RunTeamTestRequest) returns (RunTeamTestResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{id}/run-test"
      body: "*"
    };
  }
  rpc UpdateSwarmMembers(UpdateSwarmMembersRequest) returns (UpdateSwarmMembersResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/swarm-members"
      body: "*"
    };
  }
  rpc ExportTeamStructure(ExportTeamStructureRequest) returns (ExportTeamStructureResponse) {
    option (google.api.http) = {get: "/v1/teams/{team_id}/structure"};
  }
  rpc GetTeamRunSummary(GetTeamRunSummaryRequest) returns (GetTeamRunSummaryResponse) {
    option (google.api.http) = {get: "/v1/team-runs/{id}/summary"};
  }
  rpc GetTeamRunObservatory(GetTeamRunObservatoryRequest) returns (GetTeamRunObservatoryResponse) {
    option (google.api.http) = {get: "/v1/team-runs/{run_id}/observatory"};
  }
  rpc GetTeamRunObservatoryTimeline(GetTeamRunObservatoryTimelineRequest) returns (GetTeamRunObservatoryTimelineResponse) {
    option (google.api.http) = {get: "/v1/team-runs/{run_id}/observatory/timeline"};
  }
  rpc ResumeTeamRunExecution(ResumeTeamRunExecutionRequest) returns (ResumeTeamRunExecutionResponse) {
    option (google.api.http) = {
      post: "/v1/team-runs/{run_id}/resume"
      body: "*"
    };
  }
  rpc CompileTeamGraph(CompileTeamGraphRequest) returns (CompileTeamGraphResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/compile-graph"
      body: "*"
    };
  }
  rpc ListTaskDeadLetters(ListTaskDeadLettersRequest) returns (ListTaskDeadLettersResponse) {
    option (google.api.http) = {get: "/v1/task-dead-letters"};
  }
  rpc ResolveTaskDeadLetter(ResolveTaskDeadLetterRequest) returns (ResolveTaskDeadLetterResponse) {
    option (google.api.http) = {
      post: "/v1/task-dead-letters/{id}/resolve"
      body: "*"
    };
  }
  // ListSpiritTeams returns teams belonging to a spirit session.
  rpc ListSpiritTeams(ListSpiritTeamsRequest) returns (ListSpiritTeamsResponse) {
    option (google.api.http) = {get: "/v1/spirit/{spirit_session_id}/teams"};
  }
  // SynthesizeResults merges results from multiple teams into a unified output.
  rpc SynthesizeResults(SynthesizeResultsRequest) returns (SynthesizeResultsResponse) {
    option (google.api.http) = {
      post: "/v1/spirit/{spirit_session_id}/synthesize"
      body: "*"
    };
  }
  // ArchiveTeam archives a completed/failed/cancelled team.
  rpc ArchiveTeam(ArchiveTeamRequest) returns (ArchiveTeamResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/archive"
      body: "*"
    };
  }
  // RetryTeam retries a failed/cancelled team by resetting its status and re-starting.
  rpc RetryTeam(RetryTeamRequest) returns (RetryTeamResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/retry"
      body: "*"
    };
  }
  // PauseTeamRun pauses a running team run (running → paused).
  // User-initiated pause; the current member step completes before pausing.
  rpc PauseTeamRun(PauseTeamRunRequest) returns (PauseTeamRunResponse) {
    option (google.api.http) = {
      post: "/v1/team-runs/{id}/pause"
      body: "*"
    };
  }
  // UnpauseTeamRun resumes a paused team run (paused → running).
  // User-initiated resume; distinct from ResumeTeamRunExecution (HITL graph recovery).
  rpc UnpauseTeamRun(UnpauseTeamRunRequest) returns (UnpauseTeamRunResponse) {
    option (google.api.http) = {
      post: "/v1/team-runs/{id}/unpause"
      body: "*"
    };
  }
  // InjectTeamMessage injects a user message into a team run's pending queue.
  // The message is processed at the next step boundary during execution.
  rpc InjectTeamMessage(InjectTeamMessageRequest) returns (InjectTeamMessageResponse) {
    option (google.api.http) = {
      post: "/v1/teams/{team_id}/inject"
      body: "*"
    };
  }
  // GetTeamRunStats aggregates one run's token/cache/system-guard stats
  // (79-runtime-governance R7). Read-only aggregation over existing
  // accounting points; no new tables.
  rpc GetTeamRunStats(GetTeamRunStatsRequest) returns (GetTeamRunStatsResponse) {
    option (google.api.http) = {get: "/v1/team-runs/{id}/stats"};
  }
  // ExportTeamRunStats lists per-run stats over a created_at window as JSONL
  // (79-runtime-governance R7). Distinct prefix avoids {id} path-param clash.
  rpc ExportTeamRunStats(ExportTeamRunStatsRequest) returns (ExportTeamRunStatsResponse) {
    option (google.api.http) = {get: "/v1/team-run-stats/export"};
  }
}
