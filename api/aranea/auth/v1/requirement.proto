syntax = "proto3";

package aranea.auth.v1;

import "google/protobuf/descriptor.proto";

option go_package = "aranea-agents/api/aranea/auth/v1;authv1";

// AuthRequirement 声明一个 rpc 的认证/授权要求（P1 权限底座，三态互斥）：
//
//   - permission:    需持权限码（如 "user.read"）；
//   - authenticated: 仅需登录（显式声明默认策略——登记即决策留痕，
//     架构测试据此区分"有意不收严"与"漏登记"）；
//   - public:        显式豁免（登录前/自助路径，如 Login/Logout/Current）。
//
// 敏感域（P0 详设 02 §2 清单，见 permission_arch_test.go sensitiveDomains）
// 的每个 rpc 必须携带本选项：protoc-gen-aranea-auth 在生成期强制（缺注解即
// 生成失败），权限登记表 permission_registry_gen.go 由插件从本选项产出，
// 禁止手工维护（AGENTS.md §3）。键空间与判定语义不变：gRPC=FullMethod、
// HTTP=`<大写方法> <pathTemplate>`。
message AuthRequirement {
  oneof kind {
    string permission = 1;   // 需持权限码（<域>.<动作>，支持 `*` 与 `<域>.*` 通配判定）
    bool authenticated = 2;  // 仅需登录
    bool public = 3;         // 显式豁免（登录前/自助路径）
  }
}

extend google.protobuf.MethodOptions {
  AuthRequirement requirement = 51001;
}
