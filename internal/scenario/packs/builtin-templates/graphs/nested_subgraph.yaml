id: nested_subgraph
name: 子图嵌套
description: 包含子工作流的嵌套结构，适用于复用通用流程片段
category: nested
entry_point: preprocess
finish_point: postprocess
state_fields:
  - name: input
    type: string
    reducer: default
  - name: intermediate
    type: string
    reducer: default
  - name: output
    type: string
    reducer: default
nodes:
  - id: preprocess
    type: function
    label: 预处理
    description: 数据预处理
  - id: sub_workflow
    type: agent
    label: 子工作流
    description: 嵌套的子工作流
  - id: postprocess
    type: function
    label: 后处理
    description: 结果后处理
edges:
  - from: preprocess
    to: sub_workflow
  - from: sub_workflow
    to: postprocess
