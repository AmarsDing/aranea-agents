teams:
  - key: team-novel-daily-production
    display_name: 网文日更流水线
    mode: coordinator
    description: "协调式网文生产流水线：起草、大纲、角色创建、世界观构建、编辑审核与润色。"
    max_concurrency: 3
    timeout_seconds: 600
    loop_max_iterations: 1
    intent_anchor_key: webnovel-author-drafting
    synthesizer_key: webnovel-author-polishing
    members:
      - agent_key: webnovel-author-drafting
        role: coordinator
        name: 起草主控
        sort_order: 10
      - agent_key: webnovel-plotter-outline
        role: worker
        name: 大纲规划
        sort_order: 20
      - agent_key: character-writer-creation
        role: worker
        name: 角色创建
        sort_order: 30
      - agent_key: worldbuilding-designer-magic_system
        role: worker
        name: 世界观构建
        sort_order: 40
      - agent_key: fiction-editor-review
        role: worker
        name: 小说审核
        sort_order: 50
      - agent_key: webnovel-author-polishing
        role: synthesizer
        name: 润色综合
        sort_order: 90

  - key: team-viral-video-factory
    display_name: 爆款视频工厂
    mode: coordinator
    description: "协调式爆款视频生产：策划、编剧、剪辑、封面设计与小红书种草。"
    max_concurrency: 3
    timeout_seconds: 600
    loop_max_iterations: 1
    intent_anchor_key: short-video-director-planning
    members:
      - agent_key: short-video-director-planning
        role: coordinator
        name: 导演
        sort_order: 10
      - agent_key: video-scriptwriter-scriptwriting
        role: worker
        name: 编剧
        sort_order: 20
      - agent_key: video-editor-capcut-editing
        role: worker
        name: 剪映剪辑
        sort_order: 30
      - agent_key: thumbnail-designer-design
        role: worker
        name: 封面设计
        sort_order: 40
      - agent_key: xiaohongshu-creator-planting
        role: worker
        name: 小红书种草
        sort_order: 50

  - key: team-multi-platform-sync
    display_name: 多平台同步发布
    mode: parallel
    description: "并行多平台内容分发：微信、小红书与跨平台适配，同步发布。"
    max_concurrency: 3
    timeout_seconds: 300
    synthesizer_key: multi-platform-operator-sync
    members:
      - agent_key: wechat-operator-content
        role: worker
        name: 微信内容
        sort_order: 10
      - agent_key: xiaohongshu-creator-seo
        role: worker
        name: 小红书 SEO
        sort_order: 20
      - agent_key: multi-platform-operator-adapt
        role: worker
        name: 平台适配
        sort_order: 30
      - agent_key: multi-platform-operator-sync
        role: synthesizer
        name: 同步协调
        sort_order: 90
    graph:
      layout: parallel
      nodes:
        - id: wechat-content
          type: agent
          label: 微信内容
          agent_key: wechat-operator-content
          role: worker
        - id: xiaohongshu-seo
          type: agent
          label: 小红书 SEO
          agent_key: xiaohongshu-creator-seo
          role: worker
        - id: platform-adapt
          type: agent
          label: 平台适配
          agent_key: multi-platform-operator-adapt
          role: worker
        - id: sync-publish
          type: agent
          label: 同步发布
          agent_key: multi-platform-operator-sync
          role: synthesizer
      edges:
        - id: e-start-wechat
          source: __start__
          target: wechat-content
        - id: e-start-xiaohongshu
          source: __start__
          target: xiaohongshu-seo
        - id: e-start-adapt
          source: __start__
          target: platform-adapt
        - id: e-wechat-sync
          source: wechat-content
          target: sync-publish
        - id: e-xiaohongshu-sync
          source: xiaohongshu-seo
          target: sync-publish
        - id: e-adapt-sync
          source: platform-adapt
          target: sync-publish

  - key: team-live-stream-crew
    display_name: 直播团队
    mode: sequential
    description: "顺序式直播工作流：脚本编写、直播执行与直播后数据分析。"
    max_concurrency: 1
    timeout_seconds: 300
    members:
      - agent_key: live-stream-scriptwriter-script
        role: worker
        name: 直播编剧
        sort_order: 10
      - agent_key: live-stream-host-hosting
        role: worker
        name: 直播主持
        sort_order: 20
      - agent_key: live-stream-analyst-analytics
        role: worker
        name: 直播分析师
        sort_order: 30
    graph:
      layout: linear
      nodes:
        - id: write-script
          type: agent
          label: 编写脚本
          agent_key: live-stream-scriptwriter-script
          role: worker
        - id: host-stream
          type: agent
          label: 直播主持
          agent_key: live-stream-host-hosting
          role: worker
        - id: analyze-stream
          type: agent
          label: 数据分析
          agent_key: live-stream-analyst-analytics
          role: worker
      edges:
        - id: e-start-script
          source: __start__
          target: write-script
        - id: e-script-host
          source: write-script
          target: host-stream
        - id: e-host-analyze
          source: host-stream
          target: analyze-stream
        - id: e-analyze-end
          source: analyze-stream
          target: __end__

  - key: team-content-calendar
    display_name: 内容日历
    mode: coordinator
    description: 协调式内容日历规划，覆盖微信、小红书、短视频与粉丝增长渠道。
    max_concurrency: 3
    timeout_seconds: 300
    loop_max_iterations: 1
    intent_anchor_key: wechat-operator-content
    members:
      - agent_key: wechat-operator-content
        role: coordinator
        name: 微信协调
        sort_order: 10
      - agent_key: xiaohongshu-creator-planting
        role: worker
        name: 小红书种草
        sort_order: 20
      - agent_key: short-video-director-planning
        role: worker
        name: 视频导演
        sort_order: 30
      - agent_key: fan-growth-strategist-strategy
        role: worker
        name: 粉丝增长策略
        sort_order: 40

  - key: team-fan-community
    display_name: 粉丝社区
    mode: parallel
    description: "并行粉丝社区运营：增长策略、商业变现与直播互动。"
    max_concurrency: 3
    timeout_seconds: 300
    members:
      - agent_key: fan-growth-strategist-strategy
        role: worker
        name: 粉丝增长策略师
        sort_order: 10
      - agent_key: monetization-specialist-revenue
        role: worker
        name: 变现专员
        sort_order: 20
      - agent_key: live-stream-host-interaction
        role: worker
        name: 直播互动主持
        sort_order: 30
    graph:
      layout: parallel
      nodes:
        - id: fan-growth
          type: agent
          label: 粉丝增长策略
          agent_key: fan-growth-strategist-strategy
          role: worker
        - id: monetization
          type: agent
          label: 商业变现
          agent_key: monetization-specialist-revenue
          role: worker
        - id: live-interaction
          type: agent
          label: 直播互动
          agent_key: live-stream-host-interaction
          role: worker
      edges:
        - id: e-start-growth
          source: __start__
          target: fan-growth
        - id: e-start-monetization
          source: __start__
          target: monetization
        - id: e-start-interaction
          source: __start__
          target: live-interaction
