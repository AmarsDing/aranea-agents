teams:
  - key: team-novel-daily-production
    display_name: Novel Daily Production
    mode: coordinator
    description: "Coordinator-driven novel production pipeline: drafting, plotting, character creation, worldbuilding, editorial review, and polishing."
    max_concurrency: 3
    timeout_seconds: 600
    loop_max_iterations: 1
    intent_anchor_key: webnovel-author-drafting
    synthesizer_key: webnovel-author-polishing
    members:
      - agent_key: webnovel-author-drafting
        role: coordinator
        name: Drafting Lead
        sort_order: 10
      - agent_key: webnovel-plotter-outline
        role: worker
        name: Plot Outliner
        sort_order: 20
      - agent_key: character-writer-creation
        role: worker
        name: Character Creator
        sort_order: 30
      - agent_key: worldbuilding-designer-magic-system
        role: worker
        name: Worldbuilder
        sort_order: 40
      - agent_key: fiction-editor-review
        role: worker
        name: Fiction Reviewer
        sort_order: 50
      - agent_key: webnovel-author-polishing
        role: synthesizer
        name: Polishing Synthesizer
        sort_order: 90

  - key: team-viral-video-factory
    display_name: Viral Video Factory
    mode: coordinator
    description: "Coordinator-driven viral video production: planning, scriptwriting, editing, thumbnail design, and Xiaohongshu seeding."
    max_concurrency: 3
    timeout_seconds: 600
    loop_max_iterations: 1
    intent_anchor_key: short-video-director-planning
    members:
      - agent_key: short-video-director-planning
        role: coordinator
        name: Director
        sort_order: 10
      - agent_key: video-scriptwriter-scriptwriting
        role: worker
        name: Scriptwriter
        sort_order: 20
      - agent_key: video-editor-capcut-editing
        role: worker
        name: CapCut Editor
        sort_order: 30
      - agent_key: thumbnail-designer-design
        role: worker
        name: Thumbnail Designer
        sort_order: 40
      - agent_key: xiaohongshu-creator-planting
        role: worker
        name: Xiaohongshu Seeding
        sort_order: 50

  - key: team-multi-platform-sync
    display_name: Multi-Platform Sync
    mode: parallel
    description: "Parallel multi-platform content distribution: WeChat, Xiaohongshu, and cross-platform adaptation, with synchronized publishing."
    max_concurrency: 3
    timeout_seconds: 300
    synthesizer_key: multi-platform-operator-sync
    members:
      - agent_key: wechat-operator-content
        role: worker
        name: WeChat Content
        sort_order: 10
      - agent_key: xiaohongshu-creator-seo
        role: worker
        name: Xiaohongshu SEO
        sort_order: 20
      - agent_key: multi-platform-operator-adapt
        role: worker
        name: Platform Adapter
        sort_order: 30
      - agent_key: multi-platform-operator-sync
        role: synthesizer
        name: Sync Coordinator
        sort_order: 90
    graph:
      layout: parallel
      nodes:
        - id: wechat-content
          type: agent
          label: WeChat Content
          agent_key: wechat-operator-content
          role: worker
        - id: xiaohongshu-seo
          type: agent
          label: Xiaohongshu SEO
          agent_key: xiaohongshu-creator-seo
          role: worker
        - id: platform-adapt
          type: agent
          label: Platform Adapter
          agent_key: multi-platform-operator-adapt
          role: worker
        - id: sync-publish
          type: agent
          label: Sync & Publish
          agent_key: multi-platform-operator-sync
          role: synthesizer
      edges:
        - id: e-start-wechat
          source: __start__
          target: wechat-content
        - id: e-start-xiaohongshu
          source: __start__
          target: xiaohongshu-seo
        - id: e-start-adapt
          source: __start__
          target: platform-adapt
        - id: e-wechat-sync
          source: wechat-content
          target: sync-publish
        - id: e-xiaohongshu-sync
          source: xiaohongshu-seo
          target: sync-publish
        - id: e-adapt-sync
          source: platform-adapt
          target: sync-publish

  - key: team-live-stream-crew
    display_name: Live Stream Crew
    mode: sequential
    description: "Sequential live stream workflow: script writing, hosting execution, and post-stream analytics review."
    max_concurrency: 1
    timeout_seconds: 300
    members:
      - agent_key: live-stream-scriptwriter-script
        role: worker
        name: Script Writer
        sort_order: 10
      - agent_key: live-stream-host-hosting
        role: worker
        name: Stream Host
        sort_order: 20
      - agent_key: live-stream-analyst-analytics
        role: worker
        name: Stream Analyst
        sort_order: 30
    graph:
      layout: linear
      nodes:
        - id: write-script
          type: agent
          label: Write Script
          agent_key: live-stream-scriptwriter-script
          role: worker
        - id: host-stream
          type: agent
          label: Host Stream
          agent_key: live-stream-host-hosting
          role: worker
        - id: analyze-stream
          type: agent
          label: Analyze Stream
          agent_key: live-stream-analyst-analytics
          role: worker
      edges:
        - id: e-start-script
          source: __start__
          target: write-script
        - id: e-script-host
          source: write-script
          target: host-stream
        - id: e-host-analyze
          source: host-stream
          target: analyze-stream
        - id: e-analyze-end
          source: analyze-stream
          target: __end__

  - key: team-content-calendar
    display_name: Content Calendar
    mode: coordinator
    description: Coordinator-driven content calendar planning across WeChat, Xiaohongshu, short video, and fan growth channels.
    max_concurrency: 3
    timeout_seconds: 300
    loop_max_iterations: 1
    intent_anchor_key: wechat-operator-content
    members:
      - agent_key: wechat-operator-content
        role: coordinator
        name: WeChat Coordinator
        sort_order: 10
      - agent_key: xiaohongshu-creator-planting
        role: worker
        name: Xiaohongshu Seeding
        sort_order: 20
      - agent_key: short-video-director-planning
        role: worker
        name: Video Director
        sort_order: 30
      - agent_key: fan-growth-strategist-strategy
        role: worker
        name: Fan Growth Strategist
        sort_order: 40

  - key: team-fan-community
    display_name: Fan Community
    mode: parallel
    description: "Parallel fan community management: growth strategy, monetization, and live interaction engagement."
    max_concurrency: 3
    timeout_seconds: 300
    members:
      - agent_key: fan-growth-strategist-strategy
        role: worker
        name: Fan Growth Strategist
        sort_order: 10
      - agent_key: monetization-specialist-revenue
        role: worker
        name: Monetization Specialist
        sort_order: 20
      - agent_key: live-stream-host-interaction
        role: worker
        name: Live Interaction Host
        sort_order: 30
    graph:
      layout: parallel
      nodes:
        - id: fan-growth
          type: agent
          label: Fan Growth Strategy
          agent_key: fan-growth-strategist-strategy
          role: worker
        - id: monetization
          type: agent
          label: Monetization
          agent_key: monetization-specialist-revenue
          role: worker
        - id: live-interaction
          type: agent
          label: Live Interaction
          agent_key: live-stream-host-interaction
          role: worker
      edges:
        - id: e-start-growth
          source: __start__
          target: fan-growth
        - id: e-start-monetization
          source: __start__
          target: monetization
        - id: e-start-interaction
          source: __start__
          target: live-interaction
