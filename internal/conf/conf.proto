syntax = "proto3";
package kratos.api;

option go_package = "aranea-agents/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logging logging = 3;
  DebugRecorder debug_recorder = 4;
  Langfuse langfuse = 5;
  Runtime runtime = 6;
  SelfImprovement self_improvement = 7;
  Sandbox sandbox = 8;
}

// Sandbox configures the M82 agent sandbox infrastructure (pooled,
// use-and-destroy isolated execution environments). Every numeric/duration
// field maps 0 to its design default (82-sandbox.design.md §7).
message Sandbox {
  message Pool {
    int32 min_ready = 1;                            // per-profile warm target (0 = 2)
    int32 max_ready = 2;                            // per-profile warm ceiling (0 = 8)
    google.protobuf.Duration replenish_interval = 3; // 补水 tick (0 = 5s)
    google.protobuf.Duration max_pool_age = 4;       // ready-instance rotation age (0 = 10m)
  }
  message Limits {
    int32 global_max_active = 1;    // global concurrency gate (0 = 32)
    int32 per_agent_max_active = 2; // per-agent concurrency gate (0 = 4)
    int32 per_run_max_create = 3;   // per-run creation budget, P2 (0 = 16)
  }
  message TTL {
    google.protobuf.Duration default = 1;      // lease TTL when unspecified (0 = 30m)
    google.protobuf.Duration max = 2;          // hard cap incl. Renew (0 = 2h)
    google.protobuf.Duration idle_timeout = 3; // leased idle eviction (0 = 10m)
  }
  // Profile is a static spec portrait; map key is the profile name.
  // Security baselines (--read-only rootfs, cap-drop, no-new-privileges) are
  // engine-enforced and intentionally not configurable.
  message Profile {
    string image = 1;
    double cpus = 2;                 // 0 = 0.5
    int64 memory_bytes = 3;          // 0 = 268435456 (256MiB)
    int64 pids_limit = 4;            // 0 = 256
    string network = 5;              // none | egress | full ("" = none)
    string tmp_size = 6;             // tmpfs /tmp size ("" = 128m)
  }
  bool enabled = 1;    // master switch; false → consumers fall back (NFR-04)
  string engine = 2;   // docker (P0); runsc/e2b reserved ("" = docker)
  Pool pool = 3;
  Limits limits = 4;
  TTL ttl = 5;
  map<string, Profile> profiles = 6;
}

// SelfImprovement configures the platform self-improvement (V3) pipeline
// (73-self-iteration-v3, design §6.2). Default: disabled (enabled=false);
// every numeric field maps 0 to its design default.
message SelfImprovement {
  message ErrorCluster {
    int32 window_days = 1;   // observation window (0 = 7)
    int32 min_count = 2;     // min occurrences in window to fire (0 = 5)
  }
  message Perf {
    double latency_factor = 1;  // p95 regression factor vs baseline (0 = 2.0)
    double token_factor = 2;    // token usage anomaly factor (0 = 1.5)
  }
  message Eval {
    double regression_threshold = 1;  // score drop ratio to fire (0 = 0.10)
  }
  message Patch {
    int32 max_diff_lines = 1;          // diff size cap in changed lines (0 = 500)
    int32 daily_auto_apply_quota = 2;  // auto-apply daily quota (0 = disabled)
    int32 max_attempts = 3;            // patch-verify retry cap (0 = 3)
  }
  message Sandbox {
    message GateTimeouts {
      google.protobuf.Duration g1 = 1;  // build gate (0 = 5m)
      google.protobuf.Duration g2 = 2;  // test gate (0 = 10m)
      google.protobuf.Duration g3 = 3;  // lint gate (0 = 5m)
    }
    GateTimeouts gate_timeouts = 1;
    // Worktree root directory relative to repo root ("" = ".aranea-self-improve").
    string worktree_root = 2;
    // Platform repository root the sandbox/applier operates on
    // ("" = process working directory).
    string repo_root = 3;
  }
  // ObserveWindow configures the post-apply observing window (design D7/D10).
  message ObserveWindow {
    google.protobuf.Duration duration = 1;  // window length (0 = 24h)
    double error_rate_factor = 2;           // rollback when error_rate > before*factor (0 = 1.5)
    double p95_factor = 3;                  // rollback when p95 > before*factor (0 = 1.3)
    int32 max_concurrent_observing = 4;     // observing-window concurrency cap (0 = 3)
  }
  bool enabled = 1;                           // master switch (gray rollout, default off)
  google.protobuf.Duration observe_interval = 2;  // scan interval (0 = 15m)
  ErrorCluster error_cluster = 3;
  Perf perf = 4;
  Eval eval = 5;
  // Directory of test-run JSON round files (external cron output) feeding the
  // test_failure trigger. Empty = that signal source stays inert.
  string test_runs_dir = 6;
  Patch patch = 7;
  Sandbox sandbox = 8;
  ObserveWindow observe_window = 9;
  google.protobuf.Duration watchdog_interval = 10;  // watchdog tick (0 = 5m)
  google.protobuf.Duration outcome_interval = 11;   // outcome attribution tick (0 = 1h)
  google.protobuf.Duration drive_interval = 12;     // full-chain drive tick (0 = 1m)
  google.protobuf.Duration stale_timeout = 13;      // mid-pipeline stale threshold before recover (0 = 30m)
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message WS {
    bool enable = 1;
    string network = 2;
    string addr = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  WS ws = 4;
  string a2a_public_base_url = 5;
  Monitor monitor = 6;
  OpenAI openai = 7;
}

message OpenAI {
  bool enable = 1;
  string addr = 2;
  string base_path = 3;
  string model_name = 4;
  string default_agent_key = 5;
}

message Monitor {
  // Gateway process log (EnvelopeTypeLog) pushed on WS when true. Default in config.yaml: true.
  bool process_log_enabled = 1;
}

enum SinkType {
  SINK_TYPE_UNSPECIFIED = 0;
  SINK_TYPE_FILE = 1;
  SINK_TYPE_STDOUT = 2;
  SINK_TYPE_EVENTBUS = 3;
}

enum DropPolicy {
  DROP_POLICY_UNSPECIFIED = 0;
  DROP_POLICY_NEWEST = 1;
  DROP_POLICY_BLOCK = 2;
}

message LoggingSink {
  string name = 1;
  SinkType type = 2;
  int32 buffer_size = 3;
  DropPolicy drop_policy = 4;
  map<string, string> config = 5;
}

message Logging {
  string level = 1;
  string output_dir = 2;
  int32 max_size_mb = 3;
  int32 max_backups = 4;
  int32 max_age_days = 5;
  bool compress = 6;
  bool stdout_enabled = 7;
  string hook_level = 8;
  repeated LoggingSink sinks = 9;
}

message DebugRecorder {
  bool enable = 1;
  string dir = 2;
  string mode = 3;
}

message Langfuse {
  bool enable = 1;
  string public_key = 2;
  string secret_key = 3;
  string base_url = 4;
  int64 flush_interval_ms = 5;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  // PostgreSQL + pgvector: agent long-term memory (embeddings). Not used by Ent.
  message Postgres {
    string source = 1;
    // embedding dimension (e.g. 1536 for text-embedding-3-small). 0 = default 1536.
    int32 vector_dim = 2;
  }
  // When SQLite has zero admins, create this account once (aligned with AdminService.Login: password stored as MD5 hex).
  // Use only for local/smoke; never commit production secrets.
  message InitialAdmin {
    // Login-by-username value (maps to ent Admin.name).
    string name = 1;
    string email = 2;
    // Plaintext in YAML; hashed with MD5 before persist.
    string password = 3;
    // e.g. "admin" (Admin.access).
    string access = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
  // Field 3 was `Sqlite sqlite`, removed in A6 (Postgres is the only primary DB).
  // Reserved to prevent accidental reuse.
  reserved 3;
  reserved "sqlite";
  Postgres postgres = 4;
  InitialAdmin initial_admin = 5;
  // Primary database driver: "postgres" (only supported value after A6).
  // Ent CRUD + raw SQL use the Postgres connection from data.postgres.source
  // (pgvector/WAL/EventStore share the same pool).
  string driver = 6;
}

// Runtime holds infrastructure-level tuning parameters that rarely change at
// runtime but may need adjustment per deployment (e.g. high-latency networks,
// strict rate-limit environments).  All fields provide sensible zero-value
// defaults so that an empty `runtime:` section in config.yaml is equivalent to
// the previous hardcoded constants.
message Runtime {
  // WebSocket connection and priority-queue tuning.
  message WS {
    int64 read_limit = 1;              // max message size in bytes (0 = 1 MB)
    int64 pong_wait_ms = 2;            // wait for client pong (0 = 60 s)
    int64 ping_period_ms = 3;          // server ping interval (0 = 30 s)
    int64 write_wait_ms = 4;           // single write deadline (0 = 10 s)
    // field 5 (turn_timeout_ms) removed 2026-08-24: never consumed; chat turns
    // are intentionally unbounded (No-Timeout principle).
    int32 max_session_conns = 6;       // per-session WS limit (0 = 5)
    int32 max_global_monitor_conns = 7;// global monitor WS limit (0 = 3)
    int32 high_cap = 8;                // high-priority queue capacity (0 = 64)
    int32 normal_cap = 9;              // normal-priority queue capacity (0 = 128)
    int32 low_cap = 10;                // low-priority queue capacity (0 = 256)
    int64 high_block_timeout_ms = 11;  // high queue full block timeout (0 = 5 s)
    int64 backpressure_interval_ms = 12;// backpressure report interval (0 = 10 s)
    int32 low_drain_per_loop = 13;     // max low-priority drains per loop (0 = 8)
  }
  // Webhook delivery and retry tuning.
  message Hook {
    int32 default_max_attempts = 1;    // max delivery attempts (0 = 3)
    int32 default_timeout_sec = 2;     // HTTP request timeout (0 = 8 s)
    int64 retry_backoff_base_ms = 3;   // backoff base (0 = 500 ms)
    int64 retry_poll_interval_ms = 4;  // stale-poll interval (0 = 60 s)
    int64 retry_stale_after_ms = 5;    // stale threshold (0 = 5 min)
    int32 retry_batch_size = 6;        // max stale deliveries per poll (0 = 20)
    int64 retry_query_timeout_ms = 7;  // DB query timeout for stale scan (0 = 30 s)
  }
  // Self-heal observer and circuit-breaker tuning.
  message SelfHeal {
    double min_confidence = 1;                // min confidence to fire alert (0 = 0.7)
    int32 max_history = 2;                    // max heal records retained (0 = 1000)
    int64 circuit_breaker_window_ms = 3;      // sliding window width (0 = 10 min)
    int32 circuit_breaker_threshold = 4;      // events in window to trip breaker (0 = 5)
    int64 circuit_breaker_reset_after_ms = 5; // auto-reset delay (0 = 30 min)
    int64 severity_cooldown_critical_ms = 6;  // critical cooldown (0 = 30 min)
    int64 severity_cooldown_high_ms = 7;      // high cooldown (0 = 10 min)
    int64 severity_cooldown_medium_ms = 8;    // medium cooldown (0 = 5 min)
    int64 severity_cooldown_low_ms = 9;       // low cooldown (0 = 2 min)
  }
  // Memory job queue capacity tuning.
  message MemoryQueue {
    int32 high_cap = 1;               // high-priority lane (0 = 64)
    int32 normal_cap = 2;             // normal-priority lane (0 = 256)
    int32 low_cap = 3;                // low-priority lane (0 = 128)
    int32 max_tenant_normal_slots = 4;// per-tenant normal quota (0 = 128)
    int64 debounce_ms = 5;            // session debounce window (0 = 30 s)
  }
  // Channel webhook rate limiting.
  message Webhook {
    int32 rate_limit_per_min = 1;     // per-channel requests/min (0 = 120)
    int64 stale_threshold_ms = 2;     // limiter entry staleness (0 = 5 min)
  }
  // Auto-memory worker tuning.
  message AutoMemory {
    int32 max_retries = 1;            // extraction attempts per job (0 = 3)
    int32 max_messages = 2;           // recent messages to analyze (0 = 40)
    int32 drain_batch_size = 3;       // jobs drained per cycle (0 = 50)
  }
  // Orchestration activity step flusher tuning.
  message ActivityFlusher {
    int32 batch_size = 1;             // rows per flush (0 = 10)
    int64 flush_interval_ms = 2;      // ticker interval (0 = 500 ms)
    int32 channel_buffer = 3;         // internal channel capacity (0 = 64)
    int64 db_timeout_ms = 4;          // BatchCreate context timeout (0 = 5 s)
  }
  // Plugin stats recorder tuning.
  message Plugin {
    bool persist_success_runs = 1;    // persist successful plugin runs to plugin_runs table (default false)
  }
  // Deterministic tool-result pruning (79-runtime-governance R2).
  // BeforeModel hook prunes old oversized RoleTool results into blob pointers
  // (archive via ToolResultGate blob store, retrieve via read_tool_result).
  message ToolResultPrune {
    optional bool enabled = 1;        // master switch; unset = pruning ON (kill switch: enabled=false, dev plan Phase 1 回退)
    int32 after_turns = 2;            // K: prune results farther than K turns from current (0 = 8)
    int64 size_bytes = 3;             // S: min serialized size in bytes to prune (0 = 4096, aligned with loopGuardResultCap)
    repeated string exempt_tools = 4; // whitelist: tool names never pruned (取证关键类, e.g. gns3 forensics)
  }

  WS ws = 1;
  Hook hook = 2;
  SelfHeal self_heal = 3;
  MemoryQueue memory_queue = 4;
  Webhook webhook = 5;
  AutoMemory auto_memory = 6;
  ActivityFlusher activity_flusher = 7;
  Plugin plugin = 8;
  ToolResultPrune tool_result_prune = 9;
  // Cache-hit-ratio drift alert threshold (79-runtime-governance 1.5): eval
  // baseline scripts flag a run when its weighted hit ratio deviates from the
  // recorded baseline by more than this fraction. 0 = 0.10 (±10%).
  double cache_hit_alert_drift = 10;
}
