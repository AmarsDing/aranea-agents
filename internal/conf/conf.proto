syntax = "proto3";
package kratos.api;

option go_package = "aranea-agents/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logging logging = 3;
  DebugRecorder debug_recorder = 4;
  Langfuse langfuse = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message WS {
    bool enable = 1;
    string network = 2;
    string addr = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  WS ws = 4;
  string a2a_public_base_url = 5;
  Monitor monitor = 6;
  OpenAI openai = 7;
}

message OpenAI {
  bool enable = 1;
  string addr = 2;
  string base_path = 3;
  string model_name = 4;
  string default_agent_key = 5;
}

message Monitor {
  // Gateway process log (EnvelopeTypeLog) pushed on WS when true. Default in config.yaml: true.
  bool process_log_enabled = 1;
}

message Logging {
  string level = 1;
  string output_dir = 2;
  int32 max_size_mb = 3;
  int32 max_backups = 4;
  int32 max_age_days = 5;
  bool compress = 6;
  bool stdout_enabled = 7;
  string hook_level = 8;
}

message DebugRecorder {
  bool enable = 1;
  string dir = 2;
  string mode = 3;
}

message Langfuse {
  bool enable = 1;
  string public_key = 2;
  string secret_key = 3;
  string base_url = 4;
  int64 flush_interval_ms = 5;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Sqlite {
    bool enable = 1;
    string source = 2;
  }
  // PostgreSQL + pgvector: agent long-term memory (embeddings). Not used by Ent.
  message Postgres {
    string source = 1;
    // embedding dimension (e.g. 1536 for text-embedding-3-small). 0 = default 1536.
    int32 vector_dim = 2;
  }
  // When SQLite has zero admins, create this account once (aligned with AdminService.Login: password stored as MD5 hex).
  // Use only for local/smoke; never commit production secrets.
  message InitialAdmin {
    // Login-by-username value (maps to ent Admin.name).
    string name = 1;
    string email = 2;
    // Plaintext in YAML; hashed with MD5 before persist.
    string password = 3;
    // e.g. "admin" (Admin.access).
    string access = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
  Sqlite sqlite = 3;
  Postgres postgres = 4;
  InitialAdmin initial_admin = 5;
}
