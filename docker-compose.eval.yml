# Agent Memory Challenge 2026 — evaluation deployment (academic · code route).
#
# Build:  docker compose -f docker-compose.eval.yml build
# Run:    docker compose -f docker-compose.eval.yml up -d
# Smoke:  ./test/agent-memory-challenge/smoke.sh http://localhost:8910 "$EVAL_MEMORY_TOKEN"
# Stop:   docker compose -f docker-compose.eval.yml down   (add -v to drop data)
#
# The stack runs only the standalone evaluation entrypoint (cmd/memoryeval) —
# the main admin server is not started and not required.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aranea
      POSTGRES_PASSWORD: ${EVAL_DB_PASSWORD:-aranea_eval}
      POSTGRES_DB: aranea
    volumes:
      - eval-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aranea -d aranea"]
      interval: 5s
      timeout: 3s
      retries: 24

  memoryeval:
    build:
      context: .
      args:
        # Enable the pgvector-backed vector store in this image (the compose
        # db service ships the extension). Main-program builds stay untagged.
        GO_BUILD_TAGS: pgvector
    command: ["./memoryeval"]
    environment:
      EVAL_HTTP_ADDR: ":8910"
      EVAL_PG_SOURCE: "postgres://aranea:${EVAL_DB_PASSWORD:-aranea_eval}@db:5432/aranea?sslmode=disable"
      # Use the pgvector store provided by the db service (required together
      # with the GO_BUILD_TAGS=pgvector build arg above).
      DAO_VECTOR_PGVECTOR: "true"
      # pgvector column / expected embedding dimension. Must match the
      # embedding model output (e.g. 1024 for qwen3.7-text-embedding,
      # 1536 for text-embedding-3-small). Mismatched dims skip vector indexing.
      EVAL_VECTOR_DIM: ${EVAL_VECTOR_DIM:-}
      # Memory System Key (Bearer / X-Api-Key). Provide via environment; never commit.
      EVAL_MEMORY_TOKEN: ${EVAL_MEMORY_TOKEN:-}
      # The memoryeval binary links pkg/auth transitively (via internal/data),
      # whose package init() refuses to start without a JWT signing secret.
      # The evaluation endpoints never issue or verify JWTs, so any non-empty
      # value satisfies the guard; override it with a real random secret if the
      # same stack is ever exposed for normal app traffic.
      KRATOS_AUTH_SECRET: ${KRATOS_AUTH_SECRET:-aranea-memory-eval-non-jwt-placeholder-secret}
      # Optional OpenAI-compatible embedding endpoint. When unset, recall
      # degrades to keyword-only hybrid scoring and the contract stays live.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    ports:
      - "8910:8910"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eval-pgdata:
