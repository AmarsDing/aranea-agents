# M82 P2-1 sandbox egress CONNECT proxy — domain whitelist only.
# Whitelist lives in allowed_domains.txt (one host per line; dstdomain
# semantics: the listed domain AND its subdomains match).
http_port 3128

acl allowed_sites dstdomain "/etc/squid/allowed_domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# CONNECT tunnels only to whitelisted domains on SSL ports;
# plain HTTP only to whitelisted domains. Everything else denied.
http_access deny CONNECT !SSL_ports
http_access allow allowed_sites
http_access deny all

# Pure tunnel/filter — no caching. Log to the image's standard file paths
# (r2 #8, empirically verified on squid 6.13 2026-08-26): the ubuntu/squid
# entrypoint already runs `tail -F /var/log/squid/*.log &` forwarding them to
# container stdout, so `docker logs aranea-egress-proxy` still shows
# everything. Both stdout shortcuts FATAL on this image:
#  - stdio:/dev/stdout → EACCES (worker drops to cache_effective_user=proxy,
#    /dev/stdout is the root-owned container pipe)
#  - daemon:/dev/stdout → log_file_daemon helper fopen ENXIO then
#    "logfileHandleWrite: Broken pipe" → "FATAL: I don't handle this error
#    well!" → exit 1 crash-loop
cache deny all
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid

# Log rotation (r3 review #3): keep 4 rotated copies. Squid never rotates on
# its own schedule — trigger via `docker exec aranea-egress-proxy squid -k
# rotate` (ops/manual; container recreate also resets). The tail-forwarded
# stdout side is bounded separately by the compose json-file logging limits.
logfile_rotate 4

# NOTE: dns_v4_first was removed entirely (2026-08-26) — current ubuntu/squid
# treats the directive as a fatal "obsolete" error regardless of value.
# Modern squid already prefers IPv4 in dual-stack CONNECT paths; re-add an
# equivalent only if a smoke shows AAAA-induced 503s again.
