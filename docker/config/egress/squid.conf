# M82 P2-1 sandbox egress CONNECT proxy — domain whitelist only.
# Whitelist lives in allowed_domains.txt (one host per line; dstdomain
# semantics: the listed domain AND its subdomains match).
http_port 3128

acl allowed_sites dstdomain "/etc/squid/allowed_domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# CONNECT tunnels only to whitelisted domains on SSL ports;
# plain HTTP only to whitelisted domains. Everything else denied.
http_access deny CONNECT !SSL_ports
http_access allow allowed_sites
http_access deny all

# Pure tunnel/filter — no caching. Access log goes to stdout (r2 #8 —
# previously `access_log none`; the whitelist CONNECT path needs a proxy-side
# audit trail, viewable via `docker logs aranea-egress-proxy`).
cache deny all
access_log stdio:/dev/stdout squid
cache_log /dev/null
coredump_dir /var/spool/squid

# Docker bridges are IPv4-only; the host resolver still returns AAAA records
# and squid would otherwise try IPv6 first and 503 (smoke 2026-08-26).
dns_v4_first on
